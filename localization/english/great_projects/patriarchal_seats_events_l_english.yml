 nick_the_mathematician: "The Mathematician"
 nick_the_mathematician_desc: "This honorific recognizes one of the most brilliant minds of the age. His renowned wisdom extends beyond mere numbers to encompass geometry, philosophy, and mechanics. To be 'the Mathematician' is to be acknowledged as a master of logic and reason, a polymath whose intellectual acumen is sought by emperors."
 trait_historical_character_bgp_desc: "Leo is, without question, the most brilliant scholar and polymath of the 9th century. A man of staggering intellectual breadth, his expertise spans mathematics, philosophy, medicine, astronomy, and mechanics. His fame is so great that it transcended the borders of the Empire, with the Abbasid Caliph al-Ma'mun famously inviting him to Baghdad—an offer Leo declined out of loyalty to his homeland.\n\nUnder the patronage of Emperor Theophilos, Leo became the architect of some of the Empire's most advanced technological marvels. It was his genius that perfected the Imperial Beacon System, a chain of light that could transmit a message from the frontier to Constantinople in under an hour. He also constructed the legendary automata of the Great Palace, including the 'Throne of Solomon' which could be mechanically raised into the air, and golden trees with mechanical birds that sang.\n\nFollowing his time as Archbishop of Thessalonica, Leo returned to the capital to head the re-established Magnaura School under the caesar Bardas, helping to spark a profound restoration of classical learning and scientific inquiry within the Empire. He is not merely a man of numbers; he is a living symbol of Byzantine ingenuity and wisdom."
 trait_historical_character_bgp: "Historical Character"
