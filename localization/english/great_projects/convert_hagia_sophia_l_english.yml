l_english:

 great_project_type_convert_hagia_sophia: "Convert Hagia Sophia"
 great_project_type_convert_hagia_sophia_desc: "For centuries, the Hagia Sophia has stood as the greatest monument to the Nazarene faith, a masterpiece of architecture dedicated to a foreign, usurper God. It is a symbol of our people's long submission to a faith of weakness and sorrows. So long as it stands in its current form, our restoration is incomplete.\n\nThe time has come for an act of ultimate renewal. We will not merely tear it down; we will reclaim it, purify it, and transform it. We will scour it of its somber icons and sorrowful mosaics, remaking its very soul. That great dome, built to glorify a false god, will now shelter a new Palladium for our city. This will be the new heart of the Hellenic world, a Grand Temple dedicated to the divine wisdom and martial might of Pallas Athena, a statement that the Gods of Olympus have returned to their rightful place."
 great_project_type_tooltip_convert_hagia_sophia: ""
 great_project_name_possessive_convert_hagia_sophia: ""
 great_project_name_convert_hagia_sophia: ""
 
 great_project_type_convert_hagia_sophia_contribution_purification: "The Great Purification"
 great_project_type_convert_hagia_sophia_contribution_purification_desc: "This sacred space has been tainted for centuries, its walls adorned with the idols of a foreign, usurper God. Before Athena can call this place home, every trace of the old faith must be scoured away. This contribution will fund the grim but necessary work of removing the foreign icons, tearing down the mosaics, and melting the crosses. The air itself must be purified of a thousand years of false prayers."
 great_project_type_convert_hagia_sophia_contribution_name_purification: ""
 great_project_type_convert_hagia_sophia_contribution_cella: "Remaking the Cella"
 great_project_type_convert_hagia_sophia_contribution_cella_desc: "The interior of the building was designed for the sermons and rituals of its former occupants. We must remake it to suit our Gods. This contribution will alter the very architecture of the interior, demolishing partitions to create a vast, open cella and constructing a colossal central plinth upon which the cult statue will one day stand. This is an immense engineering task, re-shaping the sacred space itself."
 great_project_type_convert_hagia_sophia_contribution_name_cella: ""
 great_project_type_convert_hagia_sophia_contribution_statue: "The Palladium of Constantinople"
 great_project_type_convert_hagia_sophia_contribution_statue_desc: "An empty temple is a dead temple. We will commission the greatest artists in the realm to create the new heart of this sacred place: a colossal, chryselephantine cult statue of Athena Promachos, armed and vigilant. It will be wrought from ivory, adorned with gold, and its eyes will be piercing gems. It will be a new Palladium, a divine protector for the city and a sight to inspire both awe and terror."
 great_project_type_convert_hagia_sophia_contribution_name_statue: ""
 great_project_type_convert_hagia_sophia_contribution_frescoes: "The Mythological Frescoes"
 great_project_type_convert_hagia_sophia_contribution_frescoes_desc: "The blank walls of the temple are an insult to the Gods and a bore to mortal eyes. This contribution will fund the painting of magnificent frescoes depicting the great myths and heroic epics. The wisdom of Odysseus, the might of Herakles, the fury of the Gigantomachy—these vibrant tales of divinity and heroism will replace the somber, sorrowful icons of the past."
 great_project_type_convert_hagia_sophia_contribution_name_frescoes: ""
 great_project_type_convert_hagia_sophia_contribution_priests: "Consecrate the Hierophants"
 great_project_type_convert_hagia_sophia_contribution_priests_desc: "A temple without priests is a mere monument. For the final and most crucial step, we must establish a new Hellenic priesthood worthy of this grand edifice. This contribution will fund the recruitment and training of scholars of the old ways, consecrating them as the Hierophants of Athena. They will establish the new rites, perform the sacrifices, and make this temple a living, breathing center of our faith."
 great_project_type_convert_hagia_sophia_contribution_name_priests: ""

 convert_hagia_sophia.0001.t: "The Temple is Purified"
 convert_hagia_sophia.0001.desc: "My Lord, the work is done. The Great Church is no more. The last mosaic has been scraped from the walls, the final crucifix consigned to the foundry. The clatter of falling icons has given way to an echoing silence within the vast, now-empty hall. We have washed the building clean of its past. It is now a blank canvas, awaiting the imprint of the true Gods."
 convert_hagia_sophia.0001.a: "A necessary, if brutal, beginning."

 convert_hagia_sophia.0002.t: "Remaking the Cella"
 convert_hagia_sophia.0002.desc: "My Lord, the master architect reports resounding success. The interior of the great building has been transformed. Where once there was a space for preaching, there is now a vast, open hall designed for silent awe before a central, divine figure. The massive plinth awaits its goddess, dominating the chamber and drawing the eye of all who enter. The physical heart of the temple is ready."
 convert_hagia_sophia.0002.a: "A fitting throne for a Goddess."

 convert_hagia_sophia.0003.t: "The Palladium Arrives"
 convert_hagia_sophia.0003.desc: "My Lord, the day the great statue was unveiled will be spoken of for centuries. As the enormous veil was dropped, a collective gasp echoed through the cella. Bathed in the light from the great dome, the colossal ivory and gold figure of Athena seems to breathe with divine life. Her fierce gaze now watches over the city, a tangible symbol of power and wisdom. A Goddess has returned to her rightful home."
 convert_hagia_sophia.0003.a: "Goddess of wisdom indeed!"

 convert_hagia_sophia.0004.t: "The Walls Tell New Stories"
 convert_hagia_sophia.0004.desc: "My Lord, the interior of the temple is now a dazzling spectacle of color and drama. The stark white walls have been transformed into a breathtaking gallery of our sacred myths. To walk beneath the great dome is to be surrounded by gods and heroes, to witness the primordial struggles and great quests of our lore. The temple is no longer just a house of worship, but a library of our people's soul."
 convert_hagia_sophia.0004.a: "A lesson in glory for all to see."
 
 convert_hagia_sophia.0005.t: "The Temple Lives!"
 convert_hagia_sophia.0005.desc: "My Lord, what was once the Hagia Sophia is now, truly and finally, the Grand Temple of Athena. Today, the newly consecrated Hierophants performed the first official sacrifices before the Palladium. The scent of burnt offerings and sanctified laurel has replaced the cloying smell of incense. The temple is alive, its rituals established and its calendar of festivals set. A new era of faith has begun in the heart of the city."
 convert_hagia_sophia.0005.a: "At last. The restoration is complete."

 convert_hagia_sophia.0006.t: "Athena Ascendant"
 convert_hagia_sophia.0006.desc: "Today, I stood on the threshold of the reborn temple as the newly consecrated Hierophants, clad in white linen, performed the first great sacrifice. The scent of burnt offerings and sanctified laurel filled the vast hall, banishing the last lingering scent of a thousand years of foreign incense.\n\nThe colossal Palladium of ivory and gold seemed to draw all light unto itself, its jeweled eyes gazing out with fierce wisdom over the city it now protects. The walls, once bare, are now a vibrant tapestry of myth and heroism, the glorious deeds of Gods and men replacing the sorrowful icons of the Nazarene. The sorrowful dirges of the old faith are banished, replaced by epic hymns to the All-Seeing Pallas Athena.\n\nThis is not merely a conversion; it is a restoration. The soul of our people, long dormant, has been given a new heart of stone and gold. My name will not just be recorded in a dusty chronicle; it is now etched into the very soul of this city, a legacy as grand and enduring as the dome of this sacred temple."
 convert_hagia_sophia.0006.a: "The Age of False Gods is over! A new Olympus rises!"
 
 convert_hagia_sophia.0007.t: "The Conversion Has Failed!"
 convert_hagia_sophia.0007.desc: "The Master of Works overseeing the temple conversion has thrown himself at my feet, his face ashen. The project has collapsed.\n\nHe speaks not of enemies at the gate, but of a rot from within. The work has been plagued by a series of 'ill omens'—a fire broke out during the scraping of the mosaics, scaffolding collapsed for no reason, and a strange sickness swept through the artists commissioned for the frescoes. Spurred on by whispers from remnant Nazarene priests, the workers now believe the project is cursed by their dead god. They have deserted in droves, refusing to touch another stone.\n\nWhat little work was done is now being undone by looters and pious vandals. The project is a ruin, a half-purified, half-desecrated shell that satisfies no god and inspires no one. We sought to create a monument to our faith's glorious rebirth, and instead, we have created a monument to our own hubris and impotence."
 convert_hagia_sophia.0007.a: "Surely the work of the Nazarene!"

 CONSTANTINOPLE_LOCATION_TOOLTIP: "You hold Constantinople"
 
 building_bgp_hagia_sophia_03: "Grand Temple of Athena"
 building_bgp_hagia_sophia_03_desc: "Bathed in the light from the immense dome stands the colossal Palladium of Constantinople, a chryselephantine statue of Athena Promachos whose vigil never ceases. Its walls are a vibrant tapestry of myth and heroism, depicting the timeless tales of the Gods and the great heroes of old.\n\nThe air is perfumed with the scent of sanctified laurel and burnt offerings, as the Hierophants perform the sacred rites. This is the undisputed spiritual heart of the Empire and the center of the Hellenic faith, a monument of unparalleled splendor that proclaims the might of the Gods."
 building_type_bgp_hagia_sophia_03: "$building_bgp_hagia_sophia_03$"
 building_type_bgp_hagia_sophia_03_desc: "$building_bgp_hagia_sophia_03_desc$"
 
 bgp_temple_of_athena: "You need to adhere to the Graeco-Roman faith."