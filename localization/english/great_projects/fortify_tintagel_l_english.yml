 LR_abandoned_project_modifier_desc: "This character has started a great project, only to fail spectacularly, thus bringing shame upon themselves."

 port_builder_modifier: "Port Builder"
 port_builder_modifier_desc: "My investment in constructing a secure harbor in one of the world's most treacherous locations has earned me a formidable reputation. I am now regarded as an expert in maritime engineering and naval logistics. Captains and merchants alike know that a port built with my backing is a safe and prosperous one."

 fortify_tintagel.0001.t: "The Great Bridge Stands"
 fortify_tintagel.0001.desc: "A report from your Master Engineer at Tintagel arrives, glowing with professional pride. He confirms that the Great Bridge is complete. Defying gravity and the ceaseless winds, his masons have successfully spanned the chasm, linking the island headland to the mainland once more. The island is no longer isolated; it can now be properly supplied, garrisoned, and controlled. It is a triumph of engineering."
 fortify_tintagel.0001.a: "A vital link in the chain of our power."

 fortify_tintagel.0002.t: "The Sea-Gate is Secured"
 fortify_tintagel.0002.desc: "The new Castellan of Tintagel sends word that the fortified Sea-Gate is now operational. The treacherous cove at the base of the cliffs has been transformed into a secure, hidden harbor. With its new sea walls and heavy winches, the fortress can now be resupplied by sea in all but the worst weather, making a traditional siege nearly impossible. The castle's maritime lifeline is now secure against both enemy fleets and the fury of the ocean."
 fortify_tintagel.0002.a: "Let our enemies wonder how its garrison never starves."

 fortify_tintagel.0003.t: "The High Citadel is Complete"
 fortify_tintagel.0003.desc: "An update from the chief architect informs you that the High Citadel on the island's peak now stands finished. Its tall keep commands a panoramic view of the coastline and the western approaches, serving as an unparalleled watchtower. The magnificent Great Hall within is a worthy residence for any lord, transforming the rock from a mere military outpost into a true seat of power. The commanding heart of the fortress is now in place."
 fortify_tintagel.0003.a: "A seat of power worthy of its location."

 fortify_tintagel.0004.t: "The Mainland Ward is Fortified"
 fortify_tintagel.0004.desc: "The captain of the Tintagel garrison reports that the 'Mainland Ward' is complete. The approach to the Great Bridge is now protected by a formidable gatehouse and a thick curtain wall. Any force wishing to assault the island must first overcome this powerful outer defense, a costly and likely futile endeavor. The fortress is now truly sealed against any landward attack."
 fortify_tintagel.0004.a: "The first and strongest lock has been set."

 fortify_tintagel.0005.t: "The Lord of the Sea-Cliffs"
 fortify_tintagel.0005.desc: "I stand on the battlements of the newly completed High Citadel, the sea wind whipping my cloak about me. Below, the new bridge stands strong, linking my fortress to the land. Tintagel is no longer a ruin haunted by the ghosts of forgotten lords; it is a living, breathing fortress of immense power, and it is mine.\n\nThis castle is a testament to my will, a victory not just over rival lords, but over the very elements of nature. Storms may break upon these cliffs, but they will not break my fortress. The world will not see a mere lord in a remote castle; they will see the master of the western seas, and they shall know that this coast has a powerful guardian."
 fortify_tintagel.0005.a: "Incredible! And mine!"
 
 fortify_tintagel.0006.t: "The Sea Swallows All"
 fortify_tintagel.0006.desc: "A devastating report has arrived from Cornwall, its ink bled by rainwater. A winter storm of unprecedented fury has shattered our work at Tintagel. The half-finished bridge, its supports not yet fully seated, was smashed to pieces by colossal waves. Landslides have sent parts of the new citadel foundations crumbling into the churning sea below.\n\nMy attempt to tame this wild coast has ended in utter ruin, my treasures swallowed by the sea and my name now a cautionary tale for any who would dare to challenge the power of nature."
 fortify_tintagel.0006.a: "Horrible!"

 TINTAGEL_LOCATION_TOOLTIP: "You need to hold [GetTitleByKey('c_cornwall').GetName]"

 building_LR_fortified_tintagel: "Tintagel Castle"
 building_LR_fortified_tintagel_desc: "Reborn from scattered ruins, Tintagel now stands as a masterpiece of military engineering. A great bridge spans the chasm to the mainland, while a hidden sea-gate guarantees resupply from the churning waters below. The High Citadel, perched on the island's peak, is an impregnable seat of power that projects its owner's authority over the entire Cornish coast and the western seas."
