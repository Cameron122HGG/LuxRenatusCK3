l_english:

 great_project_type_fortify_tintagel: "Fortify Tintagel"
 great_project_type_fortify_tintagel_desc: "On windswept cliffs of black stone stands the ruin of Tintagel, the ancient seat of the Dukes of Cornwall and a legendary, near-impregnable stronghold. For centuries, however, it has been left to the sea and the wind, its power nothing more than a memory.\n\nThat time is over. We will tame this savage coast. We will rebuild the great bridge, secure the hidden harbor, and raise the citadel anew. To rule from Tintagel is to master the Cornish seas, creating a bastion of maritime power that will dominate the western approaches. It is a declaration that this coastline, and its wealth, belong to me."
