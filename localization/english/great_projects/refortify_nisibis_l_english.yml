l_english:

 great_project_type_refortify_nisibis: "Refortify Nisibis"
 great_project_type_refortify_nisibis_desc: "The Mesopotamian frontier is a gaping wound, a land of arid plains where our enemies can ride unopposed. To secure this border, we must not just patrol it, but anchor it with a fortress of unimaginable strength.\n\nHistory provides the blueprint. For centuries, the city of Nisibis served as the Roman Empire's unbreakable shield in the East. It was 'The Bulwark of the Empire', a legendary fortress that withstood the might of the Sassanid Persians time and time again, its walls holding firm against cataclysmic sieges. Its tragic loss, ceded by treaty after the death of Emperor Julian, was a wound from which the eastern frontier never fully recovered.\n\nNow, the city lies a shadow of its former self. The time has come to right this ancient wrong. We will resurrect the legend—not by patching broken walls, but by undertaking a monumental effort to build a new fortress upon the old foundations. We will forge a bastion so powerful that its very name becomes a synonym for Imperial might, securing our eastern lands for generations to come."
 great_project_type_tooltip_refortify_nisibis: ""
 great_project_name_possessive_refortify_nisibis: ""
 great_project_name_refortify_nisibis: ""
 
 great_project_type_refortify_nisibis_contribution_foundations: "Secure the Pass"
 great_project_type_refortify_nisibis_contribution_foundations_desc: "The ruins of past glories and countless sieges choke the city. Before we can build, we must clear away the rubble of broken walls and collapsed aqueducts. This foundational work will also allow our engineers to survey the original Roman fortifications, ensuring that our new defenses are built upon the bedrock of ancient, proven strength."
 great_project_type_refortify_nisibis_contribution_name_foundations: ""
 great_project_type_refortify_nisibis_contribution_walls: "Rebuild the Outer Walls"
 great_project_type_refortify_nisibis_contribution_walls_desc: "Now, the great work begins in earnest. This contribution will fund the quarrying of immense amounts of stone and the legions of masons and laborers required to raise a new defensive curtain around the city. We will not merely patch the old walls, but construct a new, thicker, and taller perimeter, complete with interlocking towers and fortified gatehouses."
 great_project_type_refortify_nisibis_contribution_name_walls: ""
 great_project_type_refortify_nisibis_contribution_citadel: "Construct the Citadel"
 great_project_type_refortify_nisibis_contribution_citadel_desc: "While the outer walls protect the city, an inner citadel is needed to house its permanent garrison and serve as a final bastion of defiance. This work will construct a dedicated military fortress within the city itself, complete with extensive barracks, armories, stables, and training grounds for our elite frontier legions."
 great_project_type_refortify_nisibis_contribution_name_citadel: ""
 great_project_type_refortify_nisibis_contribution_logistics: "The Strategic Granaries & Cisterns"
 great_project_type_refortify_nisibis_contribution_logistics_desc: "A fortress is defeated by hunger and thirst long before it is defeated by the sword. To ensure Nisibis can withstand the longest of sieges, this contribution will fund the construction of vast, underground granaries to hold years of grain, and deep, well-protected cisterns to guarantee a supply of fresh water, rendering the city almost entirely self-sufficient."
 great_project_type_refortify_nisibis_contribution_name_logistics: ""

 bulwark_of_mesopotamia_modifier: "Bulwark of Mesopotamia"
 bulwark_of_mesopotamia_modifier_desc: "The monumental task of refortifying Nisibis is complete. Its impenetrable new walls and the formidable Iron Citadel have transformed the city into a bastion of Imperial power. Its formidable Iron Citadel houses a large, professional garrison, and the constant presence of this immense military power ensures unwavering loyalty and absolute control over the surrounding region. Nisibis now stands as the unshakeable cornerstone of the Empire's defense in the East."

 refortify_nisibis.0001.t: "The Foundations are Cleared"
 refortify_nisibis.0001.desc: "My Lord, the chief engineer in Nisibis reports that the arduous task of clearing the city's foundations is complete. The debris of centuries has been hauled away, revealing the masterful stonework of our ancestors. We now have a clean and solid base upon which to build, and the master plan for the new fortifications is ready."
 refortify_nisibis.0001.a: "Upon this rock, we shall build our shield."

 refortify_nisibis.0002.t: "The Walls of Nisibis Stand Tall"
 refortify_nisibis.0002.desc: "My Lord, a triumphant message from the master mason at Nisibis! The outer walls are finished, rising high above the Mesopotamian plain. The city once again presents a formidable face of solid stone to our enemies, a clear declaration of our intent to hold this vital frontier. Though much work remains within, the city is once again a fortress."
 refortify_nisibis.0002.a: "A magnificent and daunting sight!"

 refortify_nisibis.0003.t: "The Citadel is Garrisoned"
 refortify_nisibis.0003.desc: "My Lord, your chief commander in the east sends his profound thanks. The Iron Citadel within Nisibis is complete and has been garrisoned by the finest soldiers of the frontier. Morale is sky-high, as the men are now housed in a state-of-the-art fortress, safe from both enemy assault and the city's internal politics. Nisibis is no longer just a stronghold; it is now a true military headquarters."
 refortify_nisibis.0003.a: "From this bastion, our power will project eastward."

 refortify_nisibis.0004.t: "The City's Reserves are Full"
 refortify_nisibis.0004.desc: "My Lord, the quartermaster at Nisibis reports that the new Strategic Granaries have been filled, and the water level in the great cisterns is high. Should our enemies surround the city, they will find no weakness here. The garrison can be starved out no more easily than can the desert stones themselves. The city is prepared to endure a siege of almost indefinite length."
 refortify_nisibis.0004.a: "Patience and preparation are our greatest weapons."

 refortify_nisibis.0005.t: "Nisibis Stands!"
 refortify_nisibis.0005.desc: "A jubilant dispatch arrives from your commander on the eastern frontier. The final keystone has been laid, the last granary sealed. The great work is done: Nisibis has been reborn.\n\nThe city is no longer a vulnerable border town, but a masterpiece of military engineering. Its new walls tower over the plains, a sheer face of stone and defiance. Within, a powerful Iron Citadel serves as the garrison's heart, and its vast stores of food and water make it impervious to siege. It is an unbreachable bulwark, a shield of stone and iron held against the eastern deserts.\n\nGenerations of effort and a king's ransom in gold have been spent, but the result is a fortress without equal. My name, and the names of my ancestors who contributed to this grand design, will be forever synonymous with the strength and security of the Empire's eastern frontier."
 refortify_nisibis.0005.a: "Let our enemies break themselves upon our walls!"
 
 refortify_nisibis.0006.t: "The Work is Abandoned!"
 refortify_nisibis.0006.desc: "A devastating report has arrived from the Master of Works overseeing the refortification of Nisibis. The project is finished, but not in glory. He writes that the continuous turmoil in the realm and the crippling costs have bled the endeavor dry. The river of silver required for stone, timber, and wages has run dry.\n\nWorkers have long since deserted their posts, and local corruption has siphoned away what little funding remained. The half-finished walls now stand open to the elements, their wooden scaffolding rotting in the sun. What was meant to be a symbol of our strength has become a testament to our overreach, a skeletal ruin that invites derision from our enemies.\n\nThe dream of a new, unbreachable Nisibis is dead. The fortune spent is utterly lost, and all we have to show for it is a magnificent, costly ruin—a monument to our own folly."
 refortify_nisibis.0006.a: "A bitter lesson in the cost of ambition."

 NISIBIS_LOCATION_TOOLTIP: "You hold Nisibis (Nasibin) "