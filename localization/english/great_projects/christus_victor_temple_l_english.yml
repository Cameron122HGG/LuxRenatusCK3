 great_project_type_christus_victor_temple: "Raise the Triumphal Hall of Christus Victor"
 great_project_type_christus_victor_temple_desc: "Our faith is one of fire, steel, and victory. Our god, Christus Victor, is not a suffering victim but a triumphant, unconquered warrior-god, and His temple must reflect this truth. The humble churches of the Nazarenes are insufficient for our purpose. We shall build a house worthy of the Unconquered Christ.\n\nThis will be a Grand Temple, a monument to holy war and Imperial destiny. Built on an unprecedented scale, it will serve as the spiritual heart of our righteous cause, a place to offer sacrifices of victory, to consecrate our swords, and to proclaim the coming of the rightful Sol-Imperator. Its golden dome will be a new sun, a beacon to the faithful and a promise of fire to the usurpers of the fallen world."
