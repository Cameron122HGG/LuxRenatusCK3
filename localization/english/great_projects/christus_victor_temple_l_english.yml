 solar_crusader_modifier: "Solar Crusader"
 solar_crusader_modifier_desc: "My wealth and will have helped raise the Grand Temple, a testament to our holy cause. I am not merely seen as a pious benefactor, but as a true Solar Crusader, one who has forged the very foundations of the coming righteous Empire. The Solar Priesthood recognizes my exceptional devotion, and my name is spoken with reverence by the faithful legions."

 christus_victor_temple.0001.t: "The Foundations are Laid"
 christus_victor_temple.0001.desc: "The Master of Works sends a report charged with religious fervor. The foundations have been laid according to the sacred geometry, perfectly aligned with the rising sun. At the consecration ceremony this dawn, the first rays of light blazed along the entire length of the marked-out nave, illuminating the planned site of the high altar in a halo of gold. The men have taken it as a sign of divine approval from Sol himself. We do not build on mere stone, but on a foundation of victory."
 christus_victor_temple.0001.a: "Sol Christus has blessed our endeavor!"

 christus_victor_temple.0002.t: "The Colonnade Stands"
 christus_victor_temple.0002.desc: "A dispatch from one of our generals has arrived. He writes that the new Colonnade of Legions has had a profound effect on the morale of your soldiers. Veterans and new recruits alike make pilgrimages to the construction site to gaze upon the towering marble column bearing their legion's eagle. A fierce pride and a healthy rivalry has developed, as each unit proclaims their column to be the grandest. The Basilica is already becoming an integral part of our army's martial spirit."
 christus_victor_temple.0002.a: "Let them compete now in stone, and later in glory."

 christus_victor_temple.0003.t: "The Apse is Raised"
 christus_victor_temple.0003.desc: "The chief architect reports that the grand Apse has been completed. Its magnificent half-dome soars above the elevated Tribune, a stage designed not for meek prayer, but for proclamation and judgment. He notes with pride that even a single man's voice, spoken from the Tribune, resonates with immense authority throughout the entire nave. It is a space built for the voice of a god, and for the Sol-Imperator who speaks in His name."
 christus_victor_temple.0003.a: "A fitting stage for our sacred rites."

 christus_victor_temple.0004.t: "The Golden Dome Shines!"
 christus_victor_temple.0004.desc: "Travelers bring tales from your capital. As the final scaffolding was removed from the great dome, the entire city stopped to gaze in wonder. When the midday sun struck the gilded bronze, it blazed with a blinding light, a man-made star that outshone everything around it. It is visible for leagues, a brilliant jewel proclaiming your power and the ascendancy of Sol Christus. Your friends see it as a beacon of hope; your enemies, as a burning eye."
 christus_victor_temple.0004.a: "Let it be a promise of fire to my foes."

 christus_victor_temple.0005.t: "The Mosaics are Complete"
 christus_victor_temple.0005.desc: "The Master Artisan has declared the great mosaics finished. They are magnificent, a testament to our faith's martial soul. Shimmering gold and blood-red tiles depict not suffering saints, but triumphant warrior-emperors and righteous victories. In one area, a false king is struck down by divine light; in another, legions march under the banner of the Unconquered Sun. These are not mere decorations; they are lessons in holy war rendered in stone, inspiring righteous fury in all who see them."
 christus_victor_temple.0005.a: "The very walls will preach our holy purpose."
 
 christus_victor_temple.0006.t: "The Instrument of Victory, Housed"
 christus_victor_temple.0006.desc: "A reverent letter arrives, sealed with the emblem of the Solar Priesthood. The High Priest confirms that in a solemn, private ceremony, the Sword of Victory has been installed in its new shrine. He writes that it rests under heavy guard, its polished steel seeming to drink the light, a coiled spring of potential violence. It is no longer just a weapon; it is the sacred instrument of our cause, awaiting the hand of the Sol-Imperator to dispense the god's brutal judgment."
 christus_victor_temple.0006.a: "It rests now, but it will not rest forever."

 christus_victor_temple.0007.t: "The Imperial Saints Have a Home"
 christus_victor_temple.0007.desc: "The Chronicler of the Imperial Court notes a solemn occasion: the great generals and heroes of your line have been re-interred within the new Mausoleum. Their caskets now line the crypt in ranks, like soldiers on parade. To descend into the vaults is to stand in review before the greatest warriors of your dynasty. They are a silent legion, our Imperial Saints, a permanent link to our glorious past and the spiritual guardians of our future."
 christus_victor_temple.0007.a: "Even in death, they serve the Empire."

 christus_victor_temple.0008.t: "The Solar Schola is Founded"
 christus_victor_temple.0008.desc: "The Magister of the newly established Solar Schola sends his first progress report. The first class of novices has been accepted, and they are everything we could have hoped for: young, fanatically devout, and sharp of mind. They are being trained not only in sacred scripture and solar rites, but in history, strategy, and bladecraft. We are forging the next generation of our faith's leaders—men who will be priests and officers in one."
 christus_victor_temple.0008.a: "This will ensure our faith endures for centuries."

 christus_victor_temple.0009.t: "The Temple is Abandoned!"
 christus_victor_temple.0009.desc: "The Master of Works has confirmed the catastrophic news. The grand project is dead. The constant turmoil in my realm has starved the endeavor of funds and manpower. The work has ground to a halt.\n\nThe High Priest of Sol Christus interprets this failure not as a logistical problem, but as a sign of divine wrath. He preaches that the Unconquered Sun has turned His face from us, deeming my reign or my dynasty unworthy of His favor. The half-finished dome, meant to be a new sun, now stands as a dark and mocking crescent. The unfinished mosaics are seen as a prophecy of our own incomplete victory.\n\nMy attempt to build a monument to my piety has instead become a towering symbol of my failure and a source of whispers that I am not the chosen one of our god. My legacy is now one of ruin and divine rejection."
 christus_victor_temple.0009.a: "Has the Unconquered God abandoned me?"

 christus_victor_temple.0010.t: "The New Sun Rises"
 christus_victor_temple.0010.desc: "Today, under the blinding glare of our new golden dome, I stood before the assembled legions and the sanctified Solar Priesthood. The High Priest raised the Sword of Victory to the heavens, its steel catching the sun's rays and casting a brilliant beam across the awe-struck crowd. The great work is finished. The Grand Temple of Christus Victor is consecrated.\n\nThis is no mere church; it is a temple of holy war, a promise of destiny wrought in marble and gold. Within its halls, the great mosaics cry out for righteous violence, the colonnade proclaims our military might, and the ever-burning lamps illuminate the path to our glorious future. Even now, the first great sacrifice of victory smokes upon the altar, its scent a pleasing aroma to the Unconquered God.\n\nLet the false emperors and puppet-prophets tremble. We have built not just a temple, but the spiritual capital of the true Empire. From this sacred place, a new age of fire and steel will begin."
 christus_victor_temple.0010.a: "For the glory of Sol and the coming of the rightful Imperator!"

 building_LR_christus_victor_temple: "Triumphal Hall of Christus Victor"
 building_LR_christus_victor_temple_desc: "This is no humble church, but a grand basilica built in the Roman tradition of a conqueror's Triumphal Hall. Its gilded dome blazes like a second sun, while within, a forest of marble columns dedicated to the legions stands eternal guard. The walls glitter with magnificent mosaics depicting holy victories and the righteous slaughter of the faithless.\n\nFrom the elevated Tribune, the Solar Priesthood proclaims the gospel of fire and steel. This is the sacred heart of the Empire's true faith, a place where victorious generals present their spoils, where the Sword of Victory is enshrined, and where sacrifices are made to honor the Unconquered Sun. It is a monument dedicated to war, victory, and the divine right of the Sol-Imperator."
 building_type_LR_christus_victor_temple: "$building_LR_christus_victor_temple$"
 building_type_LR_christus_victor_temple_desc: "$building_LR_christus_victor_temple_desc$"

