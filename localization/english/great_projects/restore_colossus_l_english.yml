l_english:

 great_project_type_restore_colossus: "Restore the Colossus of Rhodos"
 great_project_type_restore_colossus_desc: "Of the Seven Wonders of the Ancient World, none proclaimed the sheer power and glory of its creators quite like the Colossus of Rhodos. For half a century, the immense bronze statue of the sun god Helios bestrode the harbor, a man-made god gazing out upon the sea. Felled by an earthquake and its priceless bronze sold for scrap centuries ago, it has since been nothing more than a legend.\n\nThe time has come to challenge history itself. We will not simply build a monument; we will resurrect a legend from the depths of memory. A mountain of bronze, a forest of iron, and the skill of a thousand artisans will be required for this act of monumental hubris. We will raise Helios anew, creating a guardian for our harbor and a statement to the world that we are the true heirs to the greatness of old. We shall give the world back its lost Wonder, and in doing so, forge an eternal legacy in our own name."
 great_project_type_tooltip_restore_colossus: ""
 great_project_name_possessive_restore_colossus: ""
 great_project_name_restore_colossus: ""
 
 great_project_type_restore_colossus_contribution_foundations: "Rediscover the Foundations"
 great_project_type_restore_colossus_contribution_foundations_desc: "For nearly a thousand years, the Colossus has been a memory, its remnants plundered or lost. Before a single stone can be laid, we must excavate the harbor entrance, consult ancient accounts, and employ the finest surveyors to rediscover the exact location of the original foundations. A monument of this scale must be built upon the bedrock of its own history."
 great_project_type_restore_colossus_contribution_name_foundations: ""
 great_project_type_restore_colossus_contribution_skeleton: "Forge the Iron Skeleton"
 great_project_type_restore_colossus_contribution_skeleton_desc: "A river of iron is needed to build the god's bones. This contribution will fund the colossal undertaking of forging the internal framework of the Colossus. Thousands of iron bars must be hammered and riveted together by our best blacksmiths, creating a towering skeleton that will rise over the harbor and serve as the core structure upon which the bronze skin will be attached."
 great_project_type_restore_colossus_contribution_name_skeleton: ""
 great_project_type_restore_colossus_contribution_skin: "Cast the Bronze Skin"
 great_project_type_restore_colossus_contribution_skin_desc: "The final, most glorious, and most expensive stage of construction. We must acquire a mountain of bronze to cast the hundreds of gleaming plates that will form the Colossus's skin. This will require the construction of immense new foundries and gathering every master metallurgist in the realm to give the god his radiant, sun-like form."
 great_project_type_restore_colossus_contribution_name_skin: ""
 great_project_type_restore_colossus_contribution_beacon: "Ignite the Beacon of Helios"
 great_project_type_restore_colossus_contribution_beacon_desc: "The Colossus stands, but its eyes are dark. This work will install a great reflector and brazier within the statue's head or upheld hand. An eternal flame, attended by priests, will turn the statue into a magnificent lighthouse, a 'Beacon of Helios' to guide friendly ships to harbor and stand as a symbol of our divine favor."
 great_project_type_restore_colossus_contribution_name_beacon: ""

 restore_colossus.0001.t: "The Foundations are Rediscovered"
 restore_colossus.0001.desc: "My Lord, the chief surveyor sends a triumphant report from Rhodes! After months of painstaking excavation and study, they have located the massive marble plinths upon which the original Colossus stood. The sheer size of these foundations has silenced all doubters. We now know where the god once stood, and where he will stand again."
 restore_colossus.0001.a: "A promising and historic start!"

 restore_colossus.0002.t: "The Skeleton is Forged"
 restore_colossus.0002.desc: "My Lord, the constant clang of hammers in Rhodes has fallen silent. The Master Smith reports that the great iron skeleton is complete, its immense form already dominating the skyline. It stands as a stark, skeletal promise of what is to come, its iron limbs reaching for the sky. The frame is ready to be given its divine flesh."
 restore_colossus.0002.a: "A framework worthy of a god!"

 restore_colossus.0003.t: "The Colossus is Whole!"
 restore_colossus.0003.desc: "My Lord, it is done. The final bronze plate has been hoisted and riveted into place. The Colossus of Rhodes—no longer a skeleton of iron, but a magnificent, towering figure of gleaming bronze—stands whole once more. As the sun catches its polished surface, it seems to radiate its own light, a blinding beacon of our power and piety. The harbor of Rhodes once again has its eternal guardian."
 restore_colossus.0003.a: "A wonder of the world, reborn!"

 restore_colossus.0004.t: "The Beacon is Lit!"
 restore_colossus.0004.desc: "My Lord, last night the chief priest performed the rites, and the great beacon of the Colossus was lit for the first time. Its powerful light swept across the sea, a man-made star visible for leagues. The sailors are already calling it a miracle, and the priests say that Helios himself now watches over our harbor through the statue's fiery gaze."
 restore_colossus.0004.a: "A light for our friends, and a warning to our enemies."

 restore_colossus.0005.t: "The Sun God Rises Anew"
 restore_colossus.0005.desc: "Today, as the last of the immense scaffolding was torn away, an awe-struck silence fell over the harbor of Rhodes, soon broken by a deafening cheer from a thousand throats. The work is done. The Colossus lives again.\n\nThe towering figure of Helios, wrought from a mountain of gleaming bronze, dominates the skyline, its polished skin catching the sun with such brilliance that it appears as a star descended to earth. Ships that once seemed so mighty now look like children's toys as they pass beneath its gaze. It is not merely a statue; it is a declaration of power, a god made manifest through our ambition and will.\n\nGenerations of effort and a treasury's worth of gold have been spent to resurrect a legend. My name will forever be linked with the day we gave the world back one of its Wonders, and my legacy is now as tall and immutable as the bronze god who guards our shores."
 restore_colossus.0005.a: "Let the world gaze upon our work and marvel!"
 
 restore_colossus.0006.t: "The Bronze Tear"
 restore_colossus.0006.desc: "A panicked report arrives from Master of Works in Rhodes. The project has collapsed under its own immense weight. The river of silver required for bronze and wages has run dry, and the skilled workers, their pay long overdue, have begun to riot, sabotaging the forges before melting back into the populace.\n\nThe scene is one of profound waste. The great iron skeleton, only partially clad, stands skeletal and rusting against the sky. Immense bronze plates, expertly cast and worth a fortune, lie half-buried in the mud, never to be raised. We reached for the sun, and our ambition has cost us dearly.\n\nAll we have to show for this grand endeavor is a treasury bled dry and a harbor cluttered with the world's most expensive scrap metal. This is not a monument to our glory, but to our folly."
 restore_colossus.0006.a: "An age of ambition ends in an age of rust."

 RHODES_LOCATION_2_TOOLTIP: "You hold Rhodos"
 colossus_of_rhodos_modifier_desc: "The magnificent bronze Colossus stands anew, bestriding the harbor of Rhodos. Its sheer scale and legendary status draw merchants, sailors, and pilgrims from across the known world, turning the island into a hub of immense wealth and prestige. Its gleaming form is a potent symbol of our power, serving as both a welcoming guide for friendly fleets and a daunting warning to any would-be attacker. Rhodos is no longer just an island; it is the home of a true Wonder of the World."
 colossus_of_rhodos_modifier: "The Colossus of Rhodos"
 
 maritime_benefactor_modifier_desc: "My significant contribution to the restoration of the great harbor guardian of Rhodes has earned me a celebrated reputation among all who ply the seas. In ports across the world, sailors, merchants, and captains toast my name, seeing me as a great patron of trade and a guarantor of safe passage. They know that my investment in the Colossus was an investment in the maritime prosperity of the entire region."
 maritime_benefactor_modifier: "Maritime Benefactor"
 
 dynasty_legacy_of_the_colossus_modifier_desc: "The name of our dynasty is now forever etched into history alongside one of the Seven Wonders of the Ancient World. Generations from now, our descendants will be known as the bloodline that raised a god of bronze from the dust of memory. This legendary feat has bestowed upon our House a timeless and monumental prestige that awes lesser families."
 dynasty_legacy_of_the_colossus_modifier: "Legacy of the Colossus"