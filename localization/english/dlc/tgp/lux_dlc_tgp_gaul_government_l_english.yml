 gaul_personal_relation_ceremonial_regent_other: "[vassal.GetShortUINamePossessive] [ceremonial_regent|E]"

 gaul_administrative_government: "Gallic Administrative"
 gaul_administrative_government_adjective: "$gaul_administrative_government$"
 gaul_administrative_government_with_icon: "@government_type_ritsuryo! $gaul_administrative_government$"
 gaul_administrative_government_desc: "\n$gaul_administrative_government$ is a type of [administrative|E] [government|E] unique to Gaul.\n\nIt is a centralized [government_bureaucratic_type|E] [government_form|E] where [characters|E] are appointed as [governors|E] on behalf of their [liege|E], have access to [influence|E], and [noble_family|E] [house_head_heads|E] have a [family_manor|E] and [house_aspiration|E].\n\nA [kampaku|E] governs the [realm|E] on behalf of the [gallic_high_king|E], and may be elected from among [noble_family|E] [house_head_heads|E], or imposed by [faction|E] demand.\n\n$gaul_administrative_government$ [vassals|E] generally govern only a single [county|E], but may reject the centralized system and become local [soryo|E] lords to build their own power, though this is usually considered a [criminal|E] act.\n\n$gaul_administrative_government$ $game_concept_house_heads$ may create and join [house_blocs|E] within the [realm|E], which will support the [leading_house|E] in becoming $game_concept_majordomo_gaul$.\n\n$gaul_government_domain_limit_help$\n\n#F The $gaul_administrative_government$ system refers to the centralized administrative government of Gaul, inspired by the Chinese Confucian bureaucracy.#!"
 gaul_feudal_government: "Gallic Dynastic" # 惣領
 gaul_feudal_government_adjective: "$gaul_feudal_government$"
 gaul_feudal_government_with_icon: "@government_type_soryo! $gaul_feudal_government$"
 gaul_feudal_government_desc: "\n$gaul_feudal_government$ is a type of [feudal|E] [government|E] unique to Gaul.\n\n$gaul_feudal_government$ represents local lords who have discarded or supplanted the reach of the central [ritsuryo|E] government and rule provinces as their own fiefs.\n\n$gaul_feudal_government$ Characters do not use [influence|E], but [noble_family|E] [house_head_heads|E] retain their [family_manor|E] and [house_aspiration|E].\n\nThough they cannot be elected [ceremonial_regent|E], $gaul_feudal_government$ [rulers|E] may take power via the #V $replace_ceremonial_regent_faction_name$#! [faction|E], and use the #V Formalize Shōgunate#! [decision|E].\n\n$gaul_feudal_government$ $game_concept_ceremonial_regents$ govern the [realm|E] on behalf of the [gallic_high_king|E], inherit by $single_heir_succession_law$ [succession|E], and may be overthrown by [faction|E] demand.\n\n$gaul_feudal_government$ $game_concept_house_heads$ may create and join [house_blocs|E] within the [realm|E].$gaul_government_domain_limit_help$\n\n\n\n#F $gaul_feudal_government$ refers to the early stages of Gaulese feudalization beginning in the Heian-period, increasingly formalized under the Kamakura-period's first Shōgunate.#!"
 gaul_government_domain_limit_help: "@alert_icon! #HELP Gaulese $game_concept_governments$ have a lower [domain_limit|E] than others, which may be increased by upgrading the $game_concept_family_manor$.#!"
 tgp_is_gallic_governor_trigger: "You are a [GetGovernment('gaul_administrative_government').GetName] [governor|E]"

 # Appointment Succession Law
 gallic_appointment_succession_law: "$gaul_administrative_government$ Appointment Succession"
 gallic_appointment_succession_law_subname: "Candidate with the Highest Score Inherits"
 gallic_appointment_succession_law_effects: "\nA type of [appointment_succession_law|E]. Under $gallic_appointment_succession_law$, the [title|E] and its associated [holdings|E] will be inherited by the candidate with the highest score. Any [adult|E] in the [realm|E] may strive to attain a [governorship|E] through various means from [scheming|E] to spending [influence|E]."
 gallic_military_appointment_succession_law: "$gaul_administrative_government$ Military Succession"
 gallic_military_appointment_succession_law_subname: "Candidate with the Highest Score Inherits"
 gallic_military_appointment_succession_law_effects: "\nA type of [appointment_succession_law|E]. Under $gallic_military_appointment_succession_law$, the [title|E] and its associated [holdings|E] will be inherited by the candidate with highest [candidate_score|E]. Any [adult|E] in the [realm|E] may strive to attain a military [governorship|E] by having a good [martial_skill|E], gaining [commander_traits|E], or spending [influence|E].#!"
 # Kampaku Acclamation Succession Law (Gaul, TGP)
 gallic_regency_succession_law: "Gallic Regency Succession"
 gallic_regency_succession_law_subname: "$appointment_succession_law_subname$"
 gallic_regency_succession_law_effects: "Under $gallic_regency_succession_law$, the [title|E] and its associated [holdings|E] will be inherited by the candidate with the highest score. The pool of candidates includes the realm's [noble_families|E], [governors|E], and their family members.\n\nIf the [gallic_high_king|E] is chosen as the next [ceremonial_regent|E], they will be given the choice of either abdicating as [tenno|E] or attempting to re-establish direct rule!"

