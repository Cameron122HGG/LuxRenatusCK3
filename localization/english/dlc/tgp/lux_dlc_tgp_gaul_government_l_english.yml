l_english: 
 # Ceremonial Liege/Regent in personal relation summary
 gaul_personal_relation_ceremonial_liege_same: "[ceremonial_liege|E]"
 gaul_personal_relation_ceremonial_liege_other: "[liege.GetShortUINamePossessive] [ceremonial_liege|E]"
