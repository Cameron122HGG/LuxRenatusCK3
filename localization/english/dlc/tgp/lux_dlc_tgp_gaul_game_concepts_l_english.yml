l_english: 
 # Gallic Manors
 game_concept_gallic_manor: "Gallic Manor"
 game_concept_gallic_manors: "Gallic Manors"
 game_concept_manor: "Manor"
 game_concept_manors: "Manors"
 game_concept_shoen: "Shōen" # 荘園/庄園
 game_concept_family_manor: "Family Manor"
 game_concept_family_manors: "Family Manors"
 game_concept_gallic_manor_desc: "A $game_concept_manor$ - or [Glossary( 'Shōen', 'SHOEN_GLOSS')] - is a type of [domicile|E] held by the [house_head|E] of notable [noble_families|E] within [GetGovernment('gaul_administrative_government').GetName] and [GetGovernment('gaul_feudal_government').GetName] [realms|E]. They represent private landholdings untied to any particular [landed|E] [title|E].\n\n[japanese_manor_building|E] may be constructed here to expand the family's wealth and [influence|E], and the $game_concept_manor$ will be inherited by future generations."
 game_concept_gallic_manor_building: "Gallic Manor Building"
 game_concept_gallic_manor_buildings: "Gallic Manor Buildings"
 game_concept_manor_building: "Manor Building"
 game_concept_manor_buildings: "Manor Buildings"
 game_concept_gallic_manor_building_desc: "$game_concept_gallic_manor_buildings$ are unique and persistent improvements to a [japanese_manor|E].\n\nA large variety of structures are available for construction and may be built by the Manor's owner to generate private income, expand the family's [influence|E], and gain access to a number of [decisions|E], [interactions|E], and more."

 # Government
 game_concept_procuratio: "$gaul_administrative_government$"
 game_concept_procuratio_government: "$gaul_administrative_government$ Government"
 game_concept_procuratio_i: "@government_type_procuratio!"
 game_concept_gaul_administrative: "$gaul_administrative_government$"
 game_concept_procuratio_government_desc: "$gaul_administrative_government_desc$"
 game_concept_regnulum: "$gaul_feudal_government$"
 game_concept_regnulum_government: "$gaul_feudal_government$ Government"
 game_concept_regnulum_i: "@government_type_regnulum!"
 game_concept_gaul_feudal: "$gaul_feudal_government$"
 game_concept_regnulum_government_desc: "$gaul_feudal_government_desc$"
 
 # Gallic Bureaucracy
 game_concept_gallic_bureaucracy: "Gallic Bureaucracy"
 game_concept_gallic_bureaucracy_desc: "$game_concept_gallic_bureaucracy$ represents a [procuratio_government|E] [realm_possessive|E] level of centralization and the general power that the [ruler|E] wields over their [vassals|E].\n\nOnly the [top_liege|E] can change $game_concept_gallic_bureaucracy$. Gallic $game_concept_vassals$ use the same level as their $game_concept_liege$.\n\nThere are four levels of $game_concept_gallic_bureaucracy$:\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_0$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_1$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_2$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_3$\n\nIncreasing $game_concept_gallic_bureaucracy$ costs an amount of [prestige|E] depending on [realm_size|E] and the ruler's [learning_skill|E]."


 # Regent
 game_concept_majordomo: "Kampaku"
 game_concept_majordomo_possessive: "Kampaku's"
 game_concept_majordomo_desc: "[Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] is, de facto, the highest position in the [procuratio|E] bureaucracy, exercising significant control over the organs of state in the [tenno_possessive|E] stead.\n\nThough generally dominated by the [Glossary( 'Fujiwara', 'FUJIWARA_GLOSS' )] family, with enough [influence|E] and [prestige|E], any family might rise to the occasion."
 game_concept_gallic_imperator: "Shōgun"
 game_concept_gallic_imperator_possessive: "Shōgun's"
 game_concept_gallic_imperator_desc: "A $game_concept_gallic_imperator$, or Dictator, is the de facto [regnulum_government|E] ruler of all Japan, who has consolidated their position to the point their succession is hereditary, and reigns in the [tenno_possessive|E] stead."
 game_concept_cloistered_high_king: "Cloistered King"
 game_concept_cloistered_high_king_possessive: "Cloistered King's"
 game_concept_monk: "Jōkō" # 上皇
 game_concept_monk_possessive: "Jōkō's" # 上皇
 game_concept_cloistered_high_king_desc: "A $game_concept_cloistered_high_king$ is a retired [high_king_gaul|E] who govern as de facto [ceremonial_regent|E] for the reigning Emperor.\n\nTo become $game_concept_cloistered_high_king$, an Emperor must abdicate the #V Chrysanthemum Throne#! and become a Monk."
 game_concept_restored_high_king: "Restored High King"
 game_concept_restored_high_king_possessive: "Restored High King's"
 game_concept_restored_high_king_desc: "A $game_concept_restored_emperor$ is a [tenno|E] who governs independently of a [ceremonial_regent|E].\n\nTo become a $game_concept_restored_emperor$, a [tenno|E] may be installed by a $restore_ceremonial_liege_faction_name$ [faction|E], or use the [GetDecisionWithKey('tgp_gaul_emperor_restoration_decision').GetName] [decision|E] after becoming [ceremonial_regent|E]."
 # EMPEROR
 game_concept_high_king: "High King"
 game_concept_high_king_possessive: "High King's"
 game_concept_high_king_gaul: "Gallic High King"
 game_concept_high_king_gaul_possessive: "Gallic High King's"
 game_concept_high_king_gaul_desc: "The $game_concept_high_king_gaul$ is the sacred king of the $e_high_kingdom_gaul$, though true power is generally in the hands of the [ceremonial_regent|E], who administers the state on their behalf."

 # Royal Policies
 game_concept_royal_policy: "Royal Policy"
 game_concept_royal_policies: "Royal Policies"
 game_concept_royal_policy_desc: "The $game_concept_royal_policy$ is a [law|E] set by the [top_liege|E] of Japan that applies to all [vassals|E]. Different policies may restrict or allow actions, or bestow [realm|E]-wide effects."