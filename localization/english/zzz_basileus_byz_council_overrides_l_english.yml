 # ====================================================================
 # Action breakdown bullets (generic, no Greek/Byzantine concept tags)
 # ====================================================================
 minister_grand_chancellor_action_breakdown_tgp: "#indent_newline:4 #weak The minister can, for example:\n$BULLET$Invite any type of [courtier|E] with the [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V] [decision|E]\n$BULLET$Access special #V $influence_meritorious_career_interaction$#! [interaction|E] options, and at a reduced cost\n$BULLET$Coordinate the realm's diplomatic apparatus#!#!"
 minister_censor_action_breakdown_tgp: "#indent_newline:4 #weak The minister can, for example:\n$BULLET$Use #V $censor_find_secrets_interaction$#! [interaction|E] to find [secrets|E] in [vassal|E] [courts|E], which you can use to get a [gold_i][gold|E] reward from your [liege|E] or gain [hooks|E]\n$BULLET$Access special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"
 minister_grand_marshal_action_breakdown_tgp: "#indent_newline:4 #weak The minister can, for example:\n$BULLET$Start the [GetGreatProjectType('construct_great_barracks').GetName|V] [great_project|E]\n$BULLET$Access special #V $influence_meritorious_career_interaction$#! [interaction|E] options\n$BULLET$Lead and coordinate the standing field armies of the realm#!#!"
 minister_of_personnel_action_breakdown_tgp: "#indent_newline:4 #weak The minister can, for example:\n$BULLET$Use #V $force_governor_removal_interaction$#! [interaction|E] to fire [governors|E] regardless of the standard retirement law\n$BULLET$Invite any type of [courtier|E] with the [GetDecision('tgp_minister_recruit_courtiers_decision').GetName|V] [decision|E]\n$BULLET$Compel acceptance of the #V $offer_courtier_interaction$#! and #V $demand_courtier_interaction$#! [interactions|E]\n$BULLET$Access special #V $influence_meritorious_career_interaction$#! [interaction|E] options, and at a reduced cost#!#!"
 minister_of_revenue_action_breakdown_tgp: "#indent_newline:4 #weak The minister can, for example:\n$BULLET$Use the [GetDecision('tgp_suggest_budget_change_decision').GetName|V] [decision|E]\n$BULLET$Start the [GetGreatProjectType('minister_project_conduct_census').GetName|V] [great_project|E]\n$BULLET$Use #V $pay_treasury_debt_interaction$#! [interaction|E] to pay [treasury_debt|E] of [civilian_governors|E]\n$BULLET$Access special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"
 minister_of_rites_action_breakdown_tgp: "#indent_newline:4 #weak The minister can, for example:\n$BULLET$Start the [GetGreatProjectType('minister_project_culture').GetName|V] [great_project|E]\n$BULLET$Aid [vassals|E] in hosting [examinations|E]\n$BULLET$Access special #V $influence_meritorious_career_interaction$#! [interaction|E] options\n$BULLET$#V $demand_conversion_minister_rites_interaction$#! on [characters|E] of [faith_hostile|E] or [faith_evil|E] [faiths|E]#!#!"
 minister_of_war_action_breakdown_tgp: "#indent_newline:4 #weak The minister can, for example:\n$BULLET$Order [military_governors|E] to join the [wars|E] of other [governors|E]\n$BULLET$Start the [GetGreatProjectType('minister_project_train_troops').GetName|V] [great_project|E]\n$BULLET$Use #V $pay_treasury_debt_interaction$#! [interaction|E] to pay [treasury_debt|E] of [military_governors|E]\n$BULLET$Access special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"
 minister_of_justice_action_breakdown_tgp: "#indent_newline:4 #weak The minister can, for example:\n$BULLET$Start the [GetGreatProjectType('minister_project_establish_control').GetName|V] [great_project|E]\n$BULLET$Use #V $imprison_interaction$#! [interaction|E] on [vassals|E] and [courtiers|E], who cannot refuse\n$BULLET$Use #V $pardon_interaction$#! [interaction|E] on [characters|E] who have committed [crimes|E]\n$BULLET$Use $censor_find_secrets_interaction$ [interaction|E] to find [secrets|E] in [vassal|E] [courts|E] and [imprison|E] or pardon known [criminals|E]\n$BULLET$Access special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"
 minister_of_works_action_breakdown_tgp: "#indent_newline:4 #weak The Minister of Works can, for example:\n$BULLET$Start the [GetGreatProjectType('minister_project_development').GetName|V] [great_project|E]\n$BULLET$Start the [GetGreatProjectType('grand_canals').GetName|V] [great_project|E]\n$BULLET$Start the [GetGreatProjectType('great_wall').GetName|V] [great_project|E]\n$BULLET$Can construct [buildings|E] and [holdings|E] inside the [realm|E]\n$BULLET$Can construct [buildings|E] and [holdings|E] inside [tributaries|E] of the realm\n$BULLET$Access special #V $influence_meritorious_career_interaction$#! [interaction|E] options#!#!"

