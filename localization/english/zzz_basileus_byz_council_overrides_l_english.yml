 minister_personnel_greek_desc: "The Minister of Personnel is in charge of all matters related to [appointments|E] and can greatly impact the [candidate_score|E] of other [characters|E].\n\n#F Head of the civil service responsible for appointments, postings and the careful management of the realm's officials.#!"
 councillor_steward_greek_desc: "The Minister of the Treasury is in charge of general taxation and the realm's budget.\n\n#F Oversees the assessment and collection of taxes across the realm, ensuring the stability of the central finances.#!"
 councillor_marshal_greek_desc: "The Minister of Defense is in charge of the field armies and military strategy.\n\n#F The chief military administrator, responsible for the standing regiments and the discipline of the wider army.#!"
 councillor_court_chaplain_greek_desc: "The Minister of Faith is in charge of religious and spiritual affairs.\n\n#F The senior religious officer of the realm, working with the ruler to direct matters of faith and ceremony.#!"
 minister_justice_greek_desc: "The Minister of Justice is in charge of legal affairs and helps the ruler maintain a righteous reign.\n\n#F The chief legal officer of the realm, responsible for the judicial system and the maintenance of order across the territories.#!"
 minister_works_greek_desc: "The Minister of Works is in charge of construction and development throughout the [realm|E], and may start [great_projects|E].\n\n#F Oversees the realm's public infrastructure, its markets, its guilds and its great construction projects.#!"
 minister_grandmarshal_greek_desc: "The Grand Marshal is the highest-ranking commander in the [realm|E] and commands an [army|E] of [title_men_at_arms|E].\n\n#F The supreme commander of the standing field armies, responsible for major campaigns and the readiness of the realm's elite regiments.#!"

 councillor_chancellor_greek_desc: "The Minister of Diplomacy is in charge of the public post, internal communication, and foreign affairs.\n\n#F The principal point of contact for foreign envoys and oversees the security of the realm's communication networks.#!"
 councillor_spymaster_greek_desc: "The Spymaster is in charge of the ruler's security and intelligence.\n\n#F Often the most discreetly powerful official at court, acting as a trusted guardian and personal agent of the ruler.#!"

