 # ====================================================================
 # Concept descriptions — ministry tooltips (generic, plain English)
 # ====================================================================
 game_concept_dominus_minister_grand_chancellor_byz_desc: "The Grand Chancellor is the highest-ranking minister and is in charge of diplomatic matters and oversight of the civil service.\n\n#F A senior minister who coordinates the realm's bureaucracy and acts as the ruler's most trusted civilian advisor.#!"
 game_concept_dominus_minister_censor_byz_desc: "The Censor is the minister in charge of intelligence, internal security, and matters of intrigue.\n\n#F Beware of having a disloyal Censor, for they can easily conceal and participate in [schemes|E] against you and your [close_family|E]!#!"
 game_concept_dominus_minister_grand_marshal_byz_desc: "The Grand Marshal is the highest-ranking commander in the [realm|E] and commands an [army|E] of [title_men_at_arms|E].\n\n#F The supreme military officer of the realm, responsible for the regular field armies and the planning of major campaigns.#!"
 game_concept_dominus_minister_of_personnel_byz_desc: "The Minister of Personnel is the minister in charge of all matters related to [appointments|E] and can greatly impact the [candidate_score|E] of other [characters|E].\n\n#F Head of the civil service responsible for appointments, postings and the careful management of the realm's officials.#!"
 game_concept_dominus_minister_of_revenue_byz_desc: "The Minister of Revenue is the minister in charge of [taxation|E] and aids the ruler with the [treasury|E].\n\n#F Comptroller of the realm, with the authority to audit all departments and oversee the central treasury.#!"
 game_concept_dominus_minister_of_rites_byz_desc: "The Minister of Faith is the minister in charge of religious and spiritual affairs, and can assist [governors|E] in hosting [examinations|E].\n\n#F The senior religious officer of the realm, who works with the ruler to direct matters of faith and ceremony.#!"
 game_concept_dominus_minister_of_war_byz_desc: "The Minister of Defense is your chief [commander|E] and the [councillor|E] in charge of military matters in general.\n\n#F The chief military administrator, responsible for the training, supply and discipline of the realm's armies.#!"
 game_concept_dominus_minister_of_justice_byz_desc: "The Minister of Justice is the minister in charge of legal affairs and helps the ruler maintain a righteous reign.\n\n#F The chief legal officer of the realm, responsible for drafting laws and overseeing the administration of the judicial system.#!"
 game_concept_dominus_minister_of_works_byz_desc: "The Minister of Works is the minister in charge of construction and development throughout the [realm|E], and may start [great_projects|E].\n\n#F Holds supreme judicial and administrative authority over the capital city, its markets, its guilds, and its public infrastructure.#!"

 # ====================================================================
 # Concept descriptions — standard council flavors (generic)
 # ====================================================================
 game_concept_dominus_councillor_spymaster_byz_desc: "The Spymaster is the head of the ruler's intelligence service, the master of secrets, and the silent hand behind the throne.\n\n#F Often a trusted personal agent of the ruler, with eyes and ears in every corner of the realm.#!"
 game_concept_dominus_councillor_steward_byz_desc: "The Minister of the Treasury is the minister in charge of general taxation and the realm's budget.\n\n#F Oversees the assessment and collection of taxes across the realm, ensuring the stability of the central finances.#!"
 game_concept_dominus_councillor_marshal_byz_desc: "The Minister of Defense is a supreme military commander and chief administrative officer of the armies.\n\n#F Represents the ruler's authority over the standing field armies and is responsible for their readiness and discipline.#!"
 game_concept_dominus_councillor_chancellor_byz_desc: "The Minister of Diplomacy is the minister in charge of the public post, internal communication, and foreign affairs.\n\n#F The principal point of contact for foreign envoys and oversees the security of the realm's communication networks.#!"
 game_concept_dominus_councillor_court_chaplain_byz_desc: "The Minister of Faith is the senior spiritual figure of the realm and the ruler's partner in governing matters of religion.\n\n#F Works with the ruler to guide the faithful and to maintain the harmony of throne and altar.#!"

 # ====================================================================
 # Hard overrides of the upstream TGP concept keys — generic static
 # ====================================================================
 game_concept_minister_grand_chancellor_desc: "The Grand Chancellor is the highest-ranking minister of the realm and oversees diplomatic matters and the wider civil service.\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_censor_desc: "The Censor is the minister in charge of intelligence, internal security, and matters of intrigue.\n\n$minister_censor_action_breakdown$"
 game_concept_minister_grand_marshal_desc: "The Grand Marshal is the highest-ranking commander in the realm and commands the standing army of title men-at-arms.\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_minister_of_personnel_desc: "The Minister of Personnel handles appointments, postings and dismissals across the civil service, and shapes who advances at court.\n\n$minister_of_personnel_action_breakdown$"
 game_concept_minister_of_revenue_desc: "The Minister of Revenue oversees taxation and aids the ruler with the treasury and the realm's overall budget.\n\n$minister_of_revenue_action_breakdown$"
 game_concept_minister_of_rites_desc: "The Minister of Faith oversees religious and spiritual affairs and may assist governors in hosting examinations and ceremonies.\n\n$minister_of_rites_action_breakdown$"
 game_concept_minister_of_war_desc: "The Minister of Defense oversees the administration and discipline of the realm's armies.\n\n$minister_of_war_action_breakdown$"
 game_concept_minister_of_justice_desc: "The Minister of Justice oversees legal affairs and helps the ruler maintain a righteous reign.\n\n$minister_of_justice_action_breakdown$"
 game_concept_minister_of_works_desc: "The Minister of Works oversees construction and development throughout the realm, and may start great projects.\n\n$minister_of_works_action_breakdown$"

