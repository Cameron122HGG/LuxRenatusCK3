l_english:
  # Num to string courtesy of the CK3 Wiki. Thank you Agami!
  number_to_string: "[SCOPE.GetValue('number')|0]"
  # The logic here is that a date for a non-character is global_var:<bloodline_trait>_date = YYYYMMDD, with last two digits being the day, next two last digits being month (which will be encoded into proper text form as below), and everything behind it is year
  ## The complicated formula below does that, and also Absolutes the values so that negative years don't break it.
  ### For example, (one of) Jadwiga's (proposed) birthdate(s), 18 February 1374, would be rendered as 13740218.
  month_0: "Nullary"
  month_1: "January"
  month_2: "February"
  month_3: "March"
  month_4: "April"
  month_5: "May"
  month_6: "June"
  month_7: "July"
  month_8: "August"
  month_9: "September"
  month_10: "October"
  month_11: "November"
  month_12: "December"

  bloodline_establish_date_nochar: "Established on [Abs_int32(Subtract_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),Multiply_int32(Divide_int32(Subtract_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),Modulo_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),'(int32)100')),'(int32)100'),'(int32)100')))] [Localize(Concatenate('month_',GetString_int32(Abs_int32(Subtract_int32(Divide_int32(Subtract_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),Modulo_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),'(int32)100')),'(int32)100'),Multiply_int32(Divide_int32(Subtract_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),Modulo_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),'(int32)10000')),'(int32)10000'),'(int32)100'))))))], [Abs_int32(Divide_int32(Subtract_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),Modulo_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),'(int32)10000')),'(int32)10000'))][AddLocalizationIf(LessThan_int32(Divide_int32(Subtract_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),Modulo_int32(FixedPointToInt(GetGlobalVariable(Concatenate(Trait.GetKey,'_date')).GetValue),'(int32)10000')),'(int32)10000'),'(int32)0'),' B.C.')]"
  bloodline_establish_date_char: "Established on [Character.GetBirthDate.GetString]"

  # end.

  Caratacus_Catuvellauni: "Caradog Catuvellauni"