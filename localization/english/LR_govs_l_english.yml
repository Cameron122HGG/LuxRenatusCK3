 ##Classical
 in_kind_tax_collector: "In Kind"
 in_kind_tax_collector_desc: "Base [obligations|E] apply, based on the [vassal_contract|E], multiplied by [aptitude|E] of the assigned [tax_collector|E]"
 in_kind_tax_collector_flavor_desc: "A standard tax in kind. Subjects taxes are largely paid in agricultural produce, being the most lenient form of taxation."
 
 in_cash_taxation_tax_collector: "In Cash"
 in_cash_taxation_tax_collector_desc: "The [vassal|E] pays directly in monetary form, increasing [gold|E] taxation"
 in_cash_taxation_tax_collector_flavor_desc: "Subjects will cover, their obligations by focusing on payment in gold or silver."
 
 in_labour_taxation_tax_collector: "In Labour"
 in_labour_taxation_tax_collector_desc: "[vassal|E] cover their obligations in labour, increasing both [levies|E] and [gold|E] send to their lord"
 in_labour_taxation_tax_collector_flavor_desc: "Subjects will be contribute in the form of increased labour on their lords land, or in public works."

 in_service_taxation_tax_collector: "In Service"
 in_service_taxation_tax_collector_desc: "[vassal|E] sends their men to serve their lord, increasing [levies|E] as the focus"
 in_service_taxation_tax_collector_flavor_desc: "Subjects will be sent to the front, and serve in the army."
 
