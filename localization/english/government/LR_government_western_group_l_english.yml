 # Absolutist
 western_administrative_government: "Carolingian Administrative"
 western_administrative_government_with_icon: "@government_type_administrative! $western_administrative_government$"
 western_administrative_government_adjective: "Carolingian Administrative"
 western_administrative_government_realm: "Carolingian Realm"
 western_administrative_government_desc: "\n$game_concept_administrative_desc$\n\n#F Absolutist is a highly centralized government, where power mainly resides within the capital. Birthright, while still important, is not as prominent as in a feudal realm. With enough skill and ambition anyone, even from the most humble of origin, may rise up to become an influential governor or make a play for the throne and become emperor.#!"
 western_administrative_government_vassals_label: "[administrative|E] [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 western_administrative_obligations: "Carolingian Obligations"
 western_administrative_themes: "Available Administration Types"
 western_admin_theme_balanced: "@balanced_administration! Balanced Administration"
 western_admin_theme_balanced_short: "@balanced_administration! Balanced"
 western_admin_theme_balanced_text_icon: "@balanced_administration!"
 western_admin_theme_balanced_desc: "#flavor A well balanced administration seeks moderation to ensure equal attention in all areas of governance.#!"
 western_admin_theme_military: "@military_administration! Military Administration"
 western_admin_theme_military_short: "@military_administration! Military"
 western_admin_theme_military_text_icon: "@military_administration!"
 western_admin_theme_military_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [martial|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!"
 western_admin_theme_military_desc: "#flavor A military administration puts all energy on recruiting and training formidable troops for the imperial army.#!"
 western_admin_theme_civilian: "@civilian_administration! Civilian Administration"
 western_admin_theme_civilian_short: "@civilian_administration! Civilian"
 western_admin_theme_civilian_text_icon: "@civilian_administration!"
 western_admin_theme_civilian_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [stewardship|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n[influence|E] gained from constructing [buildings|E] in held [counties|E] is increased"
 western_admin_theme_civilian_desc: "#flavor Exempt from military service, a civilian administration focuses on improving the economy and well-being of the citizens.#!"
 western_admin_theme_frontier: "@frontier_administration! Frontier Administration"
 western_admin_theme_frontier_short: "@frontier_administration! Frontier"
 western_admin_theme_frontier_text_icon: "@frontier_administration!"
 western_admin_theme_frontier_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Unlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [vassal|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [prowess|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n$EFFECT_LIST_BULLET$ Unlocks the #high $EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]\n$EFFECT_LIST_BULLET$ Enables [raiding|E]"
 western_admin_theme_frontier_desc: "#flavor One cannot leave the borders undefended. A frontier administration will ensure the realm's defenses and stand ready to repel any potential invaders.#!"
 western_admin_theme_imperial: "@imperial_administration! Imperial Administration"
 western_admin_theme_imperial_short: "@imperial_administration! Imperial"
 western_admin_theme_imperial_text_icon: "@imperial_administration!"
 western_admin_theme_imperial_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [prestige_level|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_currency_level_increase_value')|+0%/] for each level#!#!\n$EFFECT_LIST_BULLET$ Increases [powerful_family|E] Rating\nCannot have appointment revoked without a [revoke_title_reason|E]"
 western_admin_theme_imperial_desc: "#flavor An imperial administration provides a significant level of autonomy and freedom from many regular responsibilities. It is the most prestigious administration one can have.#!"
 western_admin_theme_naval: "@naval_administration! Naval Administration"
 western_admin_theme_naval_short: "@naval_administration! Naval"
 western_admin_theme_naval_text_icon: "@naval_administration!"
 western_admin_theme_naval_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Unlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [vassal|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] for every controlled #high [GetBuilding('common_tradeport_01').GetTypeName]#!#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_building_increase_value')|+0%/] for each [GetBuilding('common_tradeport_01').GetTypeName]#!#!\n$EFFECT_LIST_BULLET$ Unlocks the #high $NAVAL_EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]"
 western_admin_theme_naval_desc: "#flavor The navy is the backbone of any expansive realm. With a dedicated naval administration, safety and efficiency at sea will be highly increased.#!"
 WESTERN_ADMINISTRATIVE_CONTRACT: "[Character.Custom( 'GetProvinceConceptNoTooltip' )] Administration"
 western_admin_theme_frontier_valid_desc: "The [vassal.Custom( 'GetProvinceConceptNoTooltip' )] must border another [realm|E]"
 western_admin_theme_imperial_valid_desc: "Only one [vassal.Custom( 'GetProvinceConceptNoTooltip' )] can have this administration active"
 western_admin_theme_naval_valid_desc: "The [vassal.Custom( 'GetProvinceConceptNoTooltip' )] must be Coastal"
 western_admin_contract_forbids_revocation_desc: "You cannot revoke [titles|E] or Appointments from a [vassal|E] governing with the [GetSubjectContractType( 'administrative_themes' ).GetObligationName( 'western_admin_theme_imperial' )] unless you have a [revoke_title_reason|E]"
 western_admin_vassal: "Absolutist"
 western_admin_vassal_desc: "$game_concept_administrative_desc$"