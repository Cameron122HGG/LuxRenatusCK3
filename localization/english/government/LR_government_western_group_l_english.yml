 western_feudal_government_desc: "\n$game_concept_western_feudal_desc$\n\n#F Western Feudalism was the dominant government form in WesternEurope between the 9th and the 15th century. The western_feudal system is based on the relationship between the landholder and those who provide services and labor in order to live there. The rulers who hold the land appoint vassals which are given fiefs to govern. In return, the vassals provide their liege with [soldiers|E] and [taxes|E].#!"
