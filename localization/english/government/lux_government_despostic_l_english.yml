l_english:
 # Despotism
 despot_government: "Near Eastern Despotism"
 despot_icon_concept: "@government_type_despot!"
 despot_government_with_icon: "@government_type_despot!$despot_government$"
 despot_government_adjective: "Despotic"
 despot_government_realm: "Despotic Realm"
 despot_government_desc: "\n$game_concept_despot_desc$\n\n#F Near Eastern Despotism is the ancient form of government of the fertile crescent in which a single individual formally wields all the power and authority embodying the state. This practice of power rooted in ancient history grants more power to the ruler, but is not well-accepted by populations and rulers from other civilizations as well as tribes. This government grants easier access to advanced administration and vice-royalties, larger demesne and has no limit on the number of vassals following one of the ancient Persian, Archaic or Mandaean cults. However, this government tends to be rejecte by rulers of other religions, who will resent being part of this state. Oriental despots still practice the looting of neighboring realms to enrich the despot abroad.#!"
 despot_government_vassals_label: "Despotic [obligations|E] are based on [opinion|E]"
 despot_government_obligations: "From [opinion|E]"
 despot_government_tax_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_tax_max_possible'))|1V])"
 despot_government_levies_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_levies_max_possible'))|1V])"
 despot_government_unclamped_contribution_label: "Based on [opinion|E] of me"
 despot_government_min_contribution_label: "[crown_authority|E] minimum"
 despot_vassal: "Thrall"
 despot_vassal_desc: "$game_concept_despot_desc$"
 default_despot_tax_collector: "Tax Collector"
 default_despot_tax_collector_desc: "A tax collector is a low-ranking official who is responsible for collecting taxes from the populace on behalf of the despot. They ensure that the despot's treasury is filled and that the government has the necessary funds to operate. Tax collectors may also be responsible for enforcing tax laws and regulations, and may have the authority to seize property or assets from those who fail to pay their taxes."
 default_despot_tax_collector_flavor_desc: "A tax collector is often seen as a necessary evil, as they are responsible for collecting money from the populace, which can be unpopular. However, they are also an important part of the government, as they help to ensure that the despot has the resources needed to govern effectively."

