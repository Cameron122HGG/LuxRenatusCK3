 roman_imperial_province_standard: "@roman_imperial_standard_administration! Standard Administration"
 roman_imperial_province_standard_short: "Standard"
 roman_imperial_province_standard_text_icon: "@roman_imperial_standard_administration!"
 roman_imperial_province_standard_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\nUses [GetLaw('roman_imperial_appointment_succession_law').GetName]"
 roman_imperial_province_standard_desc: "#low A civil type that attends to the everyday needs of the government and the local inhabitants#!"
 roman_imperial_province_industrial: "@roman_imperial_industrial_administration! Industrial Administration"
 roman_imperial_province_industrial_short: "Industrial"
 roman_imperial_province_industrial_text_icon: "@roman_imperial_industrial_administration!"
 roman_imperial_province_industrial_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\nUses [GetLaw('roman_imperial_appointment_succession_law').GetName]\n\n#alert_trial @alert_icon! Limited to [EmptyScope.ScriptValue('roman_imperial_province_industrial_max_value')|V0]#!"
