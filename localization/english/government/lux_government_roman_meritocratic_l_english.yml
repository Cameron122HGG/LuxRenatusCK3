 roman_imperial_province_metropolitan_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [diplomacy|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n$EFFECT_LIST_BULLET$ Uses [GetLaw('roman_imperial_appointment_succession_law').GetName]\n\n#alert_trial @alert_icon! Limited to [EmptyScope.ScriptValue('roman_imperial_province_metropolitan_max_value')|V0]#!"
 roman_imperial_province_metropolitan_desc: "#low An efficient civil administration applied to larger urban areas. It greatly emphasizes on efficient use of taxes and making cities prosper.#!"
 roman_imperial_province_metropolitan_amount_desc: "$roman_imperial_province_metropolitan_short$ limit reached"
 roman_imperial_province_military: "@roman_imperial_military_administration! Military Administration"
 roman_imperial_province_military_short: "Military"
 roman_imperial_province_military_text_icon: "@roman_imperial_military_administration!"
 roman_imperial_province_military_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Can recruit [GetMaA('zhanmadao_infantry').GetName]\n$EFFECT_LIST_BULLET$ Uses [GetLaw('roman_imperial_military_appointment_succession_law').GetName]\n\n#alert_trial @alert_icon! Limited to [EmptyScope.ScriptValue('roman_imperial_province_military_max_value')|V0] at this tier.#!"
 roman_imperial_province_military_desc: "#low A military administration that enables the mustering of troops. Providing the realm with the means of protecting itself, or expanding its borders when necessary.#!"
 roman_imperial_province_military_amount_desc: "$roman_imperial_province_military_short$ limit reached"
 roman_imperial_province_protectorate: "@roman_imperial_protectorate_administration! Protectorate Administration"
