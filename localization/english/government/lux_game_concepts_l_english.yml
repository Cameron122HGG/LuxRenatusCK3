l_english:
 game_concept_classical: "Classical"
 game_concept_classical_government: "Classical Government"
 game_concept_classical_i: "@government_type_classical!$classical_government$"
 game_concept_classical_desc: "The classical Roman and Hellenistic form of government emphasizes enlightened rule by the ruler. In the classical Graeco-Roman political model, the ruler is less involved in day-to-day decision-making, hampering centralization and limiting personal domain. At the same time, the realm's administration is more developed and maintains the Graeco-Roman legal system, preventing realm split upon successions. Prestigious rulers keep up the tradition of advancing civilization by founding new cities in their realm. On the battlefield, Graeco-Roman pikemen and heavy infantry remain unmatched, heirs the Hellenistic phalanxes and of the Roman legions." 
 game_concept_classical_ep3: "Classical"
 game_concept_classical_government_ep3: "Classical Government"
 game_concept_classical_ep3_i: "@government_type_classical!$classical_government_ep3$"
 game_concept_classical_ep3_desc: "A form of government inspired by the Roman and Hellenistic traditions, emphasizing enlightened monarchy, developed administration, and the Graeco-Roman legal system."
 game_concept_despot: "Despotism"
 game_concept_despot_government: "Despotism Government"
 game_concept_despot_i: "@government_type_despot!$despot_government$!"
 game_concept_despot_desc: "Oriental Despotism is the ancient form of government of the fertile crescent in which a single individual formally wields all the power and authority embodying the state. This practice of power rooted in ancient history grants more power to the ruler, but is not well-accepted by populations and rulers from other civilizations as well as tribes. This government grants easier access to advanced administration and vice-royalties, larger demesne and has no limit on the number of vassals following one of the ancient Persian, Archaic or Mandaean cults. However, this government tends to be rejecte by rulers of other religions, who will resent being part of this state. Oriental despots still practice the looting of neighboring realms to enrich the despot abroad."
 game_concept_western_roman: "Western Roman"
 game_concept_western_romans: "Western Romans"
 game_concept_western_roman_desc: "The Western Roman heritage group is the Latin heir to the ancient Roman civilization that once ruled much of Europe, North Africa, and the Middle East. Time has passed, and the Western Roman Empire has long been split from the East and greatly weakened, but its legacy endures in the languages, laws, and customs of its descendants. Western Romans are known for their strong sense of civic duty, their love of order and discipline, and their appreciation for the arts and architecture. They are also renowned for their military prowess, having inherited the tactics and strategies of their Roman ancestors. In the medieval world, Western Romans often find themselves at odds with other cultures, particularly the Germanic tribes that have settled in former Roman territories."
 game_concept_western_empire: "The Western Empire"
 game_concept_western_empire_desc: "The long history of the Western Roman Empire has left a conception amongst the people in the lands it once ruled that even if the empire has fallen, it can be restored. The idea of the Western Empire as a unifying political entity has persisted through the centuries, inspiring various rulers and factions to attempt to revive its glory. This concept is often associated with a sense of nostalgia for the past and a desire to reclaim the cultural and political heritage of ancient Rome. In the medieval period, the notion of the Western Empire continues to influence political ambitions and alliances, as various powers vie for dominance in the fragmented landscape of post-Roman Europe."
 game_concept_macedonian: "Macedonian"
 game_concept_macedonian_desc: "The Macedonian heritage group traces its origins to the ancient kingdom of Macedon, which rose to prominence under the leadership of Philip II and his son Alexander the Great. Macedonians are known for their martial traditions, their strategic acumen, and their ability to adapt and integrate diverse cultures into their own. The legacy of Alexander's conquests has left a lasting impact on the Macedonian identity, fostering a sense of pride in their historical role as conquerors and cultural disseminators. In the medieval period, Macedonians often find themselves navigating the complex political landscape of the Balkans, balancing their Hellenistic heritage with the influences of neighboring Slavic and Byzantine cultures."
 game_concept_macedonians: "Macedonians"
 game_concept_egyptian: "Egyptian"
 game_concept_egyptian_desc: "The Egyptian heritage group is the descendant of the ancient civilization that flourished along the Nile River for millennia. Egyptians are known for their deep connection to their land, their rich cultural traditions, and their contributions to art, architecture, and learning. The legacy of the pharaohs and the enduring influence of ancient Egyptian religion and customs continue to shape the identity of the Egyptian people. In the medieval world, Egyptians often find themselves at the crossroads of trade and cultural exchange, interacting with a diverse array of peoples from the Mediterranean, Africa, and the Middle East."
 game_concept_egyptians: "Egyptians"
 game_concept_mainstream: "Mainstream"
 game_concept_mainstream_desc: "The Mainstream religious group represents the dominant faith tradition within a given region or culture. Adherents of the Mainstream religion often hold significant social, political, and cultural influence, shaping the norms and values of their communities. This religious group is characterized by its widespread acceptance and institutional presence, often serving as the foundation for societal cohesion and identity. In the medieval period, Mainstream religions play a crucial role in governance, education, and community life, with rulers frequently aligning themselves with the dominant faith to legitimize their authority."
 game_concept_statist: "Statist"
 game_concept_statist_desc: "The Statist religious group emphasizes the central role of the state in religious affairs, often advocating for a close relationship between religious institutions and governmental authority. Adherents of the Statist faith tradition believe that the state should play a significant role in regulating religious practices, promoting social order, and ensuring the welfare of its citizens. This religious group is characterized by its support for strong centralized governance and its emphasis on the collective good over individual spiritual pursuits. In the medieval period, Statist religions often align closely with ruling powers, influencing policy and societal norms to reflect their values."
 game_concept_graeco_roman: "Graeco-Roman"
 game_concept_graeco_roman_desc: "The Graeco-Roman religious group represents the syncretic blend of Greek and Roman religious traditions that emerged during antiquity. Adherents of the Graeco-Roman faith honor a pantheon of gods and goddesses, each embodying various aspects of life, nature, and human experience. This religious group is characterized by its rich mythology, elaborate rituals, and emphasis on civic participation in religious festivals and ceremonies. In the medieval period, Graeco-Roman religions continue to influence cultural practices and artistic expressions, serving as a bridge between ancient traditions and contemporary beliefs."
 game_concept_graeco_romans: "Graeco-Romans"
 game_concept_greco_roman: "Greco-Roman"
 game_concept_greco_romans: "Greco-Romans"



 


 # Roman Imperial
 game_concept_roman_imperial_government: "Roman Imperial Government"
 game_concept_roman_imperial: "Roman Imperial"
 game_concept_roman_imperials: "Roman Imperials"
 game_concept_roman_imperial_i: "@government_type_roman_imperial!" 
 game_concept_roman_imperial_government_desc: "$game_concept_roman_imperial$ is a [government_bureaucratic_type|E] [government_form|E] in which the [liege|E] appoints characters as [governors|E], of which there are two types, [civilian_governor_short|E] and [military_governor_short|E].\n\nCharacters have access to [influence|E], [noble_families|E], [family_estates|E], and [treasury|E].\n\nIndependent [rulers|E] have [legitimacy|E], while [vassals|E] focus on obtaining [dignitas|E]."


 # Dignitas
 game_concept_dignitas: "Dignitas"
 game_concept_decorous: "Decorous"
 game_concept_dignitas_desc: "A [character_possessive|E] $game_concept_dignitas$ tracks their progress to the next [dignitas_level|E]. All characters with an [elder|E] or [disciples|E] produce a passive $game_concept_dignitas$ gain.\n\n[governors|E] can increase their $game_concept_dignitas$ by constructing [buildings|E] in their assigned [holdings|E], going on an [inspection|E] [activity|E], participating in a [GetActivityType('activity_debate').GetName] and attending [examinations|E].\n\n[GetSubjectContractType( 'roman_imperial_provinces' ).GetObligationNameShort( 'roman_imperial_province_standard' )] governors increase their monthly dignitas gain by paying more [taxes|E] to their [liege|E], while [GetSubjectContractType( 'roman_imperial_provinces' ).GetObligationNameShort( 'roman_imperial_province_military' )] governors increase it by creating [men_at_arms|E].\n\nNon-$game_concept_governors$ can attempt to increase it by attending [examinations|E]."
 game_concept_dignitas_i: "@dignitas_icon!"
 game_concept_dignitas_level: "Dignitas Rank"
 game_concept_dignitas_level_desc: "A [character_possessive|E] $game_concept_dignitas_level$ indicates how appropriate they are as a [governor|E] in Roman [administrative_governments|E].\n\nIt represents their documented achievements and moral conduct according to Confucian ideals through the amount of [dignitas|E] they have gained.\n\nAn official with a high $game_concept_dignitas_level$ has a higher [candidate_score|E] and [governor_salary|E].\n\nThe Ranks are:\n$EFFECT_LIST_BULLET$[GetModifier( 'dignitas_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'dignitas_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'dignitas_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'dignitas_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'dignitas_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'dignitas_level_5' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'dignitas_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'dignitas_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'dignitas_level_8' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'dignitas_level_9' ).GetNameWithTooltip|L]"
 game_concept_dignitas_levels: "Dignitas Ranks"
 game_concept_dignitas_level_impact: "Dignitas Rank Impact"
 game_concept_dignitas_level_impact_desc: "Dignitas Rank Impact increases or decreases the [modifiers|E] gained from your current [dignitas_level|E]."
 
 # Imperial Examinations
 game_concept_roman_imperial_examination: "Civil Service Examination"
 game_concept_roman_imperial_examinations: "Civil Service Examinations"
 game_concept_examination: "Examination"
 game_concept_examinations: "Examinations"
 game_concept_roman_imperial_examination_desc: "The $game_concept_roman_imperial_examinations$ hold a key role in the [administrative|E] functions of [GetGovernment('roman_imperial_government').GetName|E] and [GetGovernment('dignitasocratic_government').GetName|E] [governments|E]. \n\nThrough the examination system, bureaucrats are appointed by [dignitas|E] over lineage, ensuring that the brightest scholars, regardless of heritage, may gain [governorship|E] appointments. \n\nThe examination levels are: \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Children's#!: Parents can have their children take the examination from the age of [EmptyScope.ScriptValue('child_exam_min_age')] through the $send_child_to_examination_interaction$ [interaction|E].#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Provincial#!: Characters who are not [landed|E] may attempt the second level of Examinations through the [GetActivityType('activity_local_examination').GetName] [activity|E].#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Metropolitan#!: Held by the [GetGovernment('roman_imperial_government').GetName|E] [government|E] through the [GetActivityType('activity_roman_imperial_examination').GetName] activity.#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Palace#!: The final [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] entrants at the $activity_roman_imperial_examination$ are invited to a feast at the royal palace, to meet and show their worth to [son_of_heaven|E].#!"
 game_concept_exam_cheat: "Exam Cheat"
 game_concept_exam_cheat_desc: "An $game_concept_exam_cheat$ unlock options that may be used to bypass the upcoming exam. Beware though, getting caught is costly."

 game_concept_childrens_examination_i: "@child_exam_icon"
 game_concept_childrens_examination: "Children's Examination"
 game_concept_childrens_examination_desc: "The first level [roman_imperial_examinations|E], taken from the age of [EmptyScope.ScriptValue('child_exam_min_age')]. Parents can send their children to the examination through the $send_child_to_examination_interaction$ [interaction|E]."

 game_concept_provincial_examination_i: "@provincial_exam_icon"
 game_concept_provincial_examination: "Provincial Examination"
 game_concept_provincial_examination_desc: "The second level [roman_imperial_examinations|E], taken via the [GetActivityType('activity_local_examination').GetName] [activity|E].\n\n#S When passed:#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithEffects]."

 game_concept_metropolitan_examination_i: "@metropolitan_exam_icon"
 game_concept_metropolitan_examination: "Metropolitan Examination"
 game_concept_metropolitan_examination_desc: "The third level [roman_imperial_examinations|E]. Held by the [GetGovernment('roman_imperial_government').GetName|E] [government|E] through the [GetActivityType('activity_roman_imperial_examination').GetName] [activity|E].\n\n#S When passed:#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithEffects]."

 game_concept_palace_examination_i: "@palace_exam_icon"
 game_concept_palace_examination: "Palace Examination"
 game_concept_palace_examination_desc: "The fourth and final [roman_imperial_examinations|E]. The final [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] entrants at the [GetActivityType('activity_roman_imperial_examination').GetName] are invited to a feast at the royal palace, to kowtow and show their worth to [son_of_heaven|E]\n\n#S When passed:#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithEffects]."

 game_concept_exam_advantage: "Exam Advantage"
 game_concept_exam_advantage_desc: "$game_concept_exam_advantage$ improves the chances of various actions during an [roman_imperial_examination|E], such as when answering questions and demonstrating skills."
 
 game_concept_exam_score: "Exam Score"
 game_concept_exam_score_desc: "The $game_concept_exam_score$ determines how likely an entrant is to pass a [roman_imperial_examination|E]\n\nThe initial score is based on the entrant's [GetTrait('confucian_education').GetName( GetNullCharacter )] [trait|E], as well as their [learning|E], [stewardship|E] and [martial|E] [skills|E] depending on the focus of the $game_concept_examination$.\n\nOnly the top ten entrants in the [GetActivityType('activity_roman_imperial_examination').GetName] [activity|E] may attempt the @palace_exam_icon! #V Palace Examination#!."

 game_concept_dignitas_pool: "Candidate List"
 game_concept_dignitas_pools: "Candidate Lists"
 game_concept_dignitas_pool_possessive: "Candidate List's"
 game_concept_dignitas_pool_desc: "A $game_concept_dignitas_pool$ contains all potential [characters|E] who are eligible to gain [titles|E] with certain types of [appointment|E].\n\nCandidates are sorted based on their [candidate_score|E]. Some [appointment_succession_laws|E] use [dignitas|E], which will sort the candidates by their [dignitas_level|E] first and $game_concept_candidate_score$ second.\n\nWhen the [holder|E] of a Title with $game_concept_appointment$ dies, the Title will pass to the highest ranking character in the list. If the character holds a Title already, the Title must have higher a higher [appointment_prominence|E], otherwise it will pass to the next character."

 game_concept_appointment_prominence: "Prominence"
 game_concept_appointment_prominence_desc: "$game_concept_appointment_prominence$ measures how appealing a [title|E] is for candidates on a [dignitas_pool|E].\n\nA candidate who already holds a [title|E] will only be appointed to a new one of the same [title_tier|E] if it has higher $game_concept_appointment_prominence$.\n\n$game_concept_appointment_prominence$ is based on local wealth and proximity to the [realm_capital|E]."

 game_concept_entrant: "Entrant"
 game_concept_entrants: "Entrants"
 game_concept_entrant_desc: "An $game_concept_entrant$ is a character testing their mettle against the [roman_imperial_examination|E] [activity|E]."

 game_concept_subject_standing: "Subject Standing"
 game_concept_subject_standing_desc: "$game_concept_subject_standing$ represents the status bestowed onto a [tributary|E] or [vassal|E] by their [suzerain|E] or [liege|E]."

 game_concept_imperial_grace: "Imperial Grace"
 game_concept_imperial_grace_desc: "$game_concept_imperial_grace$ represents the status bestowed onto a [tributary|E] by [son_of_heaven|E].\n\nHigh $game_concept_imperial_grace$ may result in special privileges being granted to the $game_concept_tributary$ during [tribute_missions|E]. At low levels of $game_concept_favor$, the $game_concept_son_of_heaven$ may #EMP exact#! tribute from you, and if it reaches zero it could mean the end of the relationship."

 game_concept_seal_of_investiture: "Seal of Investiture"
 game_concept_seal_of_investiture_desc: "Simultaneously a legal document and a revered symbol of the grace of the Son of Heaven, the $game_concept_seal_of_investiture$ signifies the holder's special status as a loyal and favored [tributary|E] of [SelectLocalization( GetPlayer.IsValid, 'game_concept_seal_of_investiture_desc_ingame', 'h_china' )].\n\nA $game_concept_seal_of_investiture$ may be granted to $game_concept_tributaries$ with high [imperial_grace|E] during the closing ceremonies of a successful #bold Tribute Mission#!."
 game_concept_seal_of_investiture_desc_ingame: "[GetTitleByKey('h_china').GetDefinitiveName]"
 HAS_SEAL_OF_INVESTITURE: "You possess a [seal_of_investiture|E]"
 NO_SEAL_OF_INVESTITURE: "You do not possess a [seal_of_investiture|E]"

 SUBJECT_STANDING_CONCEPT: "[subject_standing|E]"
 SUBJECT_STANDING_IMPERIAL_GRACE_CONCEPT: "[imperial_grace|E]"

 IMPERIAL_GRACE_LOSS_STABILITY: "Because the [dynastic_cycle|E] is currently in the $situation_dynastic_cycle_phase_stability$ phase, all #EMP $tributaries_roman_imperial$#! lose [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability')|V] [imperial_grace|E] each year."
 IMPERIAL_GRACE_LOSS_STABILITY_EXPANSION: "Because the [dynastic_cycle|E] is currently in the $situation_dynastic_cycle_phase_stability_expansion$ phase, all #EMP $tributaries_roman_imperial$#! lose [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_expansion')|V] [imperial_grace|E] each year."
 IMPERIAL_GRACE_LOSS_STABILITY_ADVANCEMENT: "Because the [dynastic_cycle|E] is currently in the $situation_dynastic_cycle_phase_stability_advancement$ phase, all #EMP $tributaries_roman_imperial$#! lose [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_advancement')|V] [imperial_grace|E] each year."
 IMPERIAL_GRACE_LOSS_INSTABILITY: "Because the [dynastic_cycle|E] is currently in the $situation_dynastic_cycle_phase_stability_advancement$ phase, all #EMP $tributaries_roman_imperial$#! lose [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability')|V] [imperial_grace|E] each year."
 IMPERIAL_GRACE_LOSS_INSTABILITY_CONQUEST: "Because the [dynastic_cycle|E] is currently in the $situation_dynastic_cycle_phase_instability_conquest$ phase, all #EMP $tributaries_roman_imperial$#! lose [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability_conquest')|V] [imperial_grace|E] each year."
 IMPERIAL_GRACE_LOSS_CHAOS: "Because the [dynastic_cycle|E] is currently in the $situation_dynastic_cycle_phase_chaos$ phase, all #EMP $tributaries_roman_imperial$#! lose [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_chaos')|V] [imperial_grace|E] each year."

 # Mandate
 game_concept_mandate_of_heaven: "Mandate of Heaven"
 game_concept_mandate_of_heaven_mandate: "Mandate"
 game_concept_mandate_of_heaven_desc: "The $game_concept_mandate_of_heaven$ is a special type of [legitimacy|E] only available to [son_of_heaven|E]. It represents the monarch's right to rule, and who is considered the supreme ruler under all of heaven.\n\nThe Mandate is closely connected to the [dynastic_cycle|E]. The Cycle affect how the reigning monarch gains Legitimacy and may also change [situation_dynastic_cycle_phase|E] based on the monarch's level of Mandate."

 game_concept_son_of_heaven: "Son of Heaven"
 game_concept_son_of_heaven_possessive: "Son of Heaven's"
 game_concept_son_of_heaven_desc: "The $game_concept_son_of_heaven$ is the [hegemon|E] of China and the [top_liege|E] of the [roman_imperial_government|E].\n\nThe $game_concept_son_of_heaven$ has a special form of [legitimacy|E], the [mandate_of_heaven|E], and a unique [situation_participant_group|E] simply called $game_concept_son_of_heaven$."

 # Treasury
 game_concept_treasury_i: "@treasury_icon!"
 game_concept_treasury: "Treasury"
 game_concept_treasury_desc: "In certain [administrative_governments|E], Treasury represents assets that may only be used for governmental purposes, in contrast with your personal [gold|E].\n\n$BULLET$#indent_newline:2 As a [vassal|E], you will receive Treasury from your [liege|E], based on your [tax|E] contributions and other obligations#!\n$BULLET$#indent_newline:2 Treasury is created by the [top_liege|e], who converts a percentage of [taxation|E] income into Treasury#!\n$BULLET$#indent_newline:2 You can transfer [gold|E] to the Treasury at will#!\n$BULLET$#indent_newline:2 The Treasury stays with the [title|E] if it gets a new [holder|E]#!"
 game_concept_imperial_treasury_i: "$game_concept_treasury_i$"
 game_concept_imperial_treasury: "Imperial Treasury"
 game_concept_imperial_treasury_desc: "$game_concept_treasury_desc$"

 game_concept_treasury_vassal_development: "Vassal Development"
 game_concept_treasury_vassal_development_desc: "Treasury sent to direct [vassals|E] through their [liege|E], based on their tax contributions and other [obligations|E]."
 game_concept_treasury_magisterium_budget: "Magisterium Budget"
 game_concept_treasury_magisterium_budget_short: "Magisterium"
 game_concept_treasury_magisterium_budget_desc: "Treasury sent to [vassals|E] from the central government, for the purposes of funding [magisteriums|E]. It is based on the periodically calculated allocation of the [treasury|E] income of the [top_liege|E]."
 game_concept_treasury_salary_budget: "Salary Budget"
 game_concept_treasury_salary_budget_short: "Salary"
 game_concept_treasury_salary_budget_desc: "Treasury sent to [vassals|E] from the central government, which they receive as [gold|E] to be used as their personal salary. It is based on the periodically calculated allocation of the [treasury|E] income of the [top_liege|E]."
 game_concept_treasury_military_budget: "Military Budget"
 game_concept_treasury_military_budget_short: "Military"
 game_concept_treasury_military_budget_desc: "Treasury sent to military [province|E] [vassals|E] from the central government, for the purposes of funding additional military activities. It is based on the periodically calculated allocation of the [treasury|E] income of the [top_liege|E]."

 game_concept_governor_salary: "Governor Salary"
 game_concept_governor_salary_desc: "In [administrative_governments|E] that distinguish between [gold|E] and [treasury|E], [governors|E] receive a Salary in $game_concept_gold$."

 game_concept_treasury_budgeting: "Treasury Budgeting"
 game_concept_treasury_budget: "Treasury Budget"
 game_concept_treasury_budgeting_desc: "A system responsible for distributing central funds to specific [vassals|E] and sub-vassals at specific allocation rates.\n\nWhen a budget is enacted, a per-vassal [treasury_budget_base_rate|E] is calculated for each [treasury_budget_category|E] based on the available [treasury_budget_capacity|E].\n\n@alert_icon! The calculated base rate #bold will not be changed#! until a new budget is enacted in the future! So if you get more recipients, your budget costs will rise."

 game_concept_treasury_budget_capacity: "Budget Capacity"
 game_concept_treasury_budget_capacity_desc: "The monthly amount of [treasury|E] available for [treasury_budgeting|E]. Consists of the treasury income minus any regular expenses that are not managed by budgeting, such as [treasury_vassal_development|E] and [court_amenities|E]."

 game_concept_treasury_budget_category: "Budget Category"
 game_concept_treasury_budget_category_desc: "One distinct part of [treasury_budgeting|E] that can receive budget allocation. Each budget category can have different recipients, and might pay out in [gold|E] instead of [treasury|E]."

 game_concept_treasury_budget_base_rate: "Budget Base Rate"
 game_concept_treasury_budget_base_rate_short: "Base Rate"
 game_concept_treasury_budget_base_rate_desc: "The amount a standard recipient of a [treasury_budget_category|E] receives. Recipients may receive more or less than the base rate depending on their [title_rank|E], [dignitas_level|E], or other modifiers."

 game_concept_treasury_budget_category_trend: "Budget Category Trend"
 game_concept_treasury_budget_category_trend_short: "Trend"
 game_concept_treasury_budget_category_trend_desc: "The difference in [treasury|E] that a [treasury_budget_category|E] will receive compared to the previous budget enactment."

 game_concept_treasury_budget_unallocated: "Unallocated Treasury Budget"
 game_concept_treasury_budget_unallocated_short: "Unallocated"
 game_concept_treasury_budget_unallocated_desc: "Any unallocated treasury budget will contribute to general [treasury] income."

 game_concept_treasury_budget_deficit: "Treasury Budget Deficit"
 game_concept_treasury_budget_deficit_short: "Deficit"
 game_concept_treasury_budget_deficit_desc: "When spending more than the [treasury_budget_capacity|E], an amount will be subtracted from the monthly [treasury|E] income."

 # Roman Imperial Bureaucracy
 game_concept_roman_imperial_bureaucracy: "Roman Imperial Bureaucracy"
 game_concept_roman_imperial_bureaucracy_desc: "$game_concept_roman_imperial_bureaucracy$ represents a [roman_imperial|E] [realm_possessive|E] level of centralization and the general power that the [ruler|E] wields over their [vassals|E].\n\nOnly the [top_liege|E] can change $game_concept_roman_imperial_bureaucracy$. Roman Imperial $game_concept_vassals$ use the same level as their $game_concept_liege$.\n\nThere are four levels of $game_concept_roman_imperial_bureaucracy$:\n$EFFECT_LIST_BULLET$$roman_imperial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$roman_imperial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$roman_imperial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$roman_imperial_bureaucracy_3$\n\nIncreasing $game_concept_roman_imperial_bureaucracy$ costs an amount of [prestige|E] depending on [realm_size|E] and the ruler's [learning_skill|E]."
 game_concept_magister: "Magister"
 game_concept_magisters: "Magisters"
 game_concept_magister_possessive: "Magister's"
 game_concept_magisters_possessive: "Magisters'"
 game_concept_magister_desc: "$game_concept_magisters$ are a type of [councillors|E] serving on the [council|E], or [magisterium|E], of [son_of_heaven|E].\n\nEach magister has a number of responsibilities, such as funding [great_projects|E] and helping [governors|E] in different ways."
 game_concept_magisterium: "Magisterium"
 game_concept_magisteriums: "Ministries"
 game_concept_magisterium_possessive: "Magisterium's"
 game_concept_magisteriums_possessive: "Magisteriums'"
 game_concept_magisterium_desc: "The $game_concept_magisterium$ is a type of [council|E] only available to [son_of_heaven|E].\n\nThere are nine [magisters|E], each one representing the highest level of government and is the head of a particular branch of government.\n\nThe $game_concept_magisters$ are:\n$EFFECT_LIST_BULLET$[magister_grand_chancellor|E]\n$EFFECT_LIST_BULLET$[magister_grand_marshal|E]\n$EFFECT_LIST_BULLET$[magister_censor|E]\n$EFFECT_LIST_BULLET$[magister_of_personnel|E]\n$EFFECT_LIST_BULLET$[magister_of_revenue|E]\n$EFFECT_LIST_BULLET$[magister_of_rites|E]\n$EFFECT_LIST_BULLET$[magister_of_war|E]\n$EFFECT_LIST_BULLET$[magister_of_justice|E]\n$EFFECT_LIST_BULLET$[magister_of_works|E]"
 game_concept_magister_grand_chancellor: "$councillor_chancellor_roman_imperial_government_imperial$"
 game_concept_magister_grand_chancellor_desc: "The $game_concept_magister_grand_chancellor$ is the highest ranking [magister|E] and is in charge of diplomatic matters. They are typically assigned the position of [grand_secretariat_director|E].\n\n#indent_newline:4 #weak The magister can, for example:\n$BULLET$Use the [GetDecision('favored_movement_consults_heaven_decision').GetName] [decision|E]#!#!"
 game_concept_magister_grand_chancellor_possessive: "$councillor_chancellor_roman_imperial_government_imperial_possessive$"
 game_concept_magister_censor: "$councillor_spymaster_roman_imperial_government_imperial$"
 game_concept_magister_censor_desc: "The $game_concept_magister_censor$ is the [magister|E] in charge of matters of intrigue and intelligence.\n\nBeware of having a disployal Censor, for they can easily conceal and participate in [schemes|E] against you and your [close_family|E]!\n\n#indent_newline:4 #weak The magister can, for example:\n$BULLET$Search for [secrets|E] in [vassal|E] [courts|E]#!#!"
 game_concept_magister_censor_possessive: "$councillor_spymaster_roman_imperial_government_imperial_possessive$"
 game_concept_magister_grand_marshal: "$magister_grand_marshal$"
 game_concept_magister_grand_marshal_desc: "The $game_concept_magister_grand_marshal$ is the highest ranking commander in the [realm|E] and commands an [army|E] of [title_men_at_arms|E].\n\n#indent_newline:4 #weak The magister can, for example:\n$BULLET$Start the #V Grand Campaign#! [great_project|E]#!#!"
 game_concept_magister_grand_marshal_possessive: "$magister_grand_marshal_possessive$"
 game_concept_magister_of_personnel: "$magister_personnel$"
 game_concept_magister_of_personnel_desc: "The $game_concept_magister_of_personnel$ is the [magister|E] in charge of all matters related to [appointments|E] and can greatly impact the [candidate_score|E] of other [characters|E].\n\n#indent_newline:4 #weak The magister can, for example:\n$BULLET$Fire [governors|E] regardless of the [GetLawGroup('roman_imperial_retirement_law').GetName] [law|E]\n$BULLET$Invite any type of [courtier|E] with the [GetDecision('tgp_magister_recruit_courtiers_decision').GetName] [decision|E]\n$BULLET$May use #V $influence_decorous_career_interaction$#! at a reduced cost#!#!"
 game_concept_magister_of_personnel_possessive: "$magister_personnel_possessive$"
 game_concept_magister_of_revenue: "$councillor_steward_roman_imperial_government_imperial$"
 game_concept_magister_of_revenue_desc: "The $game_concept_magister_of_revenue$ is the [magister|E] in charge of [taxation|E] and aids [son_of_heaven|E] with the [treasury|E].\n\n#indent_newline:4 #weak The magister can, for example:\n$BULLET$Aid [vassals|E] who can #V $roman_imperial_request_treasury_interaction$#!\n$BULLET$Use the [GetDecision('tgp_suggest_budget_change_decision').GetName] [decision|E]#!#!"
 game_concept_magister_of_revenue_possessive: "$councillor_steward_roman_imperial_government_imperial_possessive$"
 game_concept_magister_of_rites: "$councillor_court_chaplain_roman_imperial_government_imperial$"
 game_concept_magister_of_rites_desc: "The $game_concept_magister_of_rites$ is the [magister|E] in charge of religious and spiritual affairs, and can assist [governors|E] in hosting [examinations|E].\n\n#indent_newline:4 #weak The magister can, for example:\n$BULLET$Start the [GetGreatProjectType('magister_project_culture').GetName|V] [great_project|E]\n$BULLET$Start the [GetGreatProjectType('magister_project_establish_control').GetName|V] [great_project|E]\n$BULLET$Aid [vassals|E] in hosting [examinations|E]#!#!"
 game_concept_magister_of_rites_possessive: "$councillor_court_chaplain_roman_imperial_government_imperial_possessive$"
 game_concept_magister_of_war: "$magister_war$"
 game_concept_magister_of_war_desc: "The $game_concept_magister_of_war$ is the [magister|E] in charge of the administration and management of troops. When subject [governors|E] are in need of military aid, it is the $game_concept_magister_of_war$ who can send Military Governors to help.\n\nThe magister is not an active [commander|E] and does not lead troops. That is the purview of the [magister_grand_marshal|E].\n\n#indent_newline:4 #weak The magister can, for example:\n$BULLET$Send aid to [vassals|E] at [war|E] who can #V $roman_imperial_request_military_aid_interaction$#!\n$BULLET$Order [military_governors|E] to join the [wars|E] of other [governors|E]#!#!"
 game_concept_magister_of_war_possessive: "$magister_war_possessive$"
 game_concept_magister_of_justice: "$magister_justice$"
 game_concept_magister_of_justice_desc: "The $game_concept_magister_of_justice$ is the [magister|E] in charge of legal affairs and assisting [son_of_heaven|E] to maintain a righteous rule.\n\n#indent_newline:4 #weak The magister can, for example:\n$BULLET$Imprison [vassals|E] and [courtiers|E], who cannot refuse\n$BULLET$Use #V $pardon_interaction$#! on [characters|E] who have committed [crimes|E]#!#!"
 game_concept_magister_of_justice_possessive: "$magister_justice_possessive$"
 game_concept_magister_of_works: "$magister_works$"
 game_concept_magister_of_works_desc: "The $game_concept_magister_of_works$ is the [magister|E] in charge of construction and development throughout the [realm|E], and may start [great_projects|E].\n\n#indent_newline:4 #weak The magister can, for example:\n$BULLET$Start the [GetGreatProjectType('magister_project_development').GetName|V] [great_project|E]#!#!"
 game_concept_magister_of_works_possessive: "$magister_works_possessive$"
 game_concept_grand_secretariat_director: "Secretary Director"
 game_concept_grand_secretariat: "Grand Secretariat"
 game_concept_grand_secretariat_possessive: "Grand Secretariat's"
 game_concept_grand_secretariat_director_desc: "The Secretary Director is a type of [diarch|E] for [son_of_heaven|E], helping the divine ruler to manage the [realm|E].\n\nWho the Director is depends on the active [GetLawGroup('grand_secretariat_laws').GetName|V] [law|E]. The position can be held by either the [magister_grand_chancellor|E], the [magister_grand_marshal|E], or the [magister_censor|E].\n\nThe Director is able to start most [great_projects|E] available to certain [magisters|E] and Son of Heaven."
 game_concept_magisterium_obligation: "Magisterium Obligation"
 game_concept_magisterium_obligations: "Magisterium Obligations"
 game_concept_magisterium_obligations_desc: "$game_concept_magisterium_obligations$ is a unique set of [vassal_obligations|E] only available for [magisters|E].\n\nAll civil magisters have a specific option set as their default, while the [magister_grand_marshal|E] has a unique option that provides the Marshal with [title_men_at_arms|E].\n\nThese obligations cannot be changed."
