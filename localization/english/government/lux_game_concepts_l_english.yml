l_english:
 game_concept_classical: "Classical"
 game_concept_classical_government: "Classical Government"
 game_concept_classical_i: "@government_type_classical! $classical_government$"
 game_concept_classical_desc: "A form of government inspired by the Roman and Hellenistic traditions, emphasizing enlightened monarchy, developed administration, and the Greco-Roman legal system."
 game_concept_despot: "Despotism"
 game_concept_despot_government: "Despotism Government"
 game_concept_despot_i: "@government_type_despot! $despot_government$!"
 game_concept_despot_desc: "Oriental Despotism is the ancient form of government of the fertile crescent in which a single individual formally wields all the power and authority embodying the state. This practice of power rooted in ancient history grants more power to the ruler, but is not well-accepted by populations and rulers from other civilizations as well as tribes. This government grants easier access to advanced administration and vice-royalties, larger demesne and has no limit on the number of vassals following one of the ancient Persian, Archaic or Mandaean cults. However, this government tends to be rejecte by rulers of other religions, who will resent being part of this state. Oriental despots still practice the looting of neighboring realms to enrich the despot abroad."
 