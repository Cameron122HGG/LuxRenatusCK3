l_english:
#Alexandrian Administration
 alexandrian_administrative_government: "Alexandrian Administrative"
 alexandrian_administrative_icon_concept: "@government_type_alexandrian_administrative!"
 alexandrian_administrative_government_with_icon: "@government_type_alexandrian_administrative! $alexandrian_administrative_government$"
 alexandrian_administrative_government_adjective: "Alexandrian Administrative"
 alexandrian_administrative_government_realm: "Alexandrian Realm"
 alexandrian_administrative_government_desc: "\n$game_concept_alexandrian_administrative_desc$\n\n#F The Alexandrian Administrative Monarchy is a form of government inspired by the Hellenistic Successor Kingdoms left in the wake of Alexander the Great's Empire. It emphasizes strong rule by the monarch, with a well-developed administrative system taking inspirations from both Greek and Near Eastern World. This government type allows for efficient governance, urban development, and strong military organization, reflecting the principles of Enlightened Monarchy. #!"
 alexandrian_administrative_government_vassals_label: "Alexandrian [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 alexandrian_admin_vassal: "Alexandrian Administrative"
 alexandrian_admin_vassal_desc: "$game_concept_alexandrian_administrative_desc$"
 alexandrian_administrative_obligations: "Alexandrian Administrative Obligations"
 alexandrian_administrative_themes: "Available Administration Types"
 alexandrian_administrative_theme_balanced: "@balanced_administration! Balanced Administration"
 alexandrian_administrative_theme_balanced_short: "@balanced_administration! Balanced"
 alexandrian_administrative_theme_balanced_text_icon: "@balanced_administration!"
 alexandrian_administrative_theme_balanced_desc: "#flavor A well balanced administration seeks moderation to ensure equal attention in all areas of governance.#!"
 alexandrian_administrative_theme_military: "@military_administration! Military Administration"
 alexandrian_administrative_theme_military_short: "@military_administration! Military"
 alexandrian_administrative_theme_military_text_icon: "@military_administration!"
 alexandrian_administrative_theme_military_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [martial|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!"
 alexandrian_administrative_theme_military_desc: "#flavor A military administration puts all energy on recruiting and training formidable troops for the imperial army.#!"
 alexandrian_administrative_theme_civilian: "@civilian_administration! Civilian Administration"
 alexandrian_administrative_theme_civilian_short: "@civilian_administration! Civilian"
 alexandrian_administrative_theme_civilian_text_icon: "@civilian_administration!"
 alexandrian_administrative_theme_civilian_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [stewardship|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n[influence|E] gained from constructing [buildings|E] in held [counties|E] is increased"
 alexandrian_administrative_theme_civilian_desc: "#flavor Exempt from military service, a civilian administration focuses on improving the economy and well-being of the citizens.#!"
 alexandrian_administrative_theme_frontier: "@frontier_administration! Frontier Administration"
 alexandrian_administrative_theme_frontier_short: "@frontier_administration! Frontier"
 alexandrian_administrative_theme_frontier_text_icon: "@frontier_administration!"
 alexandrian_administrative_theme_frontier_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\nUnlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [subject|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [prowess|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\nUnlocks the #high $EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]\nEnables [raiding|E]"
 alexandrian_administrative_theme_frontier_desc: "#flavor One cannot leave the borders undefended. A frontier administration will ensure the realm's defenses and stand ready to repel any potential invaders.#!"
 alexandrian_administrative_theme_imperial: "@imperial_administration! Imperial Administration"
 alexandrian_administrative_theme_imperial_short: "@imperial_administration! Imperial"
 alexandrian_administrative_theme_imperial_text_icon: "@imperial_administration!"
 alexandrian_administrative_theme_imperial_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [prestige_level|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_currency_level_increase_value')|+0%/] for each level#!#!\nIncreases [powerful_family|E] Rating\nCannot have appointment revoked without a [revoke_title_reason|E]"
 alexandrian_administrative_theme_imperial_desc: "#flavor An imperial administration provides a significant level of autonomy and freedom from many regular responsibilities. It is the most prestigious administration one can have.#!"
 alexandrian_administrative_theme_naval: "@naval_administration! Naval Administration"
 alexandrian_administrative_theme_naval_short: "@naval_administration! Naval"
 alexandrian_administrative_theme_naval_text_icon: "@naval_administration!"
 alexandrian_administrative_theme_naval_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\nUnlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [subject|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] for every controlled #high [GetBuilding('common_tradeport_01').GetTypeName]#!#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_building_increase_value')|+0%/] for each [GetBuilding('common_tradeport_01').GetTypeName]#!#!\nUnlocks the #high $NAVAL_EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]"
 alexandrian_administrative_theme_naval_desc: "#flavor The navy is the backbone of any expansive realm. With a dedicated naval administration, safety and efficiency at sea will be highly increased.#!"
