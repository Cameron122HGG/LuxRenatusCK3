 alexandrian_administrative_theme_frontier_valid_desc: "The [subject.Custom( 'GetProvinceConceptNoTooltip' )] must border another [realm|E]"
 alexandrian_administrative_theme_imperial_valid_desc: "Only one [subject.Custom( 'GetProvinceConceptNoTooltip' )] can have this administration active"
 alexandrian_administrative_theme_naval_valid_desc: "The [subject.Custom( 'GetProvinceConceptNoTooltip' )] must be Coastal"
 alexandrian_administrative_forbids_revocation_desc: "You cannot revoke [titles|E] or Appointments from a [subject|E] governing with the [GetSubjectContractType( 'alexandrian_administrative_themes' ).GetObligationName( 'alexandrian_administrative_theme_imperial' )] unless you have a [revoke_title_reason|E]"
 
