l_english:
SPARTA_GLOSS: "Come and take it."
LEONIDAS_GLOSS: "Famous King of Sparta."
ROMA_CITY_GLOSS: "The Eternal City."
KYNANIDONES_GLOSS: "A warband made up of free women, founded by the princess Kleitoníkē Hierakáina of Makedon, the She-Hawk of Thasos, in honour of the mightly Kynane, sister of Alexander the Great. These warriors are consecrated to Ares Enyalios and Artemis Kynago."
ACHAEMENID_GLOSS: "The Achaemenids, the old and reveered House of Cyrus and Darius that established the Persian Empire, now relegated to a mostly priestly role."
ARGEAD_GLOSS: "The Argeads, kings of Makedon, the family of Amyntas, Alketas, Philip and Alexander the Great."
CALGACID_GLOSS: "The matrilineal family which, through motherhood or marriage with its daughters, gave Caledonia its kings, Calgacus chief among them, Impeder of Romans."
PLEURIAS_GLOSS: "Descended from Pleurias, king of the Autariates and one of the leaders of the Illyrian revolt that almost ended Philip II's life. While Alexander dealt with the three Illyrian kings who rebelled against Macedon, his descendants consolidated the tribes and dynasties of Dindaria and created a stable principality."
TEUTA_GLOSS: "The kindred of Teuta, queen of the Ardiaei, widow of Agron and vanquisher of the Romans. From Rhizon and Scodra, the Sea-Queen defied the Emperor and gathered the peoples of the Adriatic beneath one crown; her memory endures among the princely clans of Illyria."
ROURAN_GLOSS: "The Yujiulü, descendants of Mugulü and khagans of the Rouran, whose dominion stretched across the eastern steppe."
TROY_ILLYRIAN_GLOSS: "The descendants of Helenus, son of Priam, who carried the Dardanian blood of Troy into Epirus and Illyria. They rebuilt the fallen high walls of Troy among the Dinaric mountains."
ODA_THELTATE_GLOSS: "The Way of Hidden Things, the Mysteria Illyrica, or the Zagrean Descent, practiced by many Illyrians."