l_english:
LOADING_TIP_0:""You leave the setting to court the rising sun." \n -Tiberius Claudius Nero Caesar"					
LOADING_TIP_1:""A good shepherd shears his sheep he doesn't flay them" \n -Tiberius Claudius Nero Caesar"			
LOADING_TIP_2:""Right action is better than knowledge but in order to do what is right we must know what is right." \n -Charlemagne"			
LOADING_TIP_3:""I do not steal victory." \n -Megas Alexandros before the Battle of Gaugamela in response to Parmenion's suggestion that he attack the Persian camp at night"			
LOADING_TIP_4:""There is nothing impossible to him who will try." \n -Megas Alexandros"					
LOADING_TIP_5:""Are you still to learn that the end and perfection of our victories is to avoid the vices and infirmities of those whom we subdue?" \n -Megas Alexandros"					
LOADING_TIP_6:""For my part I assure you I had rather excel others in the knowledge of what is excellent than in the extent of my power and dominion." \n -Megas Alexandros"		
LOADING_TIP_7:""To the strongest!" \n -Megas Alexandros purported last words regarding who will inherit his empire"				
LOADING_TIP_8:""Don't fear sometime ceasing to live but do fear never beginning to live in accord with nature." \n -Marcus Aurelius"				
LOADING_TIP_9:""A reflective contented mind is the best possession." \n -Zarathustra"	
LOADING_TIP_10:""Satisfaction linked with dishonor or with harm to others is a prison for the seeker." \n -Zarathustra"
LOADING_TIP_11:""Truly, it is easy to do evil." \n -Ashoka the Great"				
LOADING_TIP_12:""All men are my children. What I desire for my own children and I desire their welfare and happiness both in this world and the next that I desire for all men." \n -Ashoka the Great"			
LOADING_TIP_13:""Let my skin and sinews and bones dry up together with all the flesh and blood of my body! I welcome it! But I will not move from this spot until I have attained the supreme and final wisdom." \n -Gautama Buddha"				
LOADING_TIP_14:""That army of yours that the world with its devas can't overcome I will smash with discernment." \n -Gautama Buddha"			
LOADING_TIP_15:""All compounded things are subject to decay. Strive with diligence!" \n -Gautama Buddha last words"				
LOADING_TIP_16:""Would that the Roman people had but one neck!" \n -Emperor Caligula"					
LOADING_TIP_17:""To do no evil is good to intend none better." \n -Claudius Caesar Augustus Germanicus"				
LOADING_TIP_18:""No one is free who does not lord over himself." \n -Claudius Caesar Augustus Germanicus"					
LOADING_TIP_19:""Whom the gods love dies young." \n -Menandros of Athens"					
LOADING_TIP_20:""The man who runs may fight again." \n -Menandros of Athens"					
LOADING_TIP_21:""There is no instance of a nation benefitting from prolonged warfare." \n -Sun Zi"					
LOADING_TIP_22:""As material fortune is associated with the properties of the body so honor belongs to those of the soul." \n -Claudius Ptolemaeus"				
LOADING_TIP_23:""Everything that is hard to attain is easily assailed by the generality of men." \n -Claudius Ptolemaeus"					
LOADING_TIP_24:""Numberless are the world's wonders	but none more wonderful than man." \n -Sophokles"				
LOADING_TIP_25:""Fortune is not on the side of the faint-hearted." \n -Sophokles"					
LOADING_TIP_26:""Oh dear! I think I'm becoming a god!" \n -Vespasian on his deathbed in mockery of Alexandros II"		
LOADING_TIP_27:""It is convenient that there be gods and as it is convenient let us believe that there are." \n -Publius Ovidius Naso"		
LOADING_TIP_28:""Time the devourer of all things." \n -Publius Ovidius Naso"				
LOADING_TIP_29:""Suppose the chariot of the sun were given you; what would you do?" \n -Publius Ovidius Naso"			
LOADING_TIP_30:""Kindness is a mark of faith and whoever has not kindness has not faith." \n -Prophet Muhammad"				
LOADING_TIP_31:""Know that Paradise is under the shades of swords." \n -Prophet Muhammad"					
LOADING_TIP_32:""Avoid cruelty and injustice for on the Day of Judgment the same will turn into several darknesses and guard yourselves against miserliness for this has ruined nations who lived before you." \n -The Prophet Muhammad"	
LOADING_TIP_33:""It is better for a leader to make a mistake in forgiving than to make a mistake in punishing." \n -Prophet Muhammad"					
LOADING_TIP_34:""For those who practice tyranny and deprive others of their rights I will be harsh and stern but for those who follow the law I will be most soft and tender." \n -'Umar ibn Al-Khattab"		
LOADING_TIP_35:""The wisest man is he who can account for his actions." \n -'Umar ibn Al-Khattab"					
LOADING_TIP_36:""The weakest man is the one who is able to correct his moral defects but doesn't take action." \n -Ali bin Abu-Talib"				
LOADING_TIP_37:""A friend cannot be considered a friend unless he is tested on three occasions: in time of need	behind your back and after your death." \n -Ali bin Abu-Talib"			
LOADING_TIP_38:""There are two sides to every question." \n -Protagoras"					
LOADING_TIP_39:""Man is the measure of all things: of things which are that they are and of things which are not that they are not." \n -Protagoras"		
LOADING_TIP_40:""Listen — I say that justice is nothing other than the advantage of the stronger." \n -Plato"					
LOADING_TIP_41:""The people have always some champion whom they set over them and nurse into greatness... This and no other is the root from which a tyrant springs: when he first appears he is a protector." \n -Plato"					
LOADING_TIP_42:""No human thing is of serious importance." \n -Plato"					
LOADING_TIP_43:""And happiness is thought to depend on leisure for we are busy that we may have leisure and make war that we may live in peace." \n -Aristotle"			
LOADING_TIP_44:""Man is by nature a political animal." \n -Aristotle"					
LOADING_TIP_45:""Give me the place to stand and I shall move the earth." \n -Archimedes"				
LOADING_TIP_46:""To ravage to slaughter to usurp under false titles they call empire and where they make a desert they call it peace." \n -Publius Tacitus"
LOADING_TIP_47:""The gods are on the side of the stronger." \n -Publius Tacitus"					
LOADING_TIP_48:""Because they didn't know better they called it 'civilization when it was part of their slavery." \n -Publius Tacitus"			
LOADING_TIP_49:""Once killing starts it is difficult to draw the line." \n -Publius Tacitus"				
LOADING_TIP_50:""Very little is needed to make a happy life." \n -Marcus Aurelius"					
LOADING_TIP_51:""Do not think that what is hard for you to master is humanly impossible but if a thing is humanly possible consider it to be within your reach." \n -Marcus Aurelius"			
LOADING_TIP_52:""All men are made one for another: either then teach them better or bear with them." \n -Marcus Aurelius"				
LOADING_TIP_53:""Waste no more time arguing what a good man should be. Be one." \n -Marcus Aurelius"					
LOADING_TIP_54:""I came I saw I conquered." \n -Gaius Iulius Caesar"	
LOADING_TIP_55:""Alea iacta est." \n -Gaius Iulius Caesar"					
LOADING_TIP_56:""Fortune which has a great deal of power in other matters but especially in war can bring about great changes in a situation through very slight forces." \n -Gaius Iulius Caesar"			
LOADING_TIP_57:""Men willingly believe what they wish." \n -Gaius Iulius Caesar"					
LOADING_TIP_58:""It is not the well-fed long-haired man I fear but the pale and the hungry looking." \n -Gaius Iulius Caesar"			
LOADING_TIP_59:""I am not bothered by the fact that I am not understood. I am bothered when I do not know others." \n -Kong Fu Zi"					
LOADING_TIP_60:""To study and not think is a waste. To think and not study is dangerous." \n -Kong Fu Zi"					
LOADING_TIP_61:""The cautious seldom err." \n -Kong Fu Zi"					
LOADING_TIP_62:""Nothing is infinite." \n -Seneca the Elder"					
LOADING_TIP_63:""All things death claims. It is law, not punishment to die." \n -Seneca the Elder"	
LOADING_TIP_64:""It is the sign of a great spirit to be moderate in prosperity." \n -Seneca the Elder"					
LOADING_TIP_65:""It is wrong not to give a hand to the fallen. This custom is common to the whole human race." \n -Seneca the Elder"					
LOADING_TIP_66:""Our lack of confidence is not the result of difficulty. The difficulty comes from our lack of confidence." \n -Seneca the Younger"				
LOADING_TIP_67:""Fire tries gold misfortune tries brave men." \n -Seneca the Younger"			
LOADING_TIP_68:""It is a rough road that leads to the heights of greatness." \n -Seneca the Younger"					
LOADING_TIP_69:""If one does not know to which port one is sailing no wind is favorable." \n -Seneca the Younger"				
LOADING_TIP_70:""The study of history is the best medicine for a sick mind for in history you have a record of the infinite variety of human experience plainly set out for all to see: and in that record you can find for yourself and your country both examples and warnings." \n -Titus Livius"				
LOADING_TIP_71:""Men are slower to recognize blessings than misfortunes." \n -Titus Livius"					
LOADING_TIP_72:""Fortune blinds men when she does not wish them to withstand the violence of her onslaughts." \n -Titus Livius"					
LOADING_TIP_73:""Vae victis!" \n -Titus Livius"					
LOADING_TIP_74:""There is nothing that is more often clothed in an attractive garb than a false creed." \n -Titus Livius"					
