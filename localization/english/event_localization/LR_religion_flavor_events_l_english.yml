l_english:
  hellenic_flavor.0001.t: "A Shocking Auguria"
  hellenic_flavor.0001.desc: "A local Augur has come to your court to perform a public Auguria. The ceremony is to be held on a plain outside the castle walls, and, while approaching clouds make you worried, the Augur will not postpone it. After observing the entrails of many sacrifices, the Augur is about to proclaim the will of the gods when a bolt of lightning strikes him violently!"
  hellenic_flavor.0001.a: "It seems the gods spoke for themselves..."
  hellenic_flavor.0001.b: "Am I next?"