 bookmark_basileus_cyprus: "King Phillipos of Kypros"
 bookmark_basileus_cyprus_desc: "Philippos is the head of the Argeads, main descendants of Alexander the Great through Alexandros IV. Ruler of the Island Kingdom of Cyprus, Philippos is a boisterous, loud and burly person. A strong man, built for combat, yet he lacks any real talent for war. He is married to the charming (insertdiadochiprincess), who has given him a sole male heir, Craterus. Philippos has no other ambitions than his banquets and military competitions, yet the blood of the Conqueror is restless in the veins of his son, who tires of his father's self-indulging ways."
