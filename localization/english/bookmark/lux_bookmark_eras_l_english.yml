 bm_group_9682_title: "319 B.C"
 bm_group_9682: "Death of the Conqueror"
 bm_group_tooltip_9682: "#T $bm_group_9682_title$ #!\n$bm_not_released$\n\n#help "319 BCE - Megas Alexandros dies, poison is suspected to be the cause of his death. He leaves behind several legitimate children by Roxana and Stateira, and several ilegitimate ones widely acknowledged to be his. His son Alexandros IV is blinded in an accident and following unrest he is taken by his mother and loyal retainers to Cyprus.""

 bm_group_9689_title: "312 B.C"
 bm_group_9689: "Victors and Saviors"
 bm_group_tooltip_9689: "#T $bm_group_9689_title$ #!\n$bm_not_released$\n\n#help "312 BCE - Seleukos I Nikator and Ptolemy I Soter defeat Demetrius I Poliorcetes of Macedon in the Battle of Gaza. Beginning of Seleukid Era and creation of Arche Seleukeia."



 bm_group_11066_title: "1066 A.D"
 bm_group_11066: "The Light Reborn"
 bm_group_tooltip_11066: "#T $bm_group_11066_title$ #!\n\n#help "The Light of Classical Antiquity has not yet been extinguished. Can you banish the Dark Ages?"
 




