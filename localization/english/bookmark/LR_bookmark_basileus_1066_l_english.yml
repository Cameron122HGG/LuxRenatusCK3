l_english: 
 bookmark_basileus_cyprus: "Phillipos of Kypros"
 bookmark_basileus_cyprus_desc: "Philippos is the head of the Argeads, the main line of descendants of Megas Alexandros through Alexandros IV. Ruler of the island kingdom of Cyprus, Philippos is a boisterous, loud, and burly person. A strong man built for combat, yet he lacks any real talent for war. He is married to the charming Alexeia, a Seleukid princess who has given him his sole male heir, Krateros.\n\n#bold Philippos has no greater ambitions than the next banquet or sparring match, yet the blood of the Conqueror is restless in the veins of his son, who tires of his father's self-indulging ways.#!"
 bookmark_basileus_cyprus_subheading: "Blood of the Conqueror"
 
 bookmark_basileus_thessaloniki: "General Dorotheos of Thessaloniki"
 bookmark_basileus_thessaloniki_desc: "A man whom his troops call 'Megas Alexandros reborn', Dorotheos is a famous Rhomaion general who has recently risen against the Eastern Empire, throwing the weakened realm into a great crisis. His line, the Argeadai, are descendants of Alexander the Great's illegitimate son Cassander. A proud, charismatic, and above all passionate man, though some would see him as preposterous and overbearing, Dorotheos is prone to spectacle. He is oft recorded giving grand speeches on the glory of conquest, the bonds of men, and above all, the importance of leaders as active examples to their people, not distant rulers secluded in their own high ideals.\n\n#bold The dream of Dorotheos is the very same dream of his famed ancestor, to conquer all the world at the head of his army, and reach the shores of the Outer Ocean...#!"
 bookmark_basileus_thessaloniki_subheading: "General of the Eastern Armies"
 
 bookmark_basileus_kyrene: "Basileus Apollonios of Kyrene"
 bookmark_basileus_kyrene_desc: "Mighty Apollonios, beloved of Apollo Phoibos and true Pharaoh of Aigyptos, rules from his capital at the last Hellenistic stronghold of Kyrene, a realm which combines the grandeur of the ancient world with the sophistication of the new age. Apollonios follows the ancient royal tradition of marrying only within his own family, and has taken his sister Cleopatra to wife, for only such a union can be blessed by the light of Helios! However, the power once bestowed upon the scions of Ptolemy over the Nile has waned and their lands are occupied by all manner of rivals - imposters claiming Ptolemaic descent, the effete Iskanderoi occupying Alexandria, and the quarrelsome remnants of the Caliphates.\n\n#bold But Aigyptos, under its legitimate rulers, the trueborn Ptolemaic Pharaohs, could even rise beyond the heights of its former supremacy!#!"
 bookmark_basileus_kyrene_subheading: "True Lord of the Nile"
 bookmark_basileus_kyrene_character_title_type: "Pharaoh"
 
 bookmark_basileus_syria: "Basileus Seleukos of Antiochia"
 bookmark_basileus_syria_desc: "Once upon a time, the Seleukidai strode atop the world. From the epicenter of civilization at Babylon they commanded an empire to rival the glory of Megas Alexandros, establishing themselves as the strongest among the Diadokhoi and the truest heirs to the King of Conquerors. It may thus be said that a great and burdensome legacy rests upon the brow of Seleukos - one that he has proven himself utterly unfit to bear. A wastrel and a hedonist to the bone, he has sunken deep into the corruption and decadent lifestyle of Antioch's nobility.\n\n#bold Unworthy of even the name of his most vaunted ancestor, Seleukos' rule may yet doom him to the annals of history and take his dynasty with it...Unless drastic measures are undertaken.#!"
 bookmark_basileus_syria_subheading: "Lord of Syria"