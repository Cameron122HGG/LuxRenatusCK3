 indo_zor: "Pyromantism"
 indo_zor_adj:1 "Pyromantic"
 indo_zor_adherent: "Pyromantic"
 indo_zor_adherent_plural: "Pyromantics"
 indo_zor_desc: "Pyromantism is a Local Greco-Roman faith of Statist soul, characterized by strong Iranian influences, the result of centuries of syncretism between Greeks and Iranians in the Eastern satrapies of Bactria, Sogdiana and Arachosia, unstable lands of volatile leaders and uneasy masters. It is a subtle blend of Hellenic gods and religious patterns with Sogdian Zoroastrian cosmology, old Iranian deities and Far Eastern themes, built around grand public rituals, divination by fire and the worship of great heroic figures considered as Yazatas (minor deities) and Devae (spirits), all falling under the supreme command of Horomasdes (Ahura-Mazda), the force of Light and Order in the World, First Emanation of Zarvanes Bythos, Time Primordial." 

 indo_zor_history: "Long ago, this pantheon of divine beings sealed a pact with the Prophet and King of Men, Megas Alexandros, who became Horomasdes' adoptive Son. When Megas Alexander set fire to Persepolis and defeated the Persian holders of lies, Horomasdes recognized in Him a worthy Hero, the Saoshyant of our Time. Through the great beacon of Persepolis burning, the Light entered Alexander and guided Him to His Fate. His steps led him to the divine Rowkhshan, unborn reincarnation of Athena-Nanaiya, who conquered His heart and brought Him to a higher plane, where He was assigned the most sacred of missions by Horomasdes: to banish Lie and Darkness from this world. To accomplish this mission he reached to both the Eastern and Western ends of the Earth, where he fought Ahriman and made him flee, and enclosed many of his beasts behind the Iron Gates of Caucassus Indicus. This is just one of a series of battles, works and quests that the greatest heroes of myth did while inspired by Horomasdes, while Zurvan Bythos brings the Last Day forth, slow but steady, and sets everyone's Destiny. The Pyromantic cosmogony was largely shaped by Indohellenic Kings, claiming divine descent from Rowkhshan and Alexander and thus divine nature, who recognized the cult's potential as a way to bring."
 indo_zor_high_god_name: "Zeus-Oromasdes"
 indo_zor_high_god_name_2: "$indo_zor_high_god_name$" # Optional translation alt
 indo_zor_high_god_name_possessive: "Zeus-Oromasdes's"

