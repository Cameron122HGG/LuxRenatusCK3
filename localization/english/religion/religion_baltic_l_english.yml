 jumala:0 "Jumala"
 jumala_adj:0 "Jumala"
 jumala_adherent:0 "Jumala"
 jumala_adherent_plural:0 "Jumalat"
 jumala_desc:0 "This is the majority religion in this county. The worship of Jumala is a Local Finnic Shamanic cult of Traditional soul, with strong Greco-Roman influences. In it, all other gods do not exist, and Jumala is the one true god."
