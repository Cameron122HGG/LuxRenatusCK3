 jumala_old_adj:0 "Old Jumala"
 jumala_old_adherent:0 "Old Jumala"
 jumala_old_adherent_plural:0 "Old Jumalat"

 dievas:0 "Dievas"
 dievas_adj:0 "Dievasic"
 dievas_adherent:0 "Dievasian"
 dievas_adherent_plural:0 "Dievasians"
 dievas_desc:0 "The Worship of Dievas is a Local Baltic Barbarian cult of Traditional soul, characterized by strong Christian influences. It belongs to the Baltic Civilization, characterized by an emphasis on rural areas, individual martial prowess and low division of labor. Its doctrine is a Local Variation of a mainstream religious current, favoring social harmony over doctrinal purity. Its Soul is Traditional: the faith follows the ancient traditions of the commoners and Local notables, and it has slowly evolved, if at all, throughout the recent era of troubles and turmoil. It has a Christian ascendant, characterized by a focu on strong rural fortified holdings and special privileges to the clergy."
 dievas_old:0 "Old Dievas"
 dievas_old_adj:0 "Old Dievasic"
 dievas_old_adherent:0 "Old Dievasian"
 dievas_old_adherent_plural:0 "Old Dievasians"

 ilmatar:0 "Ilmattarenpalvoja" 
 ilmatar_adj:0 "Ilmattarenpalvoja"
 ilmatar_adherent:0 "Ilmattarenpalvoja"
 ilmatar_adherent_plural:0 "Ilmattarenpalvojat"
 ilmatar_desc:0 "The worship of Ilmatar is a Local Finnic Shamanic faith of Clerical soul, characterized by strong Norse influences. Ilmattar is the air spirit in the Kalevala (epic of Finland). Ilmattar is portrayed as androgynous, meaning they have both male and female elements. Ilmattar was impregnated by the sea and wind and gave birth to Vainamoinen, the main character in the Kalevala."
 ilmatar_old:0 "Old Ilmattarenpalvoja"
 ilmatar_old_adj:0 "Old Ilmattarenpalvoja"
 ilmatar_old_adherent:0 "Old Ilmattarenpalvoja"
 ilmatar_old_adherent_plural:0 "Old Ilmattarenpalvojat"

 voipel: "Voipeleanpalvoja"
 voipel_adj: "Voipelean"
 voipel_adherent: "Voipelean"
 voipel_adherent_plural: "Voipeleans"
 voipel_desc: "The worship of Voipel' is a Local Finnic Shamanic faith of Messianic soul. Voipel' is the Komi's God the of the Cold North Wind and the Night. He is worshipped in great midnight ceremonies during winter an is expected to devour the World. Great nightly fires are central to worship as their flames reveal Voipel's whirling wind."
