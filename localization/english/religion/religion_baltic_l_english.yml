 saule: "Saulicism"
 saule_adj: "Saulic"
 saule_adherent: "Saulian"
 saule_adherent_plural: "Saulians"
 saule_desc: "This is the majority religion in this county. The cult of Saule is an Heretical Baltic Barbarian faith of Clerical soul, with strong Greco-Roman influences. A sun-worshipping cult of the Baltic religions, it is based off the Roman worship of Sol Invictus. Saule, the sun god, is worshipped in a monotheistic fashion."
 saule_old: "Old Saulicism"
 saule_old_adj: "Old Saulic"
 saule_old_adherent: "Old Saulian"
 saule_old_adherent_plural: "Old Saulians"

 peckols: "Peckolism"
 peckols_adj: "Peckolic"
 peckols_adherent: "Peckolian"
 peckols_adherent_plural: "Peckolians"
 peckols_desc: "The cult of Peckols is a Local Baltic Barbarian faith of Clerical soul. They worship the two deities of the underworld, Peckols and Patollo. The two are actually one god, formed in two separate entities. The god(s) is/are seen as an angry, evil spirit, known for haunting and taunting the living if the dead were not buried with proper rituals or if the living disobeyed the pagan priests."
