 allfather_adherent: "Allfather"
 allfather_adherent_plural: "Allfathers"
 allfather_desc: "The worship of Wodanaz is a Local Germanic Barbarian religion of Traditional soul, characterized by strong Norse influences. PLEASE FILL THIS OUT LATER."
