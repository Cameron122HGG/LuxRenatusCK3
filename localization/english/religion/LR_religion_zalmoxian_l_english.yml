 # Zalmoxism
 zal: "Zalmoxism"
 zal_adj: "Zalmoxian"
 zal_adherent: "Zalmoxist"
 zal_adherent_plural: "Zalmoxists"
 zal_desc: "The cult of Zalmoxis is a Mainstream Graeco-Roman religion of Martial Soul. Zalmoxism is a henotheistic faith focused primarily upon the worship of Zalmoxis, a Thracian slave and disciple of Pythagoras. Following his tutelage and manumission, he opened a school in Samos teaching the science of the skies, and thereafter returned to his native people, the Getae, to teach them about the immortality of the soul. The Getae absorbed his teachings into their understanding of the divine, and upon his passing declared him to have joined the gods. For Zalmoxis was wise and virtuous, and in his own words, death was merely a change of country. The high priest Decaeneus, at the behest of King Burebista, further codified and reformed the Zalmoxian faith, drawing from the Orphic Mysteries and the heroic myths of the Thracian peoples. What emerged was a mystical warrior cult possessed of such terrible ferocity that it took the whole of Roman might to contest their force of arms. His most devoted followers loose arrows into the sky on the eve of battle to honor his ascent to the heavens, and make pilgrimage within caves for three days before emerging, just as Zalmoxis did for three years at Kogaionon to illuminate his people on the nature of death and rebirth. Most famous among their rituals, however, is the offering of living souls to Zalmoxis as messengers, who are sent to him in death on a bed of spears."
 zal_old: "Old Zalmoxianism"
 zal_old_adj: "Old Zalmoxian"
 zal_old_adherent: "Old Zalmoxian"
 zal_old_adherent_plural: "Old Zalmoxians"
 
 # Zalmoxian Christianity
 zal_christ: "Decaeneism"
 zal_christ_adj: "Decaeneist"
 zal_christ_adherent: "Decaeneist"
 zal_christ_adherent_plural: "Decaeneists"
 zal_christ_desc: "Decaeneism is a Heretical Graeco-Roman sect of Martial Soul, with strong Christian influences. Also called Zalmoxian Christianity, the Decaeneist school of thought proclaims that Zalmoxis, following his ascension to godhood, has continued to relay his divine wisdom unto humanity through a line of prophets and godly men who have carried his spirit across the ages. Figures such as the high priest Decaeneus are an inviolable part of this tradition, however it is considered to have culminated in the life of Jesus of Nazareth, whom they believe to have been the second coming of Zalmoxis. His rise from humble origins to the position of a teacher of divine virtue echoed that of Zalmoxis' very own life, but it was his crucifixion, descent into the world of the dead, and his rise from the tomb on the third day in near perfect allegory of their god that made Decaeneists believers in Christos Zalmoxis.\n\nThis belief earned the sect the ire of both their Zalmoxist brethren and the Sol-worshipping Romans, who subjected them to persecution, exile, torture, and death. Though the harrying of their faithful was formally lifted in the 4th Century by Alexandros VII in his efforts to shatter Christianity, the Decaeneists emerged from the darkness combatant, making a name for themselves as ruthless riders and soldiers among the Sarmatians in Britannia and the Celts of Singidunon. Those who take up the sword in the name of Christos Zalmoxis, from the humblest soldier to the most decorated warrior priest, hold no fear in their hearts, for their savior has shown them how to die - and how the righteous shall live eternal."

