 neoplatonic_religion_desc: "The Neoplatonic faith is a Mainstream Mystical religion of Philosophical soul. It is based on the teachings of the philosopher Plato, who posited a single source from which all existence emanates, often referred to as 'The One' or the 'Prime Mover'. Neoplatonism emphasizes the soul's journey towards reunification with this ultimate source through contemplation and virtuous living. The faith incorporates a pantheon of deities representing various aspects of existence, with a strong focus on the duality of good and evil, and the belief in an afterlife where souls are judged based on their earthly deeds."
