 #Neoplatonic-Group Faiths

 neoplato: "Neoplatonism"
 neoplato_adj: "Neoplatonic"
 neoplato_adherent: "Neoplatonist"
 neoplato_adherent_plural: "Neoplatonists"
 neoplato_desc: "The teachings of Neoplatonism are a Gnostic Mainstream religion of Scholarly soul  with a strong Greco-Roman ascendancy. In many ways the mystical Neoplatonism is the culmination of Greco-Roman religious thought. Drawing from traditional religious practice and mystery cults."
 
 plato_pythagorean: "Platonic-Pythagoreanism"
 plato_pythagorean_adj: "Platonic-Pythagorean"
 plato_pythagorean_adherent: "Platonic-Pythagorean"
 plato_pythagorean_adherent_plural: "Platonic-Pythagoreans"
 plato_pythagorean_desc: "This is the majority religion in this county. Neopythagoreanism is a Local Neoplatonist belief of Scholarly soul and strong Gnostic influences. In its origins in the First Century, it was a response to the dominating school of thought in the Hellenistic world, Stoicism, an attempt to introduce more spiritual, mystical elements to Hellenistic philosophy. Apollonius of Triana and Moderatus of Gades, disciples of Nigidus Figulus, met in what would be called the First Secret Communion and symbolically married, giving birth to the long tradition of Pythagorean same-sex marriages between companions in the faith. Then, in 179, Numenius of Apamea fused elements of Platonism with the old Pythagorean political and spiritual structure, and in what is now called the Numerian Affirmation, created the Neopythagorean School that still exists today. They believed that there was one God, the One, the Perfect Monad, of which the number One was herald and avatar, since One signifies fullness, perfection and omnipresence. From thence, the Dual appeared, the two universes, the material and the immaterial, while the Monad emanates more and more numbers and fractions that echo in our world, but that exist fully in the real world, the spiritual world, where the soul belongs and where it longs to return. They also created a hierarchy of virtues and followed an ascetic way of life in which the important was not to do good, but to have the will to do good, since the thought was more important than the flesh, the "muddy vest of decay". Neopythagoreanism influenced Neoplatonism greatly, and it was indeed another step towards Iamblichus, Plotinus and Porphyry, but the disciples of the Numerian School went on, criticizing the Neoplatonics' lack of vision of the numerological nature of the Spiritual World and becoming increasingly secretive, developing several tens of grades of acceptance, privileged orders within the School's orders, secret rites of passage that no one will reveal, mystical mysteries to unravel, and the adoration of numbers. All of this makes joining the Neopythagoreans truly a labyrinthic task worthy of Theseus. They all choose new names when they enter the School: a public one and a secret one. Names can be broken down into numbers, and thus names are powerful, but they're a metaphor for the dual world we live in: the word being the matter and the number it represents being its soul."
 porphyryan: "Porphyrianism"
 porphyryan_adj: "Porphyrian Neoplatonic"
 porphyryan_adherent: "Porphyrian Neoplatonist"
 porphyryan_adherent_plural: "Porphyrian Neoplatonists"
 porphyryan_desc: "Porphyryanism is a Local Greco-Roman belief of Scholarly soul. An anti-Christian branch of Neoplatonism founded by Porphyry of Tyre. Porphyry advocated that 'the Gods have proclaimed Christ most pious, but the Christians are a confused and vicious sect', and as a result there is much disdain for Christianity in this sect of Neoplatonism. Porphyryans also practice vegetarianism on both spiritual and ethical grounds, under the belief that animals are as sentient as human beings, as enforced by mainstream Neoplatonism."