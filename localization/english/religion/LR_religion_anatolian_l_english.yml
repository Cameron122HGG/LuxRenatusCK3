 luwian: "Luwianism"
 luwian_adj: "Luwian"
 luwian_adherent: "Luwian"
 luwian_adherent_plural: "Luwians"
 luwian_desc: "The Luwian faith is a Mainstream Hittite religion of Statist Soul, with a Graeco-Roman ascendant. The religious system is a legacy of the ancient Hittite civilization, who created a complex pantheon reflecting the mosaic of peoples present in Asia Minor, under the strong influences of Mesopotamia and Ancient Egypt. Many gods co-exist with multiple identities as a result of successive layers of syncretism, products of the Anatolian melting-pot. Although each god has a specific area of responsibility, they are collectively responsible to guide mankind on the path of morality and piety. The traditional Luwian faith was more recently reformed when the client-king of Isauria, the long-standing Hittite heartland, conquered Constantinople with support from the Eastern legions and imposed himself as Emperor Leo III in 716 CE. He introduced the cult of the Luwian sun goddess Arinniti as the new inperial state religion: He proclaimed Sol to be the consort of Arinniti, and the Emperor to be her consort in the flesh. The subsequent decades saw a short-lived global supremacy of the imperial Luwian faith. Leo III conquered Rome and sacrificed the Western Emperor to Arinniti, imposing the Luwian faith on the entire Roman Empire through well-organized persecutions of the Christians. The Luwian supremacy culminated when his son and successor, Leo Constantine, conquered Jerusalem and desecrated the Christian holy sites. Since then, in spite of the numerous set backs, the faithful still trust their divine connection to Arinniti under the leadership of Leo III's heirs, semi-divinised as the flesh of Arinniti."
 luwian_old: "Ancient Luwian"
 luwian_old_adherent: "Ancient Luwian"
 luwian_old_adherent_plural: "Ancient Luwians"
 luwian_old_adj: "Ancient Luwian"

