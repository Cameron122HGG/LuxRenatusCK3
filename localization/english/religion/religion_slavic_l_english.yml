 #Perunic
 perun: "Perunova Věra"
 perun_adj: "Perunovic"
 perun_adherent: "Perunovnik"
 perun_adherent_plural: "Perunovniks"
 perun_desc: "The worship of Perun is a Local Slavic religion of Martial Soul. Perun is the creator and god of lightning, as well as ruler of the world. He is usually depicted as a tall man with a golden moustache, a silver head, a copper beard, and armed with a mighty axe. Under Norse influence, many Slavs tend to grant him a loose prominence among all their Gods. The cult doesn't have established temples, Perunovniks arrange themselves in lodges where they convene at sacred oak woods, they sacrifice oxen and listen to the exploits and adventures of warriors from far away, as told by wandering storytellers called Slovotans. They also sing the Slovo Peruna, the Word of Perun, a body of oral epic tales which show the example of Perun as a just, honourable and astute adventurer. Every battle and every song honours and strengthens Perun in his eternal struggle against Veles, the lord beneath the Earth. It is said that whenever a lightning strikes, it was an attempt by Perun to kill Veles. Believers take it upon themselves to take part in this holy struggle against Veles' servitors and other enemies to the Will of Perun." perun_old: "Old Way of Perun"
 perun_old_adj: "Old Perunovic"
 perun_old_adherent: "Old Perunovic"
 perun_old_adherent_plural: "Old Perunovics"

