 slavic_pagan_adherent_plural: "Rodnoverics"
 slavic_pagan_desc: "The Rodnovery ('Native Faith') is a Mainstream Slavic faith of Traditional Soul. It represents the native religious traditions of the Eastern Slavs, in which Rod is seen as the creator god and therefore the king of the gods, although in some groups, Svarog is worshiped as the principal deity. Other deities include Perun, the god of thunder, Veles, the god of the underworld, Jarilo, the goddess of the moon, Dažbog, god of the sun, and so forth. Rituals include festivals throughout the year, namely seasonal festivals."
