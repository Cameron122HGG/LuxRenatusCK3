 #Velesic
 veles: "Sŭn Velesa" #The Dream of Veles
 veles_adj: "Velesovian"
 veles_adherent: "Velesovian"
 veles_adherent_plural: "Velesovians"
 veles_desc: "The Dream of Veles is a Heretical Slavic faith of Traditional Soul. Worship revolves around Veles, he who is lord of all beneath the Earth, he who guards the dead, he who haunts the dreams of Men, and the foremost opponent of the thunder god Perun. In his eternal battle with Perun the Thunderer, Veles takes the form of a great dragon to slither up the roots of the World Tree, writhing and shifting in the wake of the storm and lightning cast down by his foe as he moves to invade the abode of the gods. The followers of Veles recall these battles in extatic rituals in caves or deep underground. In his weavings through and dealings with the mortal realm, Veles variously takes the guise of magical trickster, thief, protector of peasants, and a plague-sending punisher of oathbreakers. When Veles sleeps, he sends mortals dreams, which are echoes of lives lived or yet to live, and Velesovians practice ritual trance and meditation. While the rest of the gods dwell high in the heavens, Veles' domain spans all that which lies beneath the earth. This includes the realm of Vyrai, where he shepherds the souls of the dead and guides the birds that carry the souls of the unborn into the world of the living."
