 svaroh_adherent_plural: "Svarogovniks"
 svaroh_desc: "The Temple of Svarog is a Local Slavic religion of Statist Soul, with significant Graeco-Roman influences. Svarog is the god of the celestial fire and blacksmithing, preserver of the fire which brought men out of the Stone Age. Recently, his cult gained popularity under strong influence of the Roman cult of Sol Invictus as princes make explicit connection between Svarog's civilizational role and their own authority - although no prince has ever tried to usurp solar glory in way the Roman Imperators do."
