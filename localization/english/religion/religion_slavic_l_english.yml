 #Svetovidan
 svetovid: "Svątovitovery"
 svetovid_adj: "Svątovitovan"
 svetovid_adherent: "Svetovitovnik"
 svetovid_adherent_plural: "Svetovitovniks"
 svetovid_desc: "The cult of Svątovit is a Local Slavic faith of Martial Soul. It is a warrior cult following the worship of Svątovit, God of War and Patron of Abundance. Svątovitovniks believe that worship of Svątovit will bring them victory in battle, as with most warrior cults. Svątovit is seen as some as another form of Perun, but is not seen as the same being (by most, anyway). Key elements in this cult include divination, symbolism (usually involving a white horse, an image of Svetovid with a sword or bow in one hand and a drinking horn in the other, and idolatry involving pillars and offerings. There is also a Temple of Svątovit located on the island of Rujan, where a statue of Svątovit with four heads is located, and a horn of abundance is filled with fresh mead everv evening."
