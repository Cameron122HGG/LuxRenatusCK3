 #Dazhbogite
 dazhbog: "Sŭxod Dažĭboga"
 dazhbog_adj: "Dažĭbogite"
 dazhbog_adherent: "Dažĭbogite"
 dazhbog_adherent_plural: "Dažĭbogites"
 dazhbog_desc: "The Descent of Dažbog is a Local Slavic cult with Martial Soul, with a very strong secretive and initiatory tradition. It is a mystery cult centered around Dažbog, the son of Svarog, creator and preserver of the Věčĭnyi Ognĭ, the Eternal Fire. Unlike his father, however, Dažbog represents the destructive, scorching aspect of the sun, and Svarog, seeking to temper him, challenges him to descend into the depths of Žar, the Burning Pit, not unlike the Christian Hell, and face many trials and torments. Initiates in the Descent of Dažbog practice ritual bloodletting, scarification of their flesh, and in extreme cases, self-mutilation. They seek to bind their slain enemies to Žar in eternal torment, especially Christians, from whom they may have borrowed the idea of a fiery place of torment after death. Dažbogites regard it as a most holy task to unleash the Burning One's wrath on their foes, and go to war in little clothing, covered in body painting that realces their scarified skin, an example for their enemies of the suffering that awaits them in death."
