 roman_imperial: "Imperial Cult"
 roman_imperial_adj: "Imperial Cult"
 roman_imperial_adherent: "Imperial Cult Cultist"
 roman_imperial_adherent_plural: "Imperial Cult Cultists"

 roman_imperial_desc: "The Imperial Cult is a Local Greco-Roman religion of Statist soul. The Imperial cult is an offshoot of the traditional Roman religious practices, as they evolved starting from the early Principate of Augustus. The religious practices, in a similar fashion to classical Greco-Roman beliefs, involves offerings, ranging from wine to animal sacrifices, to the gods of the classical pantheon - notably the Capitoline Triad of Jupiter, Juno and Minerva, as well as other gods like Vesta and Mars. In the Imperial Cult the worship includes the emperors as well, and some members of their families with the divinely sanctioned authority of the Roman State, guardian of the traditional values and worship of the gods. The cultus to a living emperor acknowledges his office and rule as divinely approved and constitutional: his Principate should therefore demonstrate pious respect for traditional deities and values. A deceased emperor held worthy of the honor can be voted a state divinity (divus) by the Senate and elevated as such in an act of apotheosis. The granting of apotheosis serves religious, political and moral judgment on Imperial rulers and allows living Emperors to associate themselves with a well-regarded lineage of Imperial divi from which unpopular or unworthy predecessors are excluded. The clergy is strictly organized religion with the Emperor acting as the Pontifex Maximus. The major deities have their own organized priesthoods, all under spiritual guidance from the Pontife  Maximus." 
 
 roman_imperial_religious_head_title: "Pontifex Augustalis"
 roman_imperial_religious_head_title_name: "Collegium Augustalis"

