 roman_jupiter_adj: "Jovian"
 roman_jupiter_adherent: "Jovian"
 roman_jupiter_adherent_plural: "Jovians"
 roman_jupiter_desc: "The Mos Jovis ( 'Jovian Tradition' ) is a Local Graeco-Roman religion of Statist soul and Christian ascendant. In the wake of the new age that the main monotheistic religions brought forth"



