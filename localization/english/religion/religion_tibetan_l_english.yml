 bon_adherent_plural:0 "Gyur Bönpos"
 bon_desc:0 "Gyur Bön or 'transformed Bön' is a spiritual tradition founded by Shenchen Luga that evolved alongside the Buddhist traditions of Tibet, growing out of the esoteric movements that predominated the Era of Fragmentation."

