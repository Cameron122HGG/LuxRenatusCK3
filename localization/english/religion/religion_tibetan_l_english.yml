 old_bon_adherent_plural:0 "Khyarwé Bonpos"
 old_bon_desc:0 "Khyarwé Bön or 'erring Bön' is the indigenous faith of the Tibetan region. Exact beliefs varied from place to place but ritualism, sacrificial offerings, and animistic beliefs were common among believers."

