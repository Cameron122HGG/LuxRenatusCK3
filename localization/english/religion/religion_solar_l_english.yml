 sol_apollo: "Apollo-Helios"
 sol_apollo_adj: "Apollo-Heliosean"
 sol_apollo_adherent: "Apollo-Heliosean"
 sol_apollo_adherent_plural: "Apollo-Helioseans"
 sol_apollo_desc: "The cult of Apollo-Helios is a Local Greco-Roman faith of Statist soul. A Hellenistic version of the worship of Sol Invictus, with Apollo being the monotheistic god in focus. Unlike in Solar-Imperialism, they do not believe any emperor or ruler is Apollo-incarnate."
 sol_sahara: "Dulefukanism"
 sol_sahara_adj: "Dulefukan"
 sol_sahara_adherent: "Red Sun Saharan"
 sol_sahara_adherent_plural: "Red Sun Saharans"
 sol_sahara_desc: "The Dulefukan (Red Sun) cult is a Local Saharan faith of Messianic soul, with strong Greco-Roman influences. This religion belongs to the Fur migrants who settled in the area west of the Nile. Legend has it that while moving in the desert, the early Fur in the area came across pale-skinned men in ornate dress who appeared to be dying of thirst. When provided with aid, they said that they were tasked with escorting the Sun Emperor - whom they called "Sol Invictus" - into the desert as per their servitude to their Lord Made Flesh. They also said that he will return one day to rule forever. Basically, the nomads were fascinated by these strange light-skinned men and believed them to be celestial servants of this Sol Invictus. The men were revered by the tribe and essentially treated comparable to saints. As time and generations went on, light-skinned people became more and more familiar to the Fur and obviously they were no longer thought of as celestial beings, but rather held the place of the first missionaries to the Fur in spreading the will of Sol Invictus, and the initial men that were encountered are still regarded as messengers of Sol Invictus that were meant to be found by the Fur. This religion is not the same as Solar-Imperial because they do not recognize the validity of the current emperor, for they believe that the true Sun Emperor will return one day, and all others are either imposters or placeholders until his return."
 sol_tsahay: "Ts'ahay Mahremitism"
 sol_tsahay_adj: "Ts'ahay Mahremitic"
 sol_tsahay_adherent: "Ts'ahay Mahremite"
 sol_tsahay_adherent_plural: "Ts'ahay Mahremites"
 sol_tsahay_desc: "The cult of Ts'ahay Mahrem (Sun Mahrem) is a Local Archaic Solar faith of Martial soul, with strong Greco-Roman influences. It is an Ethiopian cult based on the Roman worship of Sol Invictus, in which Mahrem or Maher, the Axumite God of War, is given Solar attributes and worshipped in a monotheistic fashion, though in a more militaristic way than it's Roman counterpart, due to Mahrem's origins as a War God. Much like with Solar-Imperialism and Sol Invictus, the ruling dynasty claims direct descent from Tsahay Mahrem."
 sol_tsashay_war_god_name: "Ts'ahay Mahrem"
 sol_tsashay_war_god_name_possessive: "Ts'ahay Mahrem's"

 sol_norse: "Sólar-Ódinnism"
 sol_norse_adj: "Ódinn-Sólar"
 sol_norse_adherent: "Ódinn-Sól Worshipper"
 sol_norse_adherent_plural: "Solar-Ódinnists"
 sol_norse_old: "Ódinn-Sól"
 sol_norse_desc: "The worship of Ódinn-Sól is a Local Norse cult of Statist soul, characterized by strong Greco-Roman influences. Increasing contacts with the Roman Empire by Varangian captains led to a synthesis between the traditional Nordic deity Odinn with the Roman cult of Sol Invictus. This synthesis makes Odinn-Sol a patron of rulers, associated with victorious conquests and wise administration alike. The chief attribute of Odinn-Sol is his single eye, representing the solar disc. It is said that Odinn sacrificed his other eye to gain infinite wisdom, so that he can shine upon the world for only half of a day. Another chief belief is the so-called Ragnarok ("Twilight of the Gods") when the forces of darkness would rise against the Sun, and the next world would be born anew from the ashes of the previous. Solar eclipses are of particular importance for the followers of Odinn-Sol, for they believe that during each eclipse the forces of darkness attempt to strike against the Solar deity, only to be thwarted by Ódinn-Sól's divine power."
 sol_norse_high_god: "Ódinn-Sól"
 sol_norse_old_adj: "Old Ódinn-Sól"
 sol_norse_old_adherent: "Old Ódinn-Sól Worshipper"
 sol_norse_old_adherent_plural: "Old Ódinn-Sól Worshippers"

 sol_slav: "Horsism"
 sol_slav_adj: "Horsic"
 sol_slav_adherent: "Horsic"
 sol_slav_adherent_plural: "Horsics"
 sol_slav_old: "Hors Old Rite"
 sol_slav_old_adj: "Horsic Old Rite"
 sol_slav_old_adherent: "Horsic Old Riter"
 sol_slav_old_adherent_plural: "Horsic Old Riters"
 sol_slav_desc: "The worship of Hors is a Local Slavic religion of Statist soul, with significant Greco-Roman influences. Hors is the Slavic sun god, a personification of the solar disc. According to the mythos, Hors travels across the sky at day and moves underground at night, fighting off the monsters living there. One common Horsic belief is that red sunrises are caused by blood split by Hors during his nocturnal journey. Hors is interpreted as source of all light and life in the world - although the creation itself is usually attributed to Rod. Roman influence has resulted in partial association of Hors with Sol Invictus - each ruler is enthroned during sunrise, with prayers and offerings being made to Hors, protector of the realm. Additionally, the ruler is considered to have a special relationship with Hors, giving blessings on the god's behalf."
 
