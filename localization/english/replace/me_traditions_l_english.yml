 tradition_imperial_polygamy_name:0 "Harem Politics"
 tradition_imperial_polygamy_desc:1 "Rulers of this culture are used to holding many concubines, almost guaranteeing an heir, yet potentialy leading to internal strife."
 
 tradition_slave_soldiers_name:0 "Slave Soldiers"
 tradition_slave_soldiers_desc:1 "This culture utilises slave soldiers to field armies, those supposed to be detached from familial politics, and stay more loyal to their liege."
 
 tradition_imperial_splendour_name:0 "Imperial Splendour"
 tradition_imperial_splendour_desc:1 "This culture has adopted Imperial Traditions of the East, from the Empires of old up to now, the grandeur follows." 
 
