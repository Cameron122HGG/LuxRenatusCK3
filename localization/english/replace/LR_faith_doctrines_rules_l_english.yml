 ##New Tenets
 tenet_greco_roman_syncretism_name:0 "Greco-Roman Syncretism"
 tenet_greco_roman_syncretism_desc:0 "Light of the Classical Civilization is not extinguished! And so, we should bath in their glory, even so slightly..."
 
 tenet_persian_syncretism_name:0 "Zoroastrian Syncretism"
 tenet_persian_syncretism_desc:0 "Wisdom of Zoroaster is not to be ignored. Zoroastrians were among the first monotheists, so it is only natural to take some of those wisdom for ourselves."

 tenet_archaic_syncretism_name:0 "Archaic Syncretism"
 tenet_archaic_syncretism_desc:0 "Beliefs of the first Civilizations are alive and well, even if their form changed with times. It would be unwise to ignore faiths that survived for so long..."

 tenet_subsaharan_syncretism_name:0 "Sub-Saharan Syncretism"
 tenet_subsaharan_syncretism_desc:0 "Although somewhat disconnected from the classical world, beliefs of Africa are not to be ignored, for they carry their own unique flavour of worship."

