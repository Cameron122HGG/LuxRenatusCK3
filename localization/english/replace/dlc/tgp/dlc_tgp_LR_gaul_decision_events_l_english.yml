 # tgp_gaul_establish_house_fief_decision
 tgp_gaul_decision.9001.t.fief: "The [ROOT.Char.GetHouse.GetBaseNameNoTooltip] Fief"
 tgp_gaul_decision.9001.t.cadet: "$create_cadet_branch_decision$"
 tgp_gaul_decision.9001.desc.fief_split_house: "I am a proud [old_house.GetBaseNameNoTooltip], but it is time to forge a new path, and establish my own lands in [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier], whatever my house head, [old_head.GetTitledFirstName], may think."
 tgp_gaul_decision.9001.desc.fief_name: "\n\nAll that remains is to decide the name of my new house..."
 tgp_gaul_decision.9001.desc.cadet: "I am a proud [old_house.GetBaseNameNoTooltip], but it is time to forge a new path, and establish my own house, whatever my house head, [old_head.GetTitledFirstName], may think."
 tgp_gaul_decision.9001.desc.permission: "\n\nWith [regent.GetTitledFirstNamePossessive] blessing given, there is little fear of reproach from the capital!"
 tgp_gaul_decision.9001.desc.crime: "\n\n[regent.GetTitledFirstName] will no doubt be furious when [regent.GetSheHe] hears of this, but that is no matter of great concern!"
 tgp_gaul_decision.9001.desc.feudal: "\n\nHouse [ROOT.Char.GetHouse.GetBaseNameNoTooltip] at last joins the ranks of the new nobility, led by [regent.GetTitledFirstName]."
 tgp_gaul_decision.9001.a.fief: "A new sun rises."
 tgp_gaul_decision.9001.a.cadet: "$tgp_gaul_decision.9001.a.fief$"
 tgp_gaul_decision.9002.t: "$tgp_gaul_decision.9001.t.fief$"
 tgp_gaul_decision.9002.t.landless: "$tgp_gaul_decision.9001.t.fief$"
 tgp_gaul_decision.9002.desc: "We have struggled within the confines of the bureaucracy as best we can, but no more."
 tgp_gaul_decision.9002.desc.landed: "It is time to forge a new path, and establish [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier] as a permanent fief of the [ROOT.Char.GetHouse.GetBaseName]."
 tgp_gaul_decision.9002.desc.landless: "It is time to forge a new path, and abandon the trappings of the bureaucrats."
 tgp_gaul_decision.9002.a: "A new sun rises on House [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 gallic_noble_family_name: "[new_house.GetNameNoTooltip] $c_nf_gaul_suffix$"
 gallic_house_first_name: "[new_head.GetUIFirstNameOnlyNotMeNoTooltipNoFormat]simi"
 gallic_house_random_barony: "[random_barony.GetNameNoTierNoTooltip]"
 gallic_house_domicile_barony: "[domicile_barony.GetNameNoTierNoTooltip]"
 gallic_house_primary_county: "[primary_county.GetNameNoTierNoTooltip]"
 gallic_house_domicile_county: "[domicile_county.GetNameNoTierNoTooltip]"
 gallic_house_name_custom: "[new_head.GetLocalizedText( 'new_gallic_house_name' )]"
 gallic_house_name_flag: "[new_head.MakeScope.Var( 'new_gallic_house_name' ).GetFlagName]"
 gallic_house_name_fallback: "[old_head.GetHouse.GetName]"
 gallic_house_name: "[new_head.GetHouse.GetNameNoTooltip]"
 gallic_dynasty_name: "[new_head.GetDynasty.GetNameNoTooltip]"
 tgp_gaul_decision.9005.t: "$tgp_gaul_establish_house_fief_decision$: Family Splits"
 tgp_gaul_decision.9005.t.landless: "$tgp_gaul_establish_manorial_manor_decision$: Family Splits"
 tgp_gaul_decision.9005.desc: "My [ROOT.Char.Custom2('RelationToMeShort', new_head)], [new_head.GetTitledFirstName], has boldly proclaimed the beginnings of a new noble house, the [new_head.GetHouse.GetBaseName], with [new_head.GetHerselfHimself] at its head.\n\nI cannot pretend to welcome this flagrant dismissal of my authority over Panaca [ROOT.Char.GetHouse.GetBaseName] — let us see how [new_head.GetSheHe] fares without my protection..."
 tgp_gaul_decision.9005.a: "The sun burns brightly, without the [ROOT.Char.GetHouse.GetBaseNameNoTooltip]'s shade."
 # tgp_gaul_become_magister_militum_decision
 tgp_gaul_decision.9101.t: "The [gallic_dictator.GetHouse.GetBaseNameNoTooltip] Dictatorship of Gaul"
 tgp_gaul_decision.9101.desc: "A new age dawns upon [GetTitleByKey('e_high_kingdom_gaul').GetBaseNameNoTierNoTooltip], as power shifts from Frank to Roman. Under [ROOT.Char.GetHouse.GetBaseNameNoTooltip] leadership, order will at last be restored, and the last vestiges of the old administration consigned to history.\n\nBut let none be mistaken — my authority is derived from [ROOT.GetCharacter.GetFaith.HighGodName]..."
 tgp_gaul_decision.9101.a: "A necessary measure to ensure peace..."

 tgp_gaul_decision.9102.t: "$tgp_gaul_decision.9101.t$"
 tgp_gaul_decision.9102.desc: "The Magisterium has risen under the rule of [gallic_dictator.GetName], putting an end to endless administrative councils. In their place, the spear and the warrior now hold true power, bringing security and order directly into the hands of the people.\n\n"
 tgp_gaul_decision.9102.admin: "My authority has been stripped, my lands handed off to the Magisterium. In my place, come warmongers who rule through strength rather than records..."
 tgp_gaul_decision.9102.feudal: "Our lands remain secure, and the authority falls back into our hands. In this new era, strength determines all."
 tgp_gaul_decision.9102.fallback: "Hopefully, in time, this proves to be a fruitful decision."
 tgp_gaul_decision.9102.a.admin: "It is a harsh new order."
 become_magister_militum_palatine_vassals_tooltip: "#N [palatine_count|0V] [governor|E] [vassals|E] will fight against you#!"
 become_magister_militum_manorial_vassals_tooltip: "#P [manorial_count|0V] [feudal|E] [vassals|E] will join you#!"
 become_magister_militum_allied_vassals_tooltip: "#P [allied_count|0V] [allied|E] or same [house|E] [vassals|E] will join you#!"

 # tgp_gaul_imperial_branch_decision
 may_found_noble_family_tt: "You may become head of a new [noble_family|E]"
 will_found_noble_family_tt: "You will become head of a new [noble_family|E]"

 # tgp_gaul_emperor_restoration_decision
 tgp_gaul_decision.9301.t: "The Cage Unlocked"
 tgp_gaul_decision.9301.desc: "As Sacral King, I've reclaimed my rightful place as the true leader of this realm.\n\nMy power is no longer wielded by those who wish to fuel their own ambitions, and all is restored to the Golden Throne."
 tgp_gaul_decision.9301.a: "Christ's blood guides the land."
 tgp_gaul_decision.9302.t: "The [sacral_king_gaul.GetTitleAsNameNoTooltip] Victorious"
 tgp_gaul_decision.9302.desc: "Words spread like wildfire along the great roads of the $game_concept_sacral_king_possessive$ return. [sacral_king_gaul.GetName] has restored [sacral_king_gaul.GetHerHis] sacred presence, in the name of revoking power from idle and ill-willed hands.\n\n[sacral_king_gaul.GetSheHe|U] now intends to rule more directly over the people of this land from the Golden Throne, and [sacral_king_gaul.GetHerHis] reign will no longer be seen as mere ceremony."
 tgp_gaul_decision.9302.a: "Let this be a return to order."

 # tgp_gaul_become_a_poet_decision
 tgp_gaul_decision.9402.t: "Verse and Wisdom"
 tgp_gaul_decision.9402.desc: "Endless days, and sleepless nights have gone by towards my comprehension of poetry and song. Sheets of paper fly through the air left and right, leaving only inscriptions with a trail of ink behind it in my pursuit of knowledge.\n\nThe time has come for me to choose a path forward. Is this something worth pursuing, or should I give up the chase?"
 tgp_gaul_decision.9402.a: "Spare no effort, I #EMP will#! understand."
 tgp_gaul_decision.9402.a.toast.success: "You successfully manage to get a grasp of poetry"
 tgp_gaul_decision.9402.a.toast.failure: "You don't fully understand this whole ordeal"
 tgp_gaul_decision.9402.b: "I've changed my mind."
 
 # tgp_gaul_become_a_monk_decision
 tgp_gaul_decision.9500.t: "A New Walk of Life"
 tgp_gaul_decision.9500.desc: "With a warm embrace, I welcome my newly found enlightenment towards spiritual transcendence — which I am reborn anew.\n\nI will devote my life to [ROOT.Char.GetFaith.GetName], living my last days to practice and preach the discoveries I find along the way.\n\nI will serve my [ROOT.Char.GetLiege.GetTitleAsName], by finding the harmony between our cultural heritage and be guided by the sacred mountains when new wisdom reveals itself."
 tgp_gaul_decision.9500.a: "I welcome the path to the celestial realm."

 # tgp_gaul_establish_gallic_administration_decision
 
 tgp_gaul_decision.9603.t: "Prince of the Franks: Call to Action"
 tgp_gaul_decision.9603.desc: "The grasping ambition of [gallic_regent_feudal.GetTitledFirstName] knows no bounds: [gallic_regent_feudal.GetSheHe] now openly pushes for reform which would cement the power of [gallic_regent_feudal.GetHerHis] manor and its allies.\n\nWhatever agreements or disagreements we may have on the governance of Gaul, the [gallic_regent_feudal.GetHouse.GetBaseNameNoTooltip] moving into such a dominant position should give us all pause."
 tgp_gaul_decision.9603.leader: "\n\n[leader.GetTitledFirstName] has emerged as figurehead of the resistance, and rallies [leader.GetHerHis] armies even now."
 tgp_gaul_decision.9603.a: "The [ROOT.Char.GetHouse.GetBaseNameNoTooltip] will not stand for this."
 tgp_gaul_decision.9603.a.bloc: "The [ROOT.Char.GetConfederation.GetName] will not stand for this."
 tgp_gaul_decision.9603.b: "It is not our fight."
 tgp_gaul_decision.9603.a.tt: "All [THIS.Char.GetConfederation.GetName|V] members will join the [war|E]"
 tgp_gaul_decision.9605.t: "Prince of the Franks: To Arms"
 tgp_gaul_decision.9605.desc: "As I push for reforms and my intentions become clear, the traitors rally. [leader.GetTitledFirstName] of [leader.GetHouse.GetBaseNameNoTooltip] has emerged as figurehead of this treachery, and gathers a host even now.\n\nIt is no matter, we [ROOT.Char.GetHouse.GetBaseNameNoTooltip] will meet them on the battlefield, and we [ROOT.Char.GetHouse.GetBaseNameNoTooltip] will triumph."
 tgp_gaul_decision.9605.peace: "As I push for reforms and my intentions become clear, only silence follows — the expected backlash never materializes. Perhaps I underestimated the realm's faith in the [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\n\nWith no traitors to deal with, Gaul can at last flourish under a new era of benevolent rule under the [gallic_regent_feudal.GetHouse.GetBaseNameNoTooltip]..."
 tgp_gaul_decision.9605.a: "These rebels will be crushed."
 tgp_gaul_decision.9605.b: "The realm has seen wisdom."
 tgp_gaul_decision.9606.t: "Prince of the Franks: [gallic_regent_feudal.GetHouse.GetBaseNameNoTooltip] Dominance"
 tgp_gaul_decision.9606.desc: "At last, the misguided rebel forces have been defeated. With their leader, [leader.GetTitledFirstName], brought before me in bonds, few can doubt that the promised peace is now within our grasp.\n\nWith all detractors silenced, Gaul can at last flourish under a new era of benevolent rule under the [gallic_regent_feudal.GetHouse.GetBaseNameNoTooltip]..."
 tgp_gaul_decision.9606.a: "Inevitable, and necessary."
 tgp_gaul_decision.9607.desc: "Shocking Paris, [gallic_regent_feudal.GetTitledFirstName] has emerged victorious against those who opposed [gallic_regent_feudal.GetHerHis] reforms, now termed rebels, moving the realm into a new era of [gallic_regent_feudal.GetHouse.GetBaseNameNoTooltip] dominance.\n\n"
 tgp_gaul_decision.9607.desc.other: "Let us hope the [ROOT.Char.GetHouse.GetBaseNameNoTooltip] can find a worthy place in this new order."
 tgp_gaul_decision.9607.desc.winner: "Our loyal service to the [gallic_regent_feudal.GetHouse.GetBaseNameNoTooltip] in this just cause will no doubt be rewarded."
 tgp_gaul_decision.9607.desc.loser: "This a dark day for [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip], and the [ROOT.Char.GetHouse.GetBaseNameNoTooltip]..."
 tgp_gaul_decision.9607.a: "There is much to think about."

 # tgp_gaul_restore_high_kingdom_gaul_monarchy_decision
 tgp_gaul_decision.9901.t: "The Sacral King Restored"
 tgp_gaul_decision.9901.desc: "The High King of Gaul stands strong, and the Sacral Throne returns to its rightful heir. This rule is not merely of a noble title or status, but reflects the ancient connection of the royal bloodline to these lands, descended from Christ himself."
 tgp_gaul_decision.9901.a: "It will be an honor to advise [gaul_scion.GetHerHim]."
 tgp_gaul_decision.9901.a.gaul_scion: "At long last."
 tgp_gaul_decision.9902.desc: "The sacred royal bloodline exudes its presence in Paris once more. A true Princeps Christianissimus, [gaul_scion.GetName] stands as its heir, just as in the days of old.\n\nWith this return to tradition, the realm may flourish again under the divine light of the Sacral Throne."
 tgp_gaul_decision.9902.a: "Long live the Sacral King!"
 # tgp_restore_high_kingdom_gaul_government_decision
 tgp_gaul_decision.9911.t: "Royal Administration Restored"
 tgp_gaul_decision.9911.desc: "The time has come for a new rule, not by brutish force, but by the quipu and the record.\n\nOnly an organized government can exact justice, while warriors twist the law to suit themselves. Under my rule the law shall be clear, fair, and firm — as our noble ancestors intended."
 tgp_gaul_decision.9911.rebel: "\n\nOpposing the ways of our predecessors, [rebel.GetName] stands against my decision. With [rebel.GetHerHis] armies raised, my desire for royal administration is challenged."
 tgp_gaul_decision.9911.a: "The old ways are the best ways."
 tgp_gaul_decision.9912.desc: "[gallic_regent_admin.GetName] has returned to the ways of our ancestors, proposing an royal administration over the Romans. [mayor.GetSheHe|U] seeks to restore order within the realm, bringing authority to the throne and court over local clans."
 tgp_gaul_decision.9912.rebel: "\n\nSuch major changes do not come without strife, however. [rebel.GetName] has risen against [mayor.GetFirstNameNoTooltip] in protest, with some following [rebel.GetHerHis] sentiments..."
 tgp_gaul_decision.9912.b: "I will not give up my power!"
 tgp_gaul_decision.9913.desc: "[actor.GetTitledFirstName] is a fool who places [actor.GetHerHis] own aggrandizement before the good of the empire. I will not stand idly by while our liege abuses [actor.GetHerHis] loyal vassals. I urge you to join me in the fight to depose this tyrant."
 tgp_gaul_decision.9913.a: "You will not stand alone!"
 tgp_gaul_decision.9913.b: "You are the traitor!"

#tgp_gaul_assert_regional_dominion_government_decision
 tgp_gaul_decision.9960.t: "Assert Regional Dominion"
 tgp_gaul_decision.9960.intro: "I will unify [title_scope.GetNameNoTier] under my banner. This corner of land will be a bastion for stability and serve as an example to our chaos riddled empire."
 tgp_gaul_decision.9960.agree: "\n\nThe local lords show great wisdom..."
 tgp_gaul_decision.9960.partial_war: "\n\nWhile the wise local lords are in accord, a foolish few flock to the banner of [main_defender.GetName] rather than concede to my dominion."
 tgp_gaul_decision.9960.full_war: "\n\nThe local lords lust after division! Unwise as it may be, they flock to the banner of [main_defender.GetName] rather than concede to my dominion."
 tgp_gaul_decision.9960.a: "...Perhaps they will find wisdom in the next life."
 tgp_gaul_decision.9960.b: "...and all concede to my dominion."
 tgp_bloc_members_join_war_effect_tt: "If you lead a [bloc|E], its members will join your [war|E]"
 tgp_gaul_assert_regional_dominion_mayor_crime_effect: "@warning_icon! #X The [ceremonial_regent|E] is [palatine|E] and will consider this a [crime_i|E][crime|E]#!"

 tgp_gaul_decision.9961.t: "[title_scope.GetNameNoTierNoTooltip] Under One Banner"
 tgp_gaul_decision.9961.desc: "A bright day for [title_scope.GetNameNoTier]! Some were slow to see the wisdom in my rule, but a storm of arrows and fire can be a diligent school master.\n\nSoon this quarrel will be forgotten. The blood of the fallen will grow maize for tomorrow's children. May our display of unity paint the path for the empire at large."
 tgp_gaul_decision.9961.a: "Where next could my banner fly?"

 tgp_gaul_decision.9962.t: "My Banner Lies Broken"
 tgp_gaul_decision.9962.desc: "My cause was just. There should have been no battle but, battle there was. In defeat my wisdom goes unheeded. Chaos reigns. [title_scope.GetName], a mirror for the empire.\n\nWe who desire harmony suffer and the spiritually compromised are made to succeed."
 tgp_gaul_decision.9962.a: "What now?"

 tgp_gaul_decision.9963.opening: "[ROOT.Char.GetName], my banner calls,"
 tgp_gaul_decision.9963.desc: "You've born witness to the strife that plagues our empire. I, [super_manorial.GetName], will unite [title_scope.GetName] and carve out a bastion for peace and stability. Submit to my banner or join the small minded in the folly of their defiance."
 tgp_gaul_decision.9963.a: "I submit"
 tgp_gaul_decision.9963.b: "To war!"
 tgp_gaul_decision.9963.a.tt: "If [super_manorial.GetShortUIName] wins the [super_manorial_war.GetName] [super_manorial.GetSheHe] will hold [title_scope.GetName] and you will become [super_manorial.GetHerHis] [vassal|E]"
 super_manorial_war_no_holder_custom_tooltip: "Start a [domination_war|E] against [main_defender.GetShortUIName] over [title_scope.GetName]\n\t$BULLET$Every [de_jure|E] [county|E] [holder|E] of [title_scope.GetName] will join [main_defender.GetShortUIName] as a defender #weak (@soldier_icon![super_manorial_war_current_enemy_strength|N0])#!"
 super_manorial_potential_peaceful: "@alert_icon!To have every [de_jure|E] [county|E] [holder|E] of [title_scope.GetName], become your [vassal|E] without a fight:\n$EFFECT_LIST_BULLET$Your [prestige_level|E] is [prestige_i][GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$Your [legitimacy_level|E] is greater or equal to #V 3#!\n$EFFECT_LIST_BULLET$Have high [dread_i][dread|E]\n$EFFECT_LIST_BULLET$Overwhelming @soldier_icon!Military Strength#!"
 super_manorial_reward_peaceful: "Every [de_jure|E] [county|E] [holder|E] of [title_scope.GetName] will become your [vassal|E]"
 gallic_expansion_internal_peace_trigger: "Internal Peace in [title_scope.GetNameNoTier]"
 gallic_dynasty_name: "[new_head.GetDynasty.GetNameNoTooltip]"
 is_mayor_tt: "This decision is only available to the Mayor of the Palace."
 gallic_bandit_crackdown_law_effects: "The [ROOT.Char.GetHouse.GetBaseNameNoTooltip] has enacted a crackdown on banditry, increasing the safety of the roads and reducing the influence of bandits in the region.\n\n$EFFECT_LIST_BULLET$Increased safety on roads in [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier].\n$EFFECT_LIST_BULLET$Reduced bandit influence in [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier]."
 gallic_regent_admin_age_desc: "The [gallic_regent_admin.GetName] has taken a step back from the political scene, allowing the royal administration to take hold. The realm is now under the firm control of the [gallic_regent_admin.GetHouse.GetBaseNameNoTooltip], and the old ways of local lords and their personal armies are a thing of the past.\n\nThe [gallic_regent_admin.GetHouse.GetBaseNameNoTooltip] will rule with an iron fist, but at least there is order in the realm once more."
