 ep3_decisions_event.4090.t: "A Step Back"
 ep3_decisions_event.4090.desc: "Beyond the walls of the estate, children shout while playing games, carts creak as they roll past, and merchants call out their wares.\n\nI have served [liege.GetTitledFirstName] for long enough.\n\nThese walls won't build themselves — and a house needs strong foundations, more than anything."
 ep3_decisions_event.4090.a: "I will be looking for opportunities."
 ep3_decisions_event.4090.a_merit: "I will be studying."
 
