l_english:
 # ====================================================================
 # Modifier names
 # ====================================================================
 LR_minister_efficient_works_modifier:0 "Well-Run Public Works"
 LR_minister_efficient_works_modifier_desc:0 "The minister responsible for construction has reorganised the realm's labour gangs, supply chains and contractors. Building projects across the realm are noticeably cheaper and finish sooner."
 LR_minister_works_strike_modifier:0 "Labour Unrest"
 LR_minister_works_strike_modifier_desc:0 "Construction crews across the realm have downed their tools after a mishandled payroll and angry foremen. Projects are crawling and the treasury bleeds gold to keep the work-sites manned."
 LR_minister_trained_troops_modifier:0 "Veteran Drills"
 LR_minister_trained_troops_modifier_desc:0 "A relentless season of drilling, marching and live exercises has hardened the realm's standing regiments. Soldiers stand straighter, screen line cavalry rides cleaner and casualties hold steadier under fire."
 LR_minister_discipline_breakdown_modifier:0 "Discipline Breakdown"
 LR_minister_discipline_breakdown_modifier_desc:0 "Brawls, desertions and looting are spreading through the camps after a string of mismanaged appointments. Maintaining order costs the crown a fortune and the army's edge in battle has dulled."
 LR_minister_legal_reformer_modifier:0 "Legal Reforms"
 LR_minister_legal_reformer_modifier_desc:0 "New statutes have been codified, clarifying disputed precedents and giving the courts a firmer hand. The throne's authority is respected, and high-handed rulings do less damage to its standing."
 LR_minister_judicial_blunder_modifier:0 "Judicial Blunder"
 LR_minister_judicial_blunder_modifier_desc:0 "A scandalous miscarriage of justice has shaken trust in the courts. Scholars argue, learned men keep their distance, and even fearsome rulers find their reputation softening."
 LR_minister_smooth_diplomacy_modifier:0 "Smooth Court Diplomacy"
 LR_minister_smooth_diplomacy_modifier_desc:0 "Back-channels between vassals and courtiers are well-greased: petty disputes are settled before they reach the throne, favours are quietly exchanged, and the whole realm runs that little bit smoother."

 # ====================================================================
 # Common option labels
 # ====================================================================
 LR_minister_pulse.option.acknowledge:0 "Noted."
 LR_minister_pulse.option.acknowledge_negative:0 "Concerning."
 LR_minister_pulse.option.well_done:0 "Well done."
 LR_minister_pulse.option.outstanding:0 "Outstanding work."
 LR_minister_pulse.option.disappointed:0 "Disappointing."

 # ====================================================================
 # 1 — Personnel (diplomacy)
 # ====================================================================
 LR_minister_pulse.1.t:0 "Court Report: The Ministry of Personnel"
 LR_minister_pulse.1.opening:0 "My liege,"
 LR_minister_pulse.1.desc.talent:0 "[minister.GetTitledFirstName] writes that a remarkable young administrator has surfaced in one of the provincial chanceries - capable, well-spoken, and apparently honest. With your leave, [minister.GetSheHe] has had the candidate sent to the capital to enter your direct service.\n\nGood appointments breed good appointments; word of this elevation has already reached the courts of the realm, and your name carries a little more weight for it."
 LR_minister_pulse.1.desc.scandal:0 "[minister.GetTitledFirstName] confesses that one of [minister.GetHerHis] recent appointments has produced an unsightly mess: bribes accepted, mistresses installed, household servants murmuring at every corner. [minister.GetSheHe] begs your understanding while the fallout is managed and the offender quietly cashiered.\n\nIt will pass. It always does. But the ministry's hand looks a little less steady this season."
 LR_minister_pulse.1.desc.smooth:0 "[minister.GetTitledFirstName] reports a quiet season at court. Petty disputes between vassals have been smoothed over before they could reach the throne, favours have been arranged in the corridors rather than fought over in the audience hall, and several minor feuds have been buried with a well-placed marriage or office.\n\nNothing dramatic - and that, [minister.GetSheHe] notes with some pride, is the entire point."
 LR_minister_pulse.1.desc.coup:0 "[minister.GetTitledFirstName] has pulled off a real coup: an entire faction of grumbling courtiers - the sort who whisper in dark colonnades about 'better candidates' - has been turned, one by one, into loyal hands of yours. Some were promised offices. Some were promised marriages. A few, [minister.GetSheHe] writes drily, were 'gently reminded of certain documents'.\n\nThe whole realm is taking notice. Your court has not been this firmly in hand in years."

 # ====================================================================
 # 2 — Justice (learning)
 # ====================================================================
 LR_minister_pulse.2.t:0 "Court Report: The Ministry of Justice"
 LR_minister_pulse.2.opening:0 "My liege,"
 LR_minister_pulse.2.desc.tyranny_reduced:0 "[minister.GetTitledFirstName] has spent the season quietly reviewing the harshest verdicts handed down in your name. Several have been overturned, a handful of unjustly held prisoners released, and one or two notoriously cruel judges retired with a small pension and a strong warning.\n\nThe resentment your subjects bore towards the throne has cooled noticeably. The realm's elders, who feared the executioner more than the law, sleep easier."
 LR_minister_pulse.2.desc.reform:0 "[minister.GetTitledFirstName] has codified a fresh body of statutes: clearer language, fewer contradictions between old and new rulings, swifter procedure for the lower courts. Scribes have been working through the nights and your name appears at the head of every page.\n\nA stronger throne is built on clear law as much as on steel; the realm will remember whose reign brought this order."
 LR_minister_pulse.2.desc.corrupt:0 "[minister.GetTitledFirstName] has quietly delivered an unexpected purse to the palace treasury - thicker than this month's accounts could possibly justify, and offered with rather too much eagerness.\n\nThe recent verdicts have been... generous to certain parties. The gold is real, the convenience is real, and people are beginning to notice that the courts are no longer entirely the courts."
 LR_minister_pulse.2.desc.blunder:0 "[minister.GetTitledFirstName] has bungled a high-profile case: a confession extracted under torture, a noble's son hanged on the wrong testimony, and a tearful family that turns out to have been on the right side of the law all along.\n\nThe courts are a laughing-stock this season. Scholars draft pamphlets, satirists draft worse, and even those who feared your justice now mostly pity it."

 # ====================================================================
 # 3 — Public Works (stewardship)
 # ====================================================================
 LR_minister_pulse.3.t:0 "Court Report: The Ministry of Works"
 LR_minister_pulse.3.opening:0 "My liege,"
 LR_minister_pulse.3.desc.efficient:0 "[minister.GetTitledFirstName] has reorganised the construction guilds: contracts standardised, materials sourced from cheaper but reliable quarries, supply trains rationalised, and corrupt overseers replaced with humbler men.\n\nWorks across the realm now move faster and at smaller cost. Architects who once dreaded the ministry's name are queueing for new commissions."
 LR_minister_pulse.3.desc.embezzle:0 "[minister.GetTitledFirstName] has delivered a so-called 'budget surplus' to the palace - pale-faced, sweating, and rather too keen to leave once the chests had been counted. The gold is real. The arithmetic, perhaps, is less real.\n\n[minister.GetSheHe] is hoping you will not look too closely at the lower clerks' ledgers this quarter."
 LR_minister_pulse.3.desc.strike:0 "[minister.GetTitledFirstName] reports - with considerable embarrassment - that masons, carpenters and labourers across half the realm have downed tools after a botched payroll, swiftly compounded by a tactless threat from a senior overseer.\n\nWork-sites are silent, scaffolding stands empty, and the treasury must keep paying the men just to stop them dispersing to other lords' projects."
 LR_minister_pulse.3.desc.treasure:0 "[minister.GetTitledFirstName] writes - excitedly, for once - that workmen excavating the foundations of a new public building have unearthed a sealed cache: old coin, plate, and the remnants of someone's long-forgotten private fortune.\n\nBy ancient right it belongs to the crown. The ministry has dispatched it under heavy guard to your treasury, and the workmen who found it have been generously - if quietly - rewarded for their honesty."

 # ====================================================================
 # 4 — Military (martial) — \"Grand Marshal\"
 # ====================================================================
 LR_minister_pulse.4.t:0 "Field Report: The Grand Marshal"
 LR_minister_pulse.4.opening:0 "My liege,"
 LR_minister_pulse.4.desc.training:0 "[minister.GetTitledFirstName] has overseen a brutal season of drills: long marches in poor weather, live-steel exercises, formation work hammered home until the men can perform it in their sleep. Several incompetent captains have been quietly retired and replaced with men of proven worth.\n\nYour men-at-arms have not been this sharp in a generation. Other lords have begun to send observers, hoping to copy the methods."
 LR_minister_pulse.4.desc.veteran:0 "[minister.GetTitledFirstName] has recruited a band of seasoned veterans to the standing regiments - hard men from foreign wars, mercenaries weary of the road, retired captains looking for a final commission. They bring scars, lessons and a hundred small tricks of the trade.\n\nThe new arrivals are already shaping the rawer recruits, and word of the ministry's generous terms has reached half the camps from here to the frontier."
 LR_minister_pulse.4.desc.discipline:0 "[minister.GetTitledFirstName] reports grimly that desertion, brawling and petty looting are spreading through the camps. A bad chain of orders, a worse pay clerk, and a sergeant flogged on the wrong testimony have together poisoned morale across several companies.\n\nFor now the army holds together - but on campaign, in a hard fight, the cracks would tell."
 LR_minister_pulse.4.desc.legend:0 "[minister.GetTitledFirstName] has distinguished [minister.GetHerselfHimself] with a feat of generalship the bards will remember for generations: a smaller force outmanoeuvred and broken, a fortified position taken with almost no loss, a battle won as much by audacity as by steel.\n\nThe army speaks [minister.GetHerHis] name with awe. So, increasingly, do the courts of neighbouring realms."
