 bookmark_eastern_clients_syracuse: "Demetrios Hieronid"
 bookmark_eastern_clients_syracuse_desc: "Syracuse was a city whose name once invoked images of glory and power, of wise kings and blind tyrants that carried her through the tumult of war and the prosperity of peace. Though a long-time friend to Rome, her fortunes have come to mirror those of her imperial overlord. Demetrios fancies himself a man worthy of ruling the whole of the island kingdom his ancestors once dominated, and equal to the task of arresting her decline. His ambitions are borne of equal parts selfish pride and spite for the godless Romans, Moors, and Vandals who have torn his birthright asunder, yet these are but daydreams. On all other things he is fickle as the wind, and his subjects fear that he is more tyrant than king.\n\n#bold You may stand alone, but your enemies are divided. Piece Sicily back together, restore her ancient greatness, and all the Mediterranean shall lie before you. Your forefathers were great builders, and the chance to build an empire is within your grasp.#!"
 bookmark_eastern_clients_syracuse_subheading: "Tyrant of Sicily"