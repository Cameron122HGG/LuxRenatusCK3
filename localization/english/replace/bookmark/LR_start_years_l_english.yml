 bm_group_5867_year: "867 A.D"
 bm_group_tooltip_5867: "#T $bm_group_5867_title$ #! \n$bm_not_released$\n\n#help "The Light of Classical Antiquity is fading. Can you hold back the coming Dark Ages?""
 
 bm_group_6066_title: "The Light Reborn"
