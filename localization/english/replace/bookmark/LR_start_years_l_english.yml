 bm_group_5682_title: "Death of the Conqueror"
 bm_group_5682: "5682"
 bm_group_9682_year: "319 B.C"
 bm_group_tooltip_9682: "#T $bm_group_5682_title$ #!\n$bm_not_released$\n\n#help "319 B.C - Megas Alexandros dies, poison is suspected to be the cause of his death. He leaves behind several legitimate children by Roxana and Stateira, and several ilegitimate ones widely acknowledged to be his. His son Alexandros IV is blinded in an accident and following unrest he is taken by his mother and loyal retainers to Cyprus.""

 bm_group_5689_title: "Victors and Saviors"
 bm_group_5689: "5689"
 bm_group_5689_year: "312 B.C."
 bm_group_tooltip_5689: "#T $bm_group_5689_title$ #!\n$bm_not_released$\n\n#help "312 B.C - Seleukos I Nikator and Ptolemy I Soter defeat Demetrius I Poliorcetes of Macedon in the Battle of Gaza. Beginning of Seleukid Era and creation of Arche Seleukeia.""


 bm_group_5867_title: "Nightfall"
