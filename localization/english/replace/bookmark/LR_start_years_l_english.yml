 bm_1066_AD_001: "Legacy of Alexander" 
 bm_1066_AD_001_desc: "The dream of Alexander the Great still echoes through the ages, in the halls and temples of the Hellenistic lands, in the words of would-be conquerors and in the blood of his descendants. Even if weakened, the realms founded by the Diadokhoi, Alexander's Successors, generals and loyal companions, still stand proud from Makedonia to India. Though they all share a language and similar culture, over time the claims and counter-claims of legitimacy have deepened the rivalry between the Successors, all claim to be true Greeks, and each also claim to be the one true inheritors of the legacy of the legends of old - of Alexander the Great, Ptolemy Soter and Seleukus Nikator. This legacy though, belongs to only the strongest."
 
 bm_1066_AD_002: "The Ruin of Britain"
 bm_1066_AD_002_desc: "Britain cannot be said to be a place of peace. Long ago abandoned by Rome, the successors of Artorius, Hereditary Governor of Britannia, fight amongst themselves. To the south, Saxon mercenaries become warlords, to the north Viking raiders style themselves as kings, and in all of the chaos, native Celts dare to dream of an Albion from before even the Caesars. But deep down every player on the board knows, whether the title be High King of the Britons, Bretwalda of the Saxons, or Imperator of the Romans, in the end there can be one Lord of this island!#!"
 
 bm_1066_AD_003: "The Eternal City"
 bm_1066_AD_003_desc: "Ah, the Eternal City! At its greatest extent, the Empire of the Romans stretched from Mesopotamia to the coasts of the Atlantic, encompassing many lands and its peoples, all beholden to the greater idea of Rome. However, its glory is now divided and scattered, East and West mere shadows of their former - united - glory, splintered by religious differences: by the holy Christ, the mighty Sol Invictus and Mithras the Lightbearer. Barbarian usurpers, claimants of all kinds, ancient enemies and would-be invaders on all sides threaten to finally extinguish its light. But Roman ambition should never be underestimated. The very same ambition that shaped the Eternal City's birth and rise to domination is now the only thing standing between it and oblivion. The Aquila Romana, the Eagle of Rome, stands proudly at the head of the armies of all the Romans as they set forth to conquer, just as they have done a thousand times before."
 
 bm_1066_AD_004: "Twilight of the Empire"
 bm_1066_AD_004_desc: "The Roman Empire is divided, and the Four Horsemen descend upon the East. Bloodied from centuries of struggle against barbarians from without, hollowed out by rebellion and usurpers from within, reeling from a succession of deadly plagues, and her people in the desperate, wailing throes of starvation and poverty, never before have imperial subjects felt so far from the Light of Sol. The Emperor of the East, Shadow of the Sun on Earth, reigns as a living god from the Sacred Palace in Constantinople. Yet with his dominion falling to pieces all around him, the truth of his divinity has come into question, inviting the rise of a rival Emperor come to take his place. There can be but one Sun in the heavens. But which shall fall into dusk, and which shall bring with it the dawn? Until this crisis should come to an end, the sons of the Eastern Empire will remain in their baleful, accursed twilight realm, ruled by no lord but Death himself."

 bm_1066_AD_005: "Song of Gaul"
 bm_1066_AD_005_desc: "When the ancient and storied lands of Gaul were divested of Roman rule, a new order arose from the ashes. The customs of the native Gallic aristocracy and the Frankish invaders blended together to form the foundation for the Sacral Kingdom of Gaul, filling the power vacuum left by the crumbling Empire and restoring a semblance of its classical prosperity. The meeting of peoples sowed harmony through the centuries, but so too has it reaped bitter discord. The Crusades of Karolus Magnus, the Wars of the Princes, the splitting of the realm between Merovingian Gaul and the Carolingians' vestige of a Holy Roman Empire, and of course the more shadowy conflicts waged beneath notice. The ones that determine just who pulls the strings of the puppet king in Paris, and how much longer the holy charade will last."

 bm_group_warlords: "Unconquered"
 bm_1066_AD_warlords: "Warlords" #Lux Invicta esque startdate
 bm_1066_AD_warlords_desc: "In this turbulent era, power is fragmented and contested by numerous ambitious warlords. Each seeks to carve out their dominion, challenging the established order and reshaping the political landscape. The struggle for supremacy is relentless, and only the most cunning and ruthless will emerge victorious."