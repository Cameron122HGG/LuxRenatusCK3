l_english: 
 bookmark_mayor_of_the_palace: "Robert Capet"
 bookmark_mayor_of_the_palace_desc: "Robert Capet, Mayor of the Palace in service to the Sacral King, is in theory but one official among many in the employ of the Merovingian dynasty. In practice, he and his house serve as the true power behind the Throne of Gaul, as they have for more than a century uninterrupted since the stewardship of Hugues the Great. A crafty politician thoroughly colored by the adder's nest he was born into, he successfully kept His Sacred Majesty Evrard from growing the fangs and backbone that might threaten his vaunted position by guile and promises, and by strategic threats and cajolery guided the realm's patchwork of Frankish, Roman, and Norman subjects well away from any thoughts of rebellion or rabble-rousing. Vast though Robert's power might be, the very nature of his position is one he has had to struggle to maintain. Between ambitious governors, endless court machinations, and a new and increasingly restless young king, the status quo he was born into cannot continue forever.\n\n#bold Gaul's palatial intrigues will remain a relentless source of anxiety for so long as they continue their course. Either solidify your place in the hierarchy, or set forth to conquer and seize the crown for yourself. In the game of thrones, there is no middle ground.#!"
 bookmark_mayor_of_the_palace_subheading: "Mayor of the Palace"

 bookmark_sacral_king: "Clotaire III"
 bookmark_sacral_king_desc: "Crowned Sacral King of Gaul little more than a year ago, the charismatic and handsome Clotaire has found it easy to charm his way through life with relative ease. Possessed of a more amiable and open nature than his father, there is little wonder as to how he became a favorite of the common people of the realm prior to his ascension. This independent popularity, and his being of an equal age with his Mayor of the Palace, has shaken up the dynamic of the court for the first time in decades. Clotaire does not have nearly as much love for his new gilded cage as the Capets hope, and he has already begun to exercise his authority - not through watered-down royal proclamations, but through his central importance to the Unctionist Church and the masses that yet hold to the Sacred Mysteries of the Holy Grail. The time has come to remind the Sacral Kingdom of Gaul, and all its grasping, blasphemous, backstabbing nobility that the Royal Blood is their sovereign by holy writ, not an instrument for their self-serving rule!\n\n#bold Reclaim the power of the throne. Find allies, undermine your regent, and raise yourself up to the position of King in your own right, lest you forevermore be a puppet to the whims of mere men.#!"
 bookmark_sacral_king_subheading: "Sacral King of Gaul"

 bookmark_syagrius: "Aquilinus Syagrius"
 bookmark_syagrius_desc: "Aquilinus is a mindful man, and knows his histories well. At the dawn of the 7th century, the Syagrian dynasty gave the Western Roman Empire its first Gallic Emperors, inaugurating a near century of Gallic rule over the Eternal City. In the closing years of the 8th century it was the coalition they assembled that sent the Karlings running to the Rhine, and their blood that served as the first Mayors of the Palace who governed the Sacral Kingdom. Now they sit as mere provincial bureaucrats under a Frankish regime. Few dynasties have risen to such heights of glory, and few have fallen quite so far. Conscious of both his position in the world yet burning with dire ambition all the same, Aquilinus plays politics with a lofty future goal in mind - not merely reclaiming his line's place as Mayors of the Palace, but to sweep the Sacral regime away wholesale, and restore proper Roman rule under a new Gallic Empire!\n\n#bold These are your lands before all others, by virtue of your Roman and Gaulish blood alike. Break the power of the Capets first, and keep the Frankish royals down whilst you bring the remainder of this broken province to heel!#!"
 bookmark_syagrius_subheading: "Procurator of Pectavia"

 bookmark_hre: "Karl IX"
 bookmark_hre_desc: "#bold Warning: Mechanics and content for the Holy Roman Empire is not yet complete, and your mileage may vary.#!\n\nKarl Albrecht, Most Serene Kaiser, by the Grace of God the Most August and great ruler of the Holy Roman Empire, blood of Karolus Magnus himself. This is the grandiose title by which the court officials at the Imperial Capital of Aachen will present the Holy Roman Emperor. In reality, the Imperial Crown is all majesty, with no power to back it up. Karl Albrecht is but a man, happy with his pitiable position and the meager occupations it brings, to receive foreign dignitaries, to accept the bows, smiles, and gifts, and to take the sons of minor nobles into his imperial guard. Aachen though, is a mire of treachery and deceit, and many of the emperor's relatives stand ready to seize the Imperial Crown and further their own ambitions...\n\n#bold Despite the diminished nature of your position, you have chances to assert yourself. Pounce upon the weakness of your heretical vassals as they present themselves, and carve out a power base of your very own. Seek strength - the rest shall follow.#!"
 bookmark_hre_subheading: "Holy Roman Emperor"