 bookmark_sacral_king: "Clotaire Merovingian"
 bookmark_sacral_king_desc: "Crowned king of Francia as a young boy, the charismatic and handsome Clotaire has found it easy to charm his way through life with relative ease. Very popular with the common people thanks to his amiable personality, he has often used this as a leverage against his contentious vassals. The Merovingian dynasty was restored from obscurity in 902 AD, and in a move to take revenge against the Pope and his support for the Karling as Sacral Emperors, they established their own Christian church, with the King as its absolute head, and a council of bishops running the day-to-day matters of the church. Let the usurpers tremble, for it is time for the true, holy Sang Real to rule yet again over all the Franks!"
 bookmark_sacral_king_subheading: "Sacral King of Gaul"

