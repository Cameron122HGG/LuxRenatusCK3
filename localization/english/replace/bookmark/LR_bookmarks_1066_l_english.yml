l_english:
 bm_1066_001: "Legacy of Alexander" 
 bm_1066_001_desc: "The dream of Alexander the Great still echoes through the ages, in the halls and temples of the Hellenistic lands, in the words of would-be conquerors and in the blood of his descendants. Even if weakened, the realms founded by the Diadokhoi, Alexander's Successors, generals and loyal companions, still stand proud from Makedonia to India. Though they all share a language and similar culture, over time the claims and counter-claims of legitimacy have deepened the rivalry between the Successors, all claim to be true Greeks, and each also claim to be the one true inheritors of the legacy of the legends of old - of Alexander the Great, Ptolemy Soter and Seleukus Nikator. This legacy though, belongs to only the strongest."
 bm_1066_002: "The Ruin of Britain"
 bm_1066_002_desc: "Britain cannot be said to be a place of peace. Long ago abandoned by Rome, the successors of Artorius, Hereditary Governor of Britannia fight amongst themselves. To the south anglo-saxon mercenaries become warlords, to the north viking raiders style themselves as kings. In all of this chaos some native celts dare to dream of an Albion from before even the Caesars. But deep down every player on the board knows, whether the title be High King of the Britons, Brytenwalda of the Saxons, or Imperator of the Romans, in the end there can be one Lord of this island!#!"
 bm_1066_003: "The Eternal City"
 bm_1066_003_desc: "Ah, the Eternal City! At its greatest extent, the Empire of the Romans stretched from Mesopotamia to the coasts of the Atlantic, encompassing many lands and its peoples, all beholden to the greater idea of Rome. However, its glory is now divided and scattered, East and West mere shadows of their former - united - glory, splintered by religious differences: by the holy Christ, the mighty Sol Invictus and Mithras the Lightbearer. Barbarian usurpers, claimants of all kinds, ancient enemies and would-be invaders on all sides threaten to finally extinguish its light. But Roman ambition should never be underestimated. The very same ambition that shaped the Eternal City's birth and rise to domination is now the only thing standing between it and oblivion. The Aquila Romana, the Eagle of Rome, stands proudly at the head of the armies of all the Romans as they set forth to conquer, just as they have done a thousand times before."
 bm_1066_004: "Fading Sun"
 bm_1066_004_desc: "The Light of Sol fades, and the Four Horsemen descend upon the fraying Eastern Empire..."

 bm_princeps_1066: "Imperium Sine Fine"
 bm_princeps_1066_desc: "The Western Empire is a shadow of its former self, but the idea of Rome still holds strong." 
 bm_autokrator_1066: "Light Unconquered"
 bm_autokrator_1066_desc: "The Eastern Roman Empire is beset on all sides, but the capital still stands."  
 bm_1066_shah: "King of Kings"
 bm_1066_shah_desc: "The great Persian rulers of 6066..." 
 bm_1066_caliph: "Commander of the Faithful"
 bm_1066_caliph_desc: "The Caliphate of 1066 is fractured and weak, but the faith remains strong."
 bm_messiah_1066: "Blood of Martyrs"
 bm_messiah_1066_desc: "The Fatimid Caliphate of 1066 is a beacon of Shia Islam in a sea of Sunni rulers."
 bm_khan_1066: "A Sound of Thunder"
 bm_khan_1066_desc: "The steppe empires of 1066 are vast and powerful, but their hold on the world is tenuous." 
 bm_huangdi_1066: "Son of Heaven"
 bm_huangdi_1066_desc: "The Chinese emperors of 1066 rule over a vast and prosperous empire, but their hold on power is fragile." 

