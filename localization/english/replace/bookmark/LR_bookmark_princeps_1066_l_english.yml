 bookmark_princeps_spqr: "Traianus Valentinianus"
 bookmark_princeps_spqr_desc: "The seventeenth descendant of Valentinian to be elected Princeps by the Senate and People of Rome, Traianus is a shrewd and ruthless man who will stop at nothing to further his ambitions. Though his authority scarcely extends beyond the bounds of Latium, he plans to rectify this state of affairs. The greatest obstacles in his path are the rebels in Venetia and Neapolis, which cling to abominable heresies of Christianity and obsolete pagan traditions, and the remnants of the Eastern Empire's rule in Tyrrhenia and Ravenna. The upheaval of the Norman invasions presents a perfect opportunity to Traianus, to make his move and restore the Western Empire to it's rightful position.\n\n#bold Rome began as but a single city assailed from all sides, and rose to become the envy and terror of the ages. Prove you are worthy of her legacy, and the favor of the Almighty.#!"
 bookmark_princeps_spqr_subheading: "First Man in Rome"

 bookmark_princeps_neapolis: "Alexander Augustus"
 bookmark_princeps_neapolis_desc: "Some men trace their descent to a single famous figure, but Alexander Augustus, the 'August Leader' of Neapolis, descends from some of the greatest men to have ever lived. By virtue of the blood of Julius Jupiter, Divus Augustus, and Megas Alexandros flowing through his veins, he is truly the son of the divine - a fact he proclaims constantly for all to hear, for Alexander's ambition is only surpassed by his pomposity. In recent times, he has unilaterally declared the Senate in Rome null and void, claiming that only a man descending from the blessed emperors and conquerors of old can restore Rome to it's proper glory, and not a slave to the Jewish god.\n\n#bold The histories teach that vaunted bloodlines and adherence to time-honored traditions are not enough to seize power, let alone maintain it. The road before you is perilous and fraught with blood - yet it is up to you to cast the die.#!"
 bookmark_princeps_neapolis_subheading: "Western Augustus"

 bookmark_princeps_venetia: "Lucius Aurelius"
 bookmark_princeps_venetia_desc: "At first sight, Lucius Aurelius is a genius the likes the world has not seen in centuries. Learned in the Classics and an accomplished statesman, he is everything a proper philosopher king should be. Except that deep down, Lucius is a man broken by the weight of expectation that his bloodline brings - that of the great Marcus Aurelius. A cynical man to whom the church of Christus Sol is but another tool of the state, he is well envious of those who have more tranquil lives. From the island fortress of Venetia, Lucius prepares to lay claim to the whole of Rome, hoping that perhaps, succeeding in this endeavor will finally calm his inner demons...\n\n#bold Your forebears were as much soldiers as they were scholars, and both prudent thought and action will be necessary for success. Exploit the opportunities of your position to the fullest, and remember always: what you do in this life echoes in eternity...#!"
 bookmark_princeps_venetia_subheading: "Most Serene Scholar"

 bookmark_princeps_syracuse: "Demetrios Hieronid"
 bookmark_princeps_syracuse_desc: "Syracuse was a city whose name once invoked images of glory and power, of wise kings and blind tyrants that carried her through the tumult of war and the prosperity of peace. Though a long-time friend to Rome, her fortunes have come to mirror those of her imperial overlord. Demetrios fancies himself a man worthy of ruling the whole of the island kingdom his ancestors once dominated, and equal to the task of arresting her decline. His ambitions are borne of equal parts selfish pride and spite for the godless Romans, Moors, and Vandals who have torn his birthright asunder, yet these are but daydreams. On all other things he is fickle as the wind, and his subjects fear that he is more tyrant than king.\n\n#bold You may stand alone, but your enemies are divided. Piece Sicily back together, restore her ancient greatness, and all the Mediterranean shall lie before you. Your forefathers were great builders, and the chance to build an empire is within your grasp.#!"
 bookmark_princeps_syracuse_subheading: "Tyrant of Sicily"