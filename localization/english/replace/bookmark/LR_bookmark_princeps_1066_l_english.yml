 bookmark_princeps_spqr: "Traianus Valentinianus"
 bookmark_princeps_spqr_desc: "The seventeenth descendant of Valentinian to be elected Princeps by the Senate and People of Rome, Traianus is a shrewd and ruthless man who will stop at nothing to further his ambitions. Though his authority scarcely extends beyond the bounds of Latium, he plans to rectify this state of affairs. The greatest obstacles in his path are the rebels in Venetia and Neapolis, which cling to abominable heresies of Christianity and obsolete pagan traditions, and the remnants of the Eastern Empire's rule in Tyrrhenia and Ravenna.\n\n#bold The upheaval of the Norman invasions presents a perfect opportunity to Traianus, to make his move and restore Rome to it's rightful position...#!"
 bookmark_princeps_spqr_subheading: "First Man in Rome"