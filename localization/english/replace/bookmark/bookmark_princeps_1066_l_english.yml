 bookmark_basileus_thessaloniki: "General Dorotheos of Thessaloniki"
 bookmark_basileus_thessaloniki_desc: "A man whom his troops call 'Megas Alexandros reborn', Dorotheos is a famous Rhomaion general who has recently risen against the Empire, throwing the weakened realm into a great crisis. His line, the Argeadai, are descendants of Alexander the Great's illegitimate son Cassander. A proud, charismatic and passionate man, though some would see him as preposterous and overbearing, Dorotheos is prone to give great speeches about the glory of conquest, the bonds of men, and above all, the importance of leaders as active examples to their people, not distant rulers, secluded in their own high ideals. The dream of Dorotheos is the dream of his famed ancestor, to conquer all the worlds at the head of his army, and reach the shores of the Outer Ocean ..."
 bookmark_basileus_thessaloniki_subheading: "General of the Eastern Armies"
 
 bookmark_basileus_kyrene: "Basileus Apollonios of Kyrene"
 bookmark_basileus_kyrene_desc: "Mighty Apollonios, beloved of Apollo Phoibos and true Pharaoh of Aigyptos, rules from his capital at the last Hellenistic stronghold of Kyrene, a realm which combines the grandeur of the ancient world with the sophistication of the new age. Apollonios follows the ancient royal tradition of marrying only within his own family, and has taken his sister Cleopatra for wife, for only such a union can be blessed by the light of Helios! However, the power once bestowed upon the scions of Ptolemy over the Nile has waned and their lands are occupied by all kinds of rivals: imposters claiming Ptolemaic descent, the deluded Argeadai occupying Alexandria and the quarrelsome remnants of the Caliphates. But Aigyptos, under its legitimate rulers, the trueborn Ptolemaic Pharaohs, could even rise beyond the heights of its former supremacy!"
 bookmark_basileus_kyrene_subheading: "True Lord of the Nile"
 bookmark_basileus_kyrene_character_title_type: "Pharaoh"
 
 bookmark_basileus_antiochia: "Basileus Seleukos of Antiochia"