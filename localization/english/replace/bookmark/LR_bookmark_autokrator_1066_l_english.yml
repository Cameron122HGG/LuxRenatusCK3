 bookmark_autokrator_byzantium: "Photios Julianos"
 bookmark_autokrator_byzantium_desc: "Emperor of the Romans and Sol Invictus made flesh, Photios descends from the famed Sun Emperor Julian, Savior of the Light, much to his chagrin. Although raised in the image of his vaunted ancestor, in reality he is a wretched soul beleaguered by his position. Photios is a man of fragile nerves and brittle constitution, a far cry from the strength and imperious divinity his regime proclaims in him, marking him as utterly unsuited for the Imperial Throne. In another, more forgiving age, he might have served as an unremarkable monarch. Better still, he might have lived the unsuspecting, humble life of a scholar, far removed from politics. Yet this is not a forgiving age. Flavios had the unenviable fate of presiding over a realm already fraying at the seams, but his open weakness has seen Constantinople's client kings in the east break from her authority, rival claimants in the west arising in the hopes of seizing his throne, and plots among his few supposedly loyal vassals to position themselves highly in the aftermath of the bloodshed to come...\n\n#bold The Eastern Empire is once again in crisis, assailed on all sides from without and within. Though the sun sets upon your dynasty, and all hope seems lost, fate is never set in stone. Do not go gentle into that good night. Rage, rage against the dying of the Light!#!"
 bookmark_autokrator_byzantium_subheading: "The Fading Sun"

 bookmark_byzantium_argeadai: "Alexandros Julio-Argead"
 bookmark_byzantium_argeadai_desc: "It is grim necessity that dictates men should rise against tyrants, and tragic posterity that dictates they should rise against an unworthy sovereign. Alexandros of Thrace is a wealthy magnate, a brilliant orator, and scion to perhaps the greatest dynasty that history has ever known. Heir of Augustus Caesar, Megas Alexandros, Neos Helios, and every greatest and most terrifying ruler of the Roman Empire from its very inception, the Imperial Throne is and has always been his by right of holy blood. For all that Julian and his vainglorious descendants bleat on and on about the philosophical foundations to imperial rule, the prosperity of the Empire has always been inexorably linked to the strength of the Sun Emperor as Sol Incarnatus. The mortal decay of the East under a false, unfit emperor is Sol's displeasure made manifest, and there is but one solution - the false Sun must be cast down into the Darkness from which it came, and Sol Made Flesh must arise to reclaim his rightful rule.\n\n#bold The False Emperor is weak and outnumbered, and a long war is not in your interest. Marshal your allies and swiftly seize Constantinople before he has a chance to strike against you in earnest. Rebuilding the rest of this broken realm will be a matter for less simple, but no less inevitable.#!"
 bookmark_byzantium_argeadai_subheading: "The Coming Dawn"

 bookmark_byzantium_opsikion: "Belisarios Justinian"
 bookmark_byzantium_opsikion_desc: "Amidst the precipitous decline of the Eastern Empire, there are precious few houses that remain loyal to Constantinople. Bitter oaths and spiteful ambition are all that bind the Emperor's faithful to a common cause. Belisarios, blood of Justinian the Great and adherent to the Jovian Tradition, is motivated by both. It was the life's work of his great ancestor, and his namesake general, to put an end to Rome's loathsome division and restore to her people the order and sanity they once knew under the auspices of the gods. So it is that he holds no end of disdain for the rebellion that threatens to once and for all sunder the Empire, and greater hatred still for the pompous, self-aggrandizing Julio-Argeads at its helm. The delusions of godhood held by their wretched brood has brought Rome to the edge of ruin time and time and time again - a delusion from which the Julianoi are far from exempt. It must, in the end, fall to Jupiter's faithful to snuff out their mad, false light, and end the cycle.\n\n#bold Defeat your enemies in detail. March with the Emperor's forces, destroy the usurpers, and then work to supplant him yourself. Justinian's dream cannot be fulfilled from a shared throne.#!"
 bookmark_byzantium_opsikion_subheading: "The Devoted of Jupiter"

 bookmark_byzantium_trebizond: "Kaisarios Konstantinian"
 bookmark_byzantium_trebizond_desc: "Formerly the Governor of Khaldia, now styling himself as the Despot of Trebizond, Kaisarios is born of the main line of the great Emperor Constantine's descendants. Infamous for his irascible temperament, Kaisarios has declared independence from the Eastern Empire, wroth from the growing tax burdens imposed by Constantinople in spite of their mounting neglect of Anatolia, and castigating the incompetence and corruption of its officials all the way up to the pampered, effeminate, cowardly Emperor Flavios. Although he intended to march west for the capital in the nascent days of his rebellion, the descent of the western provinces into anarchy and the re-emergence of the Argeadai as imperial contenders has warranted a change of tack. Instead of wrangling the viper's nest that is the Aegean, Kaisarios seeks to advance his rule northward, and finally bring order to the waters of the Black Sea...\n\n#bold Take advantage of the Eastern Anarchy and solidify your hold on the coast such that the feuding dynasts to your west do not dare give challenge. With careful maneuvering and luck, a new Pontic Empire may yet be yours to shape.#!"
 bookmark_byzantium_trebizond_subheading: "The Despot of Trebizond"

 bookmark_byzantium_epirus: "Andronikos Doukas"
 bookmark_byzantium_epirus_desc: "The Despot of Epirus and Protector of the Christian faithful in Greece, Andronikos Doukas, is neither a cunning politician, nor a powerful general, nor a particularly devout man. Out of all the players scratching and clawing for power in the ruins of what was once the most powerful state in the Mediterranean, hailing from ancient imperial, royal, and divine bloodlines, he is just another conniving opportunist who has seized on the Empire's instability and his own generalship to carve out a petty kingdom of his own - conveniently removed from the heaviest of the fighting raging just to his east. Utterly convinced of his own unrivalled brilliance in intrigue and warfare, Andronikos believes that after both the usurpers and loyalists will bleed themselves white and the fighting will come to a standstill, opening the way for him to march east at the head of a fresh army to claim the Imperial Throne like Caesar crossing the Rubicon.\n\n#bold These childish delusions have yet to give way to reality, and it's clear to all that Andronikos hasn't the talent or the force to finesse his way into true power. Even so, fortune favors the bold, and fools are oft the boldest of all.#!"
 bookmark_byzantium_epirus_subheading: "The Despot of Epirus"

 bookmark_byzantium_morea: "Theodoros Palaiologos"
 bookmark_byzantium_morea_desc: "Though they were subjected to a thousand years of debasement, persecution, and mad brutality at the hands of their pagan lords, waxing and waning with the Sun Emperor's whims, the Eastern Empire was never able to fully rid herself of her Christian subjects, leaving only the most dogged and determined schismatics to prosper beneath notice. Theodoros Palaiologos, a deft administrator from the Peloponnesos and a Sabellianist far removed from the influence of the Epirote Patriarchate or the Bishopric of Rome, is one such man. He is a shrewd, pragmatic soul who has long labored to shield his citizens and fellow faithful from the worst of imperial deprivations, but desperation and dark designs have led Theodoros to support the Julio-Argead camp against the reigning emperor. Alexandros promises stability that frail Flavios can hardly hope to achieve, and with neighboring governors in Athens and Makedonia already declaring for the old dynasty, the only logical choice for him and his outcasts to make is to pick the winning side...But is survival under another cruel, hostile regime truly his only goal?\n\n#bold This ruinous anarchy may yet spell the beginning of the end for the Eastern Empire. If the throne is usurped, then the frayed bonds between Constantinople and her clients will snap, leaving you free of your obligations and free to expand your own power. Pick the right fights, choose the right friends, and strike at the right time, and the sun worshippers may one day live to see you on their throne.#!"
 bookmark_byzantium_morea_subheading: "Despot of the Morea"