 bookmark_byzantium_argeadai: "Alexandros Julio-Argead"
 bookmark_byzantium_argeadai_desc: "Some men are born with nothing, some are born in the shadow of a famed ancestor, and some rare few are descendants of two. Alexandros of the Julio-Argeadai is the inheritor of both the August Emperors of Rome and the divine blood of Alexandros ho Megas. If any man in Rhomania is worthy of the throne, it is Alexandros of Thrace. The Emperor in Constantine's City is weak, unfit and a blight on Rome's glory; remove him, and honor the grandeur of your heritage!"
 bookmark_byzantium_argeadai_subheading: "Coming of the Dawn"

