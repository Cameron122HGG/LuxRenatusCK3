 bookmark_autokrator_byzantium: "Flavios Julianos"
 bookmark_autokrator_byzantium_desc: "Emperor of the Romans and Sol Invictus made flesh, Flavios descends from the famed Sun Emperor Julian, Savior of the Light, much to his chagrin. Raised to be another Julian, in reality he is man beleaguered by his position, completely unsuited for the Imperial Throne. Coupled with the Empire's instability in recent years, this has led to a great crisis, as the vassal kings break away and a charismatic general from Thessalonica, claiming descent from Alexander the Great, threatens to usurp the throne and end Julian's line..."
 bookmark_autokrator_byzantium_subheading: "Emperor of the Fading Sun"

 bookmark_byzantium_argeadai: "Alexandros Julio-Argead"
 bookmark_byzantium_argeadai_desc: "Some men are born with nothing, some are born in the shadow of a famed ancestor, and some rare few are descendants of two. Alexandros of the Julio-Argeadai is the inheritor of both the August Emperors of Rome and the divine blood of Alexandros ho Megas. If any man in Rhomania is worthy of the throne, it is Alexandros of Thrace. The Emperor in Constantine's City is weak, unfit and a blight on Rome's glory; remove him, and honor the grandeur of your heritage!"
 bookmark_byzantium_argeadai_subheading: "Coming of the Dawn"

 bookmark_byzantium_opsikion: "Belisarios Justinian"
 bookmark_byzantium_opsikion_desc: "i praise the sky daddy"
 bookmark_byzantium_opsikion_subheading: "The Devoted of Jupiter"

 bookmark_byzantium_trebizond: "Kaisarios Konstantinian"
 bookmark_byzantium_trebizond_desc: "Formerly the governor of Khaldia, now styling himself as the Despot of Trebizond, Kaisarios comes from the main line of Emperor Contantine's the Great descendants. Known for his irascible temperament, it his said that Kaisarios has declared independence out of anger for the state of the Empire and the general incompetence of its officials, up to Emperor Flavios, who is nothing more than a pampered coward in his eyes. While he originally intended to seize the Imperial Throne, now, with the charismatic Dorotheos Argeadai in scene, Kaisarios instead plans to expand his realm north, and perhaps finally bring order to the coasts of the Black Sea..."
 bookmark_byzantium_trebizond_subheading: "The Despot of Trebizond"

 bookmark_byzantium_epirus: "Andronikos Doukas"
 bookmark_byzantium_epirus_desc: "i praise jesus"
 bookmark_byzantium_epirus_subheading: "The Despot of Epirus"

 bookmark_byzantium_morea: "Theodoros Palaiologos"
 bookmark_byzantium_morea_desc: "i also praise jesus, but in a different, more nuanced fashion than you"
 bookmark_byzantium_morea_subheading: "Despot of the Morea"