l_english:
SPARTA_GLOSS: "Come and take it."
LEONIDAS_GLOSS: "Famous King of Sparta."
ROMA_CITY_GLOSS: "The Eternal City."
KYNANIDONES_GLOSS: "A warband made up of free women, founded by the princess Kleitoníkē Hierakáina of Makedon, the She-Hawk of Thasos, in honour of the mightly Kynane, sister of Alexander the Great. These warriors are consecrated to Ares Enyalios and Artemis Kynago."
ACHAEMENID_GLOSS: "The Achaemenids, the old and reveered House of Cyrus and Darius that established the Persian Empire, now relegated to a mostly priestly role."
ARGEAD_GLOSS: "The Argeads, kings of Makedon, the family of Amyntas, Alketas, Philip and Alexander the Great."
CALGACID_GLOSS: "The matrilineal family which, through motherhood or marriage with its daughters, gave Caledonia its kings, Calgacus chief among them, Impeder of Romans."
PLEURIAS_GLOSS: "Descended from Pleurias, king of the Autariates and one of the leaders of the Illyrian revolt that almost ended Philip II's life. While Alexander dealt with the three Illyrian kings who rebelled against Macedon, his descendants consolidated the tribes and dynasties of Dindaria and created a stable principality."
TEUTA_GLOSS: "The kindred of Teuta, queen of the Ardiaei, widow of Agron and vanquisher of the Romans. From Rhizon and Scodra, the Sea-Queen defied the Emperor and gathered the peoples of the Adriatic beneath one crown; her memory endures among the princely clans of Illyria."
ROURAN_GLOSS: "The Yujiulü, descendants of Mugulü and khagans of the Rouran, whose dominion stretched across the eastern steppe."
TROY_ILLYRIAN_GLOSS: "The descendants of Helenus, son of Priam, who carried the Dardanian blood of Troy into Epirus and Illyria. They rebuilt the fallen high walls of Troy among the Dinaric mountains."
ODA_THELTATE_GLOSS: "The Way of Hidden Things, the Mysteria Illyrica, or the Zagrean Descent, practiced by many Illyrians."
BLACK_OAKS_GLOSS: "The Haritz Beltzariak are the Brotherhood of the Black Oak, a recently formed band of spears for hire formed after the cavalcades of the the Gothic lords of Auscia burnt down the Basque villages in Bigorra and Biarn. The dispossessed, under the calcinated trunk of the sacred Assemby Oak of Bigorra, swore to be brethren and survive, and to never let a Goth in sight alive."
BURDINESCAN_GLOSS: "The Burdinezko Anaiak, or the Ironclad Company, is an organised company of mercenaries founded by the wealthy Gartzi of Irun, merchant prince of the Pyrinean valleys, initially to protect his own caravans with expensive Frankish armour, but eventually the business of war proved more lucrative than trade, and the defenders became the predators."
MENDIETAURIAK_GLOSS: "The mountains of the Pyrinees are vast and often inhospitable, but also a refuige for those who are downcast or exiled. Sometimes such people band together in what the Basques know as Mendietauriak, the Mountain-Bunds. They are light-footed, ruthless and ferocious."
FORSAKEN_AIZKOLARIAK_GLOSS: "The Basque lands are home to dense forests, and many of these forests were considered sacred and were cared for by guilds of priestly woodsmen, the Aizkolariak, some of whom cut down trees and sold their timber without the proper ritual or permission from the local high priestess. They were exiled, but they did not disband, rather they became a company of prized axe-wielding light infantry mercenaries."
ILTIR_WOLVES_GLOSS: "The Wolves of Iltirra are disparate bands of woodslands ruffians who allied under the leadership of the mysterious Count of Wolves, a ruthless ruffian bandit king."
CANIGO_GLOSS: "Like the eagle soaring from the sky descended the Iron-Wielders from Mount Caneco one foggy morning, sang the song. The sacred mountain is home to many sanctuaries of the Indigetes, Andosani and other ancient Pyrinean peoples. The Caneconitarri were dispossessed men, sworn to protect the shrines and pilgrims from the many dangers they face. After Bishop Felix called bands of armed men from Carcasso, Gerunda and Barcino to burn down the sacred groves and tear down the stone pillars, the Canicotarri have roamed the land as a band of mercenaries, forever in mourning for the oath they could not fullfill."