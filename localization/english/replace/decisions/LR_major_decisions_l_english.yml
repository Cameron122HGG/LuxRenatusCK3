 restore_roman_empire_spqr_decision: "Restore the Roman Empire"
 restore_roman_empire_spqr_decision_desc: "If Rome and other key territories of the old empire could be reclaimed, the Western Empire would win recognition in the eyes of the world as the true and rightful continuation of the Roman State."
 restore_roman_empire_spqr_decision_tooltip: "The Roman Empire will be restored"
 restore_roman_empire_spqr_decision_confirm: "I will restore the Empire"
 wre_borders_restored_tt: "The old borders of the Western Roman Empire have been restored."
 restore_roman_empire_spqr_decision_effect_tooltip: "The Roman Empire will be restored and becomes [de_jure|E] liege of every [kingdom|E] and [duchy|E] title in the [GetGeographicalRegion('custom_theodosian_wre').GetName]."

 LR_restore_roman_empire_holy_decision_effect_tooltip: "The Roman Empire will be restored and becomes [de_jure|E] liege of every [kingdom|E] and [duchy|E] title in the [GetGeographicalRegion('custom_germany').GetName]."
 LR_reunify_roman_empire_decision: "Re-unite the Roman Empire"
 LR_reunify_roman_empire_decision_desc: "By reuniting the Eastern and Western Roman Empires under a single ruler, the glory and power of Rome will be fully restored."
 LR_reunify_roman_empire_decision_tooltip: "Bind the Eastern and Western Roman Empires into a single entity once more."
 LR_reunify_roman_empire_decision_confirm: "One Empire, One Emperor."
 
 ##Reforge Alexander's Empire
 LR_create_alexander_hegemony_decision: "Revive the Dream of Alexander"
 LR_create_alexander_hegemony_decision_desc: "Alexander is perhaps the most important person in history, and he surely is for the Hellens. And his dream of conquest, of cultural exchange, is not dead! \nWe will revive Empire of his dreams, or even more than Empire!"  
 LR_create_alexander_hegemony_decision_tooltip: "Arise From the Ashes!"
 LR_create_alexander_hegemony_decision_confirm: "Arise From the Ashes!"
 
 world_alexanders_empire: "Alexander's Bounty"
 holds_imperial_title_tooltip: "Primary Title is an Empire"
 
 ###Unite Britannia
 unify_england_anglo_saxon_decision: "Unify England"
 unify_england_anglo_saxon_decision_desc: "Our ancestors had landed in this country centuries ago now, however for far too long had our people been disunited. We need to change that and create a fully unified Kingdom of England!"  
 unify_england_anglo_saxon_decision_tooltip: "Angles and Saxons Stand United!"
 unify_england_anglo_saxon_decision_confirm: "Angles and Saxons Stand United!"

 unify_england_briton_decision: "Reclaim Logres"
 unify_england_briton_decision_desc: "For far too long the Germanic barbarians were allowed to ravage our lands! We need to hold grip over what they call 'England', and restore the Roman Order in East Britannia!"  
 unify_england_briton_decision_tooltip: "Barbarians Shall Submit!"
 unify_england_briton_decision_confirm: "Barbarians Shall Submit!" 
 
 ghw_region_england: "England-Britannia"
 primary_title_is_kingdom_tooltip: "Primary Title is a Kingdom"
 
 ###Reform to Feudal from High Tribal
 convert_high_tribal_to_feudalism_decision: "Formalise Feudal Structure"
 convert_high_tribal_to_feudalism_decision_desc: "With constantly advancing sophistication of Feudal structure, it is necessary to codify My realm's laws, to be governed by contract and not only a word of mouth!"  
 convert_high_tribal_to_feudalism_decision_tooltip: "My Realm Advances"
 convert_high_tribal_to_feudalism_decision_confirm: "My Realm Advances"

 convert_classical_feudal_decision: "Adopt Classical Feudalism"
 convert_classical_feudal_decision_desc: "My Realm has deep contacts with Classical Religions and their way of governance, perhaps I should consider leaning more into them..."  
