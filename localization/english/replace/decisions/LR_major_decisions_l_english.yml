 ##LR government evnets
 lr_gov_events.0001.t:0 "Solidification of Feudal Relations"
 lr_gov_events.0001.desc:0 "The informal becomes formal. As the [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], I have concluded that we must fully adopt feudalism and its principles if we shall continue to prosper. It is the crucial next step on our road to greatness!"
 lr_gov_events.0001.a:0 "Long live [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 lr_gov_events.0002.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]" 
 lr_gov_events_abandon_high_tribal: "[GetGovernment('high_tribal_government').GetName] has been abandoned"
 
 lr_gov_events.0003.t:0 "A New forom of governance"
 lr_gov_events.0003.desc:0 "My Realm reforms. As the [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], I have concluded that we must adopt more advanced form of governance!"
 lr_gov_events.0003.a:0 "May it be for the best!"
 lr_gov_events.0003.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"

 lr_gov_events.0007.t:0 "A Simple Realm"
 lr_gov_events.0007.desc:0 "As the [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], I have concluded that our current form of governance is unsustainable. Thus the structure of it needs to be simplified."
 lr_gov_events.0007.a:0 "May it be for the best..."
 lr_gov_events.0007.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]" 
 
 lr_gov_events.0009.t:0 "A Realm of Gaul"
 lr_gov_events.0009.desc:0 "As the [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], I have concluded that it will be most wise to adopt our government in line with the customs of Gaul, for betterment of our realm."
 lr_gov_events.0009.a:0 "May it be for the best..."
 lr_gov_events.0009.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"  
 
 #Retake Eastern Provinces
 LR_restore_eastern_hegemony_decision: "Re-Establish the Theodosian Borders"
 LR_restore_eastern_hegemony_decision_desc: "When Emperor [GetScriptedCharacterByHistoryID( '70534' ).GetFirstName] split the Roman Empire into two administrative halves, the Eastern part went to his eldest son, [GetScriptedCharacterByHistoryID( '70519' ).GetFirstName]. We are his direct successors. However, the borders of our [Glossary( 'Pars', 'PARS_ORIENTIS_GLOSS' )] have greatly contracted since those days; it will be cause of great glory for a Basileus to re-establish the frontiers that [GetScriptedCharacterByHistoryID( '70534' ).GetFirstNameNoTooltip] originally left us."
 LR_restore_eastern_hegemony_decision_tooltip: "Re-establish the original frontiers of Eastern Rome"
 LR_restore_eastern_hegemony_decision_confirm: "Officialize the new borders"
 restore_gallic_empire_decision: "Restore the Gallic Empire"
 restore_gallic_empire_decision_desc: "I wield de facto supreme power over the lands of Gaul, yet I still play political theater with my Frankish prisoner who styles himself the Sacred King of the Franks. It is time to end this charade and restore the Gallic Empire, uniting all of Gaul under my rule and reclaiming the legacy of Tetricus and Syagrius!"
 restore_gallic_empire_decision_tooltip: "Unite all of Gaul under your rule and restore the Gallic Empire, ending the diarchy of Frankish and Roman rule in the region."
 restore_gallic_empire_decision_confirm: "Gaul will be mine!"
 become_king_of_franks_decision: "Become King of the Franks!"
 become_king_of_franks_decision_desc: "I wield power over Gaul not seen since the days of Saint Clovis, yet I still play political theater as Mayor of the Palace. It is time to end this charade and crown myself as King of the Franks, uniting all of Gaul under my rule and claiming the legacy of the Franks for myself!"
 become_king_of_franks_decision_tooltip: "Unite all of Gaul under your rule and seize the Kingdom of the Franks, ending the diarchy of Frankish and Roman rule in the region."
 become_king_of_franks_decision_confirm: "Francia will be mine!"
 reform_carolingian_empire_decision:0 "Restore Carolingian Borders"
 reform_carolingian_empire_decision_confirm:0 "For the Empire of the Franks!"
 reform_carolingian_empire_decision_desc:0 "The dream of Charlemagne of a united Europe was unraveled by the treachery of Latins and the pettiness of German Princes, yet it can still come true if the Franks unite under this single purpose."
 reform_carolingian_empire_decision_tooltip:0 "The Carolingian Borders are restored."
 reform_carolingian_empire_decision_effect_tooltip:0 "The Carolingian Borders are restored"
 
