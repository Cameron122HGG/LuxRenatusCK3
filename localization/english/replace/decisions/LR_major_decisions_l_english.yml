 wre_borders_restored_tt: "The Western Theodosian Borders have been restored."

 restore_diocese_aegyptus_decision: "Restore Roman Rule in Aegyptus"
 restore_diocese_aegyptus_decision_desc: "Generations ago, Roman Rule receded from the Nile. Leaving Egypt to warlords. Now, with the Vandal and Berber invaders pushed back, it is time to restore the old [Glossary( 'Dioecesis', 'ROMAN_diocese_GLOSS' )] and bring the rich lands of Aegyptus back under the rule of Rome.\n\nWith the old [Glossary( 'Dioecesis', 'ROMAN_diocese_GLOSS' )] reclaimed, the southern shores of the Mediterranean will once again be secure under the righteous Roman rule."
 restore_diocese_aegyptus_decision_tooltip: "Restore the old Imperial Diocese of Aegyptus"
 restore_diocese_aegyptus_decision_confirm: "Rome rises!"
 restore_diocese_aegyptus_effect_tooltip: "[GetTitleByKey('k_diocese_aegyptus').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_aegyptus').GetName]."
