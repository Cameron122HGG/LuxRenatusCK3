 restore_western_administration_decision: "Restore the Administrative Divisions of the Western Empire"
 restore_western_administration_decision_desc: "The [Glossary( 'Dioecesis', 'ROMAN_diocese_GLOSS' )] used to be our form of civilian and military governance. Now that we have recovered our Empire from the ashes, we should also reestablish the old imperial administrative divisions."
 restore_western_administration_decision_tooltip: "Restore the former imperial administrative divisions of the Western Empire"
 restore_western_administration_decision_confirm: "Rome rises!"
 restore_western_diocese_system_effect_tooltip:0 "The Dioceses of [GetTitleByKey('k_diocese_italia_annonaria').GetName], [GetTitleByKey('k_diocese_italia_suburbicaria').GetName] and [GetTitleByKey('k_diocese_illyricum').GetName] will be reestablished, and brought back under [de_jure|E] Imperial rule."
