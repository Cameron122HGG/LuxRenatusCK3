#Grain Dole
 wr_reinstitute_grain_dole_decision: "Reinstitute the Grain Dole"
 wr_reinstitute_grain_dole_decision_desc: "In the ancient Western Roman Empire, the citizens of Rome enjoyed the benefit of regular distributions of free or cheap bread. This tradition was interrupted by the decline of the Empire and the loss of Africa. Now that we have rebuilt the Empire, any emperor who restores this ancient tradition will win the fervent support of the people."
 wr_reinstitute_grain_dole_decision_tooltip: "Implement the bread distribution system to the capital's people"
