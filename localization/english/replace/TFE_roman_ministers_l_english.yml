l_english:
 k_minister_prafectura_oriens: "Praetorian Prefecture of the East"
 k_minister_prafectura_oriens_adj: "Praetorian"
 k_minister_prafectura_oriens_desc: "The Praetorian Prefecture of the East encompasses the eastern provinces of the Roman Empire, administered by its Praetorian Prefect."

 k_minister_prafectura_illyricum: "Praetorian Prefecture of Illyricum"
 k_minister_prafectura_illyricum_adj: "Illyrian"
 k_minister_prafectura_illyricum_desc: "The Praetorian Prefecture of Illyricum encompasses the Balkans, administered by its Praetorian Prefect."

 k_minister_prafectura_gallia: "Praetorian Prefecture of Gaul"
 k_minister_prafectura_gallia_adj: "Gallic"
 k_minister_prafectura_gallia_desc: "The Praetorian Prefecture of Gaul encompasses the western provinces including Gaul, Britannia, and Hispania, administered by its Praetorian Prefect."

 k_minister_prafectura_italia: "Praetorian Prefecture of Italy"
 k_minister_prafectura_italia_adj: "Italian"
 k_minister_prafectura_italia_desc: "The Praetorian Prefecture of Italy encompasses Italy and Africa, administered by its Praetorian Prefect."

 k_minister_magister_officiorum: "Magister Officiorum"
 k_minister_magister_officiorum_adj: "Official"
 k_minister_magister_officiorum_desc: "The Master of Offices coordinates the imperial secretariat, manages diplomatic affairs, and oversees the state postal service and arms factories."

 k_minister_comes_sacrarum_largitionum: "Comes Sacrarum Largitionum"
 k_minister_comes_sacrarum_largitionum_adj: "Largitional"
 k_minister_comes_sacrarum_largitionum_desc: "The Count of Sacred Largesses administers the imperial treasury, controls the mints, collects taxes, and manages state expenditures."

 k_minister_quaestor_sacri_palatii: "Quaestor Sacri Palatii"
 k_minister_quaestor_sacri_palatii_adj: "Quaestorial"
 k_minister_quaestor_sacri_palatii_desc: "The Quaestor of the Sacred Palace is the chief legal officer, responsible for drafting imperial legislation and managing judicial appointments."

 k_minister_comes_domesticorum: "Comes Domesticorum"
 k_minister_comes_domesticorum_adj: "Domestic"
 k_minister_comes_domesticorum_desc: "The Count of the Domestics commands the Protectores Domestici, the elite imperial bodyguard and staff officers, overseeing internal military security and the training of future commanders."

 k_minister_primicerius_notariorum: "Primicerius Notariorum"
 k_minister_primicerius_notariorum_adj: "Notarial"
 k_minister_primicerius_notariorum_desc: "The Chief Notary oversees the imperial records office, manages ceremonial protocol, and coordinates religious affairs with the patriarchate."

 k_minister_praefectus_urbi: "Praefectus Urbi"
 k_minister_praefectus_urbi_adj: "Urban"
 k_minister_praefectus_urbi_desc: "The Urban Prefect governs the imperial capital, overseeing public works, the grain supply, and urban administration."

 k_minister_magister_militum_praesentalis: "Magister Militum Praesentalis"
 k_minister_magister_militum_praesentalis_adj: "Military"
 k_minister_magister_militum_praesentalis_desc: "The Master of Soldiers is the supreme military commander, directing field armies and coordinating the defense of the empire's frontiers."

 k_minister_praepositus_sacri_cubiculi: "Praepositus Sacri Cubiculi"
 k_minister_praepositus_sacri_cubiculi_adj: "Cubicular"
 k_minister_praepositus_sacri_cubiculi_desc: "The Grand Chamberlain controls access to the Emperor's private chambers, oversees the palace eunuchs, and manages the Emperor's personal affairs and intelligence networks."


 k_minister_wre_praepositus_sacri_cubiculi: "Praepositus Sacri Cubiculi"
 k_minister_wre_praepositus_sacri_cubiculi_adj: "Cubicular"
 k_minister_wre_praepositus_sacri_cubiculi_desc: "The Grand Chamberlain controls access to the Emperor's private chambers, oversees the palace eunuchs, and manages the Emperor's personal affairs and intelligence networks."

 k_minister_magister_utriusque_militiae: "Magister Utriusque Militiae"
 k_minister_magister_utriusque_militiae_adj: "Military"
 k_minister_magister_utriusque_militiae_desc: "The Master of Both Services is the supreme military commander of the Western Empire, commanding both infantry and cavalry field armies and coordinating the defense of all frontiers."

 k_minister_wre_magister_officiorum: "Magister Officiorum"
