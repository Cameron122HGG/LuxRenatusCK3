 roman_imperial_ministry_appointment_succession_law_subname: "Candidate with the Highest Score Inherits"
 roman_imperial_ministry_appointment_succession_law_effects: "\n[succession|E] is based on [influence_level|E] and [candidate_score|E]\n\n#high A type of [appointment_succession_law|E]. $tfe_roman_imperial_appointment_succession_law$ is the succession for Roman ministerial [titles|E]. These are highly valued positions reserved for those of the highest [influence_levels|E]. Service, [influence|E], and patronage networks play a major role in increasing a candidate's [candidate_score|E].#!"
 roman_imperial_grand_marshal_appointment_succession_law: "Magister Militum Appointment"
 roman_imperial_grand_marshal_appointment_succession_law_subname: "$tfe_roman_imperial_military_appointment_succession_law_subname$"
 roman_imperial_grand_marshal_appointment_succession_law_effects: "\n[succession|E] is based on [prestige_level|E] and [candidate_score|E]\n\n#high A type of [appointment_succession_law|E] used by the highest Roman military offices, reserved for commanders of the greatest renown and proven [martial_skill|E]. Under $roman_imperial_grand_marshal_appointment_succession_law$, the [title|E] will be inherited by the candidate with the highest [candidate_score|E]. Score is primarily affected by [martial_skill|E], gaining [commander_traits|E], accumulating [prestige|E], or spending [influence|E].#!"
