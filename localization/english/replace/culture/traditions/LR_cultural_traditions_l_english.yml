l_english:
 lux_tradition_diadochi_kingship_name:0 "Diadochi Kingship"
 lux_tradition_diadochi_kingship_desc:0 "The Diadochi, the successors of Alexander the Great, established Hellenistic kingdoms across the former empire. They adopted and adapted many of the customs and traditions of the Macedonian and Greek cultures, blending them with local practices."
 lux_tradition_diadochi_phalanx_name:0 "Phalanx Warfare"
 lux_tradition_diadochi_phalanx_desc:0 "The Diadochi armies continued to employ the Macedonian phalanx formation, a dense grouping of infantry armed with long spears (sarissas). This formation was highly effective in battle, providing both offensive and defensive capabilities."
 lux_tradition_diadochi_cultural_fusion:0 "Cultural Fusion"
 
 lux_tradition_western_roman_name:0 "Western Roman Legacy"
 lux_tradition_western_roman_desc:1 "People of this culture uphold the legacy of the Western Roman Empire. They maintain Roman traditions, laws, and military practices, preserving the heritage of one of history's greatest empires."
 
 lux_tradition_tgp_sacral_harmony_name:0 "Sacral Harmony"
 lux_tradition_tgp_sacral_harmony_desc:1 "For centuries now Gauls, and Franks have lived in harmony. What some would call 'the fall of Gaul', in reality was just another step in a journey of many peoples, forming a melting pot together, and reaching greater cultural heights. May this peace last for as Long, as both Franks and Gauls stand."
 
 lux_tradition_tgp_sacred_chivalry_name:0 "Sacred Militarism"
 lux_tradition_tgp_sacred_chivalry_desc:1 "As Gauls had been tasked with running the bureaucracy, the Franks focused on their role of martial elite. For may Francia run free of threats, and injustice." 
 
 lux_tradition_tgp_sacral_peace_name:0 "Sacred Bureaucracy"
 lux_tradition_tgp_sacral_peace_desc:1 "While Franks served as the martial elite, Gauls served role just as prestigious - even if less glorious. Gauls had been largely running the administrative machine of the Sacred Realm, protecting it from threats internal." 
 
 lux_tradition_nile_name:0 "Children of the Nile"
 lux_tradition_nile_desc:1 "Inhabitants of Egypt - or 'Kemet', as the ancients called it - had always lived in harmony with the cycles of the Nile, allowing them to flourish as a one of the great civilizations."  
 
 culture_parameter_unlock_maa_western_roman:0 "Can recruit [GetMaA('funditores').GetName], [GetMaA('legionarii').GetName], [GetMaA('palatina').GetName], [GetMaA('baaallistarii').GetName] as [men_at_arms|E]"
 culture_parameter_roman_plaza:0 "Allow the construction of Roman Forum"
 funditores:0 "Funditores"
 legionarii:0 "Legionarii"
 palatina:0 "Vexillationes Palatinae"
 baaallistarii:0 "Ravenna Ballistarii"
 funditores_flavor:0 "Lightly armed slingers are not unique to the Roman Empire. Slingers have been powerful ranged units since ancient times, and the Empire's field troops have brought the slinger's ability to its full potential."
 legionarii_flavor:0 "The legionary runs through the entire history of the Roman Empire. After many reforms, when the eastern part gradually turned to cavalry tactics, the legionary was still the main force of the infantry-focused Western Empire."
 palatina_flavor:0 "The Roman Palace Guard originated from Diocletian's military reforms. It focused on protecting the direct military forces of the empire's rulers and was often used as a backup main force. Therefore, it was also called the Central Army."
 baaallistarii_flavor:0 "The Ravenna Crossbowman is the strongest ranged infantry of the Roman Empire. The pulley crossbow they use is also a high-level achievement of the empire's military technology. It is known as a ballista in the hand."

 tradition_ep3_roman_ceremonies_name: "Roman Ceremonies"
 tradition_ep3_roman_ceremonies_desc: "The emperors of the past have bestowed this culture with lingering grandeur, spectacular rites, an awe for the imperial office... and a public life rich with unrest."

 tradition_ep3_imperial_tagmata_name: "Eastern Roman Legacy"
 tradition_ep3_imperial_tagmata_desc: "Elite, well-armored regiments form the backbone of this culture's military campaigns. Their haughty troops have little regard for petty warrior nobles and reckless acts of personal valor; instead, they honor discipline and the hallowed names of their units. #EMP Exkoubitoi! Scholai! Hikanatoi!#!"

 tradition_ep3_palace_politics_name: "Palace Politics"
 tradition_ep3_palace_politics_desc: "Powerful eunuchs and silk-robed sycophants man a vast political apparatus, impressing with fineries, flattering with honors, and plotting viciously in the name of advancement."
 culture_head_court_grandeur_desc: "The [culture_head|E] does not have a [court_grandeur_level|E] of #high 8#! or higher"
 culture_parameter_unlock_akolouthos: "Can appoint the [GetCourtPositionType('akolouthos_court_position').GetName()] [court_position|E], when the Varangian Guard has been founded."

