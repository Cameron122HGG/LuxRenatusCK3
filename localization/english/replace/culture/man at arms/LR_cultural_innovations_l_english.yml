  #MaA
 # Lux Cultural MaA
 hoplite: "Hoplite"
 hoplite_flavor: "#F Veteran rural conscripts, defenders of the rocky passes, who use careful timing and local knowledge to harass even the mightiest of hosts.#!"

 peltast: "Peltast"
 peltast_flavor: "#F The tall #EMP skouton#! shields these infantry array against the foe is their namesake. Yet their chief virtue in battle is discipline, which affords them good order in both advance and retreat.#!"

 companion_guards: "Companion Guards"
 companion_guards_flavor: "#F These famed axe-wielding Germanic mercenaries are the unwavering core of the imperial host.\n\n@warning_icon! #X They will claim some [gold|E] after the Basileus's death.#!"

 legionary_cohort: "Legionary Cohort"
 legionary_cohort_flavor: "A foremost force of professional soldiers, the Cohort is the heart and soul of the roman imperial legions."
 
 legionary_cavalry: "Legionary Cavalry"
 legionary_cavalry_flavor: "Cavalry support is vital to all infantry work, even in the Legions."
 
 roman_ballista: "Ballista"
 roman_ballista_flavor: "Spear-sized bolts soar from these torsion-based machines into besieged settlements and enemy formations alike, causing fear and disorder."
 
 # Lux Icci Units #
 
 ##Roman##
 
 # Deprecated
 archer_auxilia: "Archer Auxilia"
 archer_auxilia_flavor: "Archer auxilia are supporting troops for the heavier legionary infantry, an important secondary role in Roman warfare. They are not expected to fight in hand-to-hand combat and are not given the war gear to do so for long; their job is to provide supporting fire."
 
 # Deprecated
 roman_principes: "Princeps"
 roman_principes_flavor: "Principes (sg.: princeps) were spearmen, and later swordsmen, in the armies of the early Roman Republic. They were men in the prime of their lives who were fairly wealthy, and could afford decent equipment. They were the heavier infantry of the legion."
 
 # Deprecated
 roman_hastati: "Hastati"
 roman_hastati_flavor: "Hastati (sg.: hastatus) were a class of infantry employed in the armies of the early Roman Republic, who originally fought as spearmen and later as swordsmen."
 
 # Deprecated
 roman_velites: "Velites"
 roman_velites_flavor: "Velites (sg.: veles) were a class of infantry in the Roman army of the mid-Republic from 211 to 107 BC. Velites were light infantry and skirmishers armed with javelins (Latin: hastae velitares), each with a 75cm (30 inch) wooden shaft the diameter of a finger."
 
 # Deprecated
 roman_triarii: "Triarii"
 roman_triarii_flavor: "Triarii (sg.: triarius) ('the third liners') were one of the elements of the early Roman military manipular legions of the early Roman Republic (509 BC - 107 BC). They were the oldest and among the wealthiest men in the army and could afford high quality equipment."
 
 roman_comitatenses: "Comitatenses"
 roman_comitatenses_flavor: "The comitatenses are the heirs of Rome's storied legions, heavily armored and mobile formations that act as the backbone of the Western Empire's military."
 
 roman_limitanei: "Limitanei"
 roman_limitanei_flavor: "Frontier soldiers serving at the edge of imperial territory, the limitanei have been the Western Empire's first line of defense for centuries."
 
 roman_foederatii: "Foederati"
 roman_foederatii_flavor: "The Foederati are Germanic auxiliaries and tribal allies of the Roman Empire - well-seasoned in its culture, its language, and above all in its ways of war."
 
 # Deprecated
 roman_equites: "Equites Promoti"
 roman_equites_flavor: "Since Rome's beginnings, as was common in almost all ancient societies, the noble class were the only people who could afford horses, and were therefore most likely to own one. As a result, early Roman armies fielded cavalry consisting entirely of nobles."
 
 roman_cataphractarii: "Catafractarii"
 roman_cataphractarii_flavor: "Covered head-to-foot in iron armour and armed with long lances, the catafractarii are the mailed fist of the imperial legions in the west."
 
 ##Egyptian##
 
 # Deprecated
 egypt_spearmen: "Egyptian Spearmen"
 egypt_spearmen_flavor: "The spear was used in Egypt since the earliest times for hunting larger animals, such as lions. In its form of javelin (throwing spears) it was replaced early on by the bow and arrow. Because of its greater weight, the spear was better at penetration than the arrow."
 
 # Deprecated
 egypt_infantry: "Egyptian Infantry"
 egypt_infantry_flavor: "Under the dynastic system of Egypt, infantry troops were composed of both conscripts and volunteer forces. Egyptian soldiers worked for pay, both natives and mercenaries."
 
 egypt_archers: "Egyptian Archers"
 egypt_archers_flavor: "The bow and arrow is one of ancient Egypt's most crucial weapons, used from pre-dynastic times through the Dynastic age and into the Christian and Islamic periods. The first bows were commonly 'horn bows', made by joining a pair of antelope horns with a central piece of wood."
 
 egypt_chariots: "War Chariots"
 egypt_chariots_flavor: "In ancient Egyptian society, primarily during the New Kingdom, chariotry stood as an independent unit in the king's military force. It is thought that chariots came to Egypt with the Hyksos people as a weapon around 1700 BCE."
 
  ##Iranian##
 
 # Deprecated
 iran_light_warriors: "Persian Brigade"
 iran_light_warriors_flavor: "The Persian war machine differed greatly from that of the west. Gone was the reliance on a backbone of columns and infantry; instead, the eastern empires fielded heavy cataphracts, drawn from the nobility, as their main strength."
 
 iran_warriors: "Daylamite Warriors"
 iran_warriors_flavor: "The Daylamites were an Iranian people inhabiting the Daylam — the mountainous regions of northern Iran on the southwest coast of the Caspian Sea, now comprising the southeastern half of Gilan Province."
 
 iran_immortals: "Immortals"
 iran_immortals_flavor: "The storied Persian Immortals serve in a dual capacity, operating as both an imperial guard and contributing to the ranks of the standing army."
 
 iran_bowmen: "Persian Bowmen"
 iran_bowmen_flavor: "Massed in large numbers, eastern archers could inflict heavy casualties, and the composite bows they carried afford them greater range, accuracy and power than many of their western counterparts. Constructed from a combination of wood, sinew and animal horn, the composite bow was far more effective than the traditional wooden or 'self' bow."
 
 kurdish_bowmen: "Kurdish Archers"
 kurdish_bowmen_flavor: "The origins of the Kurds are oft-speculated. One tale suggests they are the children of the Djinn, seraphic servants of King Solomon who remained on earth after their lord's death. Another legend states that the Kurds were founded by Melik Kurdim, a follower of Noah, after the biblical flood."
 
 iran_camel_riders: "Persian Camel Raiders"
 iran_camel_riders_flavor: "Camels have a number of advantages over horses: although notorious for their questionable temperament, they can be docile when handled correctly, and are generally less nervous. As desert creatures, camels also have greater stamina and can endure long periods without water. This offered a certain strategic flexibility to commanders, as long treks in arid conditions could then be undertaken."
 
 iran_cataphract: "Persian Cataphracts"
 iran_cataphract_flavor: "Eastern cavalry had Hellenic and Persian influences, with the more eastern states favouring the cataphract - heavy armour that protected both the rider and horse. The cataphract has its origins early in antiquity, in what is now Iran. Cataphract cavalry was designed to be a hammer in the tactical toolbox of eastern generals, penetrating enemy formations before outflanking and exploiting the resultant chaos."
 
 savaran_cavalry: "Elite Savaran Cavalry"
 savaran_cavalry_flavor: "The Savaran were a wide-ranging cavalry division under the Sassanid Empire, fielding horsemen from light skirmishes and horseback archers to heavy cataphracts. They were generally drawn from nobility, with the highest posts marked for those from the House of Sassan, and those of Parthian descent. They used a variety of weapons; the Parthian spear being the most famous, but also lances, swords, maces and axes."
 
 iran_war_elephant: "Armoured Indian Elephants"
 iran_war_elephant_flavor: "War elephants had to be trained like men and cavalry horses to endure the noise and chaos of battle. Indian war elephants were larger than their African counterparts and strong enough to carry a 'howdah', or small wooden tower, on their backs. The driver sat astride the beast’s neck while two men, armed with javelins, were in the howdah."
 
 ##Germany##
 
 alamannia_iron_riders: "Eisenritter"
 alamannia_iron_riders_flavor: "Based on the Roman cataphracts and the Frankish knights, these heavily armoured mounted noblemen can both act as lancers against infantry and swordsmen against other cavalry, making them a devastating tool on the battlefield."
 
 bavarian_auxilia: "Alpenmanner"
 bavarian_auxilia_flavor: "Recruited from among shepherds, herdsmen and ranchers in the remote valleys of the Alps, these light mountaineers serve as scouts and skirmishers, protecting their parent army against ambushes and potentially dangerous conditions."
 
 saxo_swordsmen: "Frilingi Swordsmen"
 saxo_swordsmen_flavor: "Saxon yeomen are known as Frilingi, Freeliners, and form a sort of middle class between the noble Edilinghui and the Lazzi peasants. Entitled by law to carry a sword, most of them cannot afford a longsword and prefer the traditional seax hunting sword, making them a potent if somewhat vulnerable unit in the field."
 
 franconian_cavalry: "Freiritter"
 franconian_cavalry_flavor: "The Franconian lands have plentiful grazing land for horses, which has enabled the growth of a noble cavalry class of freeholders, known as the Freiritter, Free Riders. Though not quite being able to afford as expensive arms and armour as their knightly counterparts to the West, a lord who can gather their number will still get a flexible cavalry force."
 
 rhinelander_cavalry: "Scarati"
 rhinelander_cavalry_flavor: "These armoured cavalrymen patrol the rich fields of the Rhineland, securing the wealth of the formerly Frankish lords from raiders from the east. Equipped to be flexible and face down both infantry and cavalry, they can quickly react to any emergency, and fill many roles on the field."
 
 frisian_militia: "Sealander Militia"
 frisian_militia_flavor: "While innovative solutions like great dikes have been proposed, the vast majority of the coastal population of the Frisian Sealands still live on terps, artifical mounds that rise above the swamplands. When regional defence is needed, every terp will provide a certain number of men for the militia, skilled in wetland wars."
 
 polabian_cavalry: "Svetojedici"
 polabian_cavalry_flavor: "These 'sacred' cavalrymen, consisting of particularly pious volunteers, serve as both an honour guard for holy idols and vicious opponents to their godless foes."
 
 sorbian_lupites: "Lupites"
 sorbian_lupites_flavor: "These lightly armed raider bands form around particularly charismatic or successful adventurers and veterans, and are motivated largely by hopes of plundering the enemy."
 
 ##Hellenistic Greece##
 
 # Deprecated
 greek_peltasts: "Light Peltasts"
 greek_peltasts_flavor: "These skirmishers were named for their small crescent-shaped leather or wicker shields or 'peltai'. It was a common habit to name troops for their shield style in the Greek world. They wore little or no armour and carried three javelins."
 
 # Deprecated
 greek_slingers: "Hellenistic Sphendonetai"
 greek_slingers_flavor: "Slingers were common in ancient armies. Slings are ancient weapons, dating back to Palaeolithic times. In comparison to bows, they were easy to make and had a greater effective range. Constructed from braided flax, hemp or rushes, a sling has a cradle where the shot is placed."
 
 # Deprecated
 citizen_hoplites: "Citizen Hoplites"
 citizen_hoplites_flavor: "Hoplites date back to the wars between the Greek city-states in the 8th and 7th centuries BC. During the Greco-Persian Wars most hoplites wore a Corinthian-style bronze helm, and a cuirass of bronze or stiffened linen or canvas. They were armed with a short sword and an iron-tipped spear with a bronze counterbalance butt-spike."
 
 # Deprecated
 militia_hoplites: "Militia Hoplites"
 militia_hoplites_flavor: "Hoplites date back to the wars between the Greek city-states in the 8th and 7th centuries BC. During the Greco-Persian Wars most hoplites wore a Corinthian-style bronze helm, and a cuirass of bronze or stiffened linen or canvas. They were armed with a short sword and an iron-tipped spear with a bronze counterbalance butt-spike."
 
 # Deprecated
 greek_hoplites: "Hoplites"
 greek_hoplites_flavor: "Hoplites date back to the wars between the Greek city-states in the 8th and 7th centuries BC. During the Greco-Persian Wars most hoplites wore a Corinthian-style bronze helm, and a cuirass of bronze or stiffened linen or canvas. They were armed with a short sword and an iron-tipped spear with a bronze counterbalance butt-spike."
 
 # Deprecated
 thorax_greek_hoplites: "Thorax Hoplites"
 thorax_greek_hoplites_flavor: "Hoplites were named, though, after the round hoplon shield they carried. The hoplon-and-spear combination required them to fight as a phalanx, a block of spearmen some eight ranks deep. When closed up, each man would find shelter behind the shield of his neighbour, creating a wall of bristling spear-points."
 
 royal_greek_hoplites: "Royal Hoplites"
 royal_greek_hoplites_flavor: "Chosen from only the most fit and honored men of their sovereign's army, Royal Hoplites carry the legacy of the Conqueror at the end of their pikes."
 
 royal_spartan_hoplites: "Spartiate Hómoioi"
 royal_spartan_hoplites_flavor: "Conditioned from the age of seven for a life on campaign, and dedicated to martial perfection, these elite Spartans are exceptionally well drilled and masters of their weaponry and equipment."
 
 # Deprecated
 greek_citizen_cavalry: "Hippeis"
 greek_citizen_cavalry_flavor: "The early Greek cavalry took roughly the same form throughout the city-states, being comprised of citizens able to afford and maintain a horse. After the Greco-Persian Wars, city-states such as Athens founded more permanent cavalry funded by annual grants. Right through the Peloponnesian War however, this volunteer cavalry continued to be few in numbers."
 
 greek_hippeus_cavalry: "Companion Cavalry"
 greek_hippeus_cavalry_flavor: "The Companions are noble heavy cavalry in imitation of the ancient Macedonians, equipped with the best horses, armor, and arms in their army."
 
 ##Eastern Romans##
 # Deprecated
 ere_slingers: "Sphendonetai"
 ere_slingers_flavor: "Rome liked to have the best of everything. When it came to skirmishers 'funditores', Latin for 'slingers', were recruited from among the best skirmishers in the reach of Rome to accompany its Legions on campaign as early as the Punic Wars, and later, in the Eastern Empire, they merged with the Hellenistic tradition of the Sphendonetai."
 
 # Deprecated
 ere_archers: "Toxotai"
 ere_archers_flavor: "From the very beginnings of its Empire, during the time of the Principate, Rome had fielded 'sagittarii' - archers, 'toxotai' in Greek - drawn from its subject peoples as auxiliaries to the Legions. As the centuries wore on, following several sets of reforms, almost all of them were folded into the Roman army proper."
 
 ere_crossbowmen: "Tzangratoroi"
 ere_crossbowmen_flavor: "Armed with hand-ballista beyond barbarian sophistication, the elite crossbowmen of the Eastern Empire loose heavy, piercing bolts to slay armored foes from range."
 
 # Deprecated
 ere_spearmen: "Kontaratoi"
 ere_spearmen_flavor: "Armed with spear and shield, the 'kontaratoi' formed the steady backbone of many Eastern Roman infantry formations. Semi-professional soldiers employed one third of the year, they were expected to hold firm in formation and anchor the line against cavalry and infantry assaults alike."
 
 # Deprecated
 ere_skutatoi: "Skutatoi"
 ere_skutatoi_flavor: "'Skutatoi' is a development of the Latin word 'scutum' - the classic Roman shield. The evolution of the Eastern Roman army saw the classic Roman infantry model evolve into 'skutatoi', a spear-and-shield infantry formation."
 
 # Deprecated
 ere_praeventores: "Prokoursatores"
 ere_praeventores_flavor: "Used as scouts, raiders, and advance troops, 'prokoursatores' specialized in screening the army and disrupting the enemy before battle was joined. Fast-moving and lightly equipped, they embodied the Byzantine preference for flexible and intelligent warfare."
 
 ere_foederatii: "Sýmmachoi"
 ere_foederatii_flavor: "Much like the Foederati in the West, these semi-Romanized tribal auxiliaries provide military service to the Eastern Empire in exchange for bread, coin, and plunder."
 
 # Deprecated
 ere_buccellarii: "Bucellarian Guard"
 ere_buccellarii_flavor: "After the 'Imperial Crisis' of the 3rd century AD, the Roman Empire found itself with no public policing, and so the administration of peace and justice in the cities became a military matter - for palatinae and the myriad Imperial guards."
 
 # Deprecated
 ere_horse_toxotai: "Hippo Toxotai"
 ere_horse_toxotai_flavor: "Specialist mounted units armed with bows who served as auxiliary units in the Roman army from the time of Augustus. This, like many adaptations made to the army's original model, was entirely due to contact with the powerful armies of the eastern empires."
 
 # Deprecated
 ere_equites: "Kavallarioi"
 ere_equites_flavor: "Horse-riding nobles, common in most ancient societies, had formed the backbone of Roman cavalry since the beginning of their rise to power. While the evolution of the Roman Empire led to most of the cavalry being formed of foreign auxilia or wealthy farmer part-time soldiers, the tradition of the Equites Promoti lived on in the units of Kavallarioi, privately-raised units of versatile horsemen used for reconnaissance, skirmishing, pursuit, and swift action across the battlefield."
 
 ere_mounted_buccellarii: "Boukellárioi"
 ere_mounted_buccellarii_flavor: "Drawing inspiration from Eurasian nomadic tactics and Hunnic mercenaries, the elite Boukellárioi are trained to be proficient with both the thrusting lance and the composite recurve bow."
 
 # Deprecated
 ere_clibanarii: "Klibanophoroi"
 ere_clibanarii_flavor: "'Klibanophoroi' were the ultimate blunt instrument on late Roman battlefields. Their name means 'camp oven' or 'metallic furnace', probably due to the amount of armour that covered both man and horse."
 
 ###End of Icci units###
 
 praetorian_cohort: "Praetorian Cohort"
 praetorian_cohort_flavor: "Hand-picked heavy infantry, the Praetorian Cohorts were the Imperial bodyguards, serving in military campaigns only when the Emperor himself was present."

  #Court Positions
 praetorian_prefect_court_position: "Praetorian prefect"
 praetorian_prefect_employer_custom_effect_description: "$BULLET$Increases [GetTrait('varangian').GetName( GetNullCharacter )] [GetCourtPositionType('bodyguard_court_position').GetName()] [aptitude|E] (based on [aptitude|E])\n$BULLET$More eligible [courtiers|E] gain the [GetTrait('varangian').GetName( GetNullCharacter )] and [GetTrait('loyal').GetName( GetNullCharacter )] [traits|E]\n$BULLET$More Varangians will appear\n@warning_icon! #X The Varangians will claim some [gold_i] Gold after the Basileus's death.#!"
 praetorian_prefect_court_position_desc: "The $praetorian_prefect_court_position$ is the supreme commander of the praetorian Guard."

  #Roman Traditions
 tradition_roman_legions_name: "Professional Soldiery"
 tradition_roman_legions_desc: "The romans emphasized that a farmer in battle worries about his crops; a soldier thinks of victory. This principle, alongside tatical flexiblity and several reforms troughout the centuries, forged one of the foremost military forces the world has ever seen: the Roman Legions."
 tradition_imperial_politics_name: "Imperial Politics"
 tradition_imperial_politics_desc: "In the Roman Empire, while power hungry generals often threatend to march their men towards the capital, within the palace walls treacherous courtiers schemed for influence. In this delicate balance of power, only strong and capable Emperors managed to preserve stability, while inept rulers brought the Empire to the brink of destruction."
 tradition_molded_architecture_name: "Moulded Architecture"
 tradition_molded_architecture_desc: "The romans believed that architecture should always be far more than one stone placed atop another. By perfecting concrete, a plentiful and cheap building material, they were able to build structures quickly, efficient and without the need for vast teams of skilled craftsmen."
 tradition_roman_ethics_name: "Mos Maiorum"
 tradition_roman_ethics_desc: "Mos Maiorum was the ancient unwritten code of values, principles and behavioural models that guided the roman way of living. It was one of the reasons why the romans considered themselves as Paragons of Civilization, guided by a mandate to subjulgate the barbarian and uncivilized cultures neighboring them."

 only_one_roman_military_tradition_allowed: "Only one roman militaristic [tradition|E] is allowed"
 only_one_roman_politics_tradition_allowed: "Only one roman politics [tradition|E] is allowed"
