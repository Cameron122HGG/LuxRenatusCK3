l_english:
 CONTROL_CURRENT_LEVEL:100 "#T Province Control: $VALUE|1$/100% #!"
 EFFECT_LIST_BULLET:0 "• " #Not sure if needed?
 GAME_DATE_STRING:100 "$DAY$ $MONTH$, $YEAR_LUX_GREG_IG$ $ERA_LUX_GREG_IG$"
 GAME_DATE_STRING_SHORT:100 "$DAY$ $MONTH_SHORT$, $YEAR_LUX_GREG_IG$ $ERA_LUX_GREG_IG$"
 GAME_DATE_STRING_LONG:100 "$DAY|O$ of $MONTH$, $YEAR_LUX_GREG_IG$ $ERA_LUX_GREG_IG$"
 GAME_DATE_STRING_SHORT_NO_YEAR:100 "$DAY$ $MONTH_SHORT$"

 YEAR_LUX_GREG_IG: "[Add_int32('(int32)-5000', '(int32)$YEAR$')]"
 ERA_LUX_GREG_IG: "[Select_CString(LessThanOrEqualTo_int32('(int32)$YEAR$', '(int32)5000'),Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR$', '(int32)5001'),'','B.C'),'A.D')]"
 BOOKMARK_DATE_STRING:100 "[GameSetup.GetSelectedDate.GetStringShortNoYear], $ERA_LUX_GREG_IG$ $YEAR_LUX_GREG_IG$"
 PICK_ANY_CHARACTER: "Play in the world of Lux Renata"

 ERA_LUX_GREG_DYNFOUND: "[Select_CString(LessThanOrEqualTo_int32( DynastyHouse.GetFoundYear, '(int32)5000'),'B.C.', Select_CString( GreaterThan_int32( DynastyHouse.GetFoundYear, '(int32)5001'),'A.D.', '' ))]"

# YEAR
 YEAR_LUX_GREG_DYNFOUND: "[Add_int32('(int32)-5000', DynastyHouse.GetFoundYear)]"

 HOUSE_VIEW_FOUNDED: "Founded in [Subtract_int32('(int32)5000', DynastyHouse.GetFoundYear)] [Select_CString(LessThanOrEqualTo_int32('(int32)$YEAR$', '(int32)5000'),Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR$', '(int32)5001'),'','B.C'),'A.D')] by [DynastyHouse.GetFounder.GetName]"
 HOUSE_LIST_FOUNDATION: "Founded in [Subtract_int32('(int32)5000', DynastyHouse.GetFoundYear)] [Select_CString(LessThanOrEqualTo_int32('(int32)$YEAR$', '(int32)5000'),Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR$', '(int32)5001'),'','B.C'),'A.D')]"

 ERA_LUX_GREG_IG_FRONTEND_BOOKMARK: "[Add_int32('(int32)-5000', '(int32)$YEAR$')], [Select_CString(LessThanOrEqualTo_int32('(int32)$YEAR$', '(int32)5000'),Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR$', '(int32)5001'),'','B.C'),'A.D')]"
 YEAR_LUX_GREG_IG_FRONTEND_BOOKMARK: "[Add_int32('(int32)-5000', '(int32)$YEAR$')]"