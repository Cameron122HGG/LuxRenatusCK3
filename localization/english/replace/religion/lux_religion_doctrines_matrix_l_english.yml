 LR_doctrine_soul_name:0 "Muhammad's Succession"
 LR_doctrine_soul_desc:0 "The question of who is Muhammad's rightful successor as the spiritual leader of the Muslim community is an essential one."
 LR_doctrine_statist_soul_name:0 "Statist Soul"
 LR_doctrine_statist_soul_desc:0 "This faith believes that the religious institution should be closely tied to the state."
 LR_doctrine_martial_soul_name:0 "Martial Soul"
 LR_doctrine_martial_soul_desc:0 "This faith emphasizes the importance of military prowess and valor in its teachings."
 LR_doctrine_populist_soul_name:0 "Populist Soul"
 LR_doctrine_populist_soul_desc:0 "This faith prioritizes the needs and desires of the common people in its teachings."
 LR_doctrine_scholarly_soul_name:0 "Scholarly Soul"
 LR_doctrine_scholarly_soul_desc:0 "This faith values knowledge, learning, and intellectual pursuits as central to its beliefs."
 LR_doctrine_messianic_soul_name:0 "Messianic Soul"
 LR_doctrine_messianic_soul_desc:0 "This faith holds a belief in a future savior or messiah who will bring about a new era of peace and righteousness."
 LR_doctrine_traditional_soul_name:0 "Traditional Soul"
 LR_doctrine_traditional_soul_desc:0 "This faith emphasizes the importance of maintaining long-standing traditions and customs in its practices."
 LR_doctrine_clerical_soul_name:0 "Clerical Soul"
 LR_doctrine_clerical_soul_desc:0 "This faith places a strong emphasis on the role of the clergy and religious leaders in guiding the community."