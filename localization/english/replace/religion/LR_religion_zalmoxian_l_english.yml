 zal_mani_adherent:0 "Apogenesian"
 zal_mani_adherent_plural:0 "Apogenesians"
 zal_mani_desc:0 "The Apogenesianists ('Twice Born') are a Local Graeco-Roman sect of Martial Soul, with strong Gnostic influences. It is a heretical sect of Zalmoxism in which adherents believe that through valor in battle, they shall ascend into heaven with Zalmoxis, regardless of their quality of life."