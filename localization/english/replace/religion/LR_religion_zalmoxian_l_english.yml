 # Zalmoxism
 zal: "Zalmoxism"
 zal_adj: "Zalmoxian"
 zal_adherent: "Zalmoxist"
 zal_adherent_plural: "Zalmoxists"
 zal_desc: "The cult of Zalmoxis is a Mainstream Graeco-Roman religion of Martial Soul. Zalmoxism is a henotheistic faith focused primarily upon the worship of Zalmoxis, a Thracian disciple of Pythagoras. Following his tutelage, he opened a school in Samos teaching the science of the skies, and thereafter returned to his native people, the Getae, to teach them about the immortality of the soul. The Getae absorbed his teachings into their understanding of the divine, and upon his passing declared him to have joined the gods. For Zalmoxis was wise and virtuous, and in his own words, death was merely a change of country. The Dacian king Burebista and his high priest Decaeneus further codified the Zalmoxian faith in their efforts to forge a united realm to rival that of the Romans and Greeks, drawing from the Orphic Mysteries and the heroic myths of the Thracian peoples. What emerged was a mystical warrior cult, whose adherents laugh in the face of even the fiercest odds. His most devoted followers loose burning arrows into the sky on the eve of battle to honor his ascent to the heavens, and make pilgrimage within caves for three days before emerging, just as Zalmoxis did for three years to illuminate his people on the nature of death and rebirth. Most famous among their rituals, however, is the offering of living souls to Zalmoxis as messengers, who are sent to him on a bed of spears."
 zal_old: "Old Zalmoxianism"
 zal_old_adj: "Old Zalmoxian"
 zal_old_adherent: "Old Zalmoxian"
 zal_old_adherent_plural: "Old Zalmoxians"
 
 # Zalmoxian Christianity
 zal_christ: "Decaeneism"
 zal_christ_adj: "Decaeneist"
 zal_christ_adherent: "Decaeneist"
 zal_christ_adherent_plural: "Decaeneists"
 zal_christ_desc: "The cult of Christos-Zalmoxis is a Local Graeco-Roman sect of Martial Soul, with strong Christian influences. A heretical branch of the Zalmoxist faith, its believers think that Jesus of Nazareth was an incarnation of the second coming of Zalmoxis, and his teachings should be accepted as well as Zalmoxis."

