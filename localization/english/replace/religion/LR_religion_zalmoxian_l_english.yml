 zal:0 "Zalmoxism"
 zal_adj:0 "Zalmoxian"
 zal_adherent:0 "Zalmoxist"
 zal_adherent_plural:0 "Zalmoxists"
 zal_desc:0 "The cult of Zalmoxis is a Mainstream Graeco-Roman religion of Martial Soul. A monotheistic religion worshipping Zalmoxis, a man who was believed to be a disciple (or slave) of Pythagoras. After massing wealth, he opened a school in Samos teaching the science of the skies. After this, he returned to his native people - the Getae - and taught them about the immortality of the Soul. After his death, the Getae turned his teachings into a religion, and this is Zalmoxism. Some of the key components of Zalmoxism include the firing of arrows to the sky (honoring Zalmoxis' ascent to the heavens) and pilgrimage inside a cave (symbolic of Zalmoxis' journey inside a cave for three days, the opening symbolizing death symbolizing rebirth)."
