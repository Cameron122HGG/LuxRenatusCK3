 kemetic_religion_desc:0 "The Kemetic pantheon was one of the oldest  practiced religions, dating back to somewhere in prehistory, but concretely coming into archeological record as early as the foundation of the first dynasty of Egypt. The Kemetics believed in a very complex cosmology and afterlife, with the Pharaohs acting as the gods' representative on earth."
