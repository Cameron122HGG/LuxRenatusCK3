 amun_desc:0 "The cult of Amun is a Reformed Mainstream Archaic Egyptian religion of Statist Soul. The faith focuses on Amun-Ra as the king of the gods of Egypt. The faith is a polytheistic faith, and while Amun-Ra is considered the king of the gods, the other Egyptian deities are also worshipped."

