llyrian_religion: "Illyrian Paganism"
illyrian_religion_adj: "Illyrian Pagan"
illyrian_religion_adherent: "Illyrian Pagan"
illyrian_religion_adherent_plural: "Illyrian Pagans"
illyrian_religion_desc: "The various religious practices of the peoples of Illyria, combining the native religion of the area with strong Greco-Roman and Celtic influences."

illyrian_pagan: "Odha Theltatë"
illyrian_paganism_adj: "Theltatic"
illyrian_paganism_adherent: "Odhëtar"
illyrian_paganism_adherent_plural: "Odhëtars"
illyrian_paganism_desc: "The Way of the Hidden Things is the most common way to practice the ancient religion of the Illyrians. Called the Mysteria Illyrica by the Romans or the Katábasis Zagréōs, the Descent of Zagreus, by the Greeks, it is a series of mysteric rites and initiations with the goal of accessing the Realm of the Blessed, where the dead rest in eternal observance and judgement of the living. It is the dead ancestors of one's family that judge the quality of one's soul, and its place in the Blessed Isles, atop the Orturra, the Tower Beyond, closer to the Sun, or to the cold damp depths beneath the Tower. The Rites of Initiation are varied but most of the adherents of the Way agree that there are several circles one must progress through to achieve a greater communion with one's ancestors, eventually speak with them and glimpse snippets of the past and the future through visions and dreams. Each circle is governed by one of the gods accepted by all Illyrians, from Patnja, Bindos and Metauros to Zis (Zeus), Mithras and Erkele (Herakles). One accesses some circles at specific moments in life (adulthood, marriage, parenthood or acquiring a certain amount of heads of cattle) but the higher circles of the Spiral Gate can only be entered by the most dedicated and enlightened. Sacrifice, procession and honoring the ancestors is part of the daily ritual to facilitate communion with the dead, but purification of the soul is considered the best way to peer through the Veil, and those who have attained such communion, the Vekterët or Speakers, are the most revered members of the community."

