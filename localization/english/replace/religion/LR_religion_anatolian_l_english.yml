 tarhunt: "Tarhunt"
 tarhunt_adj: "Tarhuntite"
 tarhunt_adherent: "Tarhuntite"
 tarhunt_adherent_plural: "Tarhuntites"
 tarhunt_desc: "The worship of Tarhunt is a Local Archaic Hittite religion of Martial Soul. At the time of the reformation of the Luwian faith by the Isaurian emperor Leo III in the 8th century, frontier areas of the client-kingdom of Isauria followed a slightly different interpretation, originating from their long experiences of defending their realm against the threat of assertive neighbors. While recognizing the Sun Goddess Arinniti, they focus their attention on Tarhunt, the god of sky and storm, holding a triple thunderbolt and a double-headed axe, slayer of the evil dragon Illuyanka. Worshippers of Tarhunt consider themselves as the holiest of all Luwian, the first line of defense of their ancient civilization."

 illuyanka: "Illuyanka"
 illuyanka_adj: "Illuyankite"
 illuyanka_adherent: "Illuyankite"
 illuyanka_adherent_plural: "Illuyankites"
 illuyanka_desc: "The cult of Illuyanka is a Heretical Archaic Hittite faith of Traditional Soul. According to ancient Hittite legend, the sky god Tarhunt defeated the serpent dragon Illuyanka in battle and emerged as the supreme divine entity. As the Isaurian Emperor Leo III reformed the beliefs of the Chosen People of Light (the Luwians) to adapt the creed to his imperial agenda, some remote communities led by Leo III's own bastard daughter resisted the changes brought by the religious reforms. Their doctrinal opposition went so far at to defy orthodox Luwian dogma by claiming that the dragon Illuyanka actually vanquished Tarhunt and emerged as the supreme divine entity, guiding his followers through the ages of darkness to come. Illuyankan worshippers maintain isolated, secretive, and defiant communities, resistant towards the external world - Luwian or else."