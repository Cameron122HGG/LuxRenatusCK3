maher_old_adj: "Old Maherite"
maher_old_adherent: "Old Maherite"
maher_old_adherent_plural: "Old Maherites"

beelshamen: "Beelshamênism"
beelshamen_adj: "Beelshamêni"
beelshamen_adherent: "Beelshamêni"
beelshamen_adherent_plural: "Beelshamênis"
beelshamen_desc: "The worship of Beelshamên is a Mainstream Canaanite religion of Statist Soul. The antiquity of the worship of the god or gods of Baal extends back to the Bronze Age among the ancient Semitic peoples. The word Baal means 'master' or 'owner': Baal was once common a name of small Syrian and Persian deities. The Great Baal is the Canaanite god of storm and heavens, worshipped primarily in Palmyra and antique Carthage. In the 1st century, the Palmyran religion focused increasingly on the trio constituted by the supreme god Beelshamên, the lunar god Aglibôl, and the sun god Malakbêl. Beelshamên leads the triad: as the lord of heaven, he commands both the moon and the sun. Beelshamên was thus fervently prayed to for the protection of livestock and crops, as he is responsible for sun and rain, as well as droughts, plagues, and other calamities. The ancient religion acquired a new dimension in the 3rd Century as strong monotheist trends coalesced in the cult of Beelshamên during the glorious times of the short-lived Palmyrene Empire. In 260, with the Roman Empire in crisis, Odaenathus and his wife Zenobia, rulers of Palmyra, carved a vast Middle Eastern empire through a series of rapid and successful campaigns and ambitious foreign policies, conquering Syria, the Persian capital Ctesiphon and Egypt. As part of their empire-building efforts, they developed religious pride among their subjects by controlling the clergy and equating Beelshamên with Roman Sol Invictus and Persian Ahura Mazda. Beelshamên's attributes, the eagle and the lightning bolt, became the symbols of the new State as expression of unchallenged authority wherever Palmyrene arms imposed its dominion. Both sovereigns made an explicit parallel between their exceptional deeds and Beelshamên's supremacy among other, lesser gods, claiming supremacy over lands worshipping other Canaanite or Phoenician deities. While the old Palmyrene Empire failed in its ambitious dream of gathering all Eastern cults into one, the memory of its glory is alive. The cult of Beelshamên retains a strong mystical aura in the lands once Palmyran and beyond."
beelshamen_old: "Old Beelshamênism"
beelshamen_old_adj: "Old Beelshamêni"
beelshamen_old_adherent: "Old Beelshamêni"
beelshamen_old_adherent_plural: "Old Beelshamênis"