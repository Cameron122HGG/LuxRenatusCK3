aglibol: "Aglibôl"
aglibol_adj: "Aglibôli"
aglibol_adherent: "Aglibôli"
aglibol_adherent_plural: "Aglibôli"
aglibol_desc: "The worship of Aglibôl ('Calf of Baal') is a Local Canaanite religion of Messianic Soul. Aglibôl is depicted with a lunar halo decorating his head and sometimes his shoulders, and one of his attributes is the sickle moon. The worship of Aglibôl is traditionally strongly associated with Beelshamên's. In the first century, the Palmyran religion focused increasingly on the trio constituted by the supreme god Beelshamên, the sun god Malakbêl, and the lunar god Aglibôl. Aglibôl was worshipped due to his shadow providing refuge from the sun and his moisture making desert orchards bloom in the early morning. Aglibôl is said to wage a continuous war against his brother Malakbêl, whereby their father Beelshamên keeps a neutral stance, thus the cycle of day and night. Then came the time of the glorious Palmyrene Empire in the 3rd Century. The Emperor Odaenathus and his wife Zenobia conquered Syria, the Parthian capital and Egypt, worshiping Beelshamên in an increasingly monotheistic fashion as a reflection of their own absolute dominion of the lands of men. The new religious doctrine elevated Beelshamên as a rival of Sol Invictus, Ahura Mazda, and Yahweh. In this evolving cult, the new Palmyrene state attempted to merge the personality of all lesser gods, including Aglibôl, in the overwhelming figure of Beelshamên. Sacrifices to Aglibôl were forbidden, and his statues and other representations were removed from the main temples. This only led to Aglibôl acquiring a new spiritual appeal. Discontented nobles and their clerical allies, who perceived absolute monarchy and monotheism as threats to their influences, consciously adhered to the worship of Aglibôl as a shadow cult, secretly gathering opponents to the new regime. As the ephemeral Empire collapsed, the followers of Aglibôl acquired more freedom and developed their own cult further, maintaining a veil of occult mystery around it to better infiltrate the official Beelshamêni clergy. Aglibôlis prophesize that the time will come when the moon god will vanquish the arrogance of the other gods, topple Beelshamên as Lord of the Heaven and reward those who kept the faith through the long night."
aglibol_old: "Old Aglibôl"
aglibol_old_adj: "Old Aglibôli"
aglibol_old_adherent: "Old Aglibôli"
aglibol_old_adherent_plural: "Old Aglibôlis"

allat: "Al-lat"
allat_adj: "Al-lati"
allat_adherent: "Al-lati"
allat_adherent_plural: "Al-latis"
allat_old: "Old Al-lat"
allat_old_adj: "Old Al-lati"
allat_old_adherent: "Old Al-lati"
allat_old_adherent_plural: "Old Al-latis"
allat_desc: "The wprship of Al-lat and her sisters is a Local Arabic religion of Traditional Soul. A henotheistic cult worshipping Al-lat, an Arabian goddess of light and life, as a primary deity, it also honors her two sisters: Al-'Uzzá, goddess of love and beauty, and Manat, goddess of destiny and death. Their cultists believe that by keeping the traditions of their goddesses, they may convince the three sisters to maintain the balance between life, fertility, and death. Although her worship once spread as far afield as Palmyra and Nabataea, the rise of the Islamic caliphates in the 7th century saw Al-lat's holiest site at Ta'if destroyed and her cultists scattered to the winds, leaving the cult of the three goddesses to languish at the periphery of Sabaean worship. Diminished as they are, the people have not forgotten them, and their priests and priestesses continue making their offerings and prayers where the old ways yet hold firm."

malakbel: "Malakbêl"
malakbel_adj: "Malakbêlite"
malakbel_adherent: "Malakbêlite"
malakbel_adherent_plural: "Malakbêlites"
malakbel_desc: "The worship of Malakbêl ('Messenger of Baal') is a Local Canaanite religion of Traditional Soul. The worship of Malakbêl is traditionally strongly associated with Beelshamên's. In the 1st century, the Palmyran religion focused increasingly on the trio constituted by the supreme god Beelshamên, the lunar god Aglibôl, and the sun god Malakbêl. Then came the time of the glorious Palmyrene Empire in the 3rd century. The Emperor Odaenathus and his wife Zenobia conquered Syria, the Parthian capital and Egypt, worshiping Beelshamên in an increasingly monotheist fashion as a reflection of their own absolute dominion of the lands of men. The new religious doctrine elevated Beelshamên as a rival of Sol Invictus, Ahura Mazda and Yahweh. In this evolving cult, the new Palmyrene State attempted to merge the personality of all lesser gods, including Malakbêl, in the overwhelming figure of Beelshamên. Sacrifices to Malakbêl were forbidden, and his statues and other representations were removed from the main temples. However, many lay people and lower clergymen, confused by these dramatic changes, continued addressing their prayers to Malakbêl and made their best to keep some smaller representations for worship. Beelshamêni nobles and high priests turned a blind eye, for as the Romans identified Malakbêl with their own Sol Invictus, Beelshamêni authorities viewed the cult of Malakbêl as a potential vector for religious propaganda. More importantly, they did not perceive worshipers of Malakbêl as open challengers of the Beelshamên supremacy, as made explicit by the god's name itself. As the Empire collapsed and Palmyra returned to the status of petty kingdom, people nostalgic of the pluralist pantheon of old continued worshiping Malakbêl with little opposition from the mainstream clergy. Through the figure of Malakbêl, his followers worship the whole pantheon all lesser gods threatened of oblivion and hope to maintain the ways of living of simpler times alive."
malakbel_old: "Old Malakbêl"
malakbel_old_adj: "Old Malakbêlite"
malakbel_old_adherent: "Old Malakbêlite"
malakbel_old_adherent_plural: "Old Malakbêlites"

