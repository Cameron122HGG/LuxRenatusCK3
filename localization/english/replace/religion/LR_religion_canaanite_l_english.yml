shams: "Shams"
shams_adj: "Shamsi"
shams_adherent: "Shamsi"
shams_adherent_plural: "Shamsis"
shams_old: "Old Shams"
shams_old_adj: "Old Shamsi"
shams_old_adherent: "Old Shamsi"
shams_old_adherent_plural: "Old Shamsis"
shams_desc: "The worship of Shams is a Mainstream Arabic faith of Clerical Soul. It represents the native religious traditions of the Arabic peoples, who venerate the gods of the Sun, the Moon and other Celestial Objects, as well as many other deities, such as patron gods of familiar clans and cities and a plethora of minor local divinities and spirits. Named after Shams, the Arabic sun goddess at the head of the pantheon, other important gods include Ta'lab the moon god, the goddess triad of Al-lat, al-Uzza and Manat, Wadd the god of water, love and fertility, and 'Attar the god of war and the morning star. Like other native Semitic faiths, it has a strict priesthood composed of both male and female priests, which tend to the temples and perform rites of astrology vital to contact, worship and interpret the will of the gods. Many soothsayers, oracles and astrologers are as well consulted by the common folk to consult the gods for their fortune."

hadad: "Hadad"
hadad_adj: "Hadadi"
hadad_adherent: "Hadadi"
hadad_adherent_plural: "Hadadis"
hadad_old: "Old Hadad"
hadad_old_adj: "Old Hadadi"
hadad_old_adherent: "Old Hadadi"
hadad_old_adherent_plural: "Old Hadadis"
