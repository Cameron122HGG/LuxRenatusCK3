#Faiths
almaqah: "Almaqah"
almaqah_adj: "Almaqahi"
almaqah_adherent: "Almaqahi"
almaqah_adherent_plural: "Almaqahis"
almaqah_old: "Almaqahi Old Rite"
almaqah_old_adj: "Almaqahi Old"
almaqah_old_adherent: "Old Almaqahi"
almaqah_old_adherent_plural: "Old Almaqahis"
almaqah_desc: "The worship of Almaqah is a Mainstream Arabic religion of Clerical Soul. Almaqah is the great protector and sole patron god of the Sabaeans. His veneration is especially strong among the Mukarribs, the unifier kings of Saba, so much that they even call themselves the children of Almaqah and claim direct descent from him. The greatest temple of Almaqah is the huge temple of Awam near Ma'rib, the Sabaean capital. The temple is tended by his priesthood, who perform rites, bless newborns and receive the offerings that are to be placed on Almaah's shrine. A common offering to thank Almaqah usually consist on placing incense or little bronze figurines at his shrines to thank Him for past fortunes and to ask for more fortunes in the future. The rich often order their servants to make steles, statuettes or bronze plates adorned with many different animals, symbols and most importantly an inscription in which they thank Almaqah, the steles are later to be placed at the local temples. However Almaqah is more than a protector god, he is also a god of fertility. He is the god of seasonal rain, and hence very important to the Sabaeans, as they pride themselves in their agricultural methods. Other aggressive natural phenomena, such as storms and thunders are associated to him as well, and not unlike Ba'al Hadad and other Near Eastern deities, have made his totem animal the bull, though more often, in his shrines one can find depictions of ibexes and mountain goats which are as well associated with the father of the Sabaeans . When Southwestern Arabia was unified by the Mukarrib kings of Saba, they ordered the temples and statues dedicated to other gods, such as 'Attar, Ta-lab or Shams, to be destroyed and replaced by shrines and temples dedicated to Almaqah, establishing their supremacy as unifier kings of the new Sabaean federation. Since then, the glory of Almaqah has made the Sabaeans into a thriving metropolitan culture, and His protective influence has been able to withstand and even turn back the might of Islam at its height."

hubal: "Hubal"
hubal_adj: "Hubali"
hubal_adherent: "Hubali"
hubal_adherent_plural: "Hubalis"
hubal_old: "Old Hubal"
hubal_old_adj: "Old Hubali"
hubal_old_adherent: "Old Hubali"
hubal_old_adherent_plural: "Old Hubalis"
hubal_desc: "The cult of Hubal is a Heretical Arabic faith of Traditional Soul. Hubal, one of the main deities of the Arabian religious traditions, is a god of fertility, rain, war, and agriculture. Shrines to Hubal were once common across the Arab world, with a typical altar to Hubal consisting of his idol being placed upon a platform above a sacred well. Though once a pluralistic sect in keeping with the rites of other Arab pagans, the rise of Islam and their violent expulsion from their lord's greatest and most holy shrine at the Ka'ba has seen the Hubali priesthood adopt more zealous doctrines in the struggle to preserve their faith, chiefly their shift to a monotheistic worship of Hubal. The following centuries spent in mountain exile have made them callous to the whims of the southern Mukarribs and ever more bitter to the Muslims, against whom they continue to swear revenge. For the Hubalis yet envision the day when they may repay the dishonor inflicted upon them by the followers of Mohammed, scattering his followers to the desert winds and worshipping at the Ka'ba once more!"

palmyran_pagan: "Elohim"
palmyran_pagan_adj: "Elohimi"
palmyran_pagan_adherent: "Elohimi"
palmyran_pagan_adherent_plural: "Elohimis"
palmyran_pagan_old: "Old Elohim"
palmyran_pagan_old_adj: "Old Rite Elohimi"
palmyran_pagan_old_adherent: "Old Elohimi"
palmyran_pagan_old_adherent_plural: "Old Elohimis"
palmyran_pagan_desc: "The worship of the Elohim ('Gods') is a Local Canaanite faith of Traditional Soul. It refers to the religious traditions of the Canaanite, Phoenician and Nabatean peoples. It is mainly polytheistic, with some monolastic (recognizing many gods, but worshipping one or a few) tendencies. The main gods of the Elohimi pantheon are Ba'al Hadad, god of storms and king of the gods, Ashtart, goddess of fertility and war, Melqart, king of cities and god of merchants, and Eshmun, the god of healing, but it also includes many local Nabatean deities, and patron gods of Canaanite and Phoenician city states."

attar: "Attar"
attar_adj: "Attari"
attar_adherent: "Attari"
attar_adherent_plural: "Attaris"
attar_old: "Old Attar"
attar_old_adj: "Old Attari"
attar_old_adherent: "Old Attari"
attar_old_adherent_plural: "Old Attaris"
attar_desc: "The worship of Attar is a Local Arabic religion of Martial Soul. Attar is a divinity of the south Arabian pantheon, and is their original god of thunderstorms and rain. 'Attar is the 'God of Thunder' and is often known by the epithet 'Shariqan', or 'the Eastern god' after the morning position of the planet Venus: he is a vengeful god as well, who is invoked against the desecrators of graves. He exercises a double function: he is both a dispenser of fertility and a patron of war. The main rite to honor him is the ritual gazelle hunt. 'Attari rulers conduct these ritual hunts mainly for the purpose of obtaining rain, which explain why the gazelle is 'Attar's animal attribute. Before the unification of southern Arabia by the Mukarribs (Unifier Kings) of Saba, he used to be the main god of the local pantheon, above all the local tribes' patron gods, and was often invoked to preside in deals between them. During the Sabaean unification, the Almaqahi Mukarribs displaced him as the main god, in some cases, forcibly destroying his temples, sacred sites and killing 'Attar's priests, in order to establish the supremacy of Saba and its protector, Almaqah. The Almaqahi priesthood demonized 'Attar as a savage and uncivilized god, whose unpredictable rain made Sabaean agriculture impossible to prosper, as opposed to Almaqah, the patron of artificial irrigation. Some of 'Attar's most fervent followers choose to sail away to the south, to Ethiopia, rather than submit to the Sabaeans. There, the cult of 'Attar suffered a transformation: to prevent massacres like those perpetrated by the Sabaeans, now every priest would have to master the use of the spear, 'Attar's sacred weapon, upon acceptance into the priesthood, and 'Attar's war god aspect would be emphasized over his agricultural side. Now, 'Attar's reformed martial priesthood, unbent and unbroken, are poised to reclaim southern Arabia in a storm of war and sand, for the glory of Attar."

talab: "Ta'lab"
talab_adj: "Ta'labi"
talab_adherent: "Ta'labi"
talab_adherent_plural: "Ta'labis"
