 #Cult of Amun-Ra
 amun:0 "Amunism"
 amun_adj:0 "Amunite"
 amun_adherent:0 "Amunite"
 amun_adherent_plural:0 "Amunites"
 amun_desc:0 "The cult of Amun is a Mainstream Archaic Egyptian religion of Statist Soul. The faith is a polytheistic one, and while Amun-Ra is considered the king of the gods, the other Egyptian deities are also worshiped. Some of the more popular divinities are Hathor, Isis, Osiris, Set, Bast, Ra, and Horus. In daily life most of the rituals revolve around the Nile River, where it is common for many farmers to provide offerings to Osiris for a good harvest. The calendar is likewise arranged according to the ebb and flow of the Nile. One of the central features of the Amunite faith is the relation between the living and the dead. Death festivals are common, but the dead are considered to be in a happy blessed land, and can come and visit the living from time to time and effect their descendants for good or ill. Thus the ancestors, or 'Akhu', are given offerings just like the gods. A final central tenet is Ma'at, the overriding ethical and moral teachings of truth, honor, justice, harmony, and above all balance. All are expected to uphold Ma'at, from the lowliest of peasants to mighty Pharaoh. If Pharaoh himself should go against these principles, then disorder and ruin are bound to befall the kingdom."

 amun_old:0 "Old Amunite"
 amun_old_adj:0 "Old Amunite"
 amun_old_adherent:0 "Old Amunite"
 amun_old_adherent_plural:0 "Old Amunites"
 amun_old_desc: "The cult of Amun is a Reformed Mainstream Archaic Egyptian religion of Statist Soul. The faith focuses on Amun-Ra as the king of the gods of Egypt."
 
 amun_religious_head_title:0 "Pharaoh"
 amun_divine_realm:0 "Duat"
 amun_religious_symbol:0 "Eye of Amun"
 amun_religious_text:0 "Book of the Dead"
 
 aten:0 "Atenism"
 aten_adj:0 "Atenist"
 aten_adherent:0 "Atenist"
 aten_adherent_plural:0 "Atenists"
 aten_desc:0 "The cult of Aten is a Heretical Archaic Egyptian faith of Martial Soul. The faith is monotheistic focusing the worship on the god Aten, the Solar Disk. It grew out of secret cults that stayed true to the religious reforms that Pharaoh Akhenaten started. In daily life they tend to focus on hymns to the Sun Disk Aten. Unlike other Egyptian faiths they do not practice offerings. They sing praises to Aten, but he does not require any offerings from humans. They have a strong warrior and community ethic as they had to band together to avoid persecution." 
 
