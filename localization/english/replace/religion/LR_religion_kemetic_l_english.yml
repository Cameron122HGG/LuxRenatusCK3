 #Isisism
 isis:0 "Isetism"
 isis_adj:0 "Isetite"
 isis_adherent:0 "Isetite"
 isis_adherent_plural:0 "Isetites"
 isis_desc:0 "The cult of Isis is a Local Archaic Egyptian faith of a Clerical Soul. The faith is a henotheistic faith that primarily worships Isis. It also worships Horus and Osiris and other family members of Isis, and to an even lesser degree the other Egyptian gods. The faith grew out of the Isetite and Osirion Mystery cult. In daily life the focus of the religion is on the priests which hold great influence. Unlike other faiths, the clergy of the Isetite faith are all women. It is considered prestigious for a daughter to join the clergy of the faith. The festivals and rituals center around Isis and her family, they often involve music, singing hymns and dancing. They also follow a dietary restriction of never eating fish or pork as those animals are considered sacred to the Isetite faith."
