 #Setitism
 set:0 "Setitism"
 set_adj:0 "Setite"
 set_adherent:0 "Setite"
 set_adherent_plural:0 "Setites"
 set_desc:0 "The cult of Set is a Heretical Archaic Egyptian faith of Messianic Soul, with strong Saharan influences. The cult is henotheistic in nature, honoring Set, but also focusing on His family, particularly Nephthys, Anat, and Astarte (who was imported by the Canaanites), who are the three wives of Set, and Set's son Anubis. Set is viewed as a positive force, a god who brings about change. In their narrative, Set did not murder Osiris but helped him die in order to become the king of the dead just as Set is king of the Gods. As Set is as well a God of Outsiders, there is a number of foreign practices involved, in particular the customs of the Berber tribes of the Sahara. Similarly to other Egyptian faiths, the dead are honored in daily life. They believe in a coming savior, the son of Set, who will restore Egypt to power and drive out the plethora of false gods ruling over it."
 set_old: "Old Setitism"
