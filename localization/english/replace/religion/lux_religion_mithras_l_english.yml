 #Eosphorist
 sol_mithras: "Eosphorism"
 sol_mithras_adj: "Eosphorist"
 sol_mithras_adherent: "Eosphorist"
 sol_mithras_adherent_plural: "Eosphorists"
 sol_mithras_old: "Eosphorism Old Rite"
 sol_mithras_old_adj: "Eosphorist Old Rite"
 sol_mithras_old_adherent: "Eosphorist Old Riter"
 sol_mithras_old_adherent_plural: "Eosphorist Old Riters"
 sol_mithras_desc: "The cult of Eosphoros ('the Lightbringer') is a Local Graeco-Roman faith of Martial Soul, with strong Gnostic influences. Eosphorism is an union of Mithras and Sol into a new figure, Eosphoros - The Dawn Bringer. Elements of the Judaeo-Christian tradition are also included, Eosphoros is Lucifer, and a direct Enemy of Christianity. Eosphorism sees the Dawn Bringer as the True God and Creator of Humanity, with Christianity being an abomination to be exterminated. It is a highly militaristic anti-Christian religion. Partly as a reaction against-Christianity, Eosphoros becomes Lucifer. Part of his mythology is centered around his Battle with Yahweh and Christ. He is the true Creator of Humanity and Redeemer, the Fallen God rising again in the Morning. He overcomes Yahweh, the Oppressor God, to help liberate humanity and bring Salvation. He is a Lord of Hosts, a Battle-Lord of the Morning, locked in battle with Yahweh until his future victory and Redemption of Humanity in His Light. Followers believe that Eosphoros' light will bring harmony to the world." 

 #Theomachian
 mani_mithras: "Theomachianism"
 mani_mithras_adj: "Theomachian"
 mani_mithras_adherent: "Theomachian"
 mani_mithras_adherent_plural: "Theomachians"
 mani_mithras_desc: "The Theomachian ('Battle of the Gods') cult is a Local Gnostic religion of Martial Soul, with strong Persian influences. It is a syncretic faith composed by many elements of Graeco-Roman mythology, Manichaeism, and Mithraism via its great success within the Roman military, turning to the idea that the world is the battleground of the Gods and that all life is part of the Battle between life and death, light and shadow, and that each mortal must give their all in the fight against the forces of darkness. Theomachians believe that all those who do not partake in their endeavor are servants of darkness and are to be destroyed."
 
