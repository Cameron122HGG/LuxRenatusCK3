 #Rodnoveric
 slavic_pagan:1 "Rodnovery"
 slavic_pagan_adj:2 "Rodnoveric"
 slavic_pagan_adherent:2 "Rodnoveric"
 slavic_pagan_adherent_plural:2 "Rodnoverics"
 slavic_pagan_desc:1 "The Rodnovery ('Native Faith') is a Local Slavic faith of Traditional Soul. It represents the native religious traditions of the Eastern Slavs, in which Rod is seen as the creator god and therefore the king of the gods, although in some groups, Svarog is worshiped as the principal deity. Other deities include Perun, the god of thunder, Veles, the god of the underworld, Jarilo, the goddess of the moon, Dažbog, god of the sun, and so forth. Rituals include festivals throughout the year, namely seasonal festivals."
 slavic_pagan_old:1 "Old Rodnovery"
 slavic_pagan_old_adj:2 "Old Rodnoveric"
 slavic_pagan_old_adherent:2 "Old Rodnoveric"
 slavic_pagan_old_adherent_plural:2 "Old Rodnoverics"
 
 #Perunic
 perun: "Perunism"
 perun_adj: "Perunic"
 perun_adherent: "Perunic"
 perun_adherent_plural: "Perunics"
 perun_old: "Old Perunism"
 perun_old_adj: "Old Perunic"
 perun_old_adherent: "Old Perunic"
 perun_old_adherent_plural: "Old Perunics"
 perun_desc: "The worship of Perun is a Mainstream Slavic religion of Martial Soul. Perun is the creator and god of lightning, as well as ruler of the world. He is usually depicted as a tall man with a golden moustache, a silver head, a copper beard, and armed with a mighty axe. Under Nordic influences, most Slavs tend to grant him a loose prominence among all their Gods. The cult doesn't have established temples - believers convene at sacred oak woods, where they sacrifice oxen and other livestock. Perunic adherents believe he is also the god of light, fighting an eternal struggle against Veles - the god of underworld. It is said that whenever a lightning strikes, it was an attempt by Perun to kill Veles. Believers take it upon themselves to take part in this holy struggle against Veles' servitors and other enemies to the Will of Perun."

 #Svarogan
 svaroh: "Svaroganism"
 svaroh_adj: "Svarogan"
 svaroh_adherent: "Svarogan"
 svaroh_adherent_plural: "Svarogans"
 svaroh_desc: "The worship of Svarog is a Local Slavic religion of Statist Soul, with significant Graeco-Roman influences. Svarog is the god of the celestial fire and blacksmithing, preserver of the fire which brought men out of the Stone Age. Recently, his cult gained popularity under strong influence of the Roman cult of Sol Invictus as princes make explicit connection between Svarog's civilizational role and their own authority - although no prince has ever tried to usurp solar glory in way the Roman Imperators do."
 svaroh_old: "Old Svaroganism"
 svaroh_old_adj: "Old Svarogan"
 svaroh_old_adherent: "Old Svarogan"
 svaroh_old_adherent_plural: "Old Svarogans"

 #Svetovidan
 svetovid: "Svetovidism"
 svetovid_adj: "Svetovidan"
 svetovid_adherent: "Svetovidite"
 svetovid_adherent_plural: "Svetovidites"
 svetovid_desc: "The cult of Svetovid is a Local Slavic faith of Martial Soul. It is a warrior cult following the worship of Svetovid, God of War and Patron of Abundance. Svetovidans believe that worship of Svetovid will bring them victory in battle, as with most warrior cults. Svetovid is seen as some as another form of Perun, but is not seen as the same being (by most, anyway). Key elements in this cult include divination, symbolism (usually involving a white horse, an image of Svetovid with a sword or bow in one hand and a drinking horn in the other, and idolatry involving pillars and offerings. There is also a Temple of Svetovid located on the island of Rujan, where a statue of Svetovid with four heads is located, and a horn of abundance is filled with fresh mead everv evening."
 svetovid_old: "Old Svetovidism"
 svetovid_old_adj: "Old Svetovidic"
 svetovid_old_adherent: "Old Svetovidite"
 svetovid_old_adherent_plural: "Old Svetovidites"

 #Dazhbogite
 dazhbog: "Dazhbogism"
 dazhbog_adj: "Dazhbogite"
 dazhbog_adherent: "Dazhbogite"
 dazhbog_adherent_plural: "Dazhbogites"
 dazhbog_old: "Old Dazhbogism"
 dazhbog_old_adj: "Old Dazhbogite"
 dazhbog_old_adherent: "Old Dazhbogite"
 dazhbog_old_adherent_plural: "Old Dazhbogites"
 dazhbog_desc: "The worship of Dažbog is a Local Slavic denomination with Martial Soul. Dažbog is the son of Svarog, creator and preserver of the holy fire. Unlike his father, however, Dažbog represents the destructive, scorching aspect of the sun: Dažbog's realm is an eternal pyre, not unlike Satan's Hell, where he torments his enemies (especially Christians) until the end of times. His followers regard it as a most holy task to unleash Dažbog's wrath on their foes and go to war with impressive body painting representing the suffering promised to their enemies in the afterlife."

 #Rodic
 rod: "Rodism"
 rod_adj: "Rodic"
 rod_adherent: "Rodist"
 rod_adherent_plural: "Rodists"
 rod_desc: "The worship of Rod is a Local Slavic faith of Traditional Soul. Rod is the oldest Slavic deity, the creator of the universe and all other gods. Even though Nordic influence resulted in some Slavs accepting Perun as a chief deity, more traditional tribes still worship Rod the Creator, as they did centuries ago."
 rod_old: "Old Rodism"
 rod_old_adj: "Old Rodic"
 rod_old_adherent: "Old Rodist"
 rod_old_adherent_plural: "Old Rodists"

 #Velesic
 veles: "Velesism"
 veles_adj: "Velesic"
 veles_adherent: "Velesite"
 veles_adherent_plural: "Velesites"
 veles_desc: "The cult of Veles is a Local Slavic faith of Traditional Soul. Worship revolves around Veles, the Slavic god of the underworld, and the foremost opponent of the thunder god Perun. In his eternal battle with Perun the Thunderer, Veles takes the form of a great dragon to slither up the roots of the World Tree, writhing and shifting in the wake of the storm and lightning cast down by his foe as he moves to invade the abode of the gods. In his weavings through and dealings with the mortal realm, he variously takes the guise of magical trickster, thief, protector of peasants, and a plague-sending punisher of oathbreakers. While the rest of the gods dwell high in the heavens, Veles' domain spans all that which lies beneath the earth. This includes the realm of Vyrai, where he shepherds the souls of the dead and guides the birds that carry the souls of the unborn into the world of the living."
 veles_old: "Old Velesism"
 veles_old_adj: "Old Velesic"
 veles_old_adherent: "Old Velesite"
 veles_old_adherent_plural: "Old Velesites"

