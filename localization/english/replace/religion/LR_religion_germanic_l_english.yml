norse_pagan: "Forn Siðr"
norse_pagan_adj: "Forn Siðric"
norse_pagan_adherent: "Forn Siðric"
norse_pagan_adherent_plural: "Forn Siðrics"
norse_pagan_desc: "The Forn Siðr ('Old Custom') is a Mainstream Norse faith of Traditional Soul. It refers to the polytheistic religious traditions of the Norse people. Many gods and goddesses are worshipped and venerated, and even though adherents may specialize their worship to a particular god or goddess, all deities in the pantheon are believed in. Practices include ancestor worship and remembrance, blots, and sacrifices - sometimes human. The existence of mythological creatures such as giants, dwarves, elves, and so on, form a great part of its folk beliefs. There are also nine homeworlds which the followers believe the gods used to shape the world humans live in - Midgardr, land of the humans, Asgardr, land of the Aesir, Vanaheimr, land of the Vanir, Jotunheimr, land of the giants, Alfheimr, land of the elves, Hel, land of the dead, Svartalfaheimr, land of the dwarves, Niflheimr, land of ice, and Muspellsheimr, the land of fire."
norse_pagan_old: "Old Forn Siðr"
norse_pagan_old_adj: "Old Forn Siðric"
norse_pagan_old_adherent: "Old Forn Siðric"
norse_pagan_old_adherent_plural: "Old Forn Siðrics"

ragnarok: "Røkkatrú"
ragnarok_adj: "Røkkatrú"
ragnarok_adherent: "Røkkatrúar"
ragnarok_adherent_plural: "Røkkatrúare"
ragnarok_desc: "Røkkatrú ('Allegiance to the Røkkr') is a Heretical Norse faith of Messianic Soul. Also known as the cult of Ragnarök, they focus their worship on Fenrir - the wolf destined to devour Odin - and his sons, Hati and Skoll. The Røkkatrúare see the Aesir as gluttonous corrupts and the Vanir as debauched revelers. They believe that during the end times, the Ragnarök, Fenrir will devour the Aesir, the Vanir, and their corrupt realms of Ásgarðr and Vanaheimr, and afterwards rule the renewed Miðgarðr with those that stood by his side, purged of the tainted influence of the Aesir and Vanir."
ragnarok_old: "Old Røkkatrú"
ragnarok_old_adj: "Old Røkkatrú"
ragnarok_old_adherent: "Old Røkkatrúar"
ragnarok_old_adherent_plural: "Old Røkkatrúare"

norse_christ: "Scandinism"
norse_christ_adj: "Scandinist"
norse_christ_adherent: "Scandinist"
norse_christ_adherent_plural: "Scandinists"
norse_christ_desc: "Scandinism is a Local Norse sect of Statist Soul, characterized by strong Christian influences. Viking raids on Frankish kingdoms and the British Isles brought the Scandinavians in contact with Christianity. Some of the Forn Siðric rulers decided to formally embrace Christianity as they seek a broader source of legitimacy towards their trouble-making vassals than the old tribal links. Thus Norse Christianity, or 'Scandinism', adopted Christian monotheism and doctrinal elements that strengthen the monarch's rule as divine right, while rejecting any form of authority from the official church. It retains many typically Norse cultural elements in the new syncretic faith. The religion has not yet developed its canon but most Scandinists hold that Baldr, who died and went to the underworld guarded by Hel, is the true Christ. They reject the Latin 'Hvítakristr', the 'White Christ', with white being associated with the Catholic sacerdotal robes as well as cowardly and effeminate attributes. Scandinist clergy make a point to wear orange garbs and keep their beards long, in keeping with the old ways of the Norse priesthoods."
norse_christ_old: "Old Scandinism"
norse_christ_old_adj: "Old Scandinist"
norse_christ_old_adherent: "Old Scandinist"
norse_christ_old_adherent_plural: "Old Scandinists"

norse_war: "Ófriðartívar"
norse_war_adj: "Ófriðartívaric"
norse_war_adherent: "Ófriðartívarist"
norse_war_adherent_plural: "Ófriðartívarists"
norse_war_desc: "The Ófriðartívar ('Gods of War') cult is a Heretical Norse faith of Martial Soul. It is an off-shoot branch of Norse religious traditions focusing on the veneration of the war gods of Norse legends - Odin, Tyr, and Freya, with a strong emphasis on their roles as mighty warriors. Adherents believe that if they worship these gods specifically, they will be granted victory in battle."
norse_war_old: "Old Ófriðartívar"
norse_war_old_adj: "Old Ófriðartívaric"
norse_war_old_adherent: "Old Ófriðartívarist"
norse_war_old_adherent_plural: "Old Ófriðartívarists"

sowilo: "Sunnatrú"
sowilo_adj: "Sunnatrúan"
sowilo_adherent: "Sunnatrúar"
sowilo_adherent_plural: "Sunnatrúare"
sowilo_desc: "Sunnatrú ('Allegiance to Sunna') is a Local Norse faith of Statist Soul. In a twist on Norse faith, the Sunnatrúare believe Mundilfari, god of time, was born from the collision of fire and ice like the giant Ymir. Realising that the world tree could not thrive without the continued energies that birthed him, Mundilfari took Ymir's eyes after Odin slew him, and infused one with the ice of Niflheim, and one with burning embers flying from the fiery world of Muspelheim, naming the two orbs Moon and Sun, after his children Máni and Sunna. Sunna is said to drive the horses Arvakr and Alsviðr that draw the chariot of the sun. She created the chariot to illuminate the Nine Worlds, circling Yggdrasil. Sunna is said to constantly quarrel against her lunar brother for control of the Heavens, continuing the cycle of day and night. The waxing and waning of their energies in this struggle is reflected in the changing lengths of days. Seen as both a nourishing mother and patroness of both fiery war and enlightened peace, she is offered sacrifices, usually animal, but prisoners of war and raids are accepted as well, who are burnt in a ritual to strengthen Sunna in her daily struggle. Influenced by the Roman cult of Sol Invictus, Sunnatrúar rulers often claim as well to have Her blood in their veins."
sowilo_old: "Old Sunnatrú"
sowilo_old_adj: "Old Sunnatrúan"
sowilo_old_adherent: "Old Sunnatrúar"
sowilo_old_adherent_plural: "Old Sunnatrúare"

sowilo_lore: "The faith in Sunna is among the newest in Midgard. In 986 CE, following a coup against his father Harald Bluetooth and subsequent religious repression of the many goðir who supported him, the Danish king Sweyn Forkbeard was forced into exile by his father's Saxon allies for almost a decade, during which he served in the Varangian Guard in Constantinople. Impressed with Roman might, Sweyn would adopt the god Sól as his protector. Upon reclaiming his throne using the wealth from his service in the east, Sweyn would go on to undertake both a grand restructuring of the religion around Sól, legitimised by his armies' successful conquests of Norway and the Danelaw. The faith was deeply unpopular outside the armies however, especially after a religious conflict with the followers of Sól-Odin in Rusland made Sweyn reaffirm Sól as a goddess, not a god. Following King Canute Sweynsson's death, the warlords fighting over the remnants of his Miklariki would seek to eradicate the memory of this 'unmanly' faith. However, the adherents of Sól would survive in an unlikely place; Sweyn's grandson Harold Harefoot, governor of Anglia, was a firm believer in his grandfather's vision, and opened his capital to the remaining pagans of Britannia, on condition they acknowledged 'Sunna' as the superior god. This alternative name for Sól would be deliberately encouraged by the Knutings to separate themselves from the Roman sun-worshipers to the west, and for being closer to the Saxon 'Sunne' and Briton 'Sulis.' To this day, the grand city of Lundúnir blazes with Sunna's light."

sowilo_high_god_name: "Sunna"
sowilo_high_god_name_2: "$sowilo_high_god_name$" # Optional translation alt
sowilo_high_god_name_possessive: "Sunna's"
sowilo_high_god_alternate: "$sowilo_high_god_name$"
sowilo_high_god_alternate_possessive: "$sowilo_high_god_name_possessive$"

