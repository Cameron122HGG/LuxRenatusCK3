allfather_adherent: "Wodanist"
allfather_adherent_plural: "Wodanists"
allfather_desc: "The worship of Wodanaz is a Local Germanic religion of Traditional Soul, characterized by strong Norse influences. Wodanaz, also known as Wodan or Wotan, is the Germanic god of war and wisdom. He is a god of change, wind, and inspiration, master of ecstatic trance and patron god to travelers, shamans, and poets. Unlike Teiwaz, in war He represents the darker side of conflict, as exemplified by one of his epithets, 'the Lord of the Slain'. He will gladly give his favor, and with it victory, to those that offer the lives of others in return. Very popular among Germanic nobility, many of their most famous chieftains and kings claim lineage from him. The Wodanazic branch of Germanic paganism arose during the chaos of the barbarian invasions in 355 AD, when the Germanic tribes began to come into direct contact with religious groups like the Christians and the Manichaeans. Fearing that the traditions of their forefathers would soon be replaced by these foreign creeds, some of the most important Germanic chieftains and priests called for a meeting at Wimares. Under Wodanaz's sacred oak, they swore to worship him as the sole god in the skies if this helped them keep their ancestral customs. Legends tell that, on that day, two ravens flew towards the sacred oak and rested on its branches. The priests took this as a sign of Wodanaz placing his favor on the kings and chieftains gathered there. From that day on, the Germanic tribes gradually absorbed other deities, both local and foreign, into the figure of Wodanaz. During the great Viking invasions of 800 AD, in encounters with their Scandinavian cousins, the Germanic tribesmen further syncretized Wodanaz with Odin, granting him the aspects of the Allfather and the magical wanderer. His priesthood is decentralized, with emphasis being placed on the many 'seers' and 'sorcerers', who claim to have been taught the magic arts by Wodanaz himself in his guise as a hooded wanderer. They preside over festivities as well as all sacrifices, animal or human, to Wodanaz. The totem animals of Wodanaz are the wolf and the raven."
