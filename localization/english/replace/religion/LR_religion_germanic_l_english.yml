german_pagan: "Furistaz Siduz"
german_pagan_adj: "Furistaz Siduzic"
german_pagan_adherent: "Germanic Pagan"
german_pagan_adherent_plural: "Germanic Pagans"
german_pagan_desc: "The Furistaz Siduz ('Foremost Custom') is a Mainstream Germanic faith of Traditional Soul. It refers to the polytheistic religious traditions of the continental Germanic peoples. While Germanic and Norse paganism share many similarities, the cultures, names, and practices are different, thus to say Forn Siðr and Furistaz Siduz are the same religion would be inaccurate. The primary gods of the pantheon include Wodan the Allfather, Tiw, the god of war and fair rule, Thunar, the thunder god, and Frija, wife of Wodan and goddess of fertility."
german_pagan_old: "Old Furistaz Siduzic"
german_pagan_old_adj: "Old Furistaz Siduz"
german_pagan_old_adherent: "Old Germanic Pagan"
german_pagan_old_adherent_plural: "Old Germanic Pagans"

irminsul: "Irminsulism"
irminsul_adj: "Irminsulic"
irminsul_adherent: "Irminsulist"
irminsul_adherent_plural: "Irminsulists"
irminsul_desc: "The worship of the Irminsul is a Heretical Germanic religion of Clerical Soul. The Irminsul are great pillars made of holy trees which unite Earth and Sky, and the medium through which the divine can be approached, felt, and understood. Only the priestly caste is authorized to approach the Irminsul, and they enjoy great authority and influence over their communities. During occult ceremonies held at irregular intervals, according to a calendar known only to those initiated, Wodanaz himself enters in communion with the Irminsul, communicates with the priests, and grants his protection to the worthy. It is said that Widukind was the sole priest authorized to meet the greatest Irminsul just after defeating Charlemagne in 777 CE, when his spirit merged with the totems. The Irminsulists accuse other Germanic beliefs which allow laymen to pray Wotan directly of being heretical, insulting to the Irminsul, and contrary to the essence of the world."
irminsul_old: "Old Irminsulism"
irminsul_old_adj: "Old Irminsulic"
irminsul_old_adherent: "Old Irminsulist"
irminsul_old_adherent_plural: "Old Irminsulists"

teiwaz: "Teiwaz"
teiwaz_adj: "Teiwazic"
teiwaz_adherent: "Teiwazic"
teiwaz_adherent_plural: "Teiwazites"
teiwaz_desc: "The worship of Teiwaz is a Local Germanic religion of Martial Soul. Teiwaz ('Shining One' or 'the God'), also known as Tīw, is the war god of noble battle, law, justice and the original father of the gods and men. He is not a god of mindless slaughter on the battlefield, or of carnage and base violence. Rather, he is the god of war in its glory, courage, and heroism. As god of justice and noble battle, it is thought he grants victory to those who fight honorably, armies that fight for their freedom or simply for survival. The Teiwazic branch of Germanic paganism rose during the chaos of the barbarian invasions in 355 AD, when Germanic armies encountered the disciplined legions of Rome. As large parts of the Germanic hosts were composed by undisciplined and impetuous youths, they made for poor soldiers. Thus the chieftains of various tribes decided to pay Germanic foederati, trained by the Romans, to instruct their warriors in the proper art of war. These foederati, veterans of the Comitatenses, also brought with them the cult of Mars, which was quickly related by the Germanic warriors to Teiwaz, the local god of war and noble battle. With their newfound discipline and skill in the art of war, these Germanic hosts won one battle after another, all of their fair victories attributed to Teiwaz. In those tribes where the worship of Teiwaz became prevalent, the other traditional gods started to wane in importance until they became minor local spirits or simply ceased to exist. Thus, in Teiwazic mythos, Teiwaz has become the sole ruler of the heavens. The caste of warrior-priests of Teiwaz, who descend mostly from the Germanic foederati who trained the tribes, is charged with training the new generations in the arts of war and presiding over martial rituals, such as ritualistic duels, to maintain discipline amongst the warriors. Teiwaz is symbolized by the sword and many warriors scratch his name in runes on their sword-blades for good luck and bravery during battle."
teiwaz_old: "Old Teiwaz"
teiwaz_old_adj: "Old Teiwazic"
teiwaz_old_adherent: "Old Teiwazic"
teiwaz_old_adherent_plural: "Old Teiwazites"

