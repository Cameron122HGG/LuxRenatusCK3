#Druidism
celtic_pagan: "Druidism"
celtic_pagan_adj: "Druidic"
celtic_pagan_adherent: "Druidist"
celtic_pagan_adherent_plural: "Druidists"
celtic_pagan_desc: "The Druidic faith is a Mainstream Celtic religion, characterized by a Traditional Soul. Followers worship various tribal deities, including some of the more pan-tribal deities such as Teutatis, Taranis, Lugh, Nuada, and Brighid in a fashion which has not changed much since the early Iron Age. In addition to these deities, they also place an emphasis on their ancestors and local nature spirits, often associated with stones, trees and bodies of water. Special connection to nature in Celtic religion is also illustrated by the importance of sacred oaks and the usage of mistletoe as sacred medicine. In social life, the most important feature of the religion is the central role played by its clergy, the druids, in maintaining religious and social cohesion. They are responsible for organizing worship and sacrifices, divination and judicial procedure. They preside over complex rituals revolving around sacred banqueting and bull-sacrificing, following a calendar based on moon cycles. Although druids prefer keeping away from the sphere of politics and abhor putting any sacred lore in writing, or perhaps because of that, their spiritual aura goes much beyond those following the Celtic traditional religion and is widely respected even by worshippers of other cults."
celtic_pagan_old: "Old Druidism"
celtic_pagan_old_adj: "Old Druidic"
celtic_pagan_old_adherent: "Old Druidist"
celtic_pagan_old_adherent_plural: "Old Druidists"

#Lughite
lugh: "Lugh"
lugh_adj: "Lughite"
lugh_adherent: "Lughite"
lugh_adherent_plural: "Lughites"
lugh_desc: "The cult of Lugh is a Local Celtic faith of Messianic Soul. It is a sect of the Celtic faith that worships Lugh mac Ethlenn, the hero-deity of the Celts and king of the Tuatha Dé, the Tribe of the Gods. His followers seek to follow his example as a warrior hero-deity."
lugh_old: "Old Lugh"
lugh_old_adj: "Old Lughite"
lugh_old_adherent: "Old Lughite"
lugh_old_adherent_plural: "Old Lughites"
 
#Hibernicism
celtic_christ: "Hibernicism"
celtic_christ_adj: "Hibernicist"
celtic_christ_adherent: "Hibernicist"
celtic_christ_adherent_plural: "Hibernicists"
celtic_christ_desc: "Hibernicism is a Local Celtic religion of Traditional soul, characterized by strong Christian influences. Christianity arrived in Britain with the Roman legions in the 4th Century, but as the Roman presence remained unstable, Local clerics reinterpreted Christianity in a fashion more in line with their own Celtic traditions, creating a new variant of Christianity commonly called called Hibernicism. Old Celtic traditions kept alive by Druidism slowly became more and more intertwined, and as a result, Hibernicism developed into an ever-changing, peculiar synthesis between its fading Christian background and the revived Celtic belief system. In particular, characters of the Christian Saints and Celtic heroes influence each other, to the extent that the historical figure of Jesus of Nazareth is sometimes merged into one of the most prominent characters of the Celtic sagas." 
celtic_christ_old: "Old Hibernicism"
celtic_christ_old_adj: "Old Hibernicist"
celtic_christ_old_adherent: "Old Hibernicist"
celtic_christ_old_adherent_plural: "Old Hibernicists"

#Endovellico-Neto
endovellico: "Endovellico-Neto"
endovellico_adj: "Endovellican"
endovellico_adherent: "Endovellican"
endovellico_adherent_plural: "Endovellicans"
endovellico_desc: "The cult of Endovellico-Neto is a Local Celtic faith of Martial soul, with strong Greco-Roman influences. Endovellicus was an Iron Age god of public health and safety worshipped among other gods in pre-Roman Lusitania and Gallaecia, associated with chthonic oracles and healing. After his defeat at the hands of the Romans, Punicus, the King of the Lusitani, decided to consolidate his new position as a Roman client-King by focusing public worship on Endovellicus, emphasizing a syncretic Greco-Roman identity to better tie himself and his people to the new Roman order. The nature of Endovellicus then evolved with the fortune of the Lusitani. As the Lusitanian soldiery began to integrate into the Roman military as legionnaires and auxiliaries, He was conflated with the god Neto, patron of the nearby Arevaci, who was by then syncretized into Mars Neto, sun god of warriors and defender of the land. Thus at the height of the Pax Romana, there was a single Lusitanian sun god with two faces, Endovellicus-Neto. To his worshippers, he is the Healing Sun, the protective and caring father of the Lusitan people. To their enemies he is the Scorching Sun, the harsh and passionate protector of the Lusitanian homeland. Other Celtiberian deities such as Ataecina, goddess of rebirth and the spring season, or Nabia, goddess of rivers and waters, were reinterpreted as local protector spirits, subservient to Endovellicus-Neto. With the descent of Hispania into chaos, the proud and tough Lusitani armies protecting their homeland against waves of invaders have only furthered their reverence for Endovellicus-Neto."
endovellico_old: "Old Endovellico-Neto"
endovellico_old_adj: "Old Endovellican"
endovellico_old_adherent: "Old Endovellican"
endovellico_old_adherent_plural: "Old Endovellicans"