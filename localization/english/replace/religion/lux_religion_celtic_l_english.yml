 lugh_desc:0 "The cult of Lugh is a Local Celtic faith of Messianic Soul. It is a sect of the Celtic faith that worships Lugh mac Ethlenn, the hero-deity of the Celts and king of the Tuath De (tribe of the gods). His followers seek to follow his example as a warrior hero-deity."
