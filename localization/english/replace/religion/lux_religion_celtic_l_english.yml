 celtic_christ:0 "Hibernian Christianity"
 celtic_christ_adj:0 "Hibernicist"
 celtic_christ_adherent:0 "Hibernicist"
 celtic_christ_adherent_plural:0 "Hibernicists"
 celtic_christ_desc:0 "Hibernicism is a Local Celtic religion of Traditional soul, characterized by strong Christian influences Christianity arrived in Britain with the Roman legions in the 4th Century, but as the Roman presence remained unstable, Local clerics reinterprated Christianity in a fashion more in line with thBelanus own Celtic traditions, creating a new variant of Christianity commonly called called Hibernicism. Old Celtic traditions kept alive by Druidism slowly became more and more intertwined, and as a result, Hibernicism developed into an ever-changing, peculiar synthesis between its fading Christian background and the revived Celtic belief system. In particular, characters of the Christian Saints and Celtic heroes influence each other, to the extent that the historical figure of Jesus of Nazareth is sometimes merged into one of the most prominent characters of the Celtic sagas." 
