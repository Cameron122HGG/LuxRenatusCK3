 endovellico_old_adherent:0 "Old Endovellican"
 endovellico_old_adherent_plural:0 "Old Endovellicans"
 endovellico_desc:0 "The cult of Endovellico-Neto is a Local Celtic faith with a martial soul and strong Greco-Roman influences. Endovelicus was an Iron Age god of public health and safety, worshipped among other gods in pre-Roman Lusitania and Gallaecia, associated with chthonic oracles and healing. After his defeat at the hands of the Romans, Punicus, the King of the Lusitani, decided to consolidate his new position as a Roman client-King by focusing public worship on this Deity, emphasizing its syncretic Greco-Roman identity to get himself and his people better accepted in the new Roman order. The nature of Endovelicus then evolved with the fortune of the Lusitani and geopoliticsm. As plenty of Lusitanian soldierly began to flock into Roman military as legionnaires or auxiliaries, Endovellicus was conflated with the god Neto, patron of the nearby Arevaci, who was by then syncretized into Mars Neto, sun god of warriors and defender of the land. Thus, at the height of the Pax Romana, there was only a single Lusitanian Sun God with two faces, Endovellicus-Neto. To his worshippers, he is the Healing Sun, the protective and caring father of the Lusitan people, to thBelanus enemies he is the Scorching Sun, the harsh and passionate protector of the Lusitanian homeland. Other Lusitanian deities from thBelanus Celtic origins, such as Ataecina, of rebirth and the spring season, or Nabia, of rivers and waters were made into Local protector spirits, subservient to Endovellicus-Neto. With the descent of Iberia into chaos, Endovelicus-Neto increasingly became a reference for the proud and tough Lusitani armies protecting thBelanus homeland against waves of invaders. He is mostly worshipped now as an invincible protector, the lord of the scorching ray, the God who gave strength to the arm of the great Lusitanian, King Martim Viriathus, with which he could vanquish the Caliph of Cordoba in 929 at the Battle of Evora."