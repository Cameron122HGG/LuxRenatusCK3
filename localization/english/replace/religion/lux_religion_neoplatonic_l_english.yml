 #Neoplatonic-Group Faiths

 neoplato: "Neoplatonism"
 neoplato_adj: "Neoplatonic"
 neoplato_adherent: "Neoplatonist"
 neoplato_adherent_plural: "Neoplatonists"
 neoplato_desc: "The teachings of Neoplatonism are a Gnostic Mainstream religion of Scholarly Soul  with a strong Graeco-Roman ascendancy. In many ways the mystical Neoplatonism is the culmination of Graeco-Roman religious thought. Drawing from traditional religious practice and mystery cults, the faith merges the philosophy of the pre-Roman era with more modern schools of thought to explore nature, life and even the gods as emanations and imititations of a mystical perfect conceptual world and being. Borrowing from the neopythagoreans, this Ultimate Perfection is often dubbed the Monad. The many branches and related currents of neoplatonism, from Gaul to India, all agree on one thing; through research, debate and mystical experimentation to discover how to reunite Man with Monad, and reach perfection."
 
 plato_pythagorean: "Neopythagoreanism"
 plato_pythagorean_adj: "Neopythagorean"
 plato_pythagorean_adherent: "Neopythagorean"
 plato_pythagorean_adherent_plural: "Neopythagoreans"
 plato_pythagorean_desc: "Neopythagoreanism is a Local Neoplatonist belief of Scholarly Soul and strong Gnostic influences. In its origins in the First Century, it was a response to the dominating school of thought in the Hellenistic world, Stoicism, an attempt to introduce more spiritual, mystical elements to Hellenistic philosophy. Apollonius of Triana and Moderatus of Gades, disciples of Nigidus Figulus, met in what would be called the First Secret Communion and symbolically married, giving birth to the long tradition of Pythagorean same-sex marriages between companions in the faith. Then, in 179, Numenius of Apamea fused elements of Platonism with the old Pythagorean political and spiritual structure, and in what is now called the Numerian Affirmation, created the Neopythagorean School that still exists today. They believed that there was one God, the One, the Perfect Monad, of which the number One was herald and avatar, since One signifies fullness, perfection and omnipresence. From thence, the Dual appeared, the two universes, the material and the immaterial, while the Monad emanates more and more numbers and fractions that echo in our world, but that exist fully in the real world, the spiritual world, where the Soul belongs and where it longs to return. They also created a hierarchy of virtues and followed an ascetic way of life in which the important was not to do good, but to have the will to do good, since the thought was more important than the flesh, the "muddy vest of decay". Neopythagoreanism influenced Neoplatonism greatly, and it was indeed another step towards Iamblichus, Plotinus and Porphyry, but the disciples of the Numerian School went on, criticizing the Neoplatonics' lack of vision of the numerological nature of the Spiritual World and becoming increasingly secretive, developing several tens of grades of acceptance, privileged orders within the School's orders, secret rites of passage that no one will reveal, mystical mysteries to unravel, and the adoration of numbers. All of this makes joining the Neopythagoreans truly a labyrinthic task worthy of Theseus. They all choose new names when they enter the School: a public one and a secret one. Names can be broken down into numbers, and thus names are powerful, but they're a metaphor for the dual world we live in: the word being the matter and the number it represents being its Soul."

 porphyryan: "Porphyrianism"
 porphyryan_adj: "Porphyrian Neoplatonic"
 porphyryan_adherent: "Porphyrian Neoplatonist"
 porphyryan_adherent_plural: "Porphyrian Neoplatonists"
 porphyryan_desc: "Porphyryanism is a Local Graeco-Roman belief of Scholarly Soul. An anti-Christian branch of Neoplatonism founded by Porphyry of Tyre. Porphyry advocated that 'the Gods have proclaimed Christ most pious, but the Christians are a confused and vicious sect', and as a result there is much disdain for Christianity in this sect of Neoplatonism. Still, the faith remains highly influenced by the gnostic Jewish and Christian movements of the Levant, seeking to combine philosophical theories of the universe with esoteric rituals to uncover hidden truths. Porphyryans also practice vegetarianism on both spiritual and ethical grounds, under the belief that animals are as sentient as human beings, as enforced by mainstream Neoplatonism."

 plato_christ: "Scholastic Christianity"
 plato_christ_adj: "Scholasticist"
 plato_christ_adherent: "Scholastic Christian"
 plato_christ_adherent_plural: "Scholasticists"
 plato_christ_desc: "The beliefs and practices of Augustinism and Origenism, known overall as Scholastic or Platonic Christianity, constitute a Neoplatonic Gnostic philosophical-religious system of Scholarly Soul under strong Christian influences. Although the fusion between Christian and Neoplatonic concepts began lmost immediately, to the extent both systems had a lasting influence on one another, Platonic Christianity constitutes yet a distinct stream of ideas. It appeared to the greater public first in the scholar Augustine of Hippo's Memories. Augustine, a great mystic and philosopher from Africa, revered by the Church and the Academy alike, began his metaphysical journey first as a Manichean eliever. He later turned to Platonism and last converted to Christianity. In the decisive last years of is life, he turned again to Platonism, although not relinquishing fully the legacy of Christianity. In the pening of the 4th century, he taught his followers the ideal of a perfect system where Christian and Platonic ideals work like clockwork and God's light shines over everyone, as best spelled out in his famous 'City of God'. His teachings became widespread among the educated classes of great cities of Italy and Africa thanks to great thinkers like Boethius - in the East, the disciples of Origen had already, in the 3rd Century, established a hriving community of intellectual exchange of Christian and Platonic ideas. Augustinianists travelled onstantly between Carthage, Rome, Arles, Syracuse and Alexandria, creating what is known now as the Academic Circuit that goes around the Mediterranean and beyond, as far east as Gades, as far north as Krakow, as far south as Timbuktu and as far east as Pataliputra. Following the ideas behind 'The City of God', Augustinians organized themselves into an Ekklesia, a tight community of believers that want to ive a virtuous, moderate life in order to attain Redemption from the One God and to feel the love of Christ the Logos, that was once made Flesh. This Ekklesia has Listeners and Virtuous, a special division of the faithful according to the nature of their Soul, and a strict structure, well-organized and very centralized and coordinated. In contrast, Origenists, while welcoming of new ideas, did not believe in Augustine's 'perfect society', and prefer to this day a more disperse, free and decentralized structure vith bishops looking after local communities but with no sole authority over them all. Both currents join efforts in aggressively challenging the mainstream Christian churches' religious supremacy over the Christ's legacy through debates and controversies. They all gather every five years in Alexandria and their Great Synod is an anticipated event for all scholars inclined to tolerance and free discussion."

 plato_islam: "Falsafa"
 plato_islam_adj: "Neoplatonic Islamic"
 plato_islam_adherent: "Neoplatonic Muslim"
 plato_islam_adherent_plural: "Neoplatonic Muslims"
 plato_islam_desc: "Falsafa, or Platonic Islam, is an Heretical Neoplatonic Gnostic belief of Scholarly Soul under a strong Islamic ascendant. 'Falsafa' is the Islamic concept of Philosophy understood as the pursuit of inquiry and understanding of the nature of the world, material and spiritual, and of the order of things. In this perspective, the One, Allah, emanated energy and matter in order to create the Universe perfect and beautiful, but the matter, intended consequence of the Creation, was a by-product of the spirit, and thus trapped in its own inadequacy to perceive the higher elements of the Universe. Ever since the First Arab Siege of Alexandria on the year 641, Islamic presence in Egypt has grown dynamically without the sponsorship of strong, lasting empires to ensure its homogeneity. Thus, when the didacts and scholarchs at Alexandria began to hear about the new faith the Arabs brought with them, the Last Revelation, the Submission to the One, they imported their holy book and invited Muslim doctors in order to learn more about this new view of the world. They soon discovered it was fully compatible with Platonic ideas and that new subtleties could be introduced. Greek translations of the Qur'an were made, as well as Arabic ones of the greatest Platonic texts, resulting in a vibrant new community of Hellenized Muslims in the newly established Madrassa of Alexandria. Soon the Roman authorities considered the new belief pernicious and tried to extirpate Muslim presence from Alexandria. The Falsafis went into hiding, but always received help from their old debate companions in the Academy, the Library and the Pandidakteion. When Alexandros, the son of Philippos Argead, and a very well-cultivated scholar, was left as Exarch of Alexandria on 835, he proclaimed amnesty and religious freedom, and the Falsafis emerged once more. Alexandros' son Aretas plunged deep into Platonic Islam thanks to his lover, Fawla Hieropsina, the Great Alimah of the Alexandrian Madrassa. Muslim presence became stronger when the Fatimids besieged the City in 919, and the city came under their domain, although Kassandir Iskenderi, Cassander of Alexandria, the newly-confirmed King of Alexandria, never forgot their Hellenistic roots, nor did his people, or the Falsafis, who remain to this day within the Great Madrassa, in good terms with the Academicians and the other scholar institutions of the City, embarked on a journey of intellectual and spiritual perfection that mimics the early days of this philosophy, when the houses of wisdom were permeable to all kinds of new ideas that might help better achieve union with Allah, the One."

 plato_hindu: "Platonic Vedanta"
 plato_hindu_adj: "Platonic Vedantic"
 plato_hindu_adherent: "Platonic Hindu"
 plato_hindu_adherent_plural: "Platonic Hindus"
 plato_hindu_desc: "Platonic Vedanta is a Local Neoplatonist faith of Scholarly Soul with strong Gnostic influences. In the 8th century, Academy-trained scholarch Guru Shankara formalized the ancient Indian philosophy of Advaita Vedanta within the context of Western Neoplatonic thought. Vedantists believe the world of experience is a dream, and that consciousness - a singular, transcendent entity - is the dreamer."