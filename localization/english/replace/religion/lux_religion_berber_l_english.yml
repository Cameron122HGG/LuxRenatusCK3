#Faiths

berber_pagan: "Amazighism"
berber_pagan_adj: "Amazigh"
berber_pagan_adherent: "Amazigh"
berber_pagan_adherent_plural: "Amazighs"
berber_pagan_old: "Amazigh Old Rite"
berber_pagan_old_adj: "Amazigh Old"
berber_pagan_old_adherent: "Old Amazigh"
berber_pagan_old_adherent_plural: "Old Amazighs"
berber_pagan_desc: "The Amazigh faith is a Local Saharan religion of Traditional Soul. It is the traditional faith of the Berber people, whose main gods include Mastiman (analogue to Greek Zeus), Amanai (analogue to Egyptian Amun) and Gurzil (analogue to Roman Mars). Practices in the Amazigh faith include elaborate burial rites, in which the dead are buried with burial with ostrich egg shells, weapons, and jewelry. The followers of the Amazigh faith also view the spirits of their ancestors to be gods, and will even spent the night in their tomb after asking questions. The Amazigh faith of the Berbers belongs to a Barbarian Civilization, characterized by an emphasis on rural areas, individual martial prowess, and low division of labor. Its Doctrine is a Local variation of a mainstream religious current, favoring social harmony over doctrinal purity. Its Soul is Traditional: the faith follows the ancient traditions of the commoners and Local notables, and it has slowly evolved, if at all, throughout the recent era of troubles and turmoils."

gurzil: "Gurziliism"
gurzil_adj: "Gurzili"
gurzil_adherent: "Gurzilite"
gurzil_adherent_plural: "Gurzilites"
gurzil_old: "Old Gurziliism"
gurzil_old_adj: "Old Gurzili"
gurzil_old_adherent: "Old Gurzilite"
gurzil_old_adherent_plural: "Old Gurzilites"
gurzil_desc: "The worship of Gurzil is a Local Saharan religion of Martial Soul. Gurzil is the bull-god of War an the Son of the Sun. Believers think that by worshipping Gurzil, and bringing images of him to war, shall grant them victory in battle."

amanai: "Elohimism"
amanai_adj: "Elohimi"
amanai_adherent: "Elohimi"
amanai_adherent_plural: "Elohimis"
amanai_old: "Old Elohimism"
amanai_old_adj: "Old Rite Elohimi"
amanai_old_adherent: "Old Elohimi"
amanai_old_adherent_plural: "Old Elohimis"
amanai_desc: "The worship of Amanaii is an Local Saharan religion of Martial Soul, with a strong Graeco-Roman influences. Amanaii is Berber god of the setting sun, and Megas Alexandros is often identified by the Berbers as Amanaii made flesh. The cult of Amanai belongs to a Barbarian Civilization, characterized by an emphasis on rural areas, individual martial prowess, and low division of labor. Its Doctrine is a Local variation of a mainstream religious current, favoring social harmony over doctrinal purity. Its Soul is Martial: heroic deeds on the battlefield are glorified as the finest sign of holiness. It also has a Graeco-Roman Ascendant, characterized by a strong interest in civic matters and well-organized military."