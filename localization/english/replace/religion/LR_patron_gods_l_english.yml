 #Hinduism
 patron_god_nakura: "Nakura"
 patron_god_desc_nakura: "The Turbaned god of the Abrahamic faiths, worshipped by sheding milk."
 patron_god_ram: "Ram"
 patron_god_desc_ram: "An Avatar of Vishnu and the idealized version of all rulers, worshipped through songs and fragant waters"
 patron_god_kali_mai: "Kali Mai"
 patron_god_desc_kali_mai: "The fierce mother, worshipped by shedding the blood from the strongest livestock and by gifting flowers."
 patron_god_ganesh: "Ganesh"
 patron_god_desc_ganesh: "The destroyer of obstacles and son of Lord Shiva, worshipped by burning incense and gifting sweets."
 patron_god_munishvaran: "Munishvaran"
 patron_god_desc_munishvaran: "The white-faced, blue-eyed god of evil spirits, appeased by through the blood of goats and burning cigarettes."
 patron_god_chankani_karuppu: "Chankani Karuppu"
 patron_god_desc_chankani_karuppu: "The lamp-black whip-wielding god from Africa, worshipped through the blood of chickens and offerings of rum."

