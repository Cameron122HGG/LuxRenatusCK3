 #Solar Imperial
 patron_god_solar_deity_01: "Emperor Aurelian"
 patron_god_desc_solar_deity_01: "The Roman Emperor known for his military prowess and consolidation of the empire, worshipped as a solar deity."
 patron_god_solar_deity_02: "Emperor Elagalabus"
 patron_god_desc_solar_deity_02: "The Roman Emperor known for his religious zeal and eccentric behavior, worshipped as a solar deity."
 patron_god_solar_deity_03: "Emperor Commodus"
 patron_god_desc_solar_deity_03: "The Roman Emperor known for his eccentric behavior and self-indulgence, worshipped as a solar deity."
 patron_god_solar_deity_04: "Emperor Julian"
 patron_god_desc_solar_deity_04: "The Roman Emperor known for his efforts to restore paganism and his philosophical pursuits, worshipped as a solar deity."
 patron_god_solar_deity_05: "Sol Invictus"
 patron_god_desc_solar_deity_05: "The Roman sun god, worshipped as the invincible sun, central to the solar cult of the Roman Empire."

