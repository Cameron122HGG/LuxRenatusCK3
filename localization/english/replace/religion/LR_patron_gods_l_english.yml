 #Roman
 patron_god_diana_deity: "Diana"
 patron_god_diana_deity_desc: "Diana Lucina, Diana Omnivaga, Diana Satia, Diana Abundia. The Nightly Queen, the Lighter of the Moon, the Lady of the Hunt, ancient Diana protects women, hunters and the souls of the dead in their sojourn to the Orcus, the Underworld. Like the Night, she conceals; like Nature, she can be inclement and fickle, but also bountiful. Like the Moon shining at night, she brings hope where there seems to be little cause for it. Women lead nightly processions in her honour to hunt small game, gather herbs, recover lost objects or lead the souls of the recently deceased to their resting place, Lady Diana reminds us that not all under the sky is for Mankind to dominate, especially Death."
 patron_god_minerva_deity: "Minerva"
 patron_god_minerva_deity_desc: "The Roman goddess of wisdom, strategy, crafts, and learning, honoured by soldiers, scholars, and artisans alike."
 patron_god_mars_deity: "Mars"
 patron_god_mars_deity_desc: "The Roman god of war and martial strength, regarded as a protector of Rome and an ancestor of its people."
 patron_god_jupiter_deity: "Iuppiter Optimus Maximus"
 patron_god_jupiter_deity_desc: "The king of the Roman gods, ruler of the heavens and guardian of law, oaths, and the Roman state."
 patron_god_neptune_deity: "Neptune"
 patron_god_neptune_deity_desc: "The Roman god of the sea, fresh waters, and horses, invoked by sailors and all who depended upon the waters."
 patron_god_mercury_deity: "Mercurius"
 patron_god_mercury_deity_desc: "The Roman god of trade, travel, communication, and good fortune, known as the swift messenger of the gods."
 patron_god_pax_deity: "Pax Romae"
 patron_god_pax_deity_desc: "The Roman personification of peace, prosperity, and civic order, celebrated as the calm secured through stability and concord."
 patron_god_juno_deity: "Juno Regina"
 patron_god_juno_deity_desc: "The queen of the Roman gods, protector of marriage, women, and the Roman people, and consort of Jupiter."

 #Hellenic
 patron_god_hellenic_deity_1: "Zeus"
 patron_god_hellenic_deity_1_desc: "The king of the gods in Hellenic mythology, ruler of Mount Olympus and god of the sky and thunder."
 patron_god_hellenic_deity_2: "Hermes"
 patron_god_hellenic_deity_3: "Apollo"
 patron_god_hellenic_deity_4: "Athena"
 patron_god_hellenic_deity_5: "Hera"
 patron_god_hellenic_deity_6: "Herakles"
 patron_god_hellenic_deity_2_desc: "The swift messenger of the gods, patron of travellers, merchants, heralds, and thieves, and guide of souls to the underworld."
 patron_god_hellenic_deity_3_desc: "The god of prophecy, music, healing, and archery, associated with reason, harmony, and the light of the sun."
 patron_god_hellenic_deity_4_desc: "The goddess of wisdom, disciplined warfare, and skilled crafts, and the steadfast protector of cities and civic order."
 patron_god_hellenic_deity_5_desc: "The queen of the gods and goddess of marriage, queenship, and family, renowned for her dignity and fierce authority."
 patron_god_hellenic_deity_6_desc: "The greatest of the Hellenic heroes, famed for his immense strength, endurance, and Twelve Labours, and later honoured among the gods."

