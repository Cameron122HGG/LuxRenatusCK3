 alexandros: "Alexandros-Ammonism"
 alexandros_adj: "Alexandros-Ammonite"
 alexandros_desc: "The cult of Alexandros-Ammon is a Local Graeco-Roman religion of Martial Soul, with significant Archaic influences. It centers around the worship of Alexandros III of Makedonia, also known as Megas Alexandros ('Alexander the Great'), who ruled Makedonia in 336-323 BCE. During the conquest of Aegyptus, Alexandros acquired a divine nature when he visited the Oracle of the Siwa Oasis, where he was proclaimed son of Zeus-Ammon, and 'Master of the Universe'. Henceforth, his cult grew with every following year, surviving even the dissolution of his empire in the wars of the Diadochi, and merging with the much more ancient worship of the Egyptian god Amun. His followers dream about the day when Alexandros-Ammon incarnate returns - this time to unify all the world under his leadership for all eternity. They commonly believe that re-enacting his legendary martial prowess in their current environment may draw his favor and accelerate his return: the religion incorporates much military training and ritual fighting, codified along strict and ancient rules."
 alexandros_adherent: "Alexandros-Ammonite"
 alexandros_adherent_plural: "Alexandros-Ammonites"
 alexandros_old: "Old Rite of Alexandros-Ammon"
 alexandros_old_adj: "Old Rite Alexandros-Ammonite"
 alexandros_old_adherent: "Old Rite Alexandros-Ammonite"
 alexandros_old_adherent_plural: "Old Rite Alexandros-Ammonites"

 solomonic_alexandros: "Solomonic Cult of Alexandros-Ammon"
 solomonic_alexandros_adj: "Solomonic Alexandrian"
 solomonic_alexandros_adherent: "Solomonic Alexandrian"
 solomonic_alexandros_adherent_plural: "Solomonic Alexandrians"
 solomonic_alexandros_desc: "The Solomonic Cult of Alexandros-Ammon is a Local Graeco-Roman faith of Martial Soul, with strong Archaic and Abrahamic influences. influences. When the cult of Alexandros-Amon spread its influence into Ethiopia, aspects were implemented into Local Solomonic Christian communities. Alexandros would often be depicted as a Saint in the church, sometimes as an archangel of Jah, even some go so far as to call him Soloman Incarnate."
 solomonic_alexandros_old: "Old Rite Solomonic Cult of Alexandros-Ammon"
 solomonic_alexandros_old_adj: "Old Rite Solomonic Alexandrian"
 solomonic_alexandros_old_adherent: "Old Rite Solomonic Alexandrian"
 solomonic_alexandros_old_adherent_plural: "Old Rite Solomonic Alexandrians"

 dionysos: "Cult of Dionysos"
 dionysos_adj: "Dionysian"
 dionysos_desc: "The cult of Dionysos is a Local Graeco-Roman religion of Ecstatic Soul, with significant Archaic influences. It centers around the worship of Dionysos, the god of wine, fertility, ritual madness, religious ecstasy, and theatre. Dionysos is a god who transcends the boundaries of the human and the divine, the mortal and the immortal. His worshipers seek to achieve a state of ecstasy and liberation from the constraints of everyday life through rituals that often involve music, dance, and the consumption of wine. The cult of Dionysos is known for its ecstatic and frenzied rituals, which can include elements of possession and trance. These rituals are often conducted in natural settings, such as forests or mountains, and are led by priests and priestesses known as Maenads or Bacchae. The cult of Dionysos has a rich mythology and is associated with various symbols, including the thyrsus (a staff topped with a pinecone), the grapevine, and the leopard skin. The worship of Dionysos was an important aspect of ancient Greek culture and had a significant influence on the development of theatre and drama."
 dionysos_adherent: "Dionysian"
 dionysos_adherent_plural: "Dionysians"
 dionysos_old: "Old Rite of Dionysos"
 dionysos_old_adj: "Old Rite Dionysian"
 dionysos_old_adherent: "Old Rite Dionysian"
 dionysos_old_adherent_plural: "Old Rite Dionysians"



