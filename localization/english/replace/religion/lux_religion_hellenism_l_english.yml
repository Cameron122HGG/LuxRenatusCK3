 hellenic_pagan: "Olympism"
 hellenic_pagan_adj: "Olympist"
 hellenic_pagan_adherent: "Olympist"
 hellenic_pagan_adherent_plural: "Olympists"
 hellenic_pagan_desc: "The Olympist religion is a Mainstream Graeco-Roman faith of Traditional soul. Followers worship a vast pantheon, the most important of which are the Dodekatheon, the twelve Olympian Gods including Zeus, Hera, Poseidon, Demeter, Athena, Apollo, Artemis, Ares, Aphrodite, Hephaestus, Hermes and either Hestia or Dionysus, depending on local variations. The religion is very demonstrative and regulates social life through rites and a well-defined calendar of events. Ritual offerings are practiced at levels, from household shrines to the largest temple, constitute one of the central practices in the religion in daily life. In particular, the religion is quite unique for its prevalence of household shrines, where most believers pray and leave offerings, with the foremost household deity being Hestia, who receives an offering at the beginning and ending of the rituals. In public, priests lead public and communal rituals that provide offerings to the gods. This clergy, although it enjoys much respect, remains decentralized and even temples worshipping the same deity are often independent from one another. In spite of this organizational weakness, the strength of this religion lies in the extremely strong bound it creates within societies that still follow it, with a mystical relationship to their history, natural and architectural environments. This may explain how the religion has gone through the centuries of imperial power, especially in smaller islands, creeks and havens of an old Mediterranean world that Ulysses would not find too unfamiliar. That religion retains a strong spiritual appeal to many, in association with the antique simplicity of a world where the gods still live close by the mortals."
 hellenic_pagan_old: "Old Rite Hellenism"
 hellenic_pagan_old_adj: "Old Rite Hellenic"
 hellenic_pagan_old_adherent: "Old Rite Hellenist"
 hellenic_pagan_old_adherent_plural: "Old Rite Hellenists"

 alexandros: "Alexandros-Ammonism"
 alexandros_adj: "Alexandros-Ammonite"
 alexandros_desc: "The cult of Alexandros-Ammon is a Local Greco-Roman religion of Martial soul, with significant Archaic influences. It centers around the worship of Alexandros III of Makedonia, also known as Megas Alexandros, whose conquests spanned from the Adriatic Sea to the distant shores of the Indus. In his conquest of Egypt, Alexandros' rule acquired a divine nature when he visited the Oracle of the Siwa Oasis. It was there that he was proclaimed son of Zeus-Ammon and Master of the Universe. Henceforth, his cult grew with every following year, surviving even the dissolution of his empire in the Wars of the Diadochi, and merging with the much more ancient worship of the Egyptian god Amun. His followers know in their hearts that Alexandros-Ammon shall one day be reborn among them - this time to unite the world under his leadership for all eternity. They commonly believe that re-enacting his legendary martial prowess in their current environment may draw his favor and accelerate his return, incorporating much military drill and ritual fighting codified along strict and ancient rules."
 alexandros_adherent: "Alexandros-Ammonite"
 alexandros_adherent_plural: "Alexandros-Ammonites"
 alexandros_old: "Old Rite of Alexandros-Ammon"
 alexandros_old_adj: "Old Rite Alexandros-Ammonite"
 alexandros_old_adherent: "Old Rite Alexandros-Ammonite"
 alexandros_old_adherent_plural: "Old Rite Alexandros-Ammonites"

 solomonic_alexandros: "Solomonic Cult of Alexandros-Ammon"
 solomonic_alexandros_adj: "Solomonic Alexandrian"
 solomonic_alexandros_adherent: "Solomonic Alexandrian"
 solomonic_alexandros_adherent_plural: "Solomonic Alexandrians"
 solomonic_alexandros_desc: "The Solomonic Cult of Alexandros-Ammon is a Local Graeco-Roman faith of Martial Soul, with strong Archaic and Abrahamic influences. When the cult of Alexandros-Ammon spread its influence into Ethiopia, aspects were implemented into local Solomonic Christian communities. Alexandros would often be depicted as a Saint in the church, sometimes as an archangel of Jah, and some even go so far as to call him another incarnation of King Solomon."
 solomonic_alexandros_old: "Old Rite Solomonic Cult of Alexandros-Ammon"
 solomonic_alexandros_old_adj: "Old Rite Solomonic Alexandrian"
 solomonic_alexandros_old_adherent: "Old Rite Solomonic Alexandrian"
 solomonic_alexandros_old_adherent_plural: "Old Rite Solomonic Alexandrians"

 dionysos: "Cult of Dionysos"
 dionysos_adj: "Dionysian"
 dionysos_desc: "The cult of Dionysos is a Local Graeco-Roman religion of Populist Soul, with significant Archaic influences. It centers around the worship of Dionysos, the god of wine, fertility, ritual madness, religious ecstasy, and theatre. Dionysos is a god who transcends the boundaries of the human and the divine, the mortal and the immortal. His worshippers seek to achieve a state of ecstasy and liberation from the constraints of everyday life through rituals that often involve music, dance, and the consumption of wine. The cult of Dionysos is known for its ecstatic and frenzied rituals, which can include elements of possession and trance. These rituals are often conducted in natural settings, such as forests or mountains, and are led by priests and priestesses known as Maenads or Bacchae. The cult of Dionysos has a rich mythology and is associated with various symbols, including the thyrsus (a staff topped with a pinecone), the grapevine, and the leopard skin. The worship of Dionysos was an important aspect of ancient Greek culture and had a significant influence on the development of theatre and drama."
 dionysos_adherent: "Dionysian"
 dionysos_adherent_plural: "Dionysians"
 dionysos_old: "Old Rite of Dionysos"
 dionysos_old_adj: "Old Rite Dionysian"
 dionysos_old_adherent: "Old Rite Dionysian"
 dionysos_old_adherent_plural: "Old Rite Dionysians"