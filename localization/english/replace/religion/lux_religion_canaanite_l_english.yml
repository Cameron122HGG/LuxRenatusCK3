beelshamen_old_adherent: "Old Beelshameni"
beelshamen_old_adherent_plural: "Old Beelshamenis"
beelshamen_desc: "The worship of Beelshamen is a Mainstream Archaic Canaanite religion of Statist soul. The antiquity of the worship of the god or gods of Baal extends back to the Bronze Age among the ancient Semitic peoples. The word Baal means "master" or "owner": Baal was once common a name of small Syrian and Persian deities. The Great Baal is the Canaanite god of storm and heavens, worshipped primarily in Palmyra and antique Carthage. In the first century, the Palmyran religion focused increasingly on the trio constituted by the supreme god Beelshamen, the lunar god Aglibol, and the sun god Malakbel. Beelshamen leads the triad: as the lord of heaven, he commands both the moon and the sun. Beelshamen was thus fervently prayed to for the protection of livestock and crops, as he is responsible for sun and rain, as well as droughts, plagues, and other calamities. The ancient religion acquired a new dimension in the 3rd Century as strong monotheist trends coalesced in the cult of Beelshamen during the glorious times of the short-lived Palmyrene Empire. In 260, with the Roman Empire in crisis, Odaenathus and his wife Zenobia, rulers of Palmyra, carved a vast Middle Eastern empire through a series of rapid and successful campaigns and ambitious foreign policies, conquering Syria, the Persian capital Ctesiphon and Egypt. As part of their empire-building efforts, they developed religious pride among their subjects by controlling the clergy and equating Beelshamen with Roman Sol Invictus and Persian Ahura Mazda. Beelshamen's attributes, the eagle and the lightning bolt, became the symbols of the new State as expression of unchallenged authority wherever Palmyrene arms imposed its dominion. Both sovereigns made an explicit parallel between their exceptional deeds and Beelshamen's supremacy among other, lesser Gods, claiming supremacy over lands worshipping other Canaanite or Phoenician deities. While the old Palmyrene Empire failed in its ambitious dream of gathering all Eastern cults into one, the memory of its glory is alive. The cult of Beelshamen retains a strong mystical aura in the lands once Palmyran and beyond. High God: Beelshamen Evil God Names: Mawt Scripture: The Sacred Steles * Priests (Temple holders) can inherit titles Priests can marry * Vassals do not mind if their levies are raised * Beelshameni counties and characters are hard to convert * Beelshameni men can take up to 3 Concubines * Can designate any valid offspring as the heir * Can be Reformed There i."


