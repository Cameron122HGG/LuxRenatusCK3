aglibol_old_adj: "Old Agliboli"
aglibol_old_adherent: "Old Agliboli"
aglibol_old_adherent_plural: "Old Aglibolis"
aglibol_desc: "Name The worship of Aglibol is a Local Archaic Canaanite religion of Messianic Soul. The meaning, in Aramaic, is "Calf of Baal". Aglibol is depicted with a lunar halo decorating his head and sometimes his shoulders, and one of his attributes is the sickle moon. The worship of Aglibol is traditionally strongly associated with Beelshamen's. In the first century, the Palmyran religion focused increasingly on the trio constituted by the supreme god Beelshamen, the sun god Malakbel and the lunar god Aglibol. imerios, Baron o Aglibol was worshipped due to his shadow providing refuge from the sun and his moisture making desert orchards bloom in the early morning. Aglibol is said to wage a continuous war against his brother Malakbel, whereby their father Beelshamen, or Ba'al Samem, keeps on a neutral stance, thus the cycle of day and night. Then came the time of the glorious Palmyrene Empire in the 3rd Century. The Emperor Odaenathus and his wife Zenobia conquered Syria, the Parthian capital and Egypt, worshiping Beelshamen in an increasingly monotheist fashion as a reflection of their own absolute dominion of the lands of men. The new religious doctrine elevated Beelshamen as a rival of Sol Invictus, Ahura Mazda and Yahweh. In this evolving cult, the new Palmyrene State attempted to merge the personality of all lesser Gods, including Aglibol, in the overwhelming figure of Beelshamen. Sacrifices to Aglibol were forbidden. His statues and other representations were removed from the main temples. This only led to Aglibol acquiring a new spiritual appeal. Discontent nobles and their high clerical allies, who perceived absolute monarchy and monotheism as threats to their influences, consciously adhered to the worship of Aglibol as a shadow cult, secretly gathering opponents to the new regime. As the ephemeral Empire collapsed, the followers of Aglibol acquired more freedom and developed their own cult further, maintaining a clout of occult mystery around it to better infiltrate the official Beelshameni clergy. Aglibolis prophesize that the time will come when the Moon God will vanquish the arrogance of the other Gods, topple Beelshamen as Lord of the Heaven and reward those who worshipped Him during the long night of His occultation."

