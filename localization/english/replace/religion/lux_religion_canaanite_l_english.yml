palmyran_pagan_adj: "Elohimi"
palmyran_pagan_adherent: "Elohimi"
palmyran_pagan_adherent_plural: "Elohimis"
palmyran_pagan_old: "Old Elohimism"
palmyran_pagan_old_adj: "Old Rite Elohimi"
palmyran_pagan_old_adherent: "Old Elohimi"
palmyran_pagan_old_adherent_plural: "Old Elohimis"
palmyran_pagan_desc: "The worship of the Elohim (Gods) is a Local Archaic Canaanite faith of Traditional Soul. It refers to the religious traditions of the Canaanite, Phoenician and Nabatean peoples. It is mainly polytheistic, with some monolastic (recognizing many gods, but worshipping one or a few) tendencies. The main gods of the Elohimi pantheon are Ba'al Hadad (God of Storms and the King of the Gods), Ashtart (Goddess of the Fertility and War ), Melqart ( King of Cities and God of Merchants ) and Eshmun (God of Healing), but it also includes many Local Nabatean deities, and patron gods of Canaanite and Phoenician city states."
