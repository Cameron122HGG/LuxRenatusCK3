almaqah: "Almaqahiism"
almaqah_adj: "Almaqahi"
almaqah_adherent: "Almaqahi"
almaqah_adherent_plural: "Almaqahis"
almaqah_old: "Almaqahi Old Rite"
almaqah_old_adj: "Almaqahi Old"
almaqah_old_adherent: "Old Almaqahi"
almaqah_old_adherent_plural: "Old Almaqahis"
almaqah_desc: "The worship of Almaqah is a Mainstream Archaic Arabic religion of Clerical Soul. Almaqah is the great protector and sole patron god of the Sabaeans and especially of the Mukarribs, the unifier kings of Saba, so much that they even call themselves the children of Almaqah and claim direct descent from him. The greatest temple of Almaqah is the huge temple of Awam near Ma'rib, the Sabaean capital. The temple is tended by his priesthood, who perform rites, bless newborns and receive the offerings that are to be placed on Almaah's shrine. A common offering to thank Almaqah usually consist on placing incense or little bronze figurines at his shrines to thank Him for past fortunes and to ask for more fortunes in the future. The rich often order their servants to make steles, statuettes or bronze plates adorned with many different animals, symbols and most importantly an inscription in which they thank Almaqah, the steles are later to be placed at the Local temples. However Almaqah is more than a protector god, he is also a god of fertility. He is the god of seasonal rain, and hence very important to the Sabaeans, as they pride themselves in their agricultural methods. Other aggressive natural phenomena, such as storms and thunders are associated to him as well, and not unlike Ba'al Hadad and other Near Eastern deities, have made his totem animal the bull, though more often, in his shrines one can find depictions of ibexes and mountain goats which are as well associated with the father of the Sabaeans . When Southwestern Arabia was unified by the Mukarrib kings of Saba, they ordered the temples and statues dedicated to other gods, such as 'Attar, Ta-lab or Shams, to be destroyed and replaced by shrines and temples dedicated to Almaqah, establishing their supremacy as unifier kings of the new Sabaean federation. Since then, the glory of Almaqah has made the Sabaeans into a thriving metropolitan culture, and His protective influence has been able to withstand and even turn back the might of Islam during its climax."

hubal: "Hubaliism"
hubal_adj: "Hubali"
hubal_adherent: "Hubalite"
hubal_adherent_plural: "Hubalites"
hubal_desc: "The cult of Hubal is an Heretical Archaic Arabic faith of Traditional Soul. A monotheistic cult worshipping Hubal, one of the main deities of the Arabian religious traditions. Hubal is a god of fertility, spring, abundance and agriculture. A typical altar to Hubal consists of putting his idol on a platform, and putting this above a sacred well dedicated to him. Hubal's idol was the biggest and highest placed in the Kaaba at Meccah before the rise of Islam."