 baltic_pagan_old_adherent:0 "Old Dievasian"
 baltic_pagan_old_adherent_plural:0 "Old Dievasians"
 baltic_pagan_desc:0 "The worship of Dievas is a Local Baltic cult of Traditional Soul, characterized by strong Christian influences. It belongs to the Baltic Civilization, characterized by an emphasis on rural areas, individual martial prowess and low division of labor. Its doctrine is a local Variation of a mainstream religious current, favoring social harmony over doctrinal purity. Its Soul is Traditional: the faith follows the ancient traditions of the commoners and local notables, and it has slowly evolved, if at all, throughout the recent era of troubles and turmoil. It has a Christian ascendant, characterized by a focu on strong rural fortified holdings and special privileges to the clergy."

 perkunas:0 "Perkunas"
 perkunas_adj:0 "Perkunan"
 perkunas_adherent:0 "Perkunan"
 perkunas_adherent_plural:0 "Perkunans"
 perkunas_desc:0 "The cult of Perkunas is a Local Baltic faith of Traditional Soul. It refers to the polytheistic religious traditions of the Baltic peoples, with the god of thunder, Perkunas, as the king of the gods. Dievas is also seen as a supreme god, but in the mainstream doctrine of Baltic paganism, Perkunas has a level of admiration that Dievas does not quite reach, mostly due to his rivalry with the devil. The devil, rather than a malevolent, all-encompassing, corrupting evil, is seen more as a trickster, stealing cattle and weapons, and then hiding in rocks and trees. When Perkunas comes to do battle, it is in the form of a thunder-storm, after which weapons and cattle are returned. Perkunas is also seen as the creator of weapons, or at least the concept of weaponry."
 perkunas_old:0 "Old Perkunas"
 perkunas_old_adj:0 "Old Perkunan"
 perkunas_old_adherent:0 "Old Perkunan"
 perkunas_old_adherent_plural:0 "Old Perkunans"

 saule: "Saule"
 saule_adj: "Saulic"
 saule_adherent: "Saulian"
 saule_adherent_plural: "Saulians"
 saule_desc: "The cult of Saule is a Heretical Baltic faith of Clerical Soul, with strong Graeco-Roman influences. A sun-worshipping cult of the Baltic religions, it is based off the Roman worship of Sol Invictus, wherein the goddess Saule is worshipped as the sole divinity. Saule is the goddess of the sun, mother of the earth and protector of the downtrodden and orphaned. Said to garbed and crowned in gold and to ride through the skies on a chariot led by fiery horses, her worshippers celebrate her warmth and mercy on feast days at the solstices, where the night of festivities is spent weaving wreaths, dancing around great bonfires, and singing hymns of praise until she rises in the morning."
 saule_old: "Old Saulitism"
 saule_old_adj: "Old Saulic"
 saule_old_adherent: "Old Saulian"
 saule_old_adherent_plural: "Old Saulians"

 peckols: "Peckols"
 peckols_adj: "Peckolsic"
 peckols_adherent: "Peckolsite"
 peckols_adherent_plural: "Peckolsites"
 peckols_desc: "The cult of Peckols is a Local Baltic faith of Clerical Soul. Peckolsites worship the twin deities of the underworld, Peckols and Patollo. The two are actually one god split into separate entities, and invariably manifest as angry and evil spirits. The living can expect frightful haunting and mischief on behalf of the gods if their dead are not buried with proper rites, or if their priests are ever disobeyed."
 peckols_old: "Old Peckolsism"
 peckols_old_adj: "Old Peckolsic"
 peckols_old_adherent: "Old Peckolsite"
 peckols_old_adherent_plural: "Old Peckolsites"

