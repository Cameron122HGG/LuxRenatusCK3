 voipel_old_adj: "Old Voipelean"
 voipel_old_adherent: "Old Voipelean"
 voipel_old_adherent_plural: "Old Voipeleans"

 chumbylat: "Chumbylat"
 chumbylat_adj: "Chumbylatic"
 chumbylat_adherent: "Chumbylatite"
 chumbylat_adherent_plural: "Chumbylatites"
 chumbylat_desc: "The worship of Chumbylat is a Local Finnic religion of Traditional Soul, with Steppe influences. An ethnoreligious cult of the Mari people, it focuses on the veneration of the demigod Chumbylat, or Kubrat the Wolf, a legendary warrior hero who united various steppe tribes into a singular mighty khaganate."
