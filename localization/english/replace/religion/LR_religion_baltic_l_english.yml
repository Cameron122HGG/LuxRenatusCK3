 ilmatar_adj:0 "Ilmattarenpalvoja"
 ilmatar_adherent:0 "Ilmattarenpalvoja"
 ilmatar_adherent_plural:0 "Ilmattarenpalvojat"
 ilmatar_desc:0 "The worship of Ilmatar is a Local Finnic faith of Clerical Soul, characterized by strong Norse influences. Ilmattar is the air spirit in the legends of the Kalevala, portrayed as androgynous, possessing both male and female elements. Ilmattar was impregnated by the sea and wind and gave birth to Vainamoinen, the main character in the Kalevala."
