 finnish_pagan:1 "Ukonusko"
 finnish_pagan_adj:1 "Ukonusko"
 finnish_pagan_adherent:1 "Ukonusko"
 finnish_pagan_adherent_plural:1 "Ukonuskos"
 finnish_pagan_desc:1 "Ukonusko ('Faith of Ukko') is a Local Finnic religion of Traditional Soul. It is the ancestral faith of the Finns, in which the sky god Ukko is the supreme deity. Other deities include Akka, goddess of fertility and wife of Ukko, Ahti, the sea god, Tapio, the forest god, Nyyrikki, the god of the hunt, and so forth. There are no holy text for Ukonusko, but the epic folk tale of Finland, the Kalevala, is regarded as a source of information on the beliefs of the Ukonusko adherents. Many rituals common in other ethnoreligions, including sacrifice, bonfires, sacred groves, drinking toasts to the gods, and wooden idols are all elements of Ukonusko."
