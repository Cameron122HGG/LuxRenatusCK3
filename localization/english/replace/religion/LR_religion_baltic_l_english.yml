 voipel: "Voipeleanpalvoja"
 voipel_adj: "Voipelean"
 voipel_adherent: "Voipelean"
 voipel_adherent_plural: "Voipeleans"
 voipel_desc: "The worship of Voipel' is a Local Finnic faith of Messianic Soul. Voipel' is the Komi god of the night and the cold north wind. He is worshipped in great midnight ceremonies during winter, and is expected to devour the world. Great nightly fires are central to worship as their flames reveal Voipel's whirling wind and ward off his frigid wrath."
