 tengri_pagan_old_adj: "Old Tengri"
 tengri_pagan_old_adherent: "Old Tengriist"
 tengri_pagan_old_adherent_plural: "Old Tengriists"
 
 #Rod-Tengriist
 tengri_rod: "Rod Tanri"
 tengri_rod_adj: "Rod Tanrili"
 tengri_rod_possessive: "Rod Tanrili's"
 tengri_rod_adherent: "Rod Tanrili"
 tengri_rod_adherent_plural: "Rod Tanrilis"
 tengri_rod_desc: "The worship of Rod Tanri ('Celestial Rod') is a Local Steppe belief of Statist Soul, with significant Slavic influences. It combines the worship of Gokh Tanri, the Turkic sky god, with the Slavic creator deity Rod. Rod-Tanri is seen as the creator of the world and all minor gods, and he resides in high heavens. To oversee and guide his creation, he has given a mandate to the rightful Prince, whose duty it is to unite the known world under Rod-Tanri's glorious rule. The Rod Tanrili faith has a simple clergy system, featuring priests who mostly tend to congregation members and shrine maintenance, and shamans, who perform mystical rites to gain access to a higher plane of existence from where they can consult Rod Tanri himself on how best to fulfill his holy wishes."
