 magyar_pagan_desc: "The way of the Táltos is a Local Steppe religion of Traditional Soul. In the native $mogyer$ faith each Táltos, or priest, is chosen by the gods prior to their birth. Endowed with superhuman strength, wisdom, and powers, $mogyer_collective_noun$ entrust these Táltos with protecting their communities and leading them to prosperity."

