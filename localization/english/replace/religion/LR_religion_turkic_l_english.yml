 #Manichean-Tengriist
 tengri_mani: "Ak-Koyash"
 tengri_mani_adj: "Ak-Koyashli"
 tengri_mani_adherent: "Koyashist"
 tengri_mani_adherent_plural: "Koyashists"
 tengri_mani_desc: "The worship of Ak-Koyash ('Luminous Koyash') is a Local Steppe faith of Traditional Soul, with strong Gnostic influences. Also known as Manichean-Tengriism it is a hybrid-religion resulting from the melding of Manichaean beliefs and Tengriism. Koyash, the traditional sun god of the Turkic peoples, is transformed into Ak-Koyash, the Luminous One, who brought the teachings of the Light as messenger from Bey Ulgen, the Birch Tree of Life. Emphasis is placed in contacting the ancestral spirits of light through Ak-Koyash in shamanistic ceremonies, as an effort to reclaim good from the evil nature of Erlik Khan, the King of Darkness."
