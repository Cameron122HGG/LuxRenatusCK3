 #Tengri Buddhist
 tengri_bud: "Ata Burkhan"
 tengri_bud_adj: "Ata Burkhanli"
 tengri_bud_possessive: "Ata Burkhanli's"
 tengri_bud_adherent: "Ata Burkhanli"
 tengri_bud_adherent_plural: "Ata Burkhanlis"
 tengri_bud_desc: "The worship of Ata Burkhan ('Forefather Buddha') is a Local Steppe religion of Clerical Soul, under strong Buddhist influences. Adherents worship Ata Burkhan, the Enlightened Sky Father, of which the historical Buddha is an earthly manifestation that resides in the Sky, as well as in numerous other gods and goddesses (especially the Earth Mother) and local spirits both benevolent and malicious. It is believed that the Enlightened Sky Father knows the ways of attaining a blissful, tranquil state without need or suffering, which he teaches to those who reincarnate in his Sky Realm and the his intermediaries on Earth, the shamans. The religion emerged gradually from contacts between local religions of steppe peoples and Buddhist missionaries sent by Ashoka, followed by Sogdian and Indohellenic merchants. As early as the 3rd century BC, Ashoka's missionaries were successful in bringing Dhammas to the steppe wizards, after learning their languages, customs and rites. The steppe wizards, not putting aside their ancient beliefs, recognized the wisdom of Buddha's message, associating him with the Supreme Deity Ata Burkhan. The term of Shaman, from the Sanskrit root 'scha' meaning 'to know', came to designate these spiritual guides of the steppe nomads who incorporated Buddhism into older beliefs, thus accessing to higher enlightenment as well as social status. The shamans, wandering among their followers under a holy protection no Khan would dare violating and regularly gathering around holy mounds following divine guidance, are the pillars of Ata Burkhanli tribes and societies. Shamans, people chosen by the gods, are able to temporarily reach the Spirit Worlds, including the Sky Realm, through meditation, offerings, dance, music, fasting and reciting of sutras and prayers to enter a sacred ecstatic trance. From those journeys they bring back words of wisdom and prophecy, as well as great amounts of good karma for those participating in their rituals and supporting them."
 tengri_bud_old: "Old Ata Burkhan"
 tengri_bud_old_adj: "Old Ata Burkhanli"
 tengri_bud_old_adherent: "Old Ata Burkhanli"
 tengri_bud_old_adherent_plural: "Old Ata Burkhanli"
 
