 tengri_ahriman_adherent_plural: "Ahriman Tanrilis"
 tengri_ahriman_desc: "The cult of Ahriman Tanri ('God Ahriman') is a Heretical Steppe faith of Messianic Soul, with strong Persian influences. This cult believes that the world was created to be a battleground between Ahriman Tanri, who schemes to overturn the corrupted order of the universe and reforge it in blood, and the Great Opponent, the patron of decadent civilizations that hold this impure material realm in writhing, diseased stagnation. The blood of their enemies feeds the sky and gives life to Ahriman Tanri, who in turn empowers his chosen on earth to do his bidding. Followers of the King of Darkness seek to prove their worth by striving for power, destroying their enemies, and casting down false gods wherever they should find them. And so they ride forth, to conquer and scour the lands of the unworthy. Their creed is writ in the merciless slaughter of the meek, the lamentation of widows and daughters, and the razed soil of the lands in their wake. For if the sky is a desert, so should the world below be."
