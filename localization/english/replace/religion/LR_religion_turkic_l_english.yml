 vattisenyaly_desc: "The Vattisen Yaly ('Ancestral Traditions') is a Local Steppe faith of Traditional Soul. It represents the traditional religious customs of the Bolgar peoples. Technically it is considered a form of Tengriism, the Altaic religious traditions, but it differs in the sense that it is heavily Slavicized and has more in common with Finno-Ugric religions than it does with the Steppe faiths. The main deity is Tură, a creator god reminiscent of the Estonian Taara, the Germanic Thor, and Altaic Tengri."
