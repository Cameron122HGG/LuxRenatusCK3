 #Erliki
 erlik: "Erlik"
 erlik_adj: "Erliki"
 erlik_adherent: "Erliki"
 erlik_adherent_plural: "Erlikis"
 erlik_desc: "The worship of Erlik Han is a Heretical Steppe religion of Traditional Soul. Erlik is the god of death, lord of the underworld, and a purveyor of curses and sins. Though reviled and feared among the many wandering peoples of the vast steppe, there are those in the expanse that understand him as a figure of balance and a vital force of nature. When the earth and the heavens were young, and life first blossomed and spread throughout the world, neither man nor animal knew death. Though at first the living rejoiced in their lands of plenty, they grew too many in number before long, descending into a hellish, unceasing suffering of starvation once they had stripped the land of its bounty. Desperate for mercy, the people prayed for an end to their torment. And so it was that Erlik was born into the world, taking the lives of those whose deaths were due and bringing their bodies to Tamag, the fiery world below. A demanding and insatiable lord intent on spreading his dominion, Erlik is granted live sacrifices and offerings to stave off his wrath - both animal and human. Those who follow Erlik Han invoke his power as Lord of the Underworld in their tents and on the battlefield, spilling blood in the dark god's name to earn his favor. Above all else, Erlikis seek to preserve earthly order, and to cull the unworthy from it."
