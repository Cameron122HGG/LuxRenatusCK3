 #Tengriist
 tengri_pagan:1 "Gökh Tanri"
 tengri_pagan_adj:0 "Gökh Tanrili"
 tengri_pagan_adherent:1 "Tengriist"
 tengri_pagan_adherent_plural:1 "Tengriists"
 tengri_pagan_desc:0 "The worship of Gökh Tanri ('Sky God') is a Local Steppe belief of Traditional Soul. A steppe religion loosely worshipping of Tengri, the creator of the world, it also includes worship of several lesser gods and spirits under him, with ancestor worship being a very important part of the faith. There is a strong emphasis on harmony and balance with the world around oneself. It has no organized priesthood, and most contact with the gods is made through shamans."

 tengri_pagan_old:1 "Old Tengriism"
 tengri_pagan_old_adj:1 "Old Tengri"
 tengri_pagan_old_adherent:1 "Old Tengriist"
 tengri_pagan_old_adherent_plural:1 "Old Tengriists"
 
 #Rod-Tengriist
 tengri_rod:0 "Rod Tanri"
 tengri_rod_adj:0 "Rod Tanrili"
 tengri_rod_possessive:0 "Rod Tanrili's"
 tengri_rod_adherent:0 "Rod-Tengriist"
 tengri_rod_adherent_plural:0 "Rod-Tengriists"
 tengri_rod_desc:0 "The worship of Rod Tanri ('Celestial Rod') is a Local Steppe belief of Statist Soul, with significant Slavic influences. It combines the worship of Gokh Tanri, the Turkic sky god, with the Slavic creator deity Rod. Rod-Tanri is seen as the creator of the world and all minor gods, and he resides in high heavens. To oversee and guide his creation, he has given a mandate to the rightful Prince, whose duty it is to unite the known world under Rod-Tanri's glorious rule. The Rod Tanrili faith has a simple clergy system, featuring priests who mostly tend to congregation members and shrine maintenance, and shamans, who perform mystical rites to gain access to a higher plane of existence from where they can consult Rod Tanri himself on how best to fulfill his holy wishes."
 tengri_rod_old:0 "Old Rod Tanrili"
 tengri_rod_old_adj:0 "Old Rod Tanrili"
 tengri_rod_old_possessive:0 "Old Rod Tanrili's"
 tengri_rod_old_adherent:0 "Old Rod Tanrili Adherent"
 tengri_rod_old_adherent_plural:0 "Old Rod Tanrili Adherents"
 
 #Ahriman-Tengriist
 tengri_ahriman:0 "Ahriman Tanri"
 tengri_ahriman_adj:0 "Ahriman Tanrili"
 tengri_ahriman_possessive:0 "Ahriman Tanrili's"
 tengri_ahriman_adherent:0 "Ahriman-Tengriist"
 tengri_ahriman_adherent_plural:0 "Ahriman-Tengriists"
 tengri_ahriman_desc:0 "The cult of Ahriman Tanri ('God Ahriman') is a Heretical Steppe faith of Messianic Soul, with strong Persian influences. This cult believes that the world was created to be a battleground between Ahriman Tanri, who schemes to overturn the corrupted order of the universe and reforge it in blood, and the Great Opponent, the patron of decadent civilizations that hold this impure material realm in writhing, diseased stagnation. The blood of their enemies feeds the sky and gives life to Ahriman Tanri, who in turn empowers his chosen on earth to do his bidding. Followers of the King of Darkness seek to prove their worth by striving for power, destroying their enemies, and casting down false gods wherever they should find them. And so they ride forth, to conquer and scour the lands of the unworthy. Their creed is writ in the merciless slaughter of the meek, the lamentation of widows and daughters, the razed soil of the lands in their wake. For if the sky is a desert, so should the world below be."
 tengri_ahriman_old:0 "Old Ahriman Tanrili"
 tengri_ahriman_old_adj:0 "Old Ahriman Tanrili"
 tengri_ahriman_old_possessive:0 "Old Ahriman Tanrili's"
 tengri_ahriman_old_adherent:0 "Old Ahriman-Tengriist"
 tengri_ahriman_old_adherent_plural:0 "Old Ahriman-Tengriists"
 
 #Manichean-Tengriist
 tengri_mani:0 "Ak-Koyash"
 tengri_mani_adj:0 "Ak-Koyashli"
 tengri_mani_possessive:0 "Ak-Koyash's"
 tengri_mani_adherent:0 "Manichean-Tengriist"
 tengri_mani_adherent_plural:0 "Manichean-Tengriists"
 tengri_mani_old:0 "Old Ak-Koyash"
 tengri_mani_old_adj:0 "Old Ak-Koyashli"
 tengri_mani_old_possessive:0 "Old Manichean Tengriist's"
 tengri_mani_old_adherent:0 "Old Manichean Tengriist"
 tengri_mani_old_adherent_plural:0 "Old Manichean Tengriists"
 tengri_mani_desc:0 "The worship of Ak-Koyash ('Luminous Koyash') is a Local Steppe faith of Traditional Soul, with strong Gnostic influences. Also known as Manichean-Tengriism it is a hybrid-religion resulting from the melding of Manichaean beliefs and Tengriism. Koyash, the traditional sun god of the Turkic peoples, is transformed into Ak-Koyash, the Luminous One, who brought the teachings of the Light as messenger from Bey Ulgen, the Birch Tree of Life. Emphasis is placed in contacting the ancestral spirits of light through Ak-Koyash in shamanistic ceremonies, as an effort to reclaim good from the evil nature of Erlik Khan, the King of Darkness."
 
 #Vattisen Yaly
 vattisenyaly:0 "Vattisen Yaly"
 vattisenyaly_adj:0 "Vattisen Yaly"
 vattisenyaly_adherent:0 "Vattisen Yalist"
 vattisenyaly_adherent_plural:0 "Vattisen Yalists"
 vattisenyaly_desc:0 "The Vattisen Yaly ('Ancestral Traditions') is a Local Steppe faith of Traditional Soul. It represents the traditional religious customs of the Bolgar peoples. Technically it is considered a form of Tengriism, the Altaic religious traditions, but it differs in the sense that it is heavily Slavicized and has more in common with Finno-Ugric religions than it does with the Steppe faiths. The main deity is Tura, a god comparable to the Estonian Taara, the Germanic Thor, and Altaic Tengri."
 vattisenyaly_old:0 "Old Vattisen Yaly"
 vattisenyaly_old_adj:0 "Old Vattisen Yaly"
 vattisenyaly_old_adherent:0 "Old Vattisen Yalist"
 vattisenyaly_old_adherent_plural:0 "Old Vattisen Yalist"
 
 #Confucian Tengriist
 tengri_confucian:0 "Kong Tanri"
 tengri_confucian_adj:0 "Kong Tanrili"
 tengri_confucian_possessive:0 "Kong Tanrili's"
 tengri_confucian_adherent:0 "Confucian Tengriist"
 tengri_confucian_adherent_plural:0 "Confucian Tengriist"
 tengri_confucian_desc:0 "The worship of Kong Tanri ('Celestial Kong') is a Local Steppe faith of Scholarly Soul, with significant Chinese influences. It combines the worship of Gokh Tanri, the Turkic sky god, with the Chinese philosopher Confucius, who is seen as a divine sage and prophet. Kong-Tanri is seen as the creator of the world and all minor gods, and he resides in high heavens. To oversee and guide his creation, he has given a mandate to the rightful Prince, whose duty it is to unite the known world under Kong-Tanri's glorious rule. The Kong Tanrili faith has a simple clergy system, featuring priests who mostly tend to congregation members and shrine maintenance, and scholars, who perform rites to gain access to a higher plane of existence from where they can consult Kong Tanri himself on how best to fulfill his holy wishes." 
