 #Tengriist
 tengri_pagan: "Gökh Tanri"
 tengri_pagan_adj: "Gökh Tanrili"
 tengri_pagan_adherent: "Tengriist"
 tengri_pagan_adherent_plural: "Tengriists"
 tengri_pagan_desc: "The worship of Gökh Tanri ('Sky God') is a Local Steppe belief of Traditional Soul. A steppe religion loosely worshipping of Tengri, the creator of the world, it also includes worship of several lesser gods and spirits under him, with ancestor worship being a very important part of the faith. There is a strong emphasis on harmony and balance with the world around oneself. It has no organized priesthood, and most contact with the gods is made through shamans."
