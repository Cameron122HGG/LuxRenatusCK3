 tengri_confucian_adherent: "Kong Tanrili"
 tengri_confucian_adherent_plural: "Kong Tanrilis"
 tengri_confucian_desc: "The worship of Kong Tanri ('Celestial Kong') is a Local Steppe faith of Scholarly Soul, with significant Chinese influences. It combines the worship of Gokh Tanri, the Turkic sky god, with the Chinese philosopher Confucius, who is seen as a divine sage and prophet. Kong-Tanri is seen as the creator of the world and all minor gods, and he resides in high heavens. To oversee and guide his creation, he has given a mandate to the rightful Prince, whose duty it is to unite the known world under Kong-Tanri's glorious rule. The Kong Tanrili faith has a simple clergy system, featuring priests who mostly tend to congregation members and shrine maintenance, and scholars, who perform rites to gain access to a higher plane of existence from where they can consult Kong Tanri himself on how best to fulfill his holy wishes." 
