 #Neoplatonic-Group Faiths

 neoplato: "Neoplatonism"
 neoplato_adj: "Neoplatonic"
 neoplato_adherent: "Neoplatonist"
 neoplato_adherent_plural: "Neoplatonists"
 neoplato_desc: "The teachings of Neoplatonism are a Gnostic Mainstream religion of Scholarly soul, with a strong Greco-Roman ascendancy. In many ways, Neoplatonic mysticism is the culmination of Greco-Roman religious thought. Drawing from traditional religious practice, mystery cults, orientalism, and the philosophical tradition, Neoplatonism presents an organized, and in the view of its practitioners definitive, revival of traditional Hellenistic practices. Essentially, the tenets include belief in the One and Infinite, the source of all life in the universe. Since it is beyond the level of being, it cannot be understood or comprehended, according to Plato. The One emanates *nous*, the perfect image of the One. This *nous* is simultaneously being and thought, and could be summarized by pure intellect. This is the highest level obtainable by man, and the *nous* corresponds perfectly to the One but is distinct and separate, as nothing reaches the level of the One. Under the One, there are three levels of celestial hierarchy: the Hypercosmic Gods, who make Essence, Life, and Soul, the Demiurge, known as the creator, and the Cosmic Gods, who make Being, Nature, and Matter. Even though Neoplatonists scholars gather in councils at academies all around the world, the greatest philosophers and thinkers discuss the teachings and ethos of Neoplatonism at the Neoplatonist Academy in Athens. The Scholarch is considered the foremost intellectual authority in Neoplatonism, and is usually elected by a council of the greatest philosophers and thinkers from all around the world."
 
 plato_pythagorean: "Neopythagoreanism"
 plato_pythagorean_adj: "Neopythagorean"
 plato_pythagorean_adherent: "Neopythagorean"
 plato_pythagorean_adherent_plural: "Neopythagoreans"
 plato_pythagorean_desc: "Neopythagoreanism is a Local Neoplatonist belief of Scholarly soul and strong Gnostic influences. In its origins in the 1st century, it was a response to the dominating school of thought in the Hellenistic world, Stoicism, an attempt to introduce more spiritual, mystical elements to Hellenistic philosophy. Apollonius of Triana and Moderatus of Gades, disciples of Nigidus Figulus, met in what would be called the First Secret Communion and symbolically married, giving birth to the long tradition of Pythagorean same-sex marriages between companions in the faith. Then in 179 CE, Numenius of Apamea fused elements of Platonism with the old Pythagorean political and spiritual structure, and in what is now called the Numerian Affirmation, created the Neopythagorean School that still exists today. They believed that there was one God, the One, the Perfect Monad, of which the number One was herald and avatar, since One signifies fullness, perfection and omnipresence. From thence, the Dual appeared, the two universes, the material and the immaterial, while the Monad emanates more and more numbers and fractions that echo in our world, but that exist fully in the real world, the spiritual world, where the soul belongs and where it longs to return. They also created a hierarchy of virtues and followed an ascetic way of life in which the important was not to do good, but to have the will to do good, since the thought was more important than the flesh, the 'muddy vest of decay'."

 porphyryan: "Porphyrianism"
 porphyryan_adj: "Porphyrian"
 porphyryan_adherent: "Porphyrian"
 porphyryan_adherent_plural: "Porphyrians"
 porphyryan_desc: "Porphyryanism is a Local Graeco-Roman belief of Scholarly Soul. An anti-Christian branch of Neoplatonism founded by Porphyry of Tyre. Porphyry advocated that 'the Gods have proclaimed Christ most pious, but the Christians are a confused and vicious sect', and as a result there is much disdain for Christianity in this sect of Neoplatonism. Still, the faith remains highly influenced by the gnostic Jewish and Christian movements of the Levant, seeking to combine philosophical theories of the universe with esoteric rituals to uncover hidden truths. Porphyryans also practice vegetarianism on both spiritual and ethical grounds, under the belief that animals are as sentient as human beings, as enforced by mainstream Neoplatonism."

 plato_christ: "Scholastic Christianity"
 plato_christ_adj: "Scholasticist"
 plato_christ_adherent: "Scholasticist"
 plato_christ_adherent_plural: "Scholasticists"
 plato_christ_desc: "The beliefs and practices of Augustinism and Origenism, known overall as Scholastic Christianity, constitute a Neoplatonic philosophical-religious system of Scholarly Soul under strong Christian influences. Although the fusion between Christian and Neoplatonic concepts began almost immediately, to the extent both systems had a lasting influence on one another, Scholastic Christianity constitutes yet another distinct stream of ideas. It first appeared to the greater public in the scholar Augustine of Hippo's Memories. Augustine, a great mystic and philosopher from Africa, revered by the Church and the Academy alike, began his metaphysical journey first as a Manichean believer. He later turned to Platonism and last converted to Christianity. In the decisive last years of is life, he turned again to Platonism, although not relinquishing fully the legacy of Christianity. In the beginning of the 4th century, he taught his followers the ideal of a perfect system where Christian and Platonic ideals work like clockwork and God's light shines over everyone, as best enumerated in his famous 'City of God'. His teachings became widespread among the educated classes of the great cities of Italy and Africa thanks to great thinkers like Boethius. In the East the disciples of Origen had already, in the 3rd century, established a thriving community of intellectual exchange of Christian and Platonic ideas. Augustinians travelled constantly between Carthage, Rome, Arelate, Syracuse, and Alexandria, creating what is known now as the Academic Circuit that goes around the Mediterranean and beyond, as far east as Gades, as far north as Krakow, as far south as Timbuktu and as far east as Pataliputra. Both currents join efforts in aggressively challenging the mainstream Christian churches' religious supremacy over the Christ's legacy through debates and controversies."

 plato_islam: "Falsafa"
 plato_islam_adj: "Falsafi"
 plato_islam_adherent: "Falsafi"
 plato_islam_adherent_plural: "Falsafis"
 plato_islam_desc: "Falsafa, or Platonic Islam, is a Heretical Neoplatonic belief of Scholarly soul with a strong Islamic ascendant. 'Falsafa' is the Islamic concept of Philosophy understood as the pursuit of inquiry and understanding of the nature of the world, material and spiritual, and of the order of things. In this perspective, the One, Allah, emanated energy and matter in order to create the Universe perfect and beautiful, but the matter, intended consequence of the Creation, was a by-product of the spirit, and thus trapped in its own inadequacy to perceive the higher elements of the Universe. Ever since the First Arab Siege of Alexandria in 641 CE, Islamic presence in Egypt has grown dynamically without the sponsorship of strong, lasting empires to ensure its homogeneity. Thus, when the didacts and scholarchs at Alexandria began to hear about the new faith the Arabs brought with them, the Last Revelation, the Submission to the One, they imported their holy book and invited Muslim doctors in order to learn more about this new view of the world. They soon discovered it was fully compatible with Platonic ideas and that new subtleties could be introduced. Greek translations of the Qur'an were made, as well as Arabic ones of the greatest Platonic texts, resulting in a vibrant new community of Hellenized Muslims in the newly established Madrassa of Alexandria."

 plato_hindu: "Platonic Vedanta"
 plato_hindu_adj: "Platonic Vedantic"
 plato_hindu_adherent: "Platonic Hindu"
 plato_hindu_adherent_plural: "Platonic Hindus"
 plato_hindu_desc: "Platonic Vedanta is a Local Neoplatonist faith of Scholarly Soul with strong Gnostic influences. In the 8th century, Academy-trained scholarch Guru Shankara formalized the ancient Indian philosophy of Advaita Vedanta within the context of Western Neoplatonic thought. Vedantists believe the world of experience is a dream, and that consciousness - a singular, transcendent entity - is the dreamer."