 #Mithraic
 mithras: "Mithraism"
 mithras_adj: "Mithraic"
 mithras_adherent: "Mithraist"
 mithras_adherent_plural: "Mithraists"
 mithras_desc: "Mithraism is a Mainstream Gnostic religion of Martial Soul. It is a cult venerating Mithras, a Roman deity based off the Zoroastrian divinity of covenant and oath, Mitra. Worshippers of Mithras have a complex system of seven grades of initiation, with ritual meals. Iconic scenes of Mithraic mythology include Mithras being born out of rock, him hunting and slaughtering a sacred bull with his bare hands and holding banquets with Sol. Very popular with the Roman soldiery, various military enclaves of the former Roman Empire now hold Mithraism as their state cult."

 #Mithraic Christian
 mithras_christ: "Mithraic Christianity"
 mithras_christ_adj: "Mithraic Christian"
 mithras_christ_adherent: "Mithraic Christian"
 mithras_christ_adherent_plural: "Mithraic Christians"
 mithras_christ_desc: "The cult of Mithras Christos is Heretical Gnostic faith of Martial Soul, with strong Christian influences. Mithraic Christians, also often called Tauraimanians ('Blood of the Bull') are a distaff sect of Mithraism which believes that Jesus of Nazareth was the incarnation of Mithras, 'Mithras Christos'. It combines many Mithraic and Christian elements, but the core belief is that Christ is Mithras made flesh as Redeemer of the World. Mithraic Christianity is very different in its message in that it is highly militant, the faithful believe in sacrificing themselves in 'fighting evil' at all costs."

