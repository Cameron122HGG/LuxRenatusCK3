 #Eosphorist
 sol_mithras: "Eosphorism"
 sol_mithras_adj: "Eosphorist"
 sol_mithras_adherent: "Eosphorist"
 sol_mithras_adherent_plural: "Eosphorists"
 sol_mithras_desc: "The cult of Eosphoros ('the Lightbringer') is a Local Gnostic faith of Martial Soul, with strong Graeco-Roman influences. Eosphorism is a union of Mithras and Sol into a new figure, Eosphoros - The Dawn Bringer. Elements of the Judaeo-Christian tradition are also included, notably the identification of Eosphoros with Lucifer, a direct enemy of the God of Abraham. Eosphorism sees the Dawn Bringer as the True God and Creator of Humanity, and Yahweh as nothing more than a conniving, tyrannical usurper of His place in the cosmos. Its ethos and theological underpinning is thus deeply militaristic, seeing Christianity as an abomination to be exterminated. The cult's overarching mythology is centered around the battle with Yahweh and Christ, exalting Eosphoros as the Redeemer of Mankind, the Fallen God rising again in the Morning. He overcomes Yahweh, the Oppressor God, to help liberate humanity and bring Salvation. He is a Lord of Hosts, a Battle-Lord of the Morning, locked in battle with Yahweh, until his future victory and Redemption of Humanity in His Light. Followers believe that Eosphoros' light will bring harmony to the world, and that there will be no peace for so long as the Cross stands."

