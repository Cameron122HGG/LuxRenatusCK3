 #Theomachian
 mani_mithras: "Theomachia"
 mani_mithras_adj: "Theomachian"
 mani_mithras_adherent: "Theomachian"
 mani_mithras_adherent_plural: "Theomachians"
 mani_mithras_desc: "The Theomachian ('Battle of the Gods') cult is a Local Gnostic religion of Martial Soul, with strong Persian influences. It is a syncretic faith composed by many elements of Graeco-Roman mythology, Manichaeism, and Mithraism via its great success within the Roman military, turning to the idea that the world is the battleground of the Gods and that all life is part of a great battle between life and death, light and shadow, and that each mortal must give their all in the fight against the forces of darkness. Theomachians believe that all those who do not partake in their endeavor are servants of darkness and are to be destroyed."
 
