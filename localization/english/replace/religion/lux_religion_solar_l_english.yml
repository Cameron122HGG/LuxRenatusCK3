 #Solar-Group Faiths
 sol_imperial: "Solar-Imperialism"
 sol_imperial_adj: "Solar-Imperial"
 sol_imperial_adherent: "Solar-Imperial"
 sol_imperial_adherent_plural: "Solar-Imperials"
 sol_imperial_desc: "The Imperial Church of the Unconquered Sun is a [mainstream|E] [graeco_roman|E] faith of [statist|E] Soul. The central figure of this faith is Sol Invictus incarnated in the flesh as the Imperator of the Roman Empire. As such, the Imperator is perceived as a divine figure having unquestionable authority, be it secular or spiritual. Since its introduction by Imperator Commodus in the 2nd Century CE, Solar-Imperialism became one of the most widespread and influential religions of the world, influencing religious systems from Britannia and Scandinavia all the way to Ethiopia. Two of the most distinguishing practices of the Sol-Imperial cult are the celebration of the 25th of December; Dies Natalis Sol Invictus - 'Day of the Invincible Sun's Birth' and the practice of 'going into the desert' - a practice in which the aging emperor abdicates the throne in favor of his heir, so that the new Sun would rise as the old one sets. Still, peaceful transitions of power are rather rare - with most emperors either slain in battle or murdered by palace plotters."

