 sol_apollo: "Apollo-Helios"
 sol_apollo_adj: "Apollo-Heliosean"
 sol_apollo_adherent: "Apollo-Heliosean"
 sol_apollo_adherent_plural: "Apollo-Helioseans"
 sol_apollo_desc: "The cult of Apollo-Helios is a Local Graeco-Roman faith of Statist Soul. A Hellenistic version of the worship of Sol Invictus, with Apollo being the monotheistic god in focus. Unlike in Solar-Imperialism, they do not believe any emperor or ruler is Apollo-incarnate."
 sol_sahara: "Dulefukanism"
 sol_sahara_adj: "Dulefukan"
 sol_sahara_adherent: "Dulefukan"
 sol_sahara_adherent_plural: "Dulefukans"
 sol_sahara_desc: "The Dulefukan ('Red Sun') cult is a Local Saharan faith of Messianic Soul, with strong Graeco-Roman influences. This religion belongs to the Fur migrants who settled in the area west of the Nile. Legend has it that while moving in the desert, the early Fur in the area came across pale-skinned men in ornate dress who appeared to be dying of thirst. When provided with aid, they said that they were tasked with escorting the Sun Emperor - whom they called 'Sol Invictus' - into the desert as per their servitude to their Lord Made Flesh. They also said that he will return one day to rule forever. The nomads were fascinated by these strange light-skinned wanderers, and believed them to be celestial servants of this Sol Invictus. The men were revered by the tribe and treated akin to saints. As time and generations went on, and light-skinned people became more and more familiar to the Fur, they would soon cease to be regarded as celestial beings but rather as the first missionaries to the Fur in spreading the will of Sol Invictus. These first companions of the Sun Emperor are still regarded as messengers of Sol Invictus, who were meant to be found by the Fur. Yet the Followers of the Red Sun, for all their overt worship of the One True Solar God, do not recognize the validity of the current emperor, for they believe that the true Sun Emperor will return one day, and that all others are either imposters or lesser servants awaiting his return."

 sol_tsahay: "Ts'ähäy Maḥremism"
 sol_tsahay_adj: "Ts'ähäy Maḥremite"
 sol_tsahay_adherent: "Ts'ähäy Maḥremite"
 sol_tsahay_adherent_plural: "Ts'ähäy Maḥremites"
 sol_tsahay_desc: "The cult of Ts'ähäy Maḥrem ('Sun Mahrem') is a Local Archaic Solar faith of Martial Soul, with strong Graeco-Roman influences. It is an Ethiopian cult based on the Roman worship of Sol Invictus, wherein Maḥrem, the Axumite god of war oft equated with Ares and Mars, takes on Solar attributes and is worshipped in monotheistic fashion. This worship is far more militaristic in nature than its Roman counterpart, owing to Maḥrem's origins. Much like with Solar-Imperialism and Sol Invictus, the ruling dynasty claims direct descent from Ts'ähäy Maḥrem."
 sol_tsashay_war_god_name: "Ts'ähäy Maḥrem"
 sol_tsashay_war_god_name_possessive: "Ts'ähäy Maḥrem's"

 sol_norse: "Sólar-Ódinnism"
 sol_norse_adj: "Ódinn-Sólar"
 sol_norse_adherent: "Solar-Ódinnist"
 sol_norse_adherent_plural: "Solar-Ódinnists"
 sol_norse_old: "Ódinn-Sól"
 sol_norse_desc: "The worship of Ódinn-Sól is a Local Norse cult of Statist Soul, characterized by strong Graeco-Roman influences. Increasing contacts with the Roman Empire by Varangian captains led to a synthesis between the traditional Nordic deity Odinn with the Roman cult of Sol Invictus. This synthesis makes Odinn-Sol a patron of rulers, associated with victorious conquests and wise administration alike. The chief attribute of Odinn-Sol is his single eye, representing the solar disc. It is said that Odinn sacrificed his other eye to gain infinite wisdom, so that he can shine upon the world for only half of a day. Another chief belief is the so-called Ragnarok ('Twilight of the Gods') when the forces of darkness would rise against the Sun, and the next world would be born anew from the ashes of the previous. Solar eclipses are of particular importance for the followers of Odinn-Sol, for they believe that during each eclipse the forces of darkness attempt to strike against the Solar deity, only to be thwarted by Ódinn-Sól's divine power."
 sol_norse_high_god: "Ódinn-Sól"
 sol_norse_old_adj: "Old Ódinn-Sólar"
 sol_norse_old_adherent: "Old Solar-Ódinnist"
 sol_norse_old_adherent_plural: "Old Solar-Ódinnist"

 sol_slav: "Horsism"
 sol_slav_adj: "Horsic"
 sol_slav_adherent: "Horsic"
 sol_slav_adherent_plural: "Horsics"
 sol_slav_old: "Hors Old Rite"
 sol_slav_old_adj: "Horsic Old Rite"
 sol_slav_old_adherent: "Horsic Old Riter"
 sol_slav_old_adherent_plural: "Horsic Old Riters"
 sol_slav_desc: "The worship of Hors is a Local Slavic religion of Statist Soul, with significant Graeco-Roman influences. Hors is the Slavic sun god, a personification of the solar disc. According to the mythos, Hors travels across the sky at day and moves underground at night, fighting off the monsters living there. One common Horsic belief is that red sunrises are caused by blood split by Hors during his nocturnal journey. Hors is interpreted as source of all light and life in the world - although the creation itself is usually attributed to Rod. Roman influence has resulted in partial association of Hors with Sol Invictus - each ruler is enthroned during sunrise, with prayers and offerings being made to Hors, protector of the realm. Additionally, the ruler is considered to have a special relationship with Hors, giving blessings on the god's behalf."
 
 sol_mani: "Solar-Manichaeism"
 sol_mani_adj: "Solar-Manichean"
 sol_mani_adherent: "Solar-Manichean"
 sol_mani_adherent_plural: "Solar-Manicheans"
 sol_mani_desc: "Solar-Manicheaism is a Local Gnostic faith of Statist Soul, with strong Persian influences. A hybrid-religion that worships Sol Invictus as the God of Light in Manichaean fashion, fighting against Ahriman, the king of darkness."

 sol_mithras: "Eosphorism"
 sol_mithras_adj: "Eosphorist"
 sol_mithras_adherent: "Eosphorist"
 sol_mithras_adherent_plural: "Eosphorists"
 sol_mithras_old: "Eosphorism Old Rite"
 sol_mithras_old_adj: "Eosphorist Old Rite"
 sol_mithras_old_adherent: "Eosphorist Old Riter"
 sol_mithras_old_adherent_plural: "Eosphorist Old Riters"
 sol_mithras_desc: "The cult of Eosphoros ('the Lightbringer') is a Local Graeco-Roman faith of Martial Soul, with strong Gnostic influences. Eosphorism is an union of Mithras and Sol into a new figure, Eosphoros - The Dawn Bringer. Elements of the Judaeo-Christian tradition are also included, Eosphoros is Lucifer, and a direct Enemy of Christianity. Eosphorism sees the Dawn Bringer as the True God and Creator of Humanity, with Christianity being an abomination to be exterminated. It is a highly militaristic anti-Christian religion. Partly as a reaction against-Christianity, Eosphoros becomes Lucifer. Part of his mythology is centered around his Battle with Yahweh and Christ. He is the true Creator of Humanity and Redeemer, the Fallen God rising again in the Morning. He overcomes Yahweh, the Oppressor God, to help liberate humanity and bring Salvation. He is a Lord of Hosts, a Battle-Lord of the Morning, locked in battle with Yahweh until his future victory and Redemption of Humanity in His Light. Followers believe that Eosphoros' light will bring harmony to the world." 