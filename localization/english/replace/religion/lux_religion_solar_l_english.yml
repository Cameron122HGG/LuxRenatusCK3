 sol_christ: "Solar-Christianity"
 sol_christ_adj: "Solar-Christian"
 sol_christ_adherent: "Solar-Christian"
 sol_christ_adherent_plural: "Solar-Christians"
 sol_christ_desc: "Solar-Christianity is a Heretical Graeco-Roman religion of Statist soul, with significant Christian influences. Also called Helianism, it was established in the 4th Century CE and popularized during the reign of Imperator Alexander VII. Solar-Christianity claims that the Christian prophet, Jesus of Nazareth, is the only true Sun incarnate and the son of God. While it does share basic elements with other Christian creeds, its pagan elements, such as the adaptation of Dies Natalis Sol Invictus as central holiday, or the personality cult of the Imperator as Christ's sole successor, make other Christian creeds treat their Solar brethren with suspicion and caution."

 sol_boreas: "Apollo-Boreas"
 sol_boreas_adj: "Apollo-Borean"
 sol_boreas_adherent: "Apollo-Borean"
 sol_boreas_adherent_plural: "Apollo-Boreans"
 sol_boreas_desc: "The cult of Apollo-Boreas is a Local Graeco-Roman faith of of Statist soul, with strong Steppe influences. Apollo-Boreas is the union of Apollo, the sun god, and Boreas, the northern wind god, the Devouring One. Boreas was adopted as a patron by the Bosporan Kings - as a cruel unforgiving God he complements the benevolent side of Apollo - together they form a two-faced God reveling in the duality of good and evil. In the first half of the year, the aspect of Apollo is venerated for his warmth and for the other half, the aspect of Boreas is offered sacrifices to stave off the cold of winter."

