 roman_imperial_desc: "The Imperial Cult is a Local Graeco-Roman religion of Statist Soul. It is an offshoot of traditional Roman religious practices as they evolved starting from the early Principate of Augustus. In a similar fashion to classical Graeco-Roman beliefs, religious practices involve offerings, ranging from wine to animal sacrifices, to the gods of the classical pantheon - notably the Capitoline Triad of Jupiter, Juno and Minerva, as well as other gods like Vesta and Mars. In the Imperial Cult, this worship includes the emperors as well, along with some members of their families with the divinely sanctioned authority of the Roman State, who serve as guardians of the traditional values and worship of the gods. The *cultus* to a living emperor acknowledges his office and rule as divinely approved and constitutional - his Principate should, therefore, demonstrate pious respect for traditional deities and values. A deceased emperor held worthy of the honor can be voted a state divinity (divus) by the Senate and elevated as such in an act of apotheosis. The granting of apotheosis serves religious, political, and moral judgment on Imperial rulers, and allows living Emperors to associate themselves with a well-regarded lineage of Imperial divi from which unpopular or unworthy predecessors are excluded. The clergy is strictly organized, with the Emperor acting as the Pontifex Maximus. The major deities have their own organized priesthoods, all under spiritual guidance from the Pontifex Maximus." 
 
 roman_imperial_religious_head_title: "Pontifex Augustalis"
 roman_imperial_religious_head_title_name: "Collegium Augustalis"

 roman_jupiter: "Mos Jovis"
 roman_jupiter_adj: "Jovian"
 roman_jupiter_adherent: "Jovian"
 roman_jupiter_adherent_plural: "Jovians"
 roman_jupiter_desc: "The Mos Jovis ('Jovian Tradition') is a Local Graeco-Roman religion of Statist soul and Christian ascendant. In the wake of the new age that the rising monotheistic religions of Late Antiquity brought forth, other religions followed their path. The strong cult of Jupiter and Hercules sponsored by the Roman Empire since the times of Diocletian lived on, dwindling in number of followers but growing stronger in community and cohesion. In Anatolia, the last bastion of this tradition, it absorbed a breath of the spirit of the age and Jupiter came to be equated with the Christian God, his bitter rival. So it was that Jupiter Optimus Maximus, Jovis Basileus, adopted Anatolian religious traditions, the most important of which was that of Jupiter Dolichenus or Jupiter-Baal, the Commagenean King of the Gods, and its particular blend of monolatry. From then on Jupiter was King, Judge, and Genesis of the World, and in Anatolia a renewed network of Flamines and Augurs kept the temples and the sacrificial arae open and running, even in secret if needed. These strong communal ties allowed the Jovian Tradition to make its believers everywhere in Anatolia a bastion of their own, a beacon of solidarity, and the support of the state ensures the public aspect of the rites is preserved, while the ruler also seizes the prizes of the communal faith and its Dolichene Mysteries in the unwavering faith of its followers."

 holy_order_herculiani: "Herculiani"
 holy_order_joviani: "Joviani"

