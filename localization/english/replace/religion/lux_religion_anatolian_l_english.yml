 cybele: "Cybelean Mother Cult"
 cybele_adj: "Cybelean"
 cybele_adherent: "Cybelean"
 cybele_adherent_plural: "Cybeleans"
 cybele_desc: "The cult of Cybele is a Local Graeco-Roman faith of Clerical Soul. The faith is a henotheistic faith that is a legacy from the antique Phrygians, dwellers of Western Anatolia in the Bronze Age, who worshipped 'Matar Kubileya', the Mother Goddess. Greek settlers arriving in Asia Minor in the beginning of the Iron Age adopted the Phrygian cult, centering their worship on Cybele, the Earth Mother, an exemplar of devoted motherhood, the Mistress of Animals, ever accompanied by lions that flank her, sit in her lap and draw her chariot. From the shores of Asia Minor the cult spread westwards and met considerable success, as Cybele was equated with other Greek deities such as Demeter and Gaïa. In spite of her popularity, Cybele remained controversial and was perceived as an ambiguous symbol of exotic foreignness among Western Greeks, to the extent that the spread of cult was accompanied by violent debates and even conflicts. Many kings in Asia Minor, in particular Eumenes I of Pergamum, saw the political opportunity of supporting a cult distinguishing a strong local identity against other Hellenistic realms and adopted Cybele as their protectors. As the rise of Rome provoked the political and cultural integration of Asian Minor realms in the global Empire, the worship of Cybele evolved from being a State religion sponsored by ambitious petty Kings to becoming a more occult mystery cult, still strongly associated with Anatolian identity. Deprived of political sponsorship, the cult now strived on the appeal of its esoteric rites involving ecstatic music, dancing and self-castration as a sign of devotion to the Goddess. Those individuals initiated to the higher degrees of the Cybelite cult hold considerable influence in their society. Thus the cult constitutes a highly structured hierarchy, informal and decentralized, but that works in parallel to the mundane social and political structures."

 tarhunt: "Tarhuntism"
 tarhunt_adj: "Tarhuntite"
 tarhunt_adherent: "Tarhuntite"
 tarhunt_adherent_plural: "Tarhuntites"
 tarhunt_desc: "The worship of Tarhunt is a Local Archaic Hittite religion of Martial Soul. At the time of the reformation of the Luwian faith by the Isaurian emperor Leo III in the 8th century, frontier areas of the client-kingdom of Isauria followed a slightly different interpretation, originating from their long experiences of defending their realm against the threat of assertive neighbors. While recognizing the Sun Goddess Arinniti, they focus their attention on Tarhunt, the god of sky and storm, holding a triple thunderbolt and a double-headed axe, slayer of the evil dragon Illuyanka. Worshippers of Tarhunt consider themselves as the holiest of all Luwian, the first line of defense of their ancient civilization."

 illuyanka: "Illuyankism"
 illuyanka_adj: "Illuyankite"
 illuyanka_adherent: "Illuyankite"
 illuyanka_adherent_plural: "Illuyankites"
 illuyanka_desc: "The cult of Illuyanka is an Heretical Archaic Hittite faith of Traditional Soul. According to ancient Hittite legend, the sky god Tarhunt defeated the serpent dragon Illuyanka in battle and emerged as the supreme divine entity. As the Isaurian Emperor Leo III reformed the beliefs of the Chosen People of Light (the Luwians) to adapt the creed to his imperial agenda, some remote communities led by Leo III's own bastard daughter resisted the changes brought by the religious reforms. Their doctrinal opposition went so far at to defy orthodox Luwian dogma by claiming that the dragon Illuyanka actually vanquished Tarhunt and emerged as the supreme divine entity, guiding his followers through the ages of darkness to come. Illuyankan worshippers maintain isolated, secretive, and defiant communities, resistant towards the external world - Luwian or else."