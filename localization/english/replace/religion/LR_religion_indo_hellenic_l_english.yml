 #Sindhian Hinduism
 sindh_indohelen: "Sindhian Hinduism"
 sindh_indohelen_adj: "Sindhian"
 sindh_indohelen_adherent: "Sindhian Hindu"
 sindh_indohelen_adherent_plural: "Sindhian Hindus"
 sindh_indohelen_desc: "Sindhian Hinduism is a Local Graeco-Roman faith of Statist Soul, characterized by strong Indian influences. The Sindhian school of Hinduism emerged in 155 BCE following Menander's conquest of Sri Lanka. Many Indo-Hellenic reforms, rituals, and interpretations have been merged with the Hindu faith to create one of the largest state-run theological schools in India. Routine rituals and festivals are performed by an ordained member of the Vedic Brotherhood, and often resemble traditional Hindu rituals with a heavy Hellenic influence, in both practice and iconography. The Vedic Brotherhood was founded by Menander in an effort to subdue the local populace and further the Hellenization of India."
