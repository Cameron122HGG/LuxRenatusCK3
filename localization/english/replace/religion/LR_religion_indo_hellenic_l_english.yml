 indo_hellenic_religion: "Indo-Hellenism"
 indo_hellenic_religion_adj: "Indo-Hellenic"
 indo_hellenic_religion_adherent: "Indo-Hellene"
 indo_hellenic_religion_adherent_plural: "Indo-Hellenes"
 indo_hellenic_religion_desc: "As the Greeks conquered Transoxiane and beyond, they brought their own belief system in the Eastern lands, and were exposed to new ones. When local princes did not favor one influence over the others, conquerors and commoners gradually integrated these new elements into the classical Hellenistic pantheon. Greeks were willing to acknowledge and in some cases even promote Indian deities they encountered in the northwestern subcontinent. While Buddhism, Hinduism, and Zoroastrianism have all had a sizeable influence on the development of the Indo-Hellenic religion, certain religions feature more prominently in various strains of this faith, and while some of these denominations may have cut ties and established a canon doctrine, the mainstream movement has maintained balance through the ever-changing times. The Hellenistic element remains dominant and aggregates all these elements: it not uncommon to see Zeus in presence of a both a Buddhist lion and the Hindu goddess Lakshmi in a single temple."

