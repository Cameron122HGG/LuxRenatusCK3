 german_pagan_old_adherent:0 "Old Germanic Polytheist"
 german_pagan_old_adherent_plural:0 "Old Germanic Polytheists"
 
 ragnarok:0 "Ginungstru"
 ragnarok_adj:0 "Ginungatru"
 ragnarok_adherent:0 "Ginungatruan"
 ragnarok_adherent_plural:0 "Ginungstruande"
 ragnarok_desc:0 "Ginungstru is a Norse faith with Zoroastrian, Gnostic, Buddhist and Neoplatonist influences, emerging from the crash of ideas from the two great empires south of the Varangian colonies among the Rus. Ginungstru, meaning Creative Faith, refocuses Norse mythology on the very beginning of space and time itself, Ginungagap, the Gap of Creation through which the primordial energies of heat and cold interacted to birth time and space. Matter itself is viewed with mild resentment, usually referenced as *Ymir,* after the primordial creature from which most matter was formed by the Aesir, including Odin and his brothers, creating humans by breathing a remnant of the Ginungagap’s creative energies into them. Borrowing from the Ragnarökic faith, the Ginungatru believe in the Twilight of the Gods as a just punishment of the Aesir for their corruption of Creation, but unlike that other faith see this event as already passed. Baldr, having been returned to the physical realm and blessed with knowledge of pure Creation beyond matter, was the great Prophet of this new era in which humans find themselves free of fading Old Gods who now have but lingering malign influence on the world. Instead humans must seek to embrace universal Order and fight Chaos, to make Creation more alike to the Uncreated Ginungagap. Through maintaining order in the world, they can ascend into the higher plane of non-material existence, or follow the example of Mimir and Baldr and be reborn through the *Lifsmeiðr,* Tree of Life, usually equated with Yggdrasil or Mimir's Tree. Those seen as reborn in this way are treated with an almost messianic reverence as guiding figures towards achieving universal Order and unity with Ginungagap."
 ragnarok_old:0 "Old Ginungstru"
 ragnarok_old_adj:0 "Old Ginungatru"
 ragnarok_old_adherent:0 "Old Ginungatruan"