 norse_pagan:0 "Forn Siðr"
 norse_pagan_adj:0 "Forn Siðric"
 norse_pagan_desc:0 "The Forn Siðr ('Old Custom') is a Mainstream Norse faith of Traditional soul. It refers to the polytheistic religious traditions of the Norse people. Many gods and goddesses are worshipped and venerated, and even though adherents may specialize their worship to a particular god or goddess, all deities in the pantheon are believed in. Practices include ancestor worship and remembrance, blots, and sacrifices -sometimes humans. Other mythological creatures, such as giants, dwarves, elves, etc. are also a part of this religion. There are also nine homeworlds which the followers believe the gods used to shape the world we live in today: Midgardr (land of the humans), Asgardr (land of the Aesir), Vanaheimr (land of the Vanir), Jotunheimr (land of the giants), Alfheimr (land of the elves), Hel (land of the dead), Svartalfaheimr (land of the dwarves), Niflheimr (land of ice), and Muspellsheimr (land of fire)."

 norse_pagan_adherent:0 "Forn Siðric"
 norse_pagan_adherent_plural:0 "Forn Siðrics"

 norse_pagan_old:0 "Old Forn Siðr"
 norse_pagan_old_adj:0 "Old Forn Siðric"
 norse_pagan_old_adherent:0 "Old Forn Siðric"
 norse_pagan_old_adherent_plural:0 "Old Forn Siðrics"

 german_pagan:0 "Furistaz Siduz"
 german_pagan_adj:0 "Furistaz Siduzic"
 german_pagan_adherent:0 "Germanic Polytheist"
 german_pagan_adherent_plural:0 "Germanic Polytheists"
 german_pagan_desc:0 "The Furistaz Siduz (Foremost Custom) is a Mainstream Germanic Barbarian faith of Traditional Soul. It refers to the polytheistic religious traditions of the continental Germanic peoples. While Germanic and Norse paganism share many similarities, the cultures, names, and practices are different, thus, to say Forn Sidr and Furistaz Siduz are the same religion would be inaccurate. Main gods include Wodanaz the Allfather, Teiwaz the god of war and fair rule, Thunraz the thunder god and Frijjo, wife of Wodanaz and goddess of fertility."
 german_pagan_old:0 "Old Furistaz Siduzic"
 german_pagan_old_adj:0 "Old Furistaz Siduz"
 german_pagan_old_adherent:0 "Old Germanic Polytheist"
 german_pagan_old_adherent_plural:0 "Old Germanic Polytheists"
 
 ragnarok:0 "Ginungstrú"
 ragnarok_adj:0 "Ginungstrúar"
 ragnarok_adherent:0 "Ginungstrúari"
 ragnarok_adherent_plural:0 "Ginungstrúande"
 ragnarok_desc:0 "Ginungstrú is a Norse faith with Zoroastrian, Gnostic, Buddhist and Neoplatonist influences, emerging from the crash of ideas from the two great empires south of the Varangian colonies among the Rus. Ginungstrú, meaning Creative Faith, refocuses Norse mythology on the very beginning of space and time itself, Ginungagap, the Gap of Creation through which the primordial energies of heat and cold interacted to birth time and space. Matter itself is viewed with mild resentment, usually referenced as *Ymir,* after the primordial creature from which most matter was formed by the Aesir, including Odin and his brothers, creating humans by breathing a remnant of the Ginungagap’s creative energies into them. Borrowing from the Ragnarökic faith, the Ginungstrú believe in the Twilight of the Gods as a just punishment of the Aesir for their corruption of Creation, but unlike that other faith see this event as already passed. Baldr, having been returned to the physical realm and blessed with knowledge of pure Creation beyond matter, was the great Prophet of this new era in which humans find themselves free of fading Old Gods who now have but lingering malign influence on the world. Instead humans must seek to embrace universal Order and fight Chaos, to make Creation more alike to the Uncreated Ginungagap. Through maintaining order in the world, they can ascend into the higher plane of non-material existence, or follow the example of Mimir and Baldr and be reborn through the *Lifsmeiðr,* Tree of Life, usually equated with Yggdrasil or Mimir's Tree. Those seen as reborn in this way are treated with an almost messianic reverence as guiding figures towards achieving universal Order and unity with Ginungagap."
 ragnarok_old:0 "Old Ginungstrú"
 ragnarok_old_adj:0 "Old Ginungstrú"
 ragnarok_old_adherent:0 "Old Ginungstrúari"
 ragnarok_old_adherent_plural:0 "Old Ginungstrúande"

 irminsul:0 "Irminsulism"
 irminsul_adj:0 "Irminsulic"
 irminsul_adherent:0 "Irminsulic"
 irminsul_adherent_plural:0 "Irminsulics"
 irminsul_old:0 "Old Irminsulism"
 irminsul_old_adj:0 "Old Irminsulic"
 irminsul_old_adherent:0 "Old Irminsulic"
 irminsul_old_adherent_plural:0 "Old Irminsulics"
 irminsul_desc:0 "The worship of the Irminsul is a Heretical Germanic Barbarian religion of Clerical Soul. The Irminsul are great pillars made of holy trees which unite Earth and Sky, and through which the Divine can be approached, felt, and understood. Only the caste of priests is authorized to approach the Irminsul. During occult ceremonies held at irregular intervals, according to a calendar only known to hose initiated, Wodanaz himself enters in communion with the Irminsul, communicates with the priests, and grants his protection to those who deserve it. It is said that Widukind was the only on-priest authorized to meet the greatest Irminsul just after defeating Charlemagne in 777 CE, when is spirit merged with the totems. The priests attending Irminsul enjoy a great authority over their ommunities. They accuse other Germanic beliefs which allow laymen to pray Wotan directly of being heretical, insulting to the Irminsul, and contrary to the essence of the world."

 norse_christ:0 "Scandinism"
 norse_christ_adj:0 "Scandinist"
 norse_christ_adherent:0 "Scandinist"
 norse_christ_adherent_plural:0 "Scandinists"
 norse_christ_old:0 "Old Scandinism"
 norse_christ_old_adj:0 "Old Scandinist"
 norse_christ_old_adherent:0 "Old Scandinist"
 norse_christ_old_adherent_plural:0 "Old Scandinists"
 norse_christ_desc:0 "Scandinism is a Local Norse sect of Statist soul, characterized by strong Christian influences. Viking raids on Frankish kingdoms and the British Isles brought the Scandinavians in contact with Christianity. Some of the Forn Siðric rulers decided to formally embrace Christianity as they seek a broader source of legitimacy towards their trouble-making vassals than the old tribal links. Thus Norse Christianity, or 'Scandinism', adopted Christian monotheism and doctrinal elements that strengthen the monarch's rule as divine right, while rejecting any form of authority from the official church. It retains many typically Norse cultural elements in the new syncretic faith. The religion has not yet developed its canon but most Scandinists hold that Baldr, who died and went to the underworld guarded by Hel, is the true Christ. They reject the Latin 'Hvítakristr' - 'White Christ', with 'White' being associated with the Catholic sacerdotal robes as well as cowardly and effeminate attributes. Scandinist clergy make a point to wear orange or dress garbs and bears."

 norse_war:0 "Ófriðartívar"
 norse_war_adj:0 "Ófriðartívaric"
 norse_war_adherent:0 "Ófriðartívarist"
 norse_war_adherent_plural:0 "Ófriðartívarists"
 norse_war_old:0 "Old Ófriðartívar"
 norse_war_old_adj:0 "Old Ófriðartívaric"
 norse_war_old_adherent:0 "Old Ófriðartívarist"
 norse_war_old_adherent_plural:0 "Old Ófriðartívarists"
 norse_war_desc:0 "The Ófriðartívar (Gods of War) cult is an Heretical Norse faith of Martial soul. It is an off-shoot branch of Norse religious traditions focusing on the veneration of the war gods of Norse legends: Odin, Tyr, and Freya, with a strong emphasis on their roles as mighty warriors. Adherents believe that if they worship these gods specifically, they will be granted victory in battle."

 sowilo:0 "Sunnatrú"
 sowilo_adj:0 "Sunnatrúar"
 sowilo_adherent:0 "Sunnatrúan"
 sowilo_adherent_plural:0 "Sunnatrúans"
 sowilo_old:0 "Old Sunnatrú"
 sowilo_old_adj:0 "Old Sunnatrúar"
 sowilo_old_adherent:0 "Old Sunnatrúan"
 sowilo_old_adherent_plural:0 "Old Sunnatrúans"
 sowilo_desc:0 "Sunnatrúar ('Allegiance to Sunna') is a Local Norse faith of Statist soul. Sunna is said to drive the horses Arvakr and Alsviðr that draw the chariot of the sun. She created the chariot to illuminate the worlds from burning embers flying from the fiery world of Muspelheim, realm of the Fire Giants. Sunna is said to constantly quarrel against her brother Mani, the Moon, for control of the Heavens, continuing the cycle of day and night. She is offered sacrifices, usually animal, but prisoners of war and raids are accepted as well, who are burnt in a ritual to strengthen Sunna in her daily struggle. Influenced by the Roman cult of Sol Invictus, Sunnatrúar rulers often claim as well to have Her blood in their veins."

 nott:0 "Njöla"
 nott_adj:0 "Njölic"
 nott_adherent:0 "Njölic"
 nott_adherent_plural:0 "Njölics"
 nott_old:0 "Old Njöla"
 nott_old_adj:0 "Old Njölic"
 nott_old_adherent:0 "Old Njölic"
 nott_old_adherent_plural:0 "Old Njölics"
 nott_desc:0 "The cult of Njöla (Night) is a Local Norse faith of Messianic Soul. Njöla is said to govern the night and the mysteries that come with it. Adherents believe that by honoring Njöla, they gain insight into the hidden aspects of the world and the secrets of the night. Rituals often involve nocturnal ceremonies and offerings to seek guidance and protection during the dark hours."

 teiwaz:0 "Teiwazism"
 teiwaz_adj:0 "Teiwazic"
 teiwaz_adherent:0 "Teiwazic"
 teiwaz_adherent_plural:0 "Teiwazites"
 teiwaz_old:0 "Old Teiwaz"
 teiwaz_old_adj:0 "Old Teiwazic"
 teiwaz_old_adherent:0 "Old Teiwazic"
 teiwaz_old_adherent_plural:0 "Old Teiwazites"
 teiwaz_desc:0 "The worship of Teiwaz is a Local Germanic Barbarian religion of Martial soul. Teiwaz ('Shining One' or 'the God') is the war god of noble battle, law, justice and the original father of the gods and men. Teiwaz, though, is not a god of mindless slaughter in the battlefield, of carnage and base violence, He is the god of war in its glory, courage and heroism. As god of justice and noble battle, it is thought he will only grant victory to those who fight honorably, such as a defensive army that fights for its freedom or simply for survival. The Teiwazic branch of Germanic paganism rose during the chaos of the barbarian invasions in 355 AD, when Germanic armies encountered the disciplined armies of Rome. As large parts of the Germanic hosts were composed by undisciplined and impetuous youths, they made for poor soldiers, thus, the chieftains of various tribes decided to pay Germanic foederati, trained by the Romans, to instruct their warriors in the proper art of war. These foederati, who were veterans of the Comitatenses, also brought with them the cult of Mars, which was quickly related by the Germanic warriors to Teiwaz, the Local god of war and noble battle. With their newfound discipline and skill in the art of war, these Germanic hosts won one battle after another, all of their fair victories attributed to Teiwaz. In those tribes where the worship of Teiwaz became prevalent, the other traditional gods started to wane in importance until they became minor Local spirits or simply ceased to exist. Thus, in Teiwazic mythos, Teiwaz has become the sole ruler of the heavens. The caste of warrior-priests of Teiwaz, who descend mostly from the Germanic foederati who trained the tribes, is charged with training the new generations in the arts of war and presiding over martial rituals, such as ritualistic duels, to maintain discipline amongst the warriors. Teiwaz is symbolized by the sword and many warriors scratch his name in runes on their sword-blades for good luck and bravery during battle."