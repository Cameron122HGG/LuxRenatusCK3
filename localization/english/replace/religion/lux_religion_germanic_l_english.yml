ragnarok: "Ragnarökism"
ragnarok_adj: "Ragnarökic"
ragnarok_adherent: "Ragnarökist"
ragnarok_adherent_plural: "Ragnarökists"
ragnarok_desc: "The cult of Fenrir is a Heretical Norse faith of Messianic soul. Also known as the cult of Ragnarök, they focus their worship on Fenrir - the wolf destined to devour Odin - and his sons, Hati and Skoll. The Ragnarökists see the Aesir as gluttonous corrupts and the Vanir as debauched revelers. They believe that during the end times, the Ragnarök, Fenrir will devour the Aesir, the Vanir, and their corrupt realms of Ásgarðr and Vanaheimr, and afterwards rule the renewed Miðgarðr with those that stood by his side, purged of the tainted influence of the Aesir and Vanir."
ragnarok_old: "Old Ragnarökism"
ragnarok_old_adj: "Old Ragnarökic"
ragnarok_old_adherent: "Old Ragnarökist"
ragnarok_old_adherent_plural: "Old Ragnarökists"

irminsul: "Irminsulism"
irminsul_adj: "Irminsulic"
irminsul_adherent: "Irminsulist"
irminsul_adherent_plural: "Irminsulists"
irminsul_old: "Old Irminsulism"
irminsul_old_adj: "Old Irminsulic"
irminsul_old_adherent: "Old Irminsulist"
irminsul_old_adherent_plural: "Old Irminsulists"
irminsul_desc: "The worship of the Irminsul is a Heretical Germanic religion of Clerical Soul. The Irminsul are great pillars made of holy trees which unite Earth and Sky, and the medium through which the divine can be approached, felt, and understood. Only the priestly caste is authorized to approach the Irminsul, and they enjoy great authority and influence over their communities. During occult ceremonies held at irregular intervals, according to a calendar known only to those initiated, Wodanaz himself enters in communion with the Irminsul, communicates with the priests, and grants his protection to the worthy. It is said that Widukind was the sole priest authorized to meet the greatest Irminsul just after defeating Charlemagne in 777 CE, when his spirit merged with the totems. The Irminsulists accuse other Germanic beliefs which allow laymen to pray Wotan directly of being heretical, insulting to the Irminsul, and contrary to the essence of the world."

norse_christ: "Scandinism"
norse_christ_adj: "Scandinist"
norse_christ_adherent: "Scandinist"
norse_christ_adherent_plural: "Scandinists"
norse_christ_desc: "Scandinism is a Local Norse sect of Statist soul, characterized by strong Christian influences. Viking raids on Frankish kingdoms and the British Isles brought the Scandinavians in contact with Christianity. Some of the Forn Siðric rulers decided to formally embrace Christianity as they seek a broader source of legitimacy towards their trouble-making vassals than the old tribal links. Thus Norse Christianity, or 'Scandinism', adopted Christian monotheism and doctrinal elements that strengthen the monarch's rule as divine right, while rejecting any form of authority from the official church. It retains many typically Norse cultural elements in the new syncretic faith. The religion has not yet developed its canon but most Scandinists hold that Baldr, who died and went to the underworld guarded by Hel, is the true Christ. They reject the Latin 'Hvítakristr', the 'White Christ', with white being associated with the Catholic sacerdotal robes as well as cowardly and effeminate attributes. Scandinist clergy make a point to wear orange garbs or dress in furs."
norse_christ_old: "Old Scandinism"
norse_christ_old_adj: "Old Scandinist"
norse_christ_old_adherent: "Old Scandinist"
norse_christ_old_adherent_plural: "Old Scandinists"

norse_war: "Ófriðartívar"
norse_war_adj: "Ófriðartívaric"
norse_war_adherent: "Ófriðartívarist"
norse_war_adherent_plural: "Ófriðartívarists"
norse_war_desc: "The Ófriðartívar ('Gods of War') cult is a Heretical Norse faith of Martial soul. It is an off-shoot branch of Norse religious traditions focusing on the veneration of the war gods of Norse legends - Odin, Tyr, and Freya, with a strong emphasis on their roles as mighty warriors. Adherents believe that if they worship these gods specifically, they will be granted victory in battle."
norse_war_old: "Old Ófriðartívar"
norse_war_old_adj: "Old Ófriðartívaric"
norse_war_old_adherent: "Old Ófriðartívarist"
norse_war_old_adherent_plural: "Old Ófriðartívarists"

sowilo: "Sunnatrú"
sowilo_adj: "Sunnatrúar"
sowilo_adherent: "Sunnatrúan"
sowilo_adherent_plural: "Sunnatrúans"
sowilo_desc: "Sunnatrúar ('Allegiance to Sunna') is a Local Norse faith of Statist soul. Sunna is said to drive the horses Arvakr and Alsviðr that draw the chariot of the sun. She created the chariot to illuminate the worlds from burning embers flying from the fiery world of Muspelheim, realm of the Fire Giants. Sunna is said to constantly quarrel against her brother Mani, the Moon, for control of the Heavens, continuing the cycle of day and night. She is offered sacrifices, usually animal, but prisoners of war and raids are accepted as well, who are burnt in a ritual to strengthen Sunna in her daily struggle. Influenced by the Roman cult of Sol Invictus, Sunnatrúar rulers often claim as well to have Her blood in their veins."
sowilo_old: "Old Sunnatrú"
sowilo_old_adj: "Old Sunnatrúar"
sowilo_old_adherent: "Old Sunnatrúan"
sowilo_old_adherent_plural: "Old Sunnatrúans"

allfather: "Wodanism"
allfather_adj: "Wodanazic"
allfather_adherent: "Wodanist"
allfather_adherent_plural: "Wodanists"
allfather_desc: "The worship of Wodanaz is a Local Germanic religion of Traditional soul, characterized by strong Norse influences. Wodanaz, also known as Wathonoz or Wotan, is the Germanic god of war and wisdom. He is a god of change, wind, and inspiration, master of ecstatic trance and patron god to travelers, shamans, and poets. Unlike Teiwaz, in war He represents the darker side of conflict, as exemplified by one of his epithets, 'the Lord of the Slain'. He will gladly give his favor, and with it victory, to those that offer the lives of others in return. Very popular among Germanic nobility, many of their most famous chieftains and kings claim lineage from him. The Wodanazic branch of Germanic paganism arose during the chaos of the barbarian invasions in 355 AD, when the Germanic tribes began to come into direct contact with religious groups like the Christians and the Manichaeans. Fearing that the traditions of their forefathers would soon be replaced by these foreign creeds, some of the most important Germanic chieftains and priests called for a meeting at Wimares. Under Wodanaz's sacred oak, they swore to worship him as the sole god in the skies if this helped them keep their ancestral customs. Legends tell that, on that day, two ravens flew towards the sacred oak and rested on its branches. The priests took this as a sign of Wodanaz placing his favor on the kings and chieftains gathered there. From that day on, the Germanic tribes gradually absorbed other deities, both local and foreign, into the figure of Wodanaz. During the great Viking invasions of 800 AD, in encounters with their Scandinavian cousins, the Germanic tribesmen further syncretized Wodanaz with Odin, granting him the aspects of the Allfather and the magical wanderer. His priesthood is decentralized, with emphasis being placed on the many 'seers' and 'sorcerers', who claim to have been taught the magic arts by Wodanaz himself in his guise as a hooded wanderer. They preside over festivities as well as all sacrifices, animal or human, to Wodanaz. The totem animals of Wodanaz are the wolf and the raven."
allfather_old: "Old Wodanism"
allfather_old_adj: "Old Wodanazic"
allfather_old_adherent: "Old Wodanist"
allfather_old_adherent_plural: "Old Wodanist"

nott: "Njöla"
nott_adj: "Njölic"
nott_adherent: "Njölic"
nott_adherent_plural: "Njölics"
nott_desc: "The cult of Njöla (Night) is a Local Norse faith of Messianic Soul. Njöla is said to govern the night and the mysteries that come with it. Adherents believe that by honoring Njöla, they gain insight into the hidden aspects of the world and the secrets of the night. Rituals often involve nocturnal ceremonies and offerings to seek guidance and protection during the dark hours."
nott_old: "Old Njöla"
nott_old_adj: "Old Njölic"
nott_old_adherent: "Old Njölic"
nott_old_adherent_plural: "Old Njölics"

teiwaz: "Teiwazism"
teiwaz_adj: "Teiwazic"
teiwaz_adherent: "Teiwazic"
teiwaz_adherent_plural: "Teiwazites"
teiwaz_desc: "The worship of Teiwaz is a Local Germanic religion of Martial soul. Teiwaz ('Shining One' or 'the God') is the war god of noble battle, law, justice and the original father of the gods and men. Teiwaz, though, is not a god of mindless slaughter in the battlefield, of carnage and base violence, He is the god of war in its glory, courage and heroism. As god of justice and noble battle, it is thought he will only grant victory to those who fight honorably, such as a defensive army that fights for its freedom or simply for survival. The Teiwazic branch of Germanic paganism rose during the chaos of the barbarian invasions in 355 AD, when Germanic armies encountered the disciplined armies of Rome. As large parts of the Germanic hosts were composed by undisciplined and impetuous youths, they made for poor soldiers. Thus the chieftains of various tribes decided to pay Germanic foederati, trained by the Romans, to instruct their warriors in the proper art of war. These foederati, who were veterans of the Comitatenses, also brought with them the cult of Mars, which was quickly related by the Germanic warriors to Teiwaz, the local god of war and noble battle. With their newfound discipline and skill in the art of war, these Germanic hosts won one battle after another, all of their fair victories attributed to Teiwaz. In those tribes where the worship of Teiwaz became prevalent, the other traditional gods started to wane in importance until they became minor local spirits or simply ceased to exist. Thus, in Teiwazic mythos, Teiwaz has become the sole ruler of the heavens. The caste of warrior-priests of Teiwaz, who descend mostly from the Germanic foederati who trained the tribes, is charged with training the new generations in the arts of war and presiding over martial rituals, such as ritualistic duels, to maintain discipline amongst the warriors. Teiwaz is symbolized by the sword and many warriors scratch his name in runes on their sword-blades for good luck and bravery during battle."
teiwaz_old: "Old Teiwaz"
teiwaz_old_adj: "Old Teiwazic"
teiwaz_old_adherent: "Old Teiwazic"
teiwaz_old_adherent_plural: "Old Teiwazites"