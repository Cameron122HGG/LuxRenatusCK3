 german_pagan_adj:0 "Foremost Custom"
 german_pagan_adherent:0 "Germanic Polytheist"
 german_pagan_adherent_plural:0 "Germanic Polytheists"
 german_pagan_desc:0 "The Furistaz Siduz (Foremost Custom) is a Mainstream Germanic Barbarian faith of Traditional Soul. It refers to the polytheistic religious traditions of the continental Germanic peoples. While Germanic and Norse paganism share many similarities, the cultures, names, and practices are different, thus, to say Forn Sidr and Furistaz Siduz are the same religion would be inaccurate. Main gods include Wodanaz the Allfather, Teiwaz the god of war and fair rule, Thunraz the thunder god and Frijjo, wife of Wodanaz and goddess of fertility."
