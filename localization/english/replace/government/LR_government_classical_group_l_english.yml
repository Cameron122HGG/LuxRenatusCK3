 steppe_classical_admin_government:0 "Nomadic Roman Classical"
 steppe_classical_admin_government_desc:0 "The Nomadic Roman Classical Hybrid Government is a unique government type that combines elements of both Nomadic and Roman Classical governments. It is characterized by a strong emphasis on mobility and adaptability, allowing for swift movement across vast territories while maintaining a structured administrative system. This government type is often associated with steppe cultures, where the ability to quickly respond to changing circumstances is crucial for survival and success."
