l_english:
#Classical Feudal
 classical_feudal_government: "Dynastic"
 classical_feudal_icon_concept: "@government_type_classical_feudal!"
 classical_feudal_government_with_icon: "@government_type_classical_feudal! $classical_feudal$"
 
 classical_feudal_government_adjective: "Classical Dynastic"
 classical_feudal_government_realm: "Classical Dynastic Realm"
 classical_feudal_government_desc: "\n$game_concept_classical_feudal_desc$\n\n#F The Roman Classical Dynastic Monarchy is a form of government inspired by the classical Roman and Hellenistic political models. It emphasizes enlightened rule by the monarch, with a well-developed administrative system that maintains the Graeco-Roman legal framework. This government type allows for efficient governance, urban development, and strong military organization, reflecting the principles of classical administration. #!"
 
 classical_feudal: "Classical Dynastic"
 classical_feudal_desc: "$game_concept_classical_feudal_desc$"

 classical_feudal_vassals: "Client"
 classical_feudal_vassals_desc: "$game_concept_classical_feudal_desc$"



 classical_tax_collector_obligations: "[tax_collector|E] Aptitude"
 classical_tax_slot: "Tax Jurisdiction"
 classical_tax_slot_no_tax_collector: "Tax Jurisdiction"
 classical_tax_slot_tax_collector: "Tax Jurisdiction: [character.GetName]" 

 classical_in_kind_tax_collector: "Artabieia"
 classical_in_kind_tax_collector_desc: "Base [obligations|E] apply, based on the [aptitude|E] of the assigned [tax_collector|E]"
 classical_in_kind_tax_collector_flavor_desc: "A standard tax paid in kind. Largely covered by payment in agricultural produce."
 
 classical_in_cash_taxation_tax_collector: "Eparourion"
 classical_in_cash_taxation_tax_collector_desc: "The [vassal|E] pays directly in monetary form, increasing [gold|E] taxation"
 classical_in_cash_taxation_tax_collector_flavor_desc: "Subjects will cover, their obligations by focusing on payment in gold or silver."
 
 classical_in_labour_taxation_tax_collector: "Angareia"
 classical_in_labour_taxation_tax_collector_desc: "[vassal|E] cover their obligations in labour, increasing both [levies|E] and [gold|E] send to their lord"
 classical_in_labour_taxation_tax_collector_flavor_desc: "Subjects will be contribute in the form of increased labour on their lords land, or in public works."

 classical_in_service_taxation_tax_collector: "Kleroukhia"
 classical_in_service_taxation_tax_collector_desc: "[vassal|E] sends their men to serve their lord, increasing [levies|E] as the focus"
 classical_in_service_taxation_tax_collector_flavor_desc: "Subjects will be fulfil their obligations by serving in the army."

#Roman Classical Administration
 classical_administrative_government: "Roman Administrative"
 classical_administrative_icon_concept: "@government_type_classical_administrative!"
 classical_administrative_government_with_icon: "@government_type_classical_administrative! $classical_administrative_government$"
 classical_administrative_government_adjective: "Roman Administrative"
 classical_administrative_government_realm: "Roman Administrative Realm"
 classical_administrative_government_desc: "\n$game_concept_classical_administrative_desc$\n\n#F The classical Roman and Hellenistic form of government emphasizes enlightened rule by the monarch. In the classical Graeco-Roman political model the ruler is less involved in the day to day decision making, hampering centralization limiting personal domain. At the same time, the realm's administration is more developed and maintains the Graeco-Roman legal system, preventing realm split upon succession. Prestigious rulers develop their urban centers. On the battlefield, Graeco-Roman Pikemen and heavy infantry remain unmatched, heirs to the phalanx and the legion. #!"
 classical_administrative_vassals_label: "Roman Classical [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 classical_administrative_vassal: "Governor"
 classical_administrative_vassal_desc: "$game_concept_classical_administrative_desc$"
 classical_administrative_obligations: "Roman Classical Obligations"
 classical_administrative_themes: "Available Administration Types"
 classical_administrative_theme_balanced: "@balanced_administration! Balanced Administration"
 classical_administrative_theme_balanced_short: "@balanced_administration! Balanced"
 classical_administrative_theme_balanced_text_icon: "@balanced_administration!"
 classical_administrative_theme_balanced_desc: "#flavor A well balanced administration seeks moderation to ensure equal attention in all areas of governance.#!"
 classical_administrative_theme_military: "@military_administration! Military Administration"
 classical_administrative_theme_military_short: "@military_administration! Military"
 classical_administrative_theme_military_text_icon: "@military_administration!"
 classical_administrative_theme_military_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [martial|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!"
 classical_administrative_theme_military_desc: "#flavor A military administration puts all energy on recruiting and training formidable troops for the imperial army.#!"
 classical_administrative_theme_civilian: "@civilian_administration! Civilian Administration"
 classical_administrative_theme_civilian_short: "@civilian_administration! Civilian"
 classical_administrative_theme_civilian_text_icon: "@civilian_administration!"
 classical_administrative_theme_civilian_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [stewardship|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n[influence|E] gained from constructing [buildings|E] in held [counties|E] is increased"
 classical_administrative_theme_civilian_desc: "#flavor Exempt from military service, a civilian administration focuses on improving the economy and well-being of the citizens.#!"
 classical_administrative_theme_frontier: "@frontier_administration! Frontier Administration"
 classical_administrative_theme_frontier_short: "@frontier_administration! Frontier"
 classical_administrative_theme_frontier_text_icon: "@frontier_administration!"
 classical_administrative_theme_frontier_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\nUnlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [subject|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [prowess|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\nUnlocks the #high $EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]\nEnables [raiding|E]"
 classical_administrative_theme_frontier_desc: "#flavor One cannot leave the borders undefended. A frontier administration will ensure the realm's defenses and stand ready to repel any potential invaders.#!"
 classical_administrative_theme_imperial: "@imperial_administration! Princely Administration"
 classical_administrative_theme_imperial_short: "@imperial_administration! Princely"
 classical_administrative_theme_imperial_text_icon: "@imperial_administration!"
 classical_administrative_theme_imperial_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [prestige_level|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_currency_level_increase_value')|+0%/] for each level#!#!\nIncreases [powerful_family|E] Rating\nCannot have appointment revoked without a [revoke_title_reason|E]"
 classical_administrative_theme_imperial_desc: "#flavor An imperial administration provides a significant level of autonomy and freedom from many regular responsibilities. It is the most prestigious administration one can have.#!"
 classical_administrative_theme_naval: "@naval_administration! Naval Administration"
 classical_administrative_theme_naval_short: "@naval_administration! Naval"
 classical_administrative_theme_naval_text_icon: "@naval_administration!"
 classical_administrative_theme_naval_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\nUnlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [subject|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] for every controlled #high [GetBuilding('common_tradeport_01').GetTypeName]#!#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_building_increase_value')|+0%/] for each [GetBuilding('common_tradeport_01').GetTypeName]#!#!\nUnlocks the #high $NAVAL_EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]"
 classical_administrative_theme_naval_desc: "#flavor The navy is the backbone of any expansive realm. With a dedicated naval administration, safety and efficiency at sea will be highly increased.#!"
 classical_administrative_CONTRACT: "[Character.Custom( 'GetProvinceConceptNoTooltip' )] Appointment"
 classical_administrative_theme_frontier_valid_desc: "The [subject.Custom( 'GetProvinceConceptNoTooltip' )] must border another [realm|E]"
 classical_administrative_theme_imperial_valid_desc: "Only one [subject.Custom( 'GetProvinceConceptNoTooltip' )] can have this administration active"
 classical_administrative_theme_naval_valid_desc: "The [subject.Custom( 'GetProvinceConceptNoTooltip' )] must be Coastal"
 classical_contract_forbids_revocation_desc: "You cannot revoke [titles|E] or Appointments from a [subject|E] governing with the [GetSubjectContractType( 'classical_administrative_themes' ).GetObligationName( 'classical_administrative_theme_imperial' )] unless you have a [revoke_title_reason|E]"


