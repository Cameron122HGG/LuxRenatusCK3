l_english:
 # Classical Feudal
 classical_feudal_government: "Classical Feudal"
 classical_feudal_icon_concept: "@government_type_classical_feudal!"
 classical_feudal_government_with_icon: "@government_type_classical_feudal! $classical_feudal_government$"
 
 classical_feudal_government_adjective: "Classical Feudal"
 classical_feudal_government_realm: "Classical Feudal Realm"
 classical_feudal_government_desc: "\n$game_concept_classical_feudal_desc$\n\n#F The Classical Feudal Monarchy is a form of government inspired by the classical Roman and Hellenistic political models. It emphasizes enlightened rule by the monarch, with a well-developed administrative system that maintains the Graeco-Roman legal framework. This government type allows for efficient governance, urban development, and strong military organization, reflecting the principles of classical administration. #!"
 
 classical_feudal: "Client"
 classical_feudal_desc: "$game_concept_classical_feudal_desc$"
 classical_tax_collector_obligations: "[tax_collector|E] Aptitude"
 despotic_tax_collector_obligations: "[tax_collector|E] Aptitude"
 
 kinship_government: "High Tribal"
 kinship_government_adjective: "High Tribal"
 kinship_government_desc: "\n$game_concept_kinship_desc$\n\n#F While called by many cultures 'barbarian', High Tribal government represents a middle ground between tribal structure and feudalism, or perhaps an alternative form of development of societies, putting high emphasis on interpersonal relations of united Tribes within the realm."
 kinship_government_filter_option: "$feudal_government$"
 kinship_vassal: "High Tribal"
 kinship_vassal_desc: "$game_concept_kinship_desc$" 
 game_concept_kinship_desc: "High Tribal is a [government_form|E] in which the amount of [levies|E] and [taxes|E] given to a [liege|E] by their [vassals|E] is determined by their opinion." 
 kinship_government_obligations: "High Tribal obligations" 
 kinship_icon_concept: "@government_type_kinship!"
 kinship_government_icon_concept: "@government_type_kinship!" 
 
 classical_tax_slot: "Tax Jurisdiction"
 classical_tax_slot_no_tax_collector: "Tax Jurisdiction"
 classical_tax_slot_tax_collector: "Tax Jurisdiction: [character.GetName]" 

 in_kind_tax_collector: "Artabieia"
 in_kind_tax_collector_desc: "Base [obligations|E] apply, based on the [aptitude|E] of the assigned [tax_collector|E]"
 in_kind_tax_collector_flavor_desc: "A standard tax paid in kind. Largely covered by payment in agricultural produce."
 
 in_cash_taxation_tax_collector: "Eparourion"
 in_cash_taxation_tax_collector_desc: "The [vassal|E] pays directly in monetary form, increasing [gold|E] taxation"
 in_cash_taxation_tax_collector_flavor_desc: "Subjects will cover, their obligations by focusing on payment in gold or silver."
 
 in_labour_taxation_tax_collector: "Angareia"
 in_labour_taxation_tax_collector_desc: "[vassal|E] cover their obligations in labour, increasing both [levies|E] and [gold|E] send to their lord"
 in_labour_taxation_tax_collector_flavor_desc: "Subjects will be contribute in the form of increased labour on their lords land, or in public works."

 in_service_taxation_tax_collector: "Kleroukhia"
 in_service_taxation_tax_collector_desc: "[vassal|E] sends their men to serve their lord, increasing [levies|E] as the focus"
 in_service_taxation_tax_collector_flavor_desc: "Subjects will be fulfil their obligations by serving in the army."

 # Despotism
 despotic_government: "Hydraulic Dynastic"
 despotic_icon_concept: "@government_type_despotic!"
 despotic_government_with_icon: "@government_type_despotic! $despotic_government$"
 despotic_government_adjective: "Hydraulic Dynastic"
 despotic_government_realm: "Hydraulic Dynastic Realm"
 despotic_government_desc: "\n$game_concept_despotic_desc$\n\n#F Hydraulic Dynastic is the ancient form of government of Persia, later adopted by the Diadochi themselves. It is characterised by autonomy given to local rulers, while retaining strong bureaucratic elements.#!"
 
 despotic_government_vassals_label: "Hydraulic Dynastic [obligations|E] are based on [vassal_contract|E], multiplied by [tax_collector|E] Aptitude, and [tax_jurisdictions|E] type"
 despotic_government_obligations: "From [opinion|E]"
 despotic_government_tax_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_tax_max_possible'))|1V])"
 despotic_government_levies_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_levies_max_possible'))|1V])"
 despotic_government_unclamped_contribution_label: "Based on [opinion|E] of me"
 
 despotic_government_min_contribution_label: "[crown_authority|E] minimum"
 despotic_vassal: "Satrap"
 despotic_vassal_desc: "$game_concept_despotic_desc$"
 
 despotic_tax_slot: "Tax Jurisdiction"
 despotic_tax_slot_no_tax_collector: "Tax Jurisdiction"
 despotic_tax_slot_tax_collector: "Tax Jurisdiction: [character.GetName]"  
 despotic_tax_collector_obligations: "[tax_collector|E] Aptitude" 

 despotic_in_kind_tax_collector: "In Kind"
 despotic_in_kind_tax_collector_desc: "Base [obligations|E] apply, based on the [vassal_contract|E], multiplied by [aptitude|E] of the assigned [tax_collector|E]"
 despotic_in_kind_tax_collector_flavor_desc: "A standard tax in kind. Subjects taxes are largely paid in agricultural produce, being the most lenient form of taxation."
 
 despotic_in_cash_taxation_tax_collector: "In Cash"
 despotic_in_cash_taxation_tax_collector_desc: "The [vassal|E] pays directly in monetary form, increasing [gold|E] taxation"
 despotic_in_cash_taxation_tax_collector_flavor_desc: "Subjects will cover, their obligations by focusing on payment in gold or silver."
 
 despotic_in_labour_taxation_tax_collector: "In Labour"
 despotic_in_labour_taxation_tax_collector_desc: "[vassal|E] cover their obligations in labour, increasing both [levies|E] and [gold|E] send to their lord"
 despotic_in_labour_taxation_tax_collector_flavor_desc: "Subjects will be contribute in the form of increased labour on their lords land, or in public works."
 
 despotic_in_service_taxation_tax_collector: "In Service"
 despotic_in_service_taxation_tax_collector_desc: "[vassal|E] sends their men to serve their lord, increasing [levies|E] as the focus"
 despotic_in_service_taxation_tax_collector_flavor_desc: "Subjects will be sent to the front, and serve in the army."