l_english:
 # Meritocratic
 roman_imperial_obligations: "Imperial Obligations"
 roman_imperial_provinces: "$administrative_themes$"
 roman_imperial_province_standard: "@celestial_standard_administration! Standard Administration"
 roman_imperial_province_standard_short: "Standard"
 roman_imperial_province_standard_text_icon: "@celestial_standard_administration!"
 roman_imperial_province_standard_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\nUses [GetLaw('celestial_appointment_succession_law').GetName]"
 roman_imperial_province_standard_desc: "#low A civil type that attends to the everyday needs of the government and the local inhabitants#!"
 roman_imperial_province_industrial: "@celestial_industrial_administration! Industrial Administration"
 roman_imperial_province_industrial_short: "Industrial"
 roman_imperial_province_industrial_text_icon: "@celestial_industrial_administration!"
 roman_imperial_province_industrial_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\nUses [GetLaw('celestial_appointment_succession_law').GetName]\n\n#alert_trial @alert_icon! Limited to [EmptyScope.ScriptValue('roman_imperial_province_industrial_max_value')|V0]#!"
 roman_imperial_province_industrial_desc: "#low A civil administration that focuses on improving the area's productivity and long-term development.#!"
 roman_imperial_province_industrial_amount_desc: "$roman_imperial_province_industrial_short$ limit reached"
 roman_imperial_province_metropolitan: "@celestial_metropolitan_administration! Metropolitan Administration"
 roman_imperial_province_metropolitan_short: "Metropolitan"
 roman_imperial_province_metropolitan_text_icon: "@celestial_metropolitan_administration!"
 roman_imperial_province_metropolitan_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [diplomacy|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n$EFFECT_LIST_BULLET$ Uses [GetLaw('celestial_appointment_succession_law').GetName]\n\n#alert_trial @alert_icon! Limited to [EmptyScope.ScriptValue('roman_imperial_province_metropolitan_max_value')|V0]#!"
 roman_imperial_province_metropolitan_desc: "#low An efficient civil administration applied to larger urban areas. It greatly emphasizes on efficient use of taxes and making cities prosper.#!"
 roman_imperial_province_metropolitan_amount_desc: "$roman_imperial_province_metropolitan_short$ limit reached"
 roman_imperial_province_military: "@celestial_military_administration! Military Administration"
 roman_imperial_province_military_short: "Military"
 roman_imperial_province_military_text_icon: "@celestial_military_administration!"
 roman_imperial_province_military_benefits: "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Can recruit [GetMaA('zhanmadao_infantry').GetName]\n$EFFECT_LIST_BULLET$ Uses [GetLaw('celestial_military_appointment_succession_law').GetName]\n\n#alert_trial @alert_icon! Limited to [EmptyScope.ScriptValue('roman_imperial_province_military_max_value')|V0] at this tier#!"
 roman_imperial_province_military_desc: "#low A military administration that enables the mustering of troops. Providing the realm with the means of protecting itself, or expanding its borders when necessary.#!"
 roman_imperial_province_military_amount_desc: "$roman_imperial_province_military_short$ limit reached"
 roman_imperial_province_protectorate: "@celestial_protectorate_administration! Protectorate Administration"
 roman_imperial_province_protectorate_short: "Protectorate"
 roman_imperial_province_protectorate_text_icon: "@celestial_protectorate_administration!"
 roman_imperial_province_protectorate_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Unlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [vassal|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Increases [governor_efficiency|E] based on [martial|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n$EFFECT_LIST_BULLET$ Can recruit [GetMaA('zhanmadao_infantry').GetName]\n$EFFECT_LIST_BULLET$ Uses [GetLaw('celestial_military_appointment_succession_law').GetName]\n\n#alert_trial @alert_icon! Limited to [EmptyScope.ScriptValue('roman_imperial_province_protectorate_max_value')|V0]#!"
 roman_imperial_province_protectorate_desc: "#low A greatly improved military administration. A protectorate will significantly bolster our military might!#!"
 roman_imperial_province_protectorate_amount_desc: "$roman_imperial_province_protectorate_short$ limit reached"
 roman_imperial_province_de_jure_desc: "Is #bold not#! a [de_jure|E] [title|E]"
