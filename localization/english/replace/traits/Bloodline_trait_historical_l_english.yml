####################家族型####################

###欧洲

##西欧
merovingian_blood:0 "Merovingian Blood"
trait_historical_bloodline_family_168671_desc:0 "The Merovingian family was the first ruling dynasty of the Frankish Kingdom. Through their expansion, the Franks unified all of Gaul except Septimania, laying the foundation for the political landscape of medieval Western Europe."

carolingiens_blood:0 "Carolingian Blood"
trait_historical_bloodline_family_190412_desc:0 "The Carolingian family, which ruled the Frankish Kingdom from 751, is one of the most famous dynasties of the Middle Ages. The Empire reached its zenith under Charlemagne, nominally inheriting the classical Roman Empire, shaping the political and cultural map of Europe for centuries to come."

wessex_blood:0 "Wessex Blood"
trait_historical_bloodline_family_33354_desc:0 "The Wessex family originated in the southwest of England. Its members rose to prominence while resisting the Viking invasions and unified the kingdoms of the Heptarchy, establishing the earliest English dynasty."

capet_blood:0 "Capet Blood"
trait_historical_bloodline_family_200_desc:0 "Founded by Hugh Capet, the Capetian family was one of the most powerful royal houses in Europe after the collapse of the West Frankish Kingdom. They ruled the West Frankish region for over three centuries, during which time they fostered the rapid development and unification of French culture."

jerusalem_blood:0 "Jerusalem Blood"
trait_historical_bloodline_family_10072_desc:0 "Under the leadership of Baldwin I and his brother, the Crusaders severely defeated Muslim dynasties in a series of outmanned battles during the First Crusade, reclaiming Jerusalem and other territories, establishing the most important 'Heavenly Kingdom' of the Crusader movement."

plantagenet_blood:0 "Plantagenet Blood"
trait_historical_bloodline_family_204506_desc:0 "The Plantagenet family originated in Anjou, France, and ruled England from the 12th century. Their domain once spanned France and Britain, extending from the Pyrenees to the Scottish border, known as the Angevin Empire."

anjou_blood:0 "Anjou Blood"
trait_historical_bloodline_family_168059_desc:0 "The House of Anjou originated from the Counts of Anjou in France. Through marriage and inheritance, the family gained control over vast territories including England, Normandy, and Aquitaine, establishing a powerful cross-Channel empire."

stuart_blood:0 "Stuart Blood"
trait_historical_bloodline_family_180048_desc:0 "The Stuart family was the first family to successfully rule the entire British Isles, with its ancestry tracing back to local nobles in Brittany, France, in the 11th century AD."

normandy_blood:0 "Normandy Blood"
trait_historical_bloodline_family_140_desc:0 "The House of Normandy originated in the Normandy region of France. Famous for the Norman conquest of England, the Normans ruled by this family completely reshaped the social landscape of medieval England and profoundly influenced the political and military development of Western Europe, Southern Europe, and even the Middle East."

##中欧
liudolf_blood:0 "Liudolfing Blood"
trait_historical_bloodline_family_1280_desc:0 "The Liudolfing family established the first dynasty of the Holy Roman Empire, also known as the Ottonian or Saxon dynasty due to its core power base in Saxony."

salian_blood:0 "Salian Blood"
trait_historical_bloodline_family_161553_desc:0 "The Salian family established the second dynasty of the Holy Roman Empire. They perfected the Empire's administrative system and secured the HRE's status as a major European power."

habsburg_blood:0 "Habsburg Blood"
trait_historical_bloodline_family_11006_desc:0 "One of the most prominent and widespread royal houses in European history. Through intermarriage and inheritance, its members served as Holy Roman Emperors, Archdukes of Austria, Kings of Hungary, Kings of Spain, etc., achieving expansion 'without war' and decisively influencing European history."

hohenzollern_blood:0 "Hohenzollern Blood"
trait_historical_bloodline_family_40550_desc:0 "The House of Hohenzollern was the primary ruling family of Brandenburg-Prussia and the German Empire. Its members ended the long history of division in the German region through military action and reform, successfully unifying Germany to establish the German Empire in 1871."

wittelsbacher_blood:0 "Wittelsbach Blood"
trait_historical_bloodline_family_30099_desc:0 "An ancient German princely house. Family members served as Holy Roman Emperors, as well as Kings of Germany, Hungary, Greece, Norway, Sweden, and Denmark in various periods."

hohenstaufen_blood:0 "Hohenstaufen Blood"
trait_historical_bloodline_family_30750_desc:0 "A comital family originating from Swabia in Southern Germany. They attained the German throne in the 12th century, becoming leaders of the 'Ghibelline' faction. Their power peaked during the reign of Frederick I, who invaded Italy and gained control of the Kingdom of Sicily."

oldenburg_blood:0 "Oldenburg Blood"
trait_historical_bloodline_family_20223_desc:0 "The House of Oldenburg originated in North Germany, tracing its founder to Elimar I in the 11th century. Through marriage and diplomacy, the family rose meteorically. Their descendants ruled Denmark, Norway, Sweden, Russia, and even Greece. The current royal houses of Norway, Denmark, and Britain are all descended from its branches."

##北欧
munso_blood:0 "Munsö Blood"
trait_historical_bloodline_family_163108_desc:0 "The Munsö family were descendants of Björn Ironside, son of Ragnar Lodbrok. The family unified the Swedish tribes and continued to rule in Scandinavia until the Middle Ages."

ivar_blood:0 "Ivar Blood"
trait_historical_bloodline_family_163111_desc:0 "The Uí Ímair (House of Ivar) were descendants of Ivar 'the Boneless'. They founded the Kingdom of Dublin and conquered Northumbria, becoming one of the most powerful conquering dynasties of the Viking Age, sweeping across the kingdoms of Britain."

yngling_blood:0 "Yngling Blood"
trait_historical_bloodline_family_168316_desc:0 "The earliest ruling dynasty of the Kingdom of Norway, founded by Harald Fairhair, which unified and ruled Norway from the second half of the 9th century with few interruptions."

##南欧
asturias_blood:0 "Asturias Blood"
trait_historical_bloodline_family_70000_desc:0 "The founder of the Spanish kingdom. Under the leadership of Pelagius, they rose up against the Muslim invasion, initiating the centuries-long Spanish 'Reconquista'."

medici_blood:0 "Medici Blood"
trait_historical_bloodline_family_medici_desc:0 "A prominent family in Florence, Italy. Its members accumulated enormous wealth through banking and used it to become the de facto rulers of Florence, driving the development of the Renaissance."

savoy_blood:0 "Savoy Blood"
trait_historical_bloodline_family_1176_desc:0 "A European royal house originating in the western Alps. Its descendants gradually expanded, becoming Kings of Sicily and Sardinia, and ultimately led the Italian Risorgimento (unification) movement."

constantine_blood:0 "Constantine Blood"
trait_historical_bloodline_family_70524_desc:0 "The family that ruled the Roman Empire in the 4th century AD. Following the accession of Constantius I, members of this family continuously served as Roman Emperors, securing the imperial succession of the Roman Empire."

justinian_blood:0 "Justinian Blood"
trait_historical_bloodline_family_70529_desc:0 "The founding family of the first Golden Age of the Eastern Roman Empire. Under its rule, the Empire reclaimed large territories including North Africa and Italy, reaching its largest extent since the collapse of the Western Empire."

heraclius_blood:0 "Heraclius Blood"
trait_historical_bloodline_family_145071_desc:0 "The family that led the Hellenization of the Eastern Roman Empire. Under its rule, the Empire completely transformed from the old system of the late Roman state into a Hellenized Orthodox Christian empire, with far-reaching influence."

isaurian_blood:0 "Isaurian Blood"
trait_historical_bloodline_family_70502_desc:0 "The Isaurian dynasty repelled the Arab siege of Constantinople, launched the Iconoclasm movement, reformed the administration, and generally implemented the theme system, consolidating the Empire's territory in Asia Minor."

macedonian_blood:0 "Macedonian Blood"
trait_historical_bloodline_family_145129_desc:0 "The ruling dynasty during the military and political Golden Age of the Eastern Roman Empire. Its period saw a flourishing of scholarship and culture, known as the 'Macedonian Renaissance'."

komnenos_blood:0 "Komnenos Blood"
trait_historical_bloodline_family_1750_desc:0 "A prominent family that originated in Paphlagonia. Through military merit and intermarriage, they gained control of the Byzantine imperial throne and briefly restored the Empire's glory, known as the 'Komnenian Restoration'."

palaiologos_blood:0 "Palaiologos Blood"
trait_historical_bloodline_family_1764_desc:0 "The dynasty founded by the Palaiologos family was the last and longest-ruling dynasty of the Eastern Roman Empire. Its period was one of the most vibrant for Byzantine culture, witnessing the final flourishing of Eastern Roman art."

laskaris_blood:0 "Laskaris Blood"
trait_historical_bloodline_family_215670_desc:0 "The Laskaris family was a Byzantine noble family. Following the fall of Constantinople, its members ruled the Empire of Nicaea in the 13th century AD, and after the Empire's restoration, they continued to wield significant influence as high nobility."

bagrationi_blood:0 "Bagrationi Blood"
trait_historical_bloodline_family_159921_desc:0 "The Bagrationi family ruled Georgia for 1030 years, from 780 to 1810, making it one of the longest-reigning dynasties in history. Even under Russian rule, members of this family remained the most powerful nobles in the Georgian region."

hauteville_blood:0 "Hauteville Blood"
trait_historical_bloodline_family_1120_desc:0 "The House of Hauteville was a family from Normandy, France, famous for its aggressive campaigns along the Mediterranean and participation in the Crusades. At its peak, the family's power spanned three continents (Europe, Asia, Africa), establishing the Kingdom of Sicily and conquering parts of North Africa and the Near East."

bulgar_blood:0 "Bulgar Blood"
trait_historical_bloodline_family_70384_desc:0 "The Bulgar family founded the First Bulgarian Empire after leading the Bulgars to settle in the Balkans. Under their rule, the empire expanded significantly, becoming a major power in Southeast Europe and playing a crucial role in the spread of Orthodox Christianity in the region."

asen_blood:0 "Asen Blood"
trait_historical_bloodline_family_217503_desc:0 "The Asen brothers led the Bulgarians in a new uprising, establishing the Second Bulgarian Empire. The family forced Byzantium to recognize its independence and expanded its rule over vast areas of the Balkan Peninsula."

##东欧
piastowie_blood:0 "Piast Blood"
trait_historical_bloodline_family_82233_desc:0 "The Piast family originated from a legendary Polish tribal leader, establishing the first dynasty in Polish history. From 962, members of this family ruled Poland, intermittently, as Dukes or Kings."

arpad_blood:0 "Árpád Blood"
trait_historical_bloodline_family_159137_desc:0 "The Árpád family was the ruling dynasty of the Principality of Hungary and the Kingdom of Hungary. Under its rule, the Kingdom of Hungary gradually formed and became powerful. With very few exceptions, all Hungarian Kings were descendants of the Árpád lineage."

premysl_blood:0 "Přemyslid Blood"
trait_historical_bloodline_family_168345_desc:0 "The Přemyslid family originated in Bohemia. From the 9th to the 14th century, the family ruled the Duchy of Bohemia, the Kingdom of Bohemia, and the Margraviate of Moravia, with its influence extending to parts of Poland, Hungary, and Austria."

rurikovich_blood:0 "Rurikovich Blood"
trait_historical_bloodline_family_40605_desc:0 "The Rurikovich family established the Old Rus' state, ruling the East Slavs, and was the first dynasty in Eastern European history. As one of Europe's oldest royal houses, many royal families claim descent from Rurik, and the lineage boasts numerous existing branches."

###非洲

##北非

##东非
gideon_blood:0 "Gideon Blood"
gideon_desc:0 "The Gideon family is the legendary royal house among the Beta Israel. They claim to be descendants of the Tribe of Dan of ancient Israel, whose ancestors fled Israel during the civil war between Rehoboam and Jeroboam. In their sustained resistance to Christianization, the family long held the core ruling position among the Beta Israel."

solomon_blood:0 "Solomon Blood"
trait_historical_bloodline_family_145983_desc:0 "The Solomonic dynasty ruled Ethiopia for 700 years. The family claimed direct descent from King Solomon of Israel and the Queen of Sheba. They replaced the Zagwe dynasty in 1270, establishing the Abyssinian Empire, whose rule, with only a few interruptions in history, lasted until the 20th century."

##西非

###亚洲
##西亚

parthian_blood:0 "Parthian Blood"
trait_historical_bloodline_family_159546_desc:0 "The Arsacid family were the founders of the Parthian Empire. At its peak, the empire spanned from the Euphrates River in the west to the Amu Darya in the east, becoming an important commercial center due to its location on the Silk Road connecting Rome and the Han dynasty."

sassanid_blood:0 "Sassanid Blood"
trait_historical_bloodline_family_159599_desc:0 "The Sassanid family were the founders of the Sassanid dynasty, also known as the Second Persian Empire, one of the most important and influential dynasties in Persian history. Its territory once encompassed Iran, Iraq, the Caucasus, parts of Central Asia, and surrounding coasts."

umayyad_blood:0 "Umayyad Blood"
trait_historical_bloodline_family_163029_desc:0 "The Umayyad family was a prominent clan of the Quraysh tribe of Mecca. Family members opposed Ali during the First Civil War and established the Umayyad Caliphate in 661, based in Damascus. This was the first hereditary dynasty in Islamic history and briefly ruled the entire Islamic world."

abbasid_blood:0 "Abbasid Blood"
trait_historical_bloodline_family_34001_desc:0 "The Abbasid family are descendants of Abbas ibn Abd al-Muttalib, the uncle of the Islamic Prophet Muhammad. The Abbasid Caliphate reached its zenith in the medieval Islamic world, peaking during the reigns of Harun al-Rashid and al-Ma'mun, ushering in the Golden Age of Islamic civilization."

fatimid_blood:0 "Fatimid Blood"
trait_historical_bloodline_family_3092_desc:0 "The Fatimid family is named after Fatima, the daughter of the Islamic Prophet Muhammad. The Fatimid dynasty they established was a Shia dynasty whose rule spanned vast areas of North Africa and West Asia, from the western Mediterranean to the Red Sea in the east."

seljuk_blood:0 "Seljuk Blood"
trait_historical_bloodline_family_3030_desc:0 "The Seljuk family originated from the Oghuz Turks. Its members founded the Great Seljuk Empire and the Sultanate of Rûm, ruling territories from Persia in the east to Anatolia in the west. Their expansion fostered a Turco-Persian cultural synthesis and indirectly sparked the First Crusade."

timurid_blood:0 "Timurid Blood"
trait_historical_bloodline_family_timurid_desc:0 "The Timurid family were noble descendants of the Turkified Mongol Barlas tribe. Family members founded the Timurid Empire and the Mughal Empire, with its peak territories spanning from Asia Minor to Delhi in India."

ottoman_blood:0 "Ottoman Blood"
trait_historical_bloodline_family_476501_desc:0 "The Ottoman family is named after its founder, Osman I, who established the Ottoman Empire which existed from the 13th to the 20th century. Culturally a blend of East and West, the Empire spanned three continents (Europe, Asia, Africa) at its zenith."

ayyubid_blood:0 "Ayyubid Blood"
trait_historical_bloodline_family_226000_desc:0 "The Ayyubid family established the Ayyubid dynasty, which ruled Egypt, Syria, and Yemen from the 12th to the 13th century. The family initiated a period of economic prosperity, leading to the resurgence of Islamic civilization."

khwarezmian_blood:0 "Khwarezmian Blood"
trait_historical_bloodline_family_20713_desc:0 "The Khwarezmian family was a Persian Sunni ruling dynasty originating from Turkic Mamluks. After gaining independence, the family ruled most of Greater Iran until its destruction by the Mongols."

buyid_blood:0 "Buyid Blood"
trait_historical_bloodline_family_1231061_desc:0 "Buwayh was a Daylamite chieftain from the southwest coast of the Caspian Sea. His three sons established the Buyid dynasty named after him. At its peak, the family's rule covered a vast territory, nearly equaling Sassanid Persia."

ghaznavid_blood:0 "Ghaznavid Blood"
trait_historical_bloodline_family_1229938_desc:0 "The Ghaznavid family was founded by the Persian slave general Sabuktigin, with members being mostly Turkicized Persian origin. The dynasty established by the Ghaznavids ruled regions including present-day Afghanistan, Iran, and the northwest of the Indian subcontinent at its zenith, promoting the spread of Persian culture in Central and South Asia."

##中亚
are_blood:0 "Are Blood"
trait_historical_bloodline_family_303238_desc:0 "The ruling clan of the Yenisei Kirghiz Khaganate. The Kirghiz were the earliest inhabitants of the upper Yenisei River and southern Minusinsk, known as Yenisei Kirghiz, called Gekun in the Western Han dynasty. The Kirghiz comprised both Caucasian and East Asian black-haired tribes, and their royal house, from the black-haired tribe, claimed descent from the Longxi Li clan."

yaglakar_blood:0 "Yaglakar Blood"
trait_historical_bloodline_family_yaglakar_desc:0 "The Yaglakar clan was the ruling family of the Uyghur Khaganate, and the most important and powerful clan in Uyghur history, whose rule spanned the Mongolian Plateau and the Xinjiang region. Its members were culturally influenced by Turkic and Buddhist traditions and played an important role in Silk Road trade."

adiz_blood:0 "Adiz Blood"
trait_historical_bloodline_family_yaglakar_7_desc:0 "As the long-reigning Yaglakar clan of the Uyghur Khaganate weakened, the power of the Adiz clan, a powerful official house, grew from being a secondary minister to dominating the Khaganate. When Khagan Fengcheng died in 795, the chief minister Kutluk was enthroned as Khagan, and he and subsequent Uyghur Khagans belonged to the Adiz clan, thus replacing the Yaglakar clan's rule over the Uyghurs."

ghurid_blood:0 "Ghurid Blood"
trait_historical_bloodline_family_extra_ghurids_1_desc:0 "The Ghurid family established the Ghurid dynasty, which ruled Afghanistan and Northern India from the 12th to the 13th century. Its peak territory was vast, making it an important Muslim state established by Turkic peoples in the region."

samanid_blood:0 "Samanid Blood"
trait_historical_bloodline_family_188637_desc:0 "The Samanid family headed a Sunni Muslim empire from the 9th to 10th centuries AD. Its rule was primarily centered in Khorasan and Transoxiana, considered part of the Iranian Intermezzo, promoting the return of Persian language and traditions and fostering Turco-Persian culture."

qara_khanid_blood:0 "Qara Khanid Blood"
trait_historical_bloodline_family_34872_desc:0 "The Qara Khanid dynasty was the first Turkic state in history to convert to Islam. The family rose in the mid-10th century and expanded rapidly, its influence long controlling the vast Central Asian region from Khotan-Kucha in the east to Bukhara in the west."

##东亚
kong_blood:0 "Blood of the Ultimate Sage"
trait_historical_bloodline_family_han_80000_desc:0 "The Kong family are the direct descendants of Confucius. For thousands of years, they have upheld Confucian culture and scholarship, being successively ennobled and enjoying immense prestige, holding paramount influence in the preservation of Chinese civilization."

borjigin_blood:0 "Borjigin Blood"
trait_historical_bloodline_family_125501_desc:0 "The Borjigin family, also known as the 'Golden Kin', were revered as sacred due to the bloodline of Genghis Khan. The family established the vast Mongol Empire through conquest and ruled numerous Khanates, including the Yuan Dynasty, playing a vital role in Asian history for centuries."

sbu_gyel_blood:0 "Tibet Blood"
trait_historical_bloodline_family_247051_desc:0 "The Yarlung dynasty's earliest and most important clan, the Sbu Gyel family produced the founder and early Btsan-po (Emperors) of the Tibetan Empire. Its descendants played a crucial ruling role on the Tibetan Plateau."

meng_blood:0 "Nanzhao Blood"
trait_historical_bloodline_family_nanzhao_meng_10_desc:0 "The Meng clan was the royal family of the Mengshe Zhao, one of the Six Zhaos of Nanzhao. They later unified the various tribes around Erhai Lake, establishing the powerful Nanzhao Kingdom, ruling the southwestern region for generations."

duan_blood:0 "Dali Blood"
trait_historical_bloodline_family_dali_duan_13_desc:0 "The Duan clan established and ruled the Dali Kingdom, an important royal family in Bai history. Although the family briefly abdicated the throne, they restored their rule after overthrowing the Gao clan and continued to exert significant influence in Yunnan as the Dali Governor-General."

liu_blood:0 "Great Han Blood"
trait_historical_bloodline_family_imperial_han_1_desc:0 "The Imperial Han family, one of the most influential families in Chinese history. Its descendants established multiple regimes throughout later history and were known as prominent clans such as the Liu of Pengcheng."

sima_blood:0 "Great Jin Blood"
trait_historical_bloodline_family_imperial_jin_1_desc:0 "The Imperial Jin family, originating from the Sima clan of Wen County, Henei. The family seized real power in Cao Wei through the Coup at Gaoping Tombs, eventually establishing the Jin dynasty. Its members rose to prominence during the Wei and Jin periods through their outstanding political and military talents, ruling the Central Plains for nearly two centuries."

yang_blood:0 "Great Sui Blood"
trait_historical_bloodline_family_imperial_sui_1_desc:0 "The Imperial Sui family, originating from the Yang clan of Hongnong. The family ended centuries of division, establishing the Sui dynasty. It unified the north and south, initiating far-reaching foundations like the Imperial Examination system and the Grand Canal."

li_blood:0 "Great Tang Blood"
trait_historical_bloodline_family_han_268_desc:0 "The Imperial Tang family, originating from the Li clan of Longxi. The Tang dynasty established by this family was the pinnacle of Chinese feudal society. It unified the realm with a heroic posture and created a brilliant and magnificent Tang golden age with a tolerant, all-embracing ethos."

zhao_blood:0 "Great Song Blood"
trait_historical_bloodline_family_han_4622_desc:0 "The Imperial Song family, originating from the Zhao clan of Zhuo Commandery. The family established the Song dynasty through the Chenqiao Mutiny. It emphasized civil rule over military, creating a highly developed commodity economy and culture. Its descendants continue as prominent clans such as the Zhao of Tianshui."

yuan_borjigin_blood:0 "Great Yuan Blood"
trait_historical_bloodline_family_217266_desc:0 "The Imperial Yuan family, originating from the Borjigin-Tului lineage of the Mongol Golden Kin, the direct descendants of Genghis Khan. Kublai Khan, a member of this family, established and ruled the Yuan dynasty, one of the successors to the vast Mongol Empire spanning Eurasia."

zhu_blood:0 "Great Ming Blood"
trait_historical_bloodline_family_zhu_zhongba_1_desc:0 "The Imperial Ming family, originating from the Zhu clan of Jurong. Zhu Yuanzhang, a descendant of this family, overthrew the Yuan rule through a peasant uprising and established the Ming dynasty. The family expelled the foreign rulers, restored Han Chinese customs, and created a unified empire with vast territory, maintaining a strong state and rigorous system for nearly three centuries."

tabgatch_blood:0 "Great Wei Blood"
trait_historical_bloodline_family_206607_desc:0 "The Tuoba clan was the leader of a powerful tribal confederation in Daibei. Its descendants established the far-reaching Northern Wei dynasty, promoting the deep integration of northern peoples with Central Plains culture."

yelv_blood:0 "Great Liao Blood"
trait_historical_bloodline_family_194325_desc:0 "The Yelü clan was a branch of the Khitan Diela tribe and long served as military leaders of the tribal confederation. They unified the Khitan tribes and established the powerful Liao dynasty in North China."

wanyan_blood:0 "Great Jin Blood"
trait_historical_bloodline_family_jurchen_wanyan_8_desc:0 "The Wanyan clan was one of the most influential families in Jurchen history. They unified the Jurchen tribes, destroyed the Liao and defeated the Song, establishing the Jin dynasty. They expanded their territory into the Central Plains, forming a tripartite balance of power with the Song and Western Xia, significantly altering the historical landscape of East Asia."

weiming_blood:0 "Great Xia Blood"
trait_historical_bloodline_family_206650_desc:0 "The Weiming family was the founder of the Western Xia dynasty in Northwest China, whose territory covered over 20,000 *li*. Western Xia nominally submitted to the Liao, Song, and Jin, but internally declared independence, forming a long-standing tripartite balance of power."

mohe_blood:0 "Bohai Blood"
trait_historical_bloodline_family_balhae_dae_17_desc:0 "The Da clan were descendants of the leader of the Sumo Mohe tribe and the founder of the Balhae Kingdom. Under its rule, Balhae borrowed from and innovated on the Tang dynasty's system in culture, politics, and economy, being hailed as the 'Flourishing Kingdom East of the Sea' at its peak."

goguryeo_blood:0 "Goguryeo Blood"
trait_historical_bloodline_family_korean_go_goguryeo_39_desc:0 "The Go clan established the Goguryeo Kingdom, which had a vast territory and formidable military power. Members of the family repeatedly repelled the Sui and Tang armies, long controlling the northern and northeastern parts of the Korean Peninsula, shaping the early political and cultural landscape of Northeast Asia."

silla_blood:0 "Silla Blood"
trait_historical_bloodline_family_korean_gim_113_desc:0 "The Kim family ruled the Silla Kingdom. Through marriage alliances and military conquests, they eventually unified most of the Korean Peninsula, establishing a powerful kingdom and promoting the spread and development of Buddhism in Korea."

goryeo_blood:0 "Goryeo Blood"
trait_historical_bloodline_family_korean_wang_goryeo_51_desc:0 "The founder of the Goryeo dynasty. Family members unified the Later Three Kingdoms of the Korean Peninsula, becoming one of the most important dynasties in Korean history. The family promoted Buddhism, developed culture, and successfully maintained the independence of its regime."

joseon_blood:0 "Joseon Blood"
trait_historical_bloodline_family_korean_i_jeonju_19_desc:0 "The Yi family established the Joseon dynasty, which ruled the Korean Peninsula for over five centuries. The family implemented Confucianism as the state ideology, promoting cultural and economic development, and successfully resisted foreign invasions, leaving a profound impact on Korean history."

yamato_blood:0 "Yamato Blood"
trait_historical_bloodline_family_japanese_yamato_192_desc:0 "The Yamato family is the Imperial House of Japan, revered as descendants of Amaterasu in Shinto. They are the core symbol of Japan's national unity and ethnic identity. The family has an ancient ruling history, maintaining the imperial lineage for thousands of years."

fujiwara_blood:0 "Fujiwara Blood"
trait_historical_bloodline_family_japanese_fujiwara_24_desc:0 "The Fujiwara clan is one of the most important noble families in Japanese history. Through intermarriage with the Imperial Family, the clan skillfully seized political power via regency (*Sesshō* and *Kanpaku*), long acting as the de facto rulers behind the scenes, profoundly shaping the politics and culture of the Heian period."

hojo_blood:0 "Hojo Blood"
trait_historical_bloodline_family_japanese_taira_kanmu_138_desc:0 "The Hōjō clan was the regent (*Shikken*) family of the Minamoto Shogunate. Initially a branch of the Taira clan, they gained effective control over military and political power during the Kamakura Shogunate, manipulating shogunal politics through the *Shikken* office, and were a key force in the samurai regime system."

kamakura_blood:0 "Kamakura Blood"
trait_historical_bloodline_family_japanese_minamoto_seiwa_10_desc:0 "The Minamoto clan established the first samurai government in Japan—the Kamakura Shogunate. The family's founder defeated the Taira clan, ending the era of court noble rule and initiating centuries of samurai rule, marking a major turning point in Japanese history."

heike_blood:0 "Heike Blood"
trait_historical_bloodline_family_japanese_taira_kanmu_21_desc:0 "The Taira clan originated from the Taira branch of the imperial family (Kanmu Heishi). In the late Heian period, they rapidly rose through military success and intermarriage, reaching the peak of their power, briefly controlling Japanese politics. Their story, immortalized in 'The Tale of the Heike', profoundly influenced Japanese culture and history."

ashikaga_blood:0 "Ashikaga Blood"
trait_historical_bloodline_family_japanese_minamoto_seiwa_103_desc:0 "The Ashikaga family established the Ashikaga Shogunate, also known as the Muromachi Shogunate. The family seized power from the Kamakura Shogunate and ruled Japan for nearly two centuries, overseeing a period of cultural flourishing known as the Muromachi period."

##南亚
pandya_blood:0 "Pandya Blood"
trait_historical_bloodline_family_189058_desc:0 "The Pandya family was the ruling dynasty of the Pandya Kingdom, one of the three ancient Tamil kingdoms, centered in the Madurai region of present-day Tamil Nadu. The family's rule can be traced back to at least the 4th century BC, making it one of the longest-ruling dynasties in the world."

chera_blood:0 "Chera Blood"
trait_historical_bloodline_family_189410_desc:0 "The Chera family was the ruling dynasty of the Chera Kingdom, one of the three ancient Tamil kingdoms, located at the southern tip of the Indian subcontinent. The clan's history existed from the time of the Mauryan Empire and continued its rule until at least the 12th century AD."

chola_blood:0 "Chola Blood"
trait_historical_bloodline_family_189400_desc:0 "The Chola family was the ruling dynasty of the Chola Kingdom, one of the three ancient Tamil kingdoms. The period from the 10th to the 13th century was its peak, with family members conquering Southern India, annexing Sri Lanka, and even successfully invading kingdoms in the Malay Archipelago."

chalukya_blood:0 "Chalukya Blood"
trait_historical_bloodline_family_74721_desc:0 "The Chalukya family was an important clan that ruled Central and Southern India from the 6th to the 12th century. Its rule is considered a milestone in the transition of South India from small kingdoms to major empires, and the golden age of Karnataka history."

karkota_blood:0 "Karkota Blood"
trait_historical_bloodline_family_188373_desc:0 "The Karkota family was a powerful ruling clan originating in Kashmir. Under its rule, the Karkota Empire defeated the Tibetan Empire with Tang support, expanding its territory to Bengal, becoming another powerful state in India after the Harsha Empire."

pratihala_blood:0 "Pratihala Blood"
trait_historical_bloodline_family_191605_desc:0 "The Pratihala family was a Hindu ruling clan established by the Gurjara tribe. At its peak, the territory under its control rivaled the Gupta Empire, stretching from Sindh in the west to Bengal in the east."

rashtrakuta_blood:0 "Rashtrakuta Blood"
trait_historical_bloodline_family_74412_desc:0 "The Rashtrakuta family was a prominent house on the Deccan Plateau, and the empire they established was one of the major powers of medieval India, renowned for its excellent administration and cultural patronage."

pala_blood:0 "Pala Blood"
trait_historical_bloodline_family_190025_desc:0 "The Pala family ruled Northeastern India, credited with ending turmoil and ushering in prosperity in the region. The family was the last major royal house in India to practice and patronize Buddhism, significantly contributing to its spread in the East."

pallava_blood:0 "Pallava Blood"
trait_historical_bloodline_family_189073_desc:0 "The Pallava family was a powerful naval family in South Indian history, ruling the Telugu and Tamil regions for centuries. Its architecture and sculptural arts became the foundation of medieval South Indian art, and its writing system spread to Southeast Asia."

##东南亚
pagan_blood:0 "Pagan Blood"
trait_historical_bloodline_family_earlyburman001_desc:0 "The Pagan family was the first in Burmese history to unify the Irrawaddy River basin. They laid the foundation for Burman culture and promoted Theravada Buddhism as the state religion, making Pagan a center for Buddhist architectural art."

kambujadesa_blood:0 "Khmer Blood"
trait_historical_bloodline_family_khmer_varman_10_desc:0 "The Angkor dynasty was the most glorious dynasty in Cambodian history. From the founding by Jayavarman II to the relocation of the capital, the Khmer Empire ruled by this family dominated the Indochinese Peninsula. Family members, through powerful military forces and grand hydraulic engineering, created world-famous religious and architectural wonders like Angkor Wat, pushing Cambodia's power to its peak."

nha_ly_blood:0 "Vietnamese Ly Blood"
trait_historical_bloodline_family_viet_ly_1_desc:0 "After Vietnam's separation from Chinese rule, the Ly family laid the administrative foundation for a centralized state, established the imperial examination and education system, and successfully repelled foreign invaders multiple times, leading Vietnam into a period of political centralization, national unity, and great power."

nha_tran_blood:0 "Vietnamese Tran Blood"
trait_historical_bloodline_family_viet_tran_1_desc:0 "The Tran family rose to prominence at the end of the Later Lý dynasty in Vietnam, establishing the Trần dynasty through abdication. During their rule, they implemented a policy of favoring civil over military power, perfected the examination system and bureaucracy, and established an autonomous foreign policy known as 'External King, Internal Emperor', successfully repelled multiple Mongol invasions and creating a golden age in medieval Vietnam."




####################个人型#######c#############

###欧洲
##西欧
blood_of_icel:0 "Blood of Icel"
trait_historical_bloodline_character_205052_desc:0 "Icel is the legendary ancestor of the Mercian royal family (Icelingas dynasty). His descendants made Mercia one of the most powerful kingdoms among the Anglo-Saxon heptarchy, and his military skill and glory became a medieval legend."

blood_of_rhodri:0 "Blood of Rhodri 'the Great'"
trait_historical_bloodline_character_81831_desc:0 "Rhodri was the first king to rule the greater part of Wales, expanding his territory through marriage and military means to its greatest extent. In the Annals of Ulster, he is recorded as the 'King of the Britons,' having successfully repelled Danish Viking incursions multiple times."

blood_of_cinaed:0 "Blood of Cináed"
trait_historical_bloodline_character_6018_desc:0 "Cináed mac Ailpín (Kenneth MacAlpin) unified the Picts and the Scots, establishing the Kingdom of Alba, and is thus considered the first King of Scotland. His Alpin dynasty ruled Scotland for several centuries."

blood_of_charlemagne:0 "Blood of Charlemagne 'the Great'"
trait_historical_bloodline_character_6392_desc:0 "Charlemagne is one of the greatest monarchs in European history. He unified most of Western Europe, conquering Italy, Saxony, and the Avars, and was crowned 'Emperor of the Romans' on Christmas Day in 800, initiating the Carolingian Renaissance in Europe."

blood_of_alfred:0 "Blood of Alfred 'the Great'"
trait_historical_bloodline_character_7627_desc:0 "Alfred was a resilient warrior and wise ruler who led the West Saxons against Viking invasions, successfully safeguarding England's independence and establishing long-lasting legal and educational systems. He was also the first person to call himself 'King of the Anglo-Saxons,' laying the foundation for the unification of England."

blood_of_hereweard:0 "Blood of Hereward"
trait_historical_bloodline_character_90028_desc:0 "Hereward the Wake was a famous Anglo-Saxon leader who resisted the Norman rule of William the Conqueror. He successfully launched repeated raids against the Norman forces from the Fenlands, becoming a symbol of the Anglo-Saxon spirit of resistance."

blood_of_godefroy:0 "Blood of Godefroy"
trait_historical_bloodline_character_10072_desc:0 "Godfrey of Bouillon was an outstanding commander of the First Crusade. He successfully led his army to capture Jerusalem and, upon founding the kingdom, refused the title of 'King,' instead calling himself 'Defender of the Holy Sepulchre,' becoming the spiritual symbol of the Crusader Kingdom."

blood_of_baldwin:0 "Blood of Baldwin"
trait_historical_bloodline_character_10073_desc:0 "Baldwin of Boulogne was the first King of Jerusalem. He relinquished his European title and established the first Crusader state in the East—the County of Edessa—before succeeding his brother Godfrey, founding the powerful Kingdom of Jerusalem in the Levant."

blood_of_henry_ii:0 "Blood of Henry Plantagenet"
trait_historical_bloodline_character_204500_desc:0 "Henry II was the founder of the Plantagenet dynasty. Through marriage and inheritance, he established a vast Angevin Empire stretching from the Scottish border to the Pyrenees. His introduction of legal and administrative reforms laid the foundation for English common law, and he is regarded as an outstanding legislator."

blood_of_philippe_iv:0 "Blood of Philip IV"
trait_historical_bloodline_character_455526_desc:0 "Philip IV, known as 'the Fair,' was a powerful and iron-willed monarch of the later French Capetian dynasty. He strengthened central authority, accumulated wealth by dissolving the Knights Templar, and coerced the Pope to move to Avignon, greatly enhancing the status of French royalty in Europe."

blood_of_robert_i:0 "Blood of Robert I"
trait_historical_bloodline_character_453501_desc:0 "Robert the Bruce is one of the greatest kings in Scottish history. He led the Scots to victory at the Battle of Bannockburn, successfully defeating the English army and ultimately securing the independence of Scotland and its monarchy."

##中欧

##北欧

blood_of_hastein:0 "Blood of Hastein"
trait_historical_bloodline_character_6878_desc:0 "Hastein was one of the most notorious and successful Vikings of all time. This greedy and terrible old warrior raided dozens of cities across Europe and North Africa, his exploits becoming a legend of adventure that terrified Christians."

blood_of_harald:0 "Blood of Hardrada"
trait_historical_bloodline_character_102531_desc:0 "Harald, known as 'Hardrada' (the Ruthless), was a mercenary in the Eastern Roman Empire's Varangian Guard, who, based on his military talent, became King of Norway."

blood_of_great_knud:0 "Blood of Cnut 'the Great'"
trait_historical_bloodline_character_101510_desc:0 "Cnut was the heir of King Sweyn of Denmark. Through conquest and rule, he unified England, Denmark, Norway, and parts of Sweden under his authority, creating the vast 'North Sea Empire' and becoming one of the greatest monarchs of the Middle Ages."

blood_of_walker_rollo:0 "Blood of Rollo 'the Walker'"
trait_historical_bloodline_character_242_desc:0 "Rollo was the founder of the Duchy of Normandy and the ancestor of William the Conqueror. This Varangian warrior gained recognition from the Frankish King by besieging Paris, establishing a powerful Viking Duchy in France, earning him the nickname 'the Walker'."

##南欧
blood_of_sancho_iii:0 "Blood of Sancho 'the Great'"
trait_historical_bloodline_character_106030_desc:0 "Sancho the Great, King of Navarre, expanded his territory through conquest, diplomacy, and inheritance. At his zenith, he called himself 'Emperor of all Spain,' and was an outstanding monarch who successfully unified most of Northern Iberia under his rule."

blood_of_robert:0 "Blood of Robert 'the Fox'"
trait_historical_bloodline_character_1128_desc:0 "Robert Guiscard, known as 'the Fox.' This powerful Norman adventurer conquered Southern Italy and Sicily. Under his leadership, the Normans even invaded the Balkan Peninsula, challenging the authority of the Byzantine Empire."

blood_of_croatia:0 "Blood of Tomislav"
trait_historical_bloodline_character_8604_desc:0 "Tomislav was the creator and first king of the unified Kingdom of Croatia. He successfully repelled the invasions of the Hungarians and Bulgarians, making Croatia a powerful independent force in the Balkan Peninsula."

blood_of_basileios_ii:0 "Blood of Basil II"
trait_historical_bloodline_character_1716_desc:0 "Basil II, known as the 'Bulgar Slayer,' is one of the greatest emperors of the Eastern Roman Empire. Through relentless military campaigns, he destroyed Bulgaria, pushing the Empire's boundaries to their zenith in four centuries, and bringing lasting glory and strength to the Empire."

blood_of_leo_iii_isaurian:0 "Blood of Leo III"
trait_historical_bloodline_character_70502_desc:0 "Leo III was the founder of the Isaurian dynasty. He was not only an outstanding military strategist who crushed the Arab siege of Constantinople and drove them out of Asia Minor, thereby saving the Empire, but also a famous reformer who initiated the Iconoclasm movement, which profoundly influenced the Empire's history."

blood_of_heraclius:0 "Blood of Heraclius"
trait_historical_bloodline_character_145071_desc:0 "Heraclius was the founder of the Heraclian dynasty. He led the Empire to an epic victory over the Persians, recovering occupied territories, and conducted Hellenization reforms, establishing Greek as the imperial language, and is considered the first emperor of the medieval Eastern Roman Empire."

blood_of_constantine:0 "Blood of Constantine 'the Great'"
trait_historical_bloodline_character_70523_desc:0 "Constantine is one of the greatest emperors in Roman history and the first Roman emperor to embrace Christianity. He established the Empire's new capital, 'Constantinople,' laying the political foundation for medieval European Christian civilization and the Eastern Roman Empire."

blood_of_justinian:0 "Blood of Justinian 'the Great'"
trait_historical_bloodline_character_70512_desc:0 "Justinian was an ambitious Eastern Roman emperor who recovered the lost territories of the Western Roman Empire, pushing the Empire's boundaries to its peak. His compilation of the *Corpus Juris Civilis* and the reconstruction of the Hagia Sophia became the eternal legacy of the Roman Empire."

blood_of_theodora:0 "Blood of Theodora"
trait_historical_bloodline_character_theodora_desc:0 "Empress Theodora of Emperor Justinian was a former actress with extraordinary intelligence and political influence. She saved Justinian's throne with her resolute will during the Nika riots and is hailed as one of the most outstanding women of the Eastern Roman Empire."

blood_of_augustus:0 "Blood of Augustus"
trait_historical_bloodline_character_145290_desc:0 "Augustus, the founding monarch of the Roman Empire. He ended the Roman Civil Wars, stabilized the imperial borders through a series of expansionist wars, and ushered in the *Pax Romana*, a period of two centuries of Roman peace, and is considered one of the greatest rulers in Roman history."

blood_of_nerva:0 "Blood of Nerva"
trait_historical_bloodline_character_145280_desc:0 "Nerva was the first of the Roman 'Five Good Emperors,' establishing the Nerva–Antonine dynasty. He created the system of adopting worthy successors, ensuring the stability of the imperial central government and leading Rome into a golden age lasting nearly a century, hence his epithet 'the Pious Emperor'."

blood_of_trajan:0 "Blood of Trajan"
trait_historical_bloodline_character_145279_desc:0 "Trajan, the second of the Roman 'Five Good Emperors,' known as 'the Brave Emperor.' He was an outstanding military commander. During his reign, the Roman Empire reached its maximum territorial extent through the conquest of Dacia and Mesopotamia, and he was honored by the Senate as *Optimus Princeps* ('the Best First Citizen')."

blood_of_hadrian:0 "Blood of Hadrian"
trait_historical_bloodline_character_145278_desc:0 "Hadrian, the third of the Roman 'Five Good Emperors,' known as 'the Wise Emperor.' He abandoned expansionist policies to consolidate and defend the Empire's borders, building the famous Hadrian's Wall to separate the civilized from the barbarian lands in Britannia, and dedicated himself to the integration of the Empire's various peoples."

blood_of_antoninus_pius:0 "Blood of Antoninus Pius"
trait_historical_bloodline_character_145277_desc:0 "Antoninus, the fourth of the Roman 'Five Good Emperors,' known as 'the Loyal Emperor.' He continued Hadrian's policy of peace, vigorously developed the economy and public works internally. His reign is considered the most peaceful and prosperous golden age of the Roman Empire."

blood_of_marcus_aurelius:0 "Blood of Marcus Aurelius"
trait_historical_bloodline_character_145274_desc:0 "Marcus Aurelius, the last of the Roman 'Five Good Emperors,' hailed as the 'Philosopher Emperor.' His philosophical work *Meditations* is enduring. He resisted barbarian invasions through relentless military campaigns, marking the end of the Roman Golden Age."

##东欧
blood_of_simeon:0 "Blood of Simeon 'the Great'"
trait_historical_bloodline_character_712_desc:0 "Simeon was not merely a conqueror crowned in gold, but a scholar garbed in monk's robes. Having drank deep from the well of Byzantine wisdom, he transformed Bulgaria into a beacon of Slavic culture. His descendants inherit his insatiable thirst for knowledge and the martial majesty that once made Emperors tremble."

blood_of_mindaugas:0 "Blood of Mindaugas"
trait_historical_bloodline_character_125301_desc:0 "Mindaugas is the first known Grand Duke and the only King of Lithuania. He unified the various Lithuanian tribes under his rule, created the Grand Duchy of Lithuania, and successfully halted the advance of the Tatars and the Teutonic Knights toward the Baltic Sea."

blood_of_jadwiga:0 "Blood of Jadwiga"
trait_historical_bloodline_character_jadwiga_desc:0 "The devout and shrewd Jadwiga was the only female King in Polish history. Through her marriage to Grand Duke Jogaila of Lithuania, she established the Polish–Lithuanian Union, strengthening the bond between the two nations and bringing great power to medieval Eastern Europe."

###非洲

##北非
blood_of_idrisid:0 "Blood of Idrisid"
trait_historical_bloodline_character_159501_desc:0 "Idris was the founder and progenitor of the Idrisid dynasty in Morocco, and a descendant of the Prophet Muhammad. He unified the Moroccan region, establishing the first Arab Muslim dynasty in the area, and is considered the founder of the Moroccan state."

blood_of_tulunid:0 "Blood of Tulunid"
trait_historical_bloodline_character_163115_desc:0 "Ahmad ibn Tulun was the founder of the Tulunid dynasty. He was a governor of Turkic slave origin who used the decline of the Abbasid Caliphate to establish an independent dynasty in Egypt. Under his rule, Egypt achieved great economic and cultural prosperity, with its influence temporarily expanding to the mountainous regions of northern Iraq."

##东非

##西非
blood_of_sundiata:0 "Blood of Sundiata"
trait_historical_bloodline_character_161022_desc:0 "The founder of the Mali Empire, hailed as the 'Lion King.' He unified the Mandinka tribes, establishing the most powerful Islamic empire in West Africa. Under his rule, Mali became a cultural and wealthy center spanning sub-Saharan Africa."

###亚洲

##西亚
blood_of_bahram_chobin:0 "Blood of Bahram Chobin"
trait_historical_bloodline_character_180645_desc:0 "Bahram VI Chobin was a Sasanian military leader and once the monarch of the dynasty. His greatest feat was defeating the Eastern Roman Empire and other great powers with significantly inferior forces, a heroic act that led him to become a sovereign."

blood_of_mirian_iii:0 "Blood of Mirian III"
trait_historical_bloodline_character_159604_desc:0 "A monarch of great importance in Georgian history. Famous for establishing Christianity as the state religion of Georgia, he is revered as a saint by the Georgian Orthodox Church."

blood_of_shapur_ii:0 "Blood of Shapur 'the Great'"
trait_historical_bloodline_character_180617_desc:0 "The King of Kings of the Sasanian dynasty of Iran, hailed as one of the three greatest wise monarchs of the Sasanians. He was one of the most outstanding politicians and military strategists of his era, reviving Persian national power and military prestige, making Persia the most authoritative state of the time."

blood_of_kavad_i:0 "Blood of Kavad"
trait_historical_bloodline_character_180627_desc:0 "One of the three wise monarchs of the Sasanian dynasty of Iran. He ascended the throne during a national crisis, greatly revitalizing the royal authority and national power, initiating the Sasanian dynasty's 'Second Golden Age'."

blood_of_khosrow_i:0 "Blood of Khosrow"
trait_historical_bloodline_character_180628_desc:0 "Khosrow I is ranked alongside Shapur II and Kavad I as one of the three greatest wise monarchs of the Sasanians, widely regarded as the most learned and wise 'Philosopher Emperor' of the four hundred years of Sasanian rule. During his reign, Sasanian Persia reached its highest peak of civil and military achievements."

blood_of_muhammad:0 "Blood of Muhammad"
trait_historical_bloodline_character_33922_desc:0 "The founder of Islam, and an outstanding politician, military leader, and social reformer. He successfully unified the tribes of the Arabian Peninsula under the monotheism of Islam, and is regarded by Muslims as the Messenger and Prophet sent by God to humanity."

blood_of_muawiya:0 "Blood of Umayyad"
trait_historical_bloodline_character_163029_desc:0 "Mu'awiya was the fifth Caliph of Islam and the founder of the Umayyad dynasty. He was a skillful politician who consolidated his power through battles, including the siege of Mecca."

blood_of_abbasid:0 "Blood of Abbasid"
trait_historical_bloodline_character_34001_desc:0 "Abu al-Abbas was a descendant of Abbas ibn Abd al-Muttalib, the uncle of the Prophet Muhammad. He overthrew the Umayyad Caliphs and established the Abbasid dynasty, making Baghdad his capital."

blood_of_abu_bakr:0 "Blood of Abu Bakr"
trait_historical_bloodline_character_163014_desc:0 "Abu Bakr was the first Caliph in the history of Islam. He was the father-in-law of the Prophet Muhammad and is recognized by Sunnis as Muhammad's successor. Under his leadership, the Arabs began and succeeded in the external conquests against the Sasanian and Byzantine Empires."

blood_of_umar:0 "Blood of Umar"
trait_historical_bloodline_character_163015_desc:0 "Umar was the second of the Four Rashidun Caliphs in Islamic history, and one of the most powerful and influential Caliphs in history. Known for his selflessness and justice, under his rule the Caliphate expanded rapidly, conquering the Sasanian Empire and two-thirds of the Byzantine Empire."

blood_of_uthman:0 "Blood of Uthman"
trait_historical_bloodline_character_163021_desc:0 "Uthman ibn Affan was the third Caliph in Islamic history. During his reign, Arab cavalry were invincible, the Iranian Plateau was incorporated into the Islamic sphere, and the Caucasus and Cyprus also became part of the Islamic world."

blood_of_ali:0 "Blood of Ali"
trait_historical_bloodline_character_33911_desc:0 "The paternal cousin and son-in-law of the Prophet Muhammad, and one of the first to accept the revelation. He dedicated his life to Islam, serving as a model for believers, and was known as the 'Lion of God,' respected for his courage, knowledge, and integrity."

blood_of_zaydism:0 "Blood of Zayd"
trait_historical_bloodline_character_163043_desc:0 "Zayd was the great-grandson of the Prophet Muhammad and the son of the fourth Imam, Ali Zayn al-Abidin. He opposed the tyranny of the Umayyad dynasty, led an uprising, and was martyred, revered by the Zaydis as the successor and spiritual mentor to the Imamate."

blood_of_ismailism:0 "Blood of Ismail"
trait_historical_bloodline_character_33916_desc:0 "A direct descendant of the Prophet Muhammad and the eldest son of the sixth Imam, Ja'far al-Sadiq. He is revered by the Ismailis as the legitimate successor to the Imamate and the spiritual leader and source of faith for the sect."

blood_of_musa_kazim:0 "Blood of Kazim"
trait_historical_bloodline_character_163022_desc:0 "Musa al-Kazim was the seventh Imam of Shia Islam, revered by Muslims for his piety, patience, and wisdom, and the ancestor of all subsequent Imams of the Twelver Shia branch."

blood_of_mahdi:0 "Blood of Mahdi"
trait_historical_bloodline_character_163027_desc:0 "The twelfth and last Imam of the Twelver Shia branch. He entered occultation in his youth and is believed by Twelver Shia to reappear as the Mahdi (Saviour) at the end of time, bringing justice and peace to the world."

blood_of_harun_rashid:0 "Blood of Harun al-Rashid"
trait_historical_bloodline_character_34005_desc:0 "The Caliph of the Abbasid dynasty during its most powerful era. He gained fame in the West for his alliance with the Frankish strongman Charlemagne, and is widely known through his vivid portrayal in the world-famous *One Thousand and One Nights*. Under his rule, the capital Baghdad became the world's political, economic, and cultural center, and the Abbasid dynasty entered a veritable Golden Age."

blood_of_abd_rahman:0 "Blood of Abd al-Rahman"
trait_historical_bloodline_character_73679_desc:0 "The first Emir of the Emirate of Córdoba and the founder of the Later Umayyad dynasty. He initiated the long-term rule of the medieval Islamic regime in Spain, repelling invasions by the Abbasids and the Frankish army, and was hailed as the 'Hawk of the Quraysh'."

blood_of_arslan:0 "Blood of Arslan"
trait_historical_bloodline_character_3040_desc:0 "The powerful Sultan of the Seljuk Empire. With extraordinary military talent, he defeated the invading Eastern Roman army at the Battle of Manzikert against greater odds, laying the foundation for Turkic rule in Anatolia, earning him the honorific 'Valiant Lion' from later generations."

blood_of_hashashin:0 "Blood of Hassan-i Sabbah"
trait_historical_bloodline_character_41702_desc:0 "The founder of the Hashashin sect (Assassins). He was famous for his mysterious doctrine and assassination campaigns against enemies, establishing a clandestine network across the mountainous regions of Persia and Syria that profoundly influenced the politics of the medieval Islamic world."

blood_of_suleyman:0 "Blood of Suleyman"
trait_historical_bloodline_character_3046_desc:0 "Utilizing the decline of Byzantium, Suleyman Shah I established the Sultanate of Rum, headquartered in Nicaea, in western Anatolia. This state had a profound influence on later history, laying an important foundation for the subsequent Islamization and Turkification of the region."

blood_of_saffarid:0 "Blood of Saffarid"
trait_historical_bloodline_character_163163_desc:0 "The founder of the Saffarid dynasty, who rose from a poor coppersmith to a powerful military conqueror. He led his armies to defeat the Abbasid forces, establishing his own powerful dynasty in the East, an exemplar of a plebeian hero."

blood_of_tamari:0 "Blood of Tamari 'the Great'"
trait_historical_bloodline_character_466517_desc:0 "The founder of the Georgian Kingdom, who successfully resisted Arab invasions and unified various Georgian principalities. He is revered as one of the greatest monarchs in Georgian history, promoting culture and Christianity."

##中亚
blood_of_zhangyichao:0 "Blood of Zhang Yichao"
trait_historical_bloodline_character_206811_desc:0 "A powerful magnate from Sha Prefecture, who led an uprising of the Hexi Han people in 848 AD, successfully overthrowing the Tibetan rule and restoring the allegiance of most of the Hexi Corridor to the Tang Dynasty. He was enfeoffed by the Tang court as the Jiedushi (Military Commissioner) of the Guiyi Circuit, establishing an important Han regime in the chaotic Western Regions and dedicating himself to the revival of Central Plains culture."

blood_of_dashi:0 "Blood of Dashi"
trait_historical_bloodline_character_188905_desc:0 "A member of the Liao imperial house who led his followers westward after the Liao dynasty's collapse, establishing the powerful Qara Khitai (Western Liao) dynasty in Central Asia. He introduced the governance model and Khitan culture of the Central Plains dynasties to Central Asia, gaining fame between the Islamic world and the Byzantine Empire for his outstanding military and political talent."

#东亚
blood_of_kongqiu:0 "Blood of Confucius"
trait_historical_bloodline_character_han_80000_desc:0 "A great thinker and educator of the Spring and Autumn period, he founded Confucianism. He advocated 'benevolence' (*Ren*) and 'rites' (*Li*), promoting 'education without discrimination,' with his thought influencing China and East Asia for thousands of years, revered by later generations as the 'Most Holy Teacher'."

blood_of_liuxiu:0 "Blood of Liu Xiu"
trait_historical_bloodline_character_imperial_han_1_desc:0 "The founding emperor of the Eastern Han Dynasty, posthumously known as Emperor Guangwu. Relying on his outstanding military talent and magnanimity, he overcame great odds in the time of chaos, ended the Wang Mang regime, unified the war-torn realm, and ushered in the 'Restoration of Guangwu'."

blood_of_simayi:0 "Blood of Sima Yi"
trait_historical_bloodline_character_imperial_jin_3_desc:0 "An outstanding politician and strategist of the state of Wei during the Three Kingdoms period, and the architect of the Western Jin Dynasty. He successfully repelled Zhuge Liang's northern expeditions multiple times, wielded immense power in his later years, and made significant contributions to Wei both economically and militarily."

blood_of_yangjian:0 "Blood of Yang Jian"
trait_historical_bloodline_character_imperial_sui_1_desc:0 "The founding emperor of the Sui Dynasty, posthumously known as Emperor Wen. He ended centuries of the Northern and Southern Dynasties division, reunified China, and implemented a series of reforms during his reign, ushering in the 'Rule of Kaihuang'."

blood_of_lishimin:0 "Blood of Li Shimin"
trait_historical_bloodline_character_han_377_desc:0 "The second emperor of the Tang Dynasty, with the temple name Taizong. He pacified the warlords at the end of the Sui with exceptional military talent, then initiated the 'Rule of Zhenguan,' relying on capable officials and humbly accepting advice. He was revered as the 'Heavenly Khan' by the northern tribes and is a recognized model of an enlightened ruler in history."

blood_of_wuzetian:0 "Blood of Wu Zetian"
trait_historical_bloodline_character_han_518_desc:0 "The only female emperor in Chinese history acknowledged by official histories. She ascended from Empress of Emperor Gaozong to regent, eventually establishing the Wu Zhou Dynasty and holding power for decades. Her rule made great contributions to the prosperity and unification of the Tang Dynasty."

blood_of_lilongji:0 "Blood of Li Longji"
trait_historical_bloodline_character_han_911_desc:0 "One of the longest-reigning and most famous emperors of the Tang Dynasty, known as Emperor Xuanzong. He ushered in the 'Flourishing Age of Kaiyuan,' bringing the Tang Dynasty to its peak. However, his later years, marked by indulgence and reliance on corrupt officials, led to the 'An Lushan Rebellion,' causing the empire's decline."

blood_of_huangchao:0 "Blood of Huang Chao"
trait_historical_bloodline_character_bookmark_huang_chao_desc:0 "A famous peasant rebellion leader in the late Tang Dynasty. He captured Chang'an, declared himself emperor, and named his state 'Great Qi.' The Huang Chao Rebellion he led shook the foundations of Tang rule, accelerated the demise of the late Tang, and had a profound impact on the subsequent historical landscape."

blood_of_zhaokuangyin:0 "Blood of Zhao Kuangyin"
trait_historical_bloodline_character_han_4622_desc:0 "The founding emperor of the Song Dynasty, with the temple name Taizu. He became emperor through the 'Chenqiao Mutiny,' establishing the Northern Song and ending the chaos of the Five Dynasties and Ten Kingdoms, laying the foundation for the Song Dynasty's three centuries of rule."

blood_of_zhaoguangyi:0 "Blood of Zhao Guangyi"
trait_historical_bloodline_character_han_4801_desc:0 "The second emperor of the Song Dynasty, with the temple name Taizong. He developed the Song Dynasty's economy and culture through a series of reforms and completed the unification wars. However, he was defeated in two campaigns against the Liao, failing to recover the Sixteen Prefectures of Yan-Yun, which sowed the seeds of the Song Dynasty's military decline."

blood_of_sushi:0 "Blood of Su Shi"
trait_historical_bloodline_character_su_82CF_1_desc:0 "One of the greatest writers and artists in Chinese history, and a leading figure in Song Dynasty literature. He achieved outstanding success in poetry, prose, calligraphy, and painting, hailed as one of the 'Eight Masters of the Tang and Song Dynasties,' with a profound influence on later literature and art."

blood_of_simaguang:0 "Blood of Sima Guang"
trait_historical_bloodline_character_han_7308_desc:0 "A famous historian and politician of the Northern Song Dynasty, who compiled the *Zizhi Tongjian*, the first chronicle-style general history in Chinese history. With his profound scholarship and unyielding integrity, he played an important role in the political arena of the Song Dynasty."

blood_of_wanganshi:0 "Blood of Wang Anshi"
trait_historical_bloodline_character_han_7436_desc:0 "A famous politician, writer, and reformer of the Northern Song Dynasty. He implemented a series of reforms aimed at strengthening central authority and revitalizing the economy, known as the 'Wang Anshi Reforms.' His reforms sparked widespread controversy at the time and had a profound impact on Chinese history."

blood_of_ouyangxiu:0 "Bloodline of Ouyang Xiu"
trait_historical_bloodline_character_han_6745_desc:0 "A prominent statesman and man of letters of the Northern Song Dynasty, who served as Vice Minister of the Bureau of Military Affairs and Participant in Medieval Administration. As a leader of the Classical Prose Movement, he advocated for a natural and clear writing style and is honored as one of the 'Eight Masters of Tang and Song'. Beyond his contributions to historiography and epigraphy, he was renowned for his integrity and his dedication to mentoring younger scholars, standing as a grandmaster of the literary world."

blood_of_xinqiji:0 "Blood of Xin Qiji"
trait_historical_bloodline_character_han_12371_desc:0 "A famous patriotic poet and military general of the Southern Song Dynasty. His bold and passionate *ci* poetry expressed his love for the nation and his determination to fight the Jin and restore the lost territories. He also achieved numerous military successes in the war against the Jin, making him an important figure in Song Dynasty literature and military history."

blood_of_zhuxi:0 "Blood of Master Zhu"
trait_historical_bloodline_character_han_11957_desc:0 "The most famous Neo-Confucian scholar and educator of the Southern Song Dynasty, and a key representative of the Confucian school. He systematically organized and developed the Confucian classics, proposing the *li-qi* (Principle and Vital Force) theory, profoundly influencing Chinese philosophy, education, and culture, and is revered as 'Master Zhu'."

blood_of_wangshao:0 "Blood of Wang Shao"
trait_historical_bloodline_character_han_7897_desc:0 "An outstanding military strategist and statesman of the Northern Song dynasty. Renowned for both his strategic brilliance and valor, he masterminded the famous 'Xihe Campaign,' recapturing vast territories and expanding the Song borders by thousands of miles, establishing himself as one of the finest generals of his era."

blood_of_chengyi:0 "Blood of Cheng Yi"
trait_historical_bloodline_character_han_8079_desc:0 "A distinguished Neo-Confucian philosopher and educator of the Northern Song dynasty, who co-founded the Luo School with his elder brother Cheng Hao. Known for his rigorous scholarship, he championed the concept of 'Gevu Zhizhi' (the investigation of things to extend knowledge), laying the bedrock for later Song dynasty philosophy."

#blood_of_chenghao:0 "Blood of Cheng Hao"
#trait_historical_bloodline_character_han_8026_desc:0 "A prominent philosopher and educator of the Northern Song dynasty, and a foundational pioneer of Neo-Confucianism. Celebrated for his magnanimous character, his teachings emphasized the spiritual 'Heavenly Principle' and the oneness of humanity and nature. Together with his brother, his ideas formed the core pillar of the later 'Cheng-Zhu School'."

blood_of_trinring:0 "Blood of Trinring"
trait_historical_bloodline_character_247085_desc:0 "A prominent politician, military strategist, and diplomat of the early Tibetan Empire, Gar Tongtsen hailed from the influential Gar clan and served as the Great Minister (Lönchen). He was one of the most pivotal officials during the reign of Songtsen Gampo.According to historical records, he was described as a man of "shrewdness, resolution, and gravity." During his tenure, he made significant contributions to the development of Tibet's political and economic systems."

blood_of_tongtsen:0 "Blood of Tongtsen"
trait_historical_bloodline_character_247087_desc:0 "A prominent political and military figure of the early Tibetan Empire, he served as the Great Minister (Lonchen). During his tenure, the borders of the Tibetan Empire were largely established, and the nation's power reached its zenith. Lon Trinring (Gar Trinring Tsendro) is also recognized in both Tibetan and ancient Chinese history as one of the few renowned generals to have never suffered a defeat."

blood_of_abaoji:0 "Blood of Abaoji"
trait_historical_bloodline_character_194325_desc:0 "The founder of the Liao Dynasty in China. A leader of both bravery and wisdom, he unified large territories in northern China and the scattered nomadic tribes, completing the transformation of the Khitan from a tribe to a state, and laying the foundation for the two-hundred-year Liao Dynasty."

blood_of_yuanhao:0 "Blood of Yuanhao"
trait_historical_bloodline_character_206650_desc:0 "The founding emperor of the Western Xia Dynasty. He renounced the surnames granted by the Tang and Song, proclaiming himself 'Wuzhu' (Son of the Blue Sky), created the Western Xia script, and used his extraordinary military talent to establish an independent Tangut kingdom on the northwestern frontier of China."

blood_of_aguda:0 "Blood of Aguda"
trait_historical_bloodline_character_jurchen_wanyan_8_desc:0 "The founding emperor of the Jin Dynasty. He achieved victory against greater odds, heavily defeating the Liao army at the Battle of Outabao. He subsequently conquered the Liao Dynasty and occupied northern China, establishing Jurchen rule over the Central Plains."

blood_of_jamukha:0 "Blood of Jamukha"
trait_historical_bloodline_character_mpo_mongol_1_desc:0 "One of the important early leaders of the Mongol Empire, considered a steppe leader with exceptional military talent and political wisdom. He was also Genghis Khan's childhood friend and main rival. He advocated for traditional Mongol aristocratic rule, contrasting sharply with Genghis Khan's populism, ultimately leading to his defeat in the power struggle with Genghis Khan."

blood_of_kublai:0 "Blood of Kublai"
trait_historical_bloodline_character_217266_desc:0 "The grandson of Genghis Khan and the founding emperor of the Yuan Dynasty, revered as Emperor Shizu of Yuan. He completed the great enterprise of unifying China, extended the Mongol Empire's rule to its extreme extent, and promoted the transition of the Mongols from steppe conquerors to emperors of the Central Plains."

blood_of_jochi:0 "Blood of Jochi"
trait_historical_bloodline_character_125502_desc:0 "Genghis Khan's eldest son, whose parentage was disputed, but an exceptional general. He was granted the vast territory west of the Mongol heartland, and his descendants established the Golden Horde (Kipchak Khanate), which ruled Eastern Europe."

blood_of_chagatai:0 "Blood of Chagatai"
trait_historical_bloodline_character_93062_desc:0 "Genghis Khan's second son, known for his mastery and strict adherence to Mongol laws and customs. He was enfeoffed with a vast region in Central Asia, and his descendants established the Chagatai Khanate, which ruled the area."

blood_of_ogodei:0 "Blood of Ögedei"
trait_historical_bloodline_character_172005_desc:0 "Genghis Khan's third son, who inherited Genghis Khan's will, conquering the Jin Dynasty in the south and launching the Second Western Campaign. He emphasized internal governance, employed talented officials, and established the capital of the Mongol Empire at Karakorum."

blood_of_tolui:0 "Blood of Tolui"
trait_historical_bloodline_character_125520_desc:0 "Genghis Khan's youngest son, an outstanding military commander. He achieved great military success in the campaigns against the Jin and Khwarazm, known for his bravery and ruthlessness. His wife, Sorghaghtani Beki, bore him four famous Khans."

blood_of_seondeok:0 "Blood of Queen Seondeok"
trait_historical_bloodline_character_korean_gim_145_desc:0 "The 27th ruler of the Silla Kingdom, the first reigning queen in the history of the Korean Peninsula. While wars with Goguryeo and Baekje persisted during her reign, she maintained national stability and development through diplomacy and military capability."

blood_of_kamatari:0 "Blood of Fujiwara no Kamatari"
trait_historical_bloodline_character_japanese_fujiwara_24_desc:0 "A trusted confidant of Prince Naka no Ōe, and the key figure who promoted the 'Taika Reform,' a crucial political reform. He established the powerful Fujiwara clan, which dominated the Japanese political scene for the following several centuries."

blood_of_kiyomori:0 "Blood of Taira no Kiyomori"
trait_historical_bloodline_character_japanese_taira_kanmu_34_desc:0 "A famous samurai in the late Heian period, he emerged victorious in the Hōgen and Heiji Rebellions, initiating the rise of samurai power. He served as the Grand Minister, the first samurai to hold this position of power, and his influence reached its zenith."

blood_of_yoritomo:0 "Blood of Minamoto no Yoritomo"
trait_historical_bloodline_character_japanese_minamoto_seiwa_10_desc:0 "The first Shogun of the Kamakura Shogunate and the founder of the shogunate system in Japan. He successfully crushed the Taira clan, established a semi-independent military government in Kamakura, and ushered in the era of samurai rule that lasted for centuries, marking a significant turning point in Japanese history."

blood_of_yoshitsune:0 "Blood of Minamoto no Yoshitsune"
trait_historical_bloodline_character_japanese_minamoto_seiwa_139_desc:0 "A legendary general of the late Heian period, famous for his distinguished service in the Genpei War. He is regarded as one of the greatest tragic heroes in Japanese history, renowned for his superior martial arts and tactics."

blood_of_tokimasa:0 "Blood of Hojo Tokimasa"
trait_historical_bloodline_character_japanese_taira_kanmu_133_desc:0 "The first Shikken (regent) of the Kamakura Shogunate and Minamoto no Yoritomo's father-in-law. He assisted the Shogun and, after Yoritomo's death, eliminated rivals and deposed/installed Shoguns, exercising the Shogun's power as Shikken and establishing the Hojo clan's de facto control over the shogunate."

blood_of_wang_geon:0 "Blood of Wang Geon"
trait_historical_bloodline_character_korean_wang_goryeo_1_desc:0 "Amidst the embers of the Later Three Kingdoms, Wang Geon mended a fractured realm with an extraordinary heart of inclusion. A master of matrimonial diplomacy and mercy, he turned bitter rivals into steadfast allies. Those who carry the blood of Taejo possess a natural gift for winning hearts and governing the populace with a steady, paternal hand."

blood_of_xuanji:0 "Blood of Yu Xuanji"
trait_historical_bloodline_character_han_3828_desc:0 "A famous female poet of the Tang Dynasty, known for her talent and tragic life. Her poetry often describes love and separation, characterized by a fresh and subtle style, deeply appreciated by later generations."

blood_of_komachi:0 "Blood of Ono no Komachi"
trait_historical_bloodline_character_japanese_ono_12_desc:0 "A famous female poet of the Heian period, known for her unparalleled beauty and extraordinary talent. Her *waka* poetry is characterized by delicate emotion and beautiful language, becoming a classic of Japanese literature."

blood_of_luoyao:0 "Blood of Liang Luoyao"
trait_historical_bloodline_character_tangut_liang_1_desc:0 "Liang Luoyao assisted two emperors with political wisdom and boldness, stabilizing the court during the crucial period of Western Xia's imperial succession. She promoted diplomatic balance with the Song and Liao dynasties, and supported the Sinicization reforms and cultural development of Western Xia, becoming an indispensable core of power in the mid-Western Xia period."

blood_of_xiao_chuo:0 "Blood of Xiao Chuo"
trait_historical_bloodline_character_nn_xiao_sis_yanyan_desc:0 "Empress Dowager Xiao Chuo of the Liao Dynasty's Emperor Shengzong, known for her outstanding political talent and firm leadership. She acted as regent after her husband's death, successfully maintaining the stability and prosperity of the Liao Dynasty, and promoting a series of important political and military reforms."

blood_of_wallada:0 "Blood of Wallada"
trait_historical_bloodline_character_andalusian_0003_desc:0 "The daughter of the Caliph of Córdoba and one of the last members of the Umayyad dynasty. She dedicated her life to scholarship and research, walking unveiled in a harsh world and sharpening the minds of women of all classes."

##南亚

##东南亚
blood_of_anawrahta:0 "Blood of Anawrahta"
trait_historical_bloodline_character_burman001_desc:0 "The founder of the Pagan Dynasty. He unified the fragmented Myanmar, laying the foundation for his kingdom's rule for centuries, and was revered as the 'Ashoka of Myanmar' for his strong patronage of Buddhism."

blood_of_jayavarman_vii:0 "Blood of Jayavarman VII"
trait_historical_bloodline_character_khmer_mahidharapura_17_desc:0 "An outstanding Khmer king who defeated the Cham invasion and brought the Khmer Empire into its final golden age. He converted to Buddhism and dedicated himself to the construction of the magnificent Bayon temple and numerous temples, hospitals, and public works, known for his charity and piety."

blood_of_ly_thai_to:0 "Blood of Lý Công Uẩn"
trait_historical_bloodline_character_viet_ly_1_desc:0 "Lý Công Uẩn was the founding monarch of Vietnam's Lý Dynasty. He seized power from the Early Lê Dynasty and moved the capital to Đại La Thành (later renamed Thăng Long, now Hanoi), laying the foundation for Vietnam's long-term development."

