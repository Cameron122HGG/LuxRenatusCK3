#家族型
karen_blood:0 "Karen Blood"
mihran_blood:0 "Mihran Blood"
trait_ck2_bloodline_family_160309_desc:0 "Descendants of one of the seven great clans of Parthia under Sassanid rule. The Seven Clans, or Seven Houses, played a vital role in Persian history."

ashina_blood:0 "Ashina Blood"
trait_ck2_bloodline_family_74000_desc:0 "The Ashina clan rose to prominence after rebelling against the Rouran Khaganate. Its members were considered semi-divine by the peoples of the great steppes."


#个人型
blood_of_caratacus:0 "Blood of Caratacus"
trait_ck2_bloodline_character_caratacus_desc:0 "An ancient British warrior who was the king of the Catuvellauni tribe during the Roman invasion of Britain, leading the resistance that nearly stopped the Roman conquest of the island."

blood_of_sassanid:0 "Blood of Sassan"
trait_ck2_bloodline_character_159599_desc:0 "The founder of the Sassanid dynasty. Known as a great warrior, hunter, and high priest of Zoroastrianism."

blood_of_bagratid:0 "Blood of Bagrat"
trait_ck2_bloodline_character_159921_desc:0 "Bagrat founded one of the world's oldest Christian dynasties, whose descendants ensured Georgia's prosperity for centuries."

blood_of_vortigern:0 "Blood of Vortigern"
trait_ck2_bloodline_character_159056_desc:0 "A king in the Sub-Roman period of Britain. He was a powerful leader, but also infamous for hiring Saxons and bringing them to the island of Britain."

blood_of_niall:0 "Blood of Niall of the Nine Hostages"
trait_ck2_bloodline_character_7255_desc:0 "A legendary Irish High King and the founder of the Uí Néill dynasty. It is said that in early Ireland, people promised that the first hand to touch Ulster would have the land and be the High King of Ireland. Niall cleverly cut off one of his hands and threw it into Ulster, staining the green grass with his blood. During his reign, he won several battles against the Saxons, Scots, Gauls, and even the Romans."

blood_of_merovingian:0 "Blood of Merovech"
trait_ck2_bloodline_character_168671_desc:0 "The legendary founder of the Merovingian dynasty. He led his tribal army to join forces with the Romans to drive the Huns out of Gaul and ended Attila's ambition in the region."

blood_of_attila:0 "Blood of Attila"
trait_ck2_bloodline_character_159117_desc:0 "Kubrat claimed his family descent could be traced back to Attila, who united numerous tribes under his command, becoming one of the most feared enemies of the ancient Roman Empire."

blood_of_solomon:0 "Blood of Solomon"
trait_ck2_bloodline_character_145983_desc:0 "The Solomonic dynasty claims its direct ancestor is King Solomon from the Bible, the King of Israel renowned for his legendary wisdom and wealth. Its founder, Menelik I, was the offspring of Solomon of Israel and the Queen of Sheba."

blood_of_songtsen_gampo:0 "Blood of Songtsen Gampo"
trait_ck2_bloodline_character_247075_desc:0 "The founder of the Tibetan Empire, who united several kingdoms on the Tibetan Plateau under his rule. He also introduced Buddhism to Tibet and created the Tibetan script."

blood_of_carolingian:0 "Blood of Karl 'the Hammer'"
trait_ck2_bloodline_character_131721_desc:0 "A great warrior and outstanding statesman who established the Franks' undisputed mastery over Gaul, while leading his army to defeat the Muslims at the Battle of Tours."

blood_of_gopala:0 "Blood of Gopala"
trait_ck2_bloodline_character_190027_desc:0 "The founder of the Pala dynasty, who is said to be a descendant of the mythical Solar Dynasty (Sūryavaṃśa). He ruled a vast kingdom encompassing the entirety of Bengal."

blood_of_ragnarr_lodbrok:0 "Blood of Ragnarr 'Lóðbrók'"
trait_ck2_bloodline_character_163109_desc:0 "An adventurer feared by Christians, a legendary Viking hero, and the King of Danes. He killed a mighty sea serpent, led numerous raids against the Franks and Anglo-Saxons, and even successfully besieged Paris by sailing up the Seine River."

blood_of_rurik:0 "Blood of Rurik"
trait_ck2_bloodline_character_40605_desc:0 "Rurik was a Varangian chieftain who ruled the Rus' and was the founder of the Rurikid dynasty, establishing many settlements including the renowned Novgorod."

blood_of_basil:0 "Blood of Basil 'the Macedonian'"
trait_ck2_bloodline_character_1700_desc:0 "Basil was born a peasant, and was employed by the Emperor before marrying the Emperor's daughter and rising to the rank of Basileus himself. He was one of the greatest emperors of the Byzantine Empire, under whose reign the Empire entered an era of glory, strength, order, and artistic prosperity."

blood_of_dyre:0 "Blood of Dyre 'the Odd'"
trait_ck2_bloodline_character_6811_desc:0 "A legendary Varangian warrior. He ruled the region of Kiev and became its first King."

blood_of_bayajidda_and_magajiva:0 "Blood of Bayajidda and Magajiva"
trait_ck2_bloodline_character_251187_desc:0 "Daura claims descent from Bayajidda, the snake-slaying hero, and Magajiva, the second queen who founded the Hausa matrilineal clan society."

blood_of_harald_fairhair:0 "Blood of Harald Fairhair"
trait_ck2_bloodline_character_144000_desc:0 "A legendary ruler who unified the Kingdom of Norway and the Norwegian people through personal ability and military might."

blood_of_arpad:0 "Blood of Árpád"
trait_ck2_bloodline_character_159136_desc:0 "The Kende of the Magyar tribes. He conquered the Carpathian Basin, finding a new homeland for the Hungarian people."

blood_of_jannabid:0 "Blood of Sai'id al-Jannabi"
trait_ck2_bloodline_character_jannabid_desc:0 "He is known for conquering Bahrain and establishing the Qarmatian Republic. In the years to come, they would continuously harass their neighbors."

blood_of_abdullah:0 "Blood of Abdullah"
trait_ck2_bloodline_character_32900_desc:0 "As the Abbasid Caliphate descended into unrest, the Fatimid dynasty rose in Ifriqiya and established their own caliphate under the leadership of Ubayd Allah al-Mahdi Billah al-Fatimi."

blood_of_premyslid:0 "Blood of Boleslav 'the Cruel'"
trait_ck2_bloodline_character_508_desc:0 "Boleslav had the inglorious start of murdering his elder brother to take power, but was nevertheless a strong leader. Bohemia prospered and grew powerful under his rule."

blood_of_athelstan:0 "Blood of Aethelstan"
trait_ck2_bloodline_character_33350_desc:0 "He is renowned and respected for driving the Vikings out of the British Isles and for being the first King of England."

blood_of_mardavij:0 "Blood of Mardavij"
trait_ck2_bloodline_character_166989_desc:0 "He was the last Zoroastrian ruler in Persia to resist the Muslims, attempting to restore the Sassanid Empire."

blood_of_rudolph:0 "Blood of Rudolph"
trait_ck2_bloodline_character_1144_desc:0 "Known for uniting the two separate parts of Burgundy to form the new Kingdom of Arles."

blood_of_brian_boru:0 "Blood of Brian Boru"
trait_ck2_bloodline_character_900_desc:0 "A legendary Irish High King. He successfully united the warring chieftains of Ireland and ended the Viking occupation of the island."

blood_of_sabuktigin:0 "Blood of Sabuktigin"
trait_ck2_bloodline_character_144123_desc:0 "The founder of the Ghaznavid dynasty. He started his youth as a slave, but in his later life, he ruled a powerful kingdom with territories extending far into India."

blood_of_seljuk:0 "Blood of Seljuk"
trait_ck2_bloodline_character_3030_desc:0 "Seljuk was a Turkic Oghuz warlord who rose from being an officer in the Khazar Khaganate's army. He soon left his homeland to pursue adventure and establish his own tribe."

blood_of_otto:0 "Blood of Otto 'the Great'"
trait_ck2_bloodline_character_1282_desc:0 "He conquered Italy, reclaimed the homeland of the Holy Roman Empire, and once again raised the banner of the Empire."

blood_of_boleslaw_the_brave:0 "Blood of Boleslaw 'the Brave'"
trait_ck2_bloodline_character_756_desc:0 "A remarkable politician, strategist, and statesman. He united Poland and built it into a strong kingdom comparable to the Western powers."

blood_of_zvonimir:0 "Blood of Demetrius Zvonimir"
trait_ck2_bloodline_character_8628_desc:0 "A peaceful ruler who ascended the throne through skillful diplomacy. His reign saw significant economic and cultural progress in Croatia."

blood_of_iracentira:0 "Blood of Rajendra 'the Great'"
trait_ck2_bloodline_character_189039_desc:0 "One of the greatest rulers in Indian history. He conquered the Andaman and Nicobar Islands, Sri Lanka, the Maldives, and parts of Myanmar, Thailand, and Indonesia."

blood_of_el_cid:0 "Blood of El Cid"
trait_ck2_bloodline_character_107590_desc:0 "A military leader and celebrated hero. The Moors called him 'El Cid', while Christians referred to him as 'Campeador'."

blood_of_arwa:0 "Blood of Arwa"
trait_ck2_bloodline_character_sulayhid_5_desc:0 "As a powerful woman, Queen Arwa was renowned for her exceptional wisdom and comprehensive knowledge. She also participated in the construction of many important architectural projects in the Kingdom of Yemen."

blood_of_william_the_conqueror:0 "Blood of William 'the Conqueror'"
trait_ck2_bloodline_character_140_desc:0 "Although born a bastard, William wiped away the shame of his birth after successfully claiming the throne of England, becoming renowned as 'the Conqueror'."

blood_of_almoravid:0 "Blood of Yusuf"
trait_ck2_bloodline_character_32965_desc:0 "Yusuf was invited by the Emirs of Al-Andalus to Iberia to halt the Christian advance. He succeeded and established a great state whose territory stretched from Ghana to Toledo."

blood_of_alexios_komnenos:0 "Blood of Alexios"
trait_ck2_bloodline_character_1742_desc:0 "A great Emperor who triumphed over the Seljuk Turks and the Normans. His reforms prevented the decline of the Empire, allowing it to recapture its former glory."

blood_of_bohemond:0 "Blood of Bohemond"
trait_ck2_bloodline_character_1140_desc:0 "As a leader of the First Crusade, Bohemond, relying on his legendary military command and cunning political skills, successfully captured Antioch and established his own kingdom in the Levant region based there."

blood_of_alienor_of_aquitaine:0 "Blood of Eleanor of Aquitaine"
trait_ck2_bloodline_character_205730_desc:0 "One of the most powerful women in Western Europe. She was a patron of literature, a military commander, and a leader of the Second Crusade."

blood_of_alfonso_vii:0 "Blood of Alfonso"
trait_ck2_bloodline_character_207500_desc:0 "As the ruler of half of Iberia, Alfonso claimed to be the 'Emperor of all Spain' and sought to bring the entire peninsula under his rule. He was also known for his passion for sponsoring the arts."

blood_of_roger:0 "Blood of Roger"
trait_ck2_bloodline_character_1132_desc:0 "As the last great Norman conqueror, Roger brought the entire region of Sicily under his rule and made Sicily a dominant Mediterranean power by raiding neighboring Islamic states."

blood_of_gartzia:0 "Blood of García 'the Restorer'"
trait_ck2_bloodline_character_206510_desc:0 "The heroic Basque King and a major supporter of the Reconquista, García restored the region of Navarre, long ruled by the Aragonese, back under Basque control."

blood_of_afonso:0 "Blood of Afonso 'the Conqueror'"
trait_ck2_bloodline_character_209503_desc:0 "Afonso I, after driving out the Moors and the Leonese to achieve independence, consolidated the foundation of the Kingdom of Portugal through shrewd multi-front warfare."

blood_of_barbarossa:0 "Blood of Friedrich"
trait_ck2_bloodline_character_212501_desc:0 "As an astute and capable monarch, Friedrich 'Barbarossa' (Redbeard) was known for his relentless conquest of Italy and his reputation as a masterful legislator."

blood_of_almohad:0 "Blood of Abu Yaqub"
trait_ck2_bloodline_character_224000_desc:0 "Under the rule of Abu, the leader of the Almohad dynasty, trade and science flourished, and he successfully halted the Reconquista through his administrative and military capabilities."

blood_of_richard_lionheart:0 "Blood of Richard 'the Lionheart'"
trait_ck2_bloodline_character_204510_desc:0 "A great military leader and warrior, known as 'the Lionheart'. He was an iconic figure of the Third Crusade, achieving great military success in the wars against the Muslims."

blood_of_saladin:0 "Blood of Saladin"
trait_ck2_bloodline_character_226000_desc:0 "The first Sultan of Egypt and Syria, who led Muslim forces in successful military campaigns against the Crusader states in the Levant."

blood_of_philippe_capet:0 "Blood of Philippe 'the Great'"
trait_ck2_bloodline_character_205506_desc:0 "Philippe was a pious and respected leader of the Third Crusade, achieving great merit in the struggles against heretics and infidels."

blood_of_dandolo:0 "Blood of Enrico"
trait_ck2_bloodline_character_213601_desc:0 "As the mastermind behind the Fourth Crusade and the sack of Constantinople, Enrico is considered one of the most successful and wealthy Doges in Venetian history."

blood_of_baldouin:0 "Blood of Baldwin"
trait_ck2_bloodline_character_205523_desc:0 "Baldwin, as a leader of the Fourth Crusade, fought alongside the Venetians, overthrew the last remnants of the Roman Empire, and became the first Latin Emperor of Constantinople."

blood_of_genghis_khan:0 "Blood of Temüjin"
trait_ck2_bloodline_character_125501_desc:0 "The founder of the Mongol Empire, revered by many of his steppe subjects as 'Genghis Khan' (Ruler of the World). An extraordinarily ruthless and capable leader."

blood_of_alexander_nevsky:0 "Blood of Alexander"
trait_ck2_bloodline_character_472844_desc:0 "A legendary military leader who won several military victories against the invading Germans and Swedes. He was later canonized as a saint."

blood_of_james:0 "Blood of James 'the Conqueror'"
trait_ck2_bloodline_character_460600_desc:0 "He is known as James the Conqueror, whose achievements established absolute hegemony along the Mediterranean coast, while he is remembered as a patron of the arts and a renowned legislator."

blood_of_baibars:0 "Blood of Baibars"
trait_ck2_bloodline_character_32933_desc:0 "Baybars I, who rose from the slave market, successfully withstood the Mongol cavalry and completely eradicated the Crusader kingdom's power from the Levant region."

blood_of_muhammad_nasrid:0 "Blood of Muhammad Nasrid"
trait_ck2_bloodline_character_73651_desc:0 "Muhammad I was known for his piety and friendly attitude towards Christians. During his reign, he successfully maintained the light of Al-Andalus against the Castilian invasion."

blood_of_william_wallace:0 "Blood of William 'Guardian of Scotland'"
trait_ck2_bloodline_character_188958_desc:0 "A brave knight who participated in the Scottish Wars of Independence. After defeating the English army, he was appointed 'Guardian of Scotland'."

blood_of_ottoman:0 "Blood of Osman"
trait_ck2_bloodline_character_476501_desc:0 "Osman was the founder of the Ottoman dynasty, proving himself to be an extraordinary commander by winning numerous battles against the Greeks and his Turkic compatriots."

blood_of_mansa_musa:0 "Blood of Mansa Musa 'the Lion'"
trait_ck2_bloodline_character_161035_desc:0 "Musa, a scholar and a conqueror, was legendary throughout the Islamic world for the countless riches and supreme authority he held over his African kingdom. He also funded many construction projects."

blood_of_tughluq:0 "Blood of Tughluq"
trait_ck2_bloodline_character_170256_desc:0 "As the founder of the Tughlaq dynasty, he expanded Muslim power across the entire South Asian subcontinent and successfully defended against Mongol incursions."

blood_of_timur:0 "Blood of Timur"
trait_ck2_bloodline_character_timur_desc:0 "In his native tongue, Timur means 'Iron'. Although he was crippled by two arrows, he remained a military genius and a politician who gradually earned loyalty."

blood_of_matilde:0 "Blood of Matilda"
trait_ck2_bloodline_character_7757_desc:0 "Duchess Matilda fought against Henry IV, the enemy of the Holy See Gregory VII, to defend the integrity and dignity of the Holy See, and her destiny is forever intertwined with the Vatican."

