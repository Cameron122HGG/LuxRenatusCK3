#########################非历史血脉#########################

blood_of_wuffa:0 "Blood of Wuffa"
trait_bloodline_unhistorical_character_205001_desc:0 "Wuffa was a descendant of the legendary Icel, whose line was said to flow with the blood of the Geats and Ynglings. They were known for their bloodline, proven in epic works like the *Beowulf Saga*."

blood_of_beowulf:0 "Blood of Beowulf"
trait_bloodline_unhistorical_character_194005_desc:0 "The Wulfingas, this ancient tribe is immortalized for the bravery displayed in the adventures of Beowulf."