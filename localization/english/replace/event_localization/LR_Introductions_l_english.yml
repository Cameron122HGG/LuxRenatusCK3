l_english:
  german_introduction.0002.t: "The Iron Fist"
  german_introduction.0002.desc: "Once there was a Reich. A great Roman Reich, where any man regardless of his background could rise to glory based on his merit, his skills, and his courage in war. The frontiers of this Reich were the great rivers of the Rhine and Danube, and countless men from all over Germania crossed these waterways for a chance to earn land and rights guarding those frontiers with the mighty legions. The border legions, the limitanei, never buckled, but the Reich behind them did. Rome's greatness came crashing down and with the wealthy cities of Italy facing raids, famine and pestilence, few of the so-called Emperors of the last few centuries could even dream of paying, let alone reinforcing the limitanei.\n\n Faced with ruination, isolation and possible starvation, the legions had no choice but to reach out to their old rivals across the river, the Alamans, to come together to forge a realm safe for them both. While this new kingdom would never be particularly stable or "civilised" by Roman standards, Alamania would grow strong and prosperous, as inheritors of the mighty legions and controllers of the critical mountain passes enabling trade between Italy and Germania, slowly refilling the coffers that enables forts and castles to rise far beyond the old Roman frontier. It is here, in the ever shifting mix of Arian Christianity, Mithraism, Manicheanism and old pagan traditions, that a new faith to conquer all others would emerge. The legions' old protectors, Mithras and Mars, became identified with Tiw, the god of warriors, and new temples and structures would emerge in imitation of the Christian faith. The biggest patrons of this new belief would be the greatest leaders this region has seen since the first Roman Kaiser.\n\n A century ago, Otto the Great came out of the Saxon lands to the north, saving all Germania from Hungarian pillaging. In the former Karling lands of the Palatine counts, he had seen the effectiveness of Frankish knights, and would combine them with the mighty soldiers of Alamania to form his Iron Legions, as people nicknamed them from their heavy armour. While even these armies could not keep Germania united beyond Otto's death, the core of his realm in Alamania would remain the strongest kingdom north of the Alps, his line continuing their forefather's legacy of sponsoring arts, science and infrastructure. A line of erudite and literate rulers, the Ottonians maintain the dream of their forefather to succeed where Charlemagne did not, to forge a New Roman Reich to replace the rotting carcass of the old, the descendants of the proud Germanic legionaires of old marching to war under the banners of Tiw like Rome once did before the days of Christian weakness. The Ottonians will forge a new realm, which will be Holy, Roman, and a Kaiserreich.\n\n The Christian lords of the Palatinate, once leaders of a revolt to free the Germans from Karling tyranny, now stand as the last bastions of a Christian Germania against the Alaman onslaught. The mostly pagan lords and tribes of Ostmark have little sympathy for their cause, and the Franks to the west will hardly forgive their revolt. Should the Palatinate fall, Charlemagne's vision will be truly dead in the east, as all Germania will stand open to the Ottonian advances, isolating the Bavarian frontierlands that still resist them to the east. With a united Reich at their back, could even Italy hold back the true inheritors of Rome from reaching out and claiming their rightful legacy in the name of Tiw? Germania holds her breath as the great questions of the age are answered in blood and iron."
  german_introduction.0002.a: "Unflinching, Tiw plunges his fist into the mouth of the Great Wolf."