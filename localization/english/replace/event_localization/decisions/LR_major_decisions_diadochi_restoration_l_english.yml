l_english:
#Diadochi Restoration Major Events

LR_diadochi_kingdoms_events.1000.t: "Return of the Successors"
LR_diadochi_kingdoms_events.1000.desc.ptolemaic: "From the great port of Alexandria, news of your coronation as Pharaoh spreads like an echo from the past. Egyptian priests and Greek scholars gather at your court, observing with a mixture of hope and skepticism. The last of the great Hellenistic kingdoms has been resurrected, and the weight of two civilizations now rests upon your shoulders. The Nile itself seems to wait to see if you will be just another conqueror, or the true restorer of its ancient glory."
LR_diadochi_kingdoms_events.1000.desc.antigonid: "On the roof of the world, where silk routes weave legends, your crown shines under the Central Asian sun. Sogdian merchants, steppe herders, and veterans of your phalanxes proclaim the rebirth of a kingdom that once united East and West. You have proven that the Hellenic spirit can flourish far from the Mediterranean, but the true challenge begins now: to rule this melting pot of peoples and turn this distant stronghold into the heart of a new empire."
LR_diadochi_kingdoms_events.1000.desc.antipatrid: "The shadows of Philip and Alexander are long, but today, your shadow joins theirs. From the highlands of Pella, you have reunified the kingdom that forged the conquerors of the known world. The ephors of Sparta and the orators of Athens fall silent, remembering the day when the Macedonian spear dictated the destiny of Greece. The silver helmet of the kings rests once more upon your head. Will you be remembered as a mere restorer, or as the beginning of a new age of conquest?"
LR_diadochi_kingdoms_events.1000.a: "The Nile flows for the Ptolemies!"
LR_diadochi_kingdoms_events.1000.b: "The blood of Antigonos reclaims his birthright!"
LR_diadochi_kingdoms_events.1000.c: "The blood of Antipater restores Macedonia!"

LR_diadochi_kingdoms_events.1100.t: "A New Alexander?"
LR_diadochi_kingdoms_events.1100.desc.ptolemaic: "From the temples of Karnak to the libraries of Alexandria, your reign is marked by a renaissance of culture and power. The legacy of the Ptolemies is no longer just a memory; it is a living, breathing empire that commands respect across the Mediterranean. Your fleets dominate the seas, and your scholars push the boundaries of knowledge. You are not just a successor; you are a new Alexander, shaping the world in your image." #Temporarily.
LR_diadochi_kingdoms_events.1100.desc.antigonid: "Your empire stretches from the northern steppes to the valleys of Hindustan, uniting Greeks, Persians, and Central Asian peoples under a single scepter. The caravans crossing the Silk Road pay tribute to your name, and your phalanxes have proven that the spirit of Alexander survives beyond his original conquests. You are the Basileus of a legendary kingdom made real, a bridge between worlds whose power no one can ignore."
LR_diadochi_kingdoms_events.1100.desc.antipatrid: "The eagle of Macedonia flies again over Constantinople. You have achieved what none thought possible: defeating the Byzantine Empire and claiming its throne as the rightful heir of Alexander. The shadows of Philip and your illustrious ancestor approve from Olympus. This is not just an empire; it is the rebirth of a legacy that changed the world, and now you write its next chapter."
LR_diadochi_kingdoms_events.1100.desc.seleukid: "From the Euphrates to the Mediterranean, your dominion spreads over the cradle of civilizations. You have remade the vast mosaic of the Seleukid Empire, uniting Greeks, Persians, Mesopotamians, and Syrians under your scepter. Babylon and Antioch are once again the centers of a Hellenized world, and your court is the beacon of an empire that surpasses even the dreams of Seleukos I. The true heir of Alexander's empire has resurfaced."
LR_diadochi_kingdoms_events.1100.a: "The Mediterranean is ours!"
LR_diadochi_kingdoms_events.1100.b: "Antigonos eyes the East!"
LR_diadochi_kingdoms_events.1100.c: "Antipater's blood runs strong!"
LR_diadochi_kingdoms_events.1100.e: "The Strength of Seleukos endures!"