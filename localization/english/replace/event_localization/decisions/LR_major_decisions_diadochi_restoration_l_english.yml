#Diadochi Restoration Major Events
LR_diadochi_kingdoms_events.0001.t:0 "Seleukid Empire Restored"
LR_diadochi_kingdoms_events.0001.desc:0 "Seleukid Empire has been restored under [scoped_ruler.GetTitledFirstName], who now holds the title of [scoped_ruler.GetTitleTierName].\n\nThe vast territories stretching from the eastern Mediterranean to the borders of India are once again united under a single ruler, reviving the legacy of Seleukos I and the Hellenistic world he helped shape after the death of Alexander the Great."
LR_diadochi_kingdoms_events.0001.a:0 "Glory to the Seleukids!"
LR_diadochi_kingdoms_events.0002.desc.others:0 "Aw fuck..."
LR_diadochi_kingdoms_events.0002.a:0 "Elephant Time"
LR_diadochi_kingdoms_events.0002.b:0 "I see..."