l_english:
 AD_SUFFIX: " A.D."
 BC_SUFFIX: " B.C."
 GAME_DATE_STRING_SHORT_NO_YEAR: "$DAY$ $MONTH_SHORT$"
 GAME_DATE_STRING: "$DAY$ $MONTH$, [Add_int32('(int32)-10000', '(int32)$YEAR$')] [SelectLocalization(GreaterThan_int32('(int32)$YEAR$', '(int32)-10000'), 'AD_SUFFIX', 'BC_SUFFIX' )]"
 GAME_DATE_STRING_SHORT: "$DAY$ $MONTH_SHORT$ [Add_int32('(int32)-10000', '(int32)$YEAR$')] [SelectLocalization(GreaterThan_int32('(int32)$YEAR$', '(int32)-10000'), 'AD_SUFFIX', 'BC_SUFFIX' )]"
 GAME_DATE_STRING_LONG: "$DAY|O$ of $MONTH$, [Add_int32('(int32)-10000', '(int32)$YEAR$')] [SelectLocalization(GreaterThan_int32('(int32)$YEAR$', '(int32)-10000'), 'AD_SUFFIX', 'BC_SUFFIX' )]"


  

