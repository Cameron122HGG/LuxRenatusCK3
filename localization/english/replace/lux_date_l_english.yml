l_english:
 Lux_Renata_Era_AD: "A.D"
 Lux_Renata_Era_BC: "B.C"
 
 CURRENT_DATE:0 "[GetCurrentDate.GetStringLong]"
 GAME_DATE_STRING_SHORT_NO_YEAR: "$DAY$ $MONTH_SHORT$"
 GAME_DATE_STRING: "$DAY$ $MONTH$, [Add_int32('(int32)-10000', '(int32)$YEAR$')] [Select_CString(LessThanOrEqualTo_int32('(int32)$YEAR$', '(int32)10000'),Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR$', '(int32)10001'),'',' B.C'),' A.D')]"
 GAME_DATE_STRING_SHORT: "$DAY$ $MONTH_SHORT$ [Add_int32('(int32)-10000', '(int32)$YEAR$')], [Select_CString(LessThanOrEqualTo_int32('(int32)$YEAR$', '(int32)10000'),Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR$', '(int32)10001'),'',' B.C'),' A.D')]"
 GAME_DATE_STRING_LONG: "$DAY$ of $MONTH$, [Add_int32('(int32)-10000', '(int32)$YEAR$')], [Select_CString(LessThanOrEqualTo_int32('(int32)$YEAR$', '(int32)10000'),Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR$', '(int32)10001'),'',' B.C'),' A.D')]"
 HOUSE_VIEW_FOUNDED: "Founded in [Add_int32('(int32)-10001', DynastyHouse.GetFoundYear)] [Select_CString(LessThanOrEqualTo_int32('(int32)$YEAR$', '(int32)10000'),Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR$', '(int32)10001'),'',' B.C'),' A.D')] by [DynastyHouse.GetFounder.GetName]"
 HOUSE_LIST_FOUNDATION: "Founded in [Add_int32('(int32)-10001', DynastyHouse.GetFoundYear)] [Select_CString(LessThanOrEqualTo_int32('(int32)$YEAR$', '(int32)10000'),Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR$', '(int32)10001'),'',' B.C'),' A.D')]"
 
 Lux_Renata_Era: "[CHARACTER.Custom('Lux_Renata_Era_Loc')]"

 PICK_ANY_CHARACTER: "Play as any Ruler in $GAME_DATE_STRING_SHORT$"
 


  

