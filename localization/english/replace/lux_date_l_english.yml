l_english:
 Lux_Renata_Era_Loc: "[CHARACTER.Custom('Lux_Renata_Era_Loc')]"
 Lux_Renata_Era_AD: "A.D"
 Lux_Renata_Era_BC: "B.C"
 GAME_DATE_STRING_SHORT_NO_YEAR: "$DAY$ $MONTH_SHORT$"
 GAME_DATE_STRING: "$DAY$ $MONTH$, [Add_int32('(int32)-10000', '(int32)$YEAR$')] $Lux_Renata_Era_Loc$"
 GAME_DATE_STRING_SHORT: "$DAY$ $MONTH_SHORT$ [Add_int32('(int32)-10000', '(int32)$YEAR$')] $Lux_Renata_Era_Loc$"
 GAME_DATE_STRING_LONG: "$DAY$ of $MONTH$, [Add_int32('(int32)-10000', '(int32)$YEAR$')] $Lux_Renata_Era_Loc$"
 HOUSE_VIEW_FOUNDED: "Founded in [Add_int32('(int32)-10000', DynastyHouse.GetFoundYear)] $Lux_Renata_Era_Loc$ by [DynastyHouse.GetFounder.GetName]"
 HOUSE_LIST_FOUNDATION: "Founded in [Add_int32('(int32)-10000', DynastyHouse.GetFoundYear)] $Lux_Renata_Era_Loc$"



  

