l_english:
  CAL_YEAR_AD:0 "[Subtract_int32('(int32)$YEAR|0$', '(int32)10000')]"
  CAL_YEAR_BC:0 "[Subtract_int32('(int32)10001', '(int32)$YEAR|0$')]"
  CAL_ERA_AD:0 "AD"
  CAL_ERA_BC:0 "BC"

  GAME_DATE_STRING:100 "$DAY$ $MONTH$, [SelectLocalization(GreaterThan_int32('(int32)$YEAR|0$', '(int32)10000'),'CAL_YEAR_AD','CAL_YEAR_BC')] [SelectLocalization(GreaterThan_int32('(int32)$YEAR|0$', '(int32)10000'),'CAL_ERA_AD','CAL_ERA_BC')]"
  GAME_DATE_STRING_SHORT:100 "$DAY$ $MONTH_SHORT$ [SelectLocalization(GreaterThan_int32('(int32)$YEAR|0$', '(int32)10000'),'CAL_YEAR_AD','CAL_YEAR_BC')] [SelectLocalization(GreaterThan_int32('(int32)$YEAR|0$', '(int32)10000'),'CAL_ERA_AD','CAL_ERA_BC')]"
  GAME_DATE_STRING_LONG:100 "$DAY|O$ of $MONTH$, [SelectLocalization(GreaterThan_int32('(int32)$YEAR|0$', '(int32)10000'),'CAL_YEAR_AD','CAL_YEAR_BC')] [SelectLocalization(GreaterThan_int32('(int32)$YEAR|0$', '(int32)10000'),'CAL_ERA_AD','CAL_ERA_BC')]"
