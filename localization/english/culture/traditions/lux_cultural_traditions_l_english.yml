l_english:
 lux_tradition_diadochi_kingship:0 "Diadochi Kingship"
 lux_tradition_diadochi_kingship_desc:0 "The Diadochi, the successors of Alexander the Great, established Hellenistic kingdoms across the former empire. They adopted and adapted many of the customs and traditions of the Macedonian and Greek cultures, blending them with local practices."
 lux_tradition_diadochi_phalanx:0 "Phalanx Warfare"
 lux_tradition_diadochi_phalanx_desc:0 "The Diadochi armies continued to employ the Macedonian phalanx formation, a dense grouping of infantry armed with long spears (sarissas). This formation was highly effective in battle, providing both offensive and defensive capabilities."
 lux_tradition_diadochi_cultural_fusion:0 "Cultural Fusion"