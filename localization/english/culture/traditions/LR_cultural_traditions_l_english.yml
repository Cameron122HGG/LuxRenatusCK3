l_english:
 lux_tradition_diadochi_kingship_name: "Diadochi Kingship"
 lux_tradition_diadochi_kingship_desc: "The Diadochi, the successors of Alexander the Great, established Hellenistic kingdoms across the former empire. They adopted and adapted many of the customs and traditions of the Macedonian and Greek cultures, blending them with local practices."
 lux_tradition_diadochi_phalanx_name: "Phalanx Warfare"
 lux_tradition_diadochi_phalanx_desc: "The Diadochi armies continued to employ the Macedonian phalanx formation, a dense grouping of infantry armed with long spears (sarissas). This formation was highly effective in battle, providing both offensive and defensive capabilities."
 lux_tradition_diadochi_cultural_fusion: "Cultural Fusion"
 
 lux_tradition_western_roman_name: "Western Roman Legacy"
 lux_tradition_western_roman_desc: "People of this culture uphold the legacy of the Western Roman Empire. They maintain Roman traditions, laws, and military practices, preserving the heritage of one of history's greatest empires."
 
 lux_tradition_tgp_sacral_harmony_name: "Sacral Harmony"
 lux_tradition_tgp_sacral_harmony_desc: "For centuries now, Gauls and Franks have lived in harmony. What some would call 'the fall of Gaul' was in reality  just another step in a journey of many peoples, forming a melting pot together, and reaching greater cultural heights. May this peace last for as long as both Franks and Gauls stand."
 
 lux_tradition_tgp_sacred_chivalry_name: "Sacred Militarism"
 lux_tradition_tgp_sacred_chivalry_desc: "As Gauls are tasked with running the bureaucracy, the Franks focused on their role of martial elite. For it is only with a strong arm that Francia may be secure from foreign threats and barbarian injustice." 
 
 lux_tradition_tgp_sacral_peace_name: "Sacred Bureaucracy"
 lux_tradition_tgp_sacral_peace_desc: "While the Franks serve as a martial caste, the Gauls serve a role just as prestigious - even if less glorious. Gauls are largely responsible for running the administrative machine of the Sacred Realm, ensuring stability within the castle while their counterparts man the walls."
 
 lux_tradition_nile_name: "Children of the Nile"
 lux_tradition_nile_desc: "Inhabitants of Egypt - or 'Kemet', as the ancients called it - had always lived in harmony with the cycles of the Nile, allowing them to flourish as a one of the great civilizations."  
 
 culture_parameter_unlock_maa_western_roman: "Can recruit [GetMaA('legionarii').GetName], [GetMaA('palatina').GetName], and [GetMaA('baaallistarii').GetName] as [men_at_arms|E]"
 culture_parameter_roman_plaza: "Allow the construction of Roman Forum"

 # Deprecated
 funditores: "Funditores"
 funditores_flavor: "Lightly armed slingers are not unique to the Roman Empire. Slingers have been powerful ranged units since ancient times, and the Empire's field troops have brought the slinger's ability to its full potential."

 legionarii: "Palatina Guards"
 legionarii_flavor: "The Auxilia Palatina are drafted from the most hardened and elite auxiliary troops serving in the Western Empire, and serve as the personal extensions of the Emperor's will."

 palatina: "Scholae Palatina"
 palatina_flavor: "Commanded in the field by the Emperor himself, the Scholae, Rome's equestrian palace guard, are always recruited from non-Roman citizens. Though foreign-born, few native sons of Rome match their loyalty."
 
 baaallistarii: "Ravenna Ballistarii"
 baaallistarii_flavor: "Ravenna Crossbowmen are equipped with a pulley crossbow, a powerful achievement of the empire's military technology that allows these privileged specialists to tear through armored formations."

 tradition_ep3_roman_ceremonies_name: "Roman Ceremonies"
 tradition_ep3_roman_ceremonies_desc: "The emperors of the past have bestowed this culture with lingering grandeur, spectacular rites, an awe for the imperial office... and a public life rich with unrest."


 tradition_ep3_palace_politics_name: "Palace Politics"
 tradition_ep3_palace_politics_desc: "Powerful eunuchs and silk-robed sycophants man a vast political apparatus, impressing with fineries, flattering with honors, and plotting viciously in the name of advancement."
 culture_head_court_grandeur_desc: "The [culture_head|E] does not have a [court_grandeur_level|E] of #high 8#! or higher"
 culture_parameter_unlock_akolouthos: "Can appoint the [GetCourtPositionType('akolouthos_court_position').GetName()] [court_position|E], when the Varangian Guard has been founded."

