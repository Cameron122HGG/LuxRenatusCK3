LR_diadochi_seleucid_kingdom_decision: "Restore the Seleucid Kingdom"
LR_diadochi_seleucid_kingdom_confirm: "Let the eagle of Seleucus soar once again!"
LR_diadochi_seleucid_kingdom_desc: "After the death of Alexander the Great, Seleucus I forged a colossal Hellenic empire, from the Syrian coasts to the gates of Persia and India, uniting the East in Macedonian glory. His successors upheld it with fire and steel, but shadows devoured it. Now, with lands reconquered and the favor of the gods, you can revive this titanic heritage: the Seleucid Kingdom will be reborn from its ashes."
LR_diadochi_seleucid_kingdom_tooltip: "Create the Kingdom of Seleucus, restoring Hellenistic rule over the ancient lands of the Seleucid Empire."
LR_diadochi_seleucid_kingdom_effect_tooltip: "From the dust of history rises the Hellenic colossus! The Seleucid Kingdom is reborn."

LR_diadochi_seleucid_kingdom_decision: "Restore the Seleucid Kingdom"
LR_diadochi_seleucid_kingdom_confirm: "Let the eagle of Seleucus soar once again!"
LR_diadochi_seleucid_kingdom_desc: "After the death of Alexander the Great, Seleucus I forged a colossal Hellenic empire, from the Syrian coasts to the gates of Persia and India, uniting the East in Macedonian glory. His successors upheld it with fire and steel, but shadows devoured it. Now, with lands reconquered and the favor of the gods, you can revive this titanic heritage: the Seleucid Kingdom will be reborn from its ashes."
LR_diadochi_seleucid_kingdom_tooltip: "Create the Kingdom of Seleucus, restoring Hellenistic rule over the ancient lands of the Seleucid Empire."
LR_diadochi_seleucid_kingdom_effect_tooltip: "From the dust of history rises the Hellenic colossus! The Seleucid Kingdom is reborn."
LR_diadochi_seleucid_empire_decision: "Forge the Seleucid Empire"
LR_diadochi_seleucid_empire_desc: "The Seleucid Kingdom is but a shadow of its former glory. The true dream of Seleucus was to rule an empire that spanned from the Mediterranean to the Indus, a Hellenistic colossus that united East and West under Macedonian rule. Now, with our armies strengthened and our rivals weakened, we can reclaim this imperial legacy and restore the Seleucid Empire to its rightful place as the master of the ancient world."
LR_diadochi_seleucid_empire_tooltip: "Unify the territories of the ancient Seleucid Empire, from the Mediterranean to the Indus, to forge a Hellenistic dominion."
LR_diadochi_seleucid_empire_confirm: "Let the world tremble before the might of the Seleucid Empire!"
LR_diadochi_seleucid_empire_effect_tooltip: "Form the Seleucid Empire and claim hegemony over the Hellenistic world. Your dynasty will be feared and respected as a true imperial power."

LR_diadochi_ptolemaic_kingdom_decision: "Ptolemaic Egyptian Kingdom"
LR_diadochi_ptolemaic_kingdom_desc: "After the collapse of Alexander's empire, one of his most cunning generals forged a kingdom on the banks of the Nile. A Hellenistic dynasty that knew how to don the vestments of the pharaohs, blending Greek wisdom with the mysteries of Egypt. The time has come for the eagle of the Ptolemies to rise again over Alexandria, reviving its legacy of power and splendor."
LR_diadochi_ptolemaic_kingdom_tooltip: "Restore the Hellenistic legacy of the Ptolemies and claim the throne of ancient Egypt as a beacon of culture and power."
LR_diadochi_ptolemaic_kingdom_confirm: "Let the Nile carry the news: a new Pharaoh rises."
LR_diadochi_ptolemaic_kingdom_effect_tooltip: "Claim the Ptolemaic Kingdom of Egypt and forge a Hellenistic legacy. Your lineage will be remembered as the restorer of a golden age."

LR_diadochi_ptolemaic_empire_decision: "Might of Alexandria"
LR_diadochi_ptolemaic_empire_desc: "The true dream of the Ptolemies was never limited to Egypt's borders. From their throne in Alexandria, the first Hellenic pharaohs extended their dominion over the coasts of the eastern Mediterranean, controlling sea routes and holy lands. It is time to reclaim this imperial legacy and make the Ptolemaic eagle the undisputed mistress of the Mare Nostrum."
LR_diadochi_ptolemaic_empire_tooltip: "Unify the territories of the ancient Hellenistic empire, from the Nile to Cyprus and Jerusalem, to forge a Mediterranean dominion."
LR_diadochi_ptolemaic_empire_confirm: "Let the world know that the heir of Alexander rules the waves."
LR_diadochi_ptolemaic_empire_effect_tooltip: "Form the Ptolemaic Empire and claim hegemony over the eastern Mediterranean. Your dynasty will be feared and respected as a true imperial power."

LR_diadochi_antigonid_kingdom_decision: "Establish the Antigonid Kingdom"
LR_diadochi_antigonid_kingdom_desc: "In the farthest reaches of the Hellenistic world, where mountains meet desert, a people of bold Greek settlers and soldiers forged an independent kingdom. Far from Seleucid power, these heirs of Alexander fused Greek wisdom with the riches of the East, creating a unique civilization on the Silk Road. It is time to claim this forgotten heritage and make Hellenism shine again in the lands of Bactria."
LR_diadochi_antigonid_kingdom_tooltip: "Found the legendary Hellenistic kingdom in the heart of Asia, where East and West meet."
LR_diadochi_antigonid_kingdom_confirm: "In the land of the blind the one eyed man is king."
LR_diadochi_antigonid_kingdom_effect_tooltip: "Form the Antigonid Kingdom and end the petty kingdoms of Asia Minor."

LR_diadochi_antigonid_empire_decision: "Forge the Antigonid Empire"
LR_diadochi_antigonid_empire_desc: "Bactria is no longer just a kingdom; it is the heart of a new empire. From the silk routes of Sogdiana to the mountains of Arachosia, we have unified the soul of Central Asia. Here, the wisdom of Greek philosophers merges with the traditions of Persian warlords and the resilience of the steppe tribes. This is the ultimate legacy of Alexander: a Hellenic power that does not look to the Mediterranean, but rules from the roof of the world."
LR_diadochi_antigonid_empire_tooltip: "Consolidate dominion over the heart of Central Asia, creating a Hellenistic empire ruling from the steppes to the Persian mountains."
LR_diadochi_antigonid_empire_confirm: "Let Central Asia tremble before its new master!"
LR_diadochi_antigonid_empire_effect_tooltip: "Form the Antigonid Empire, unifying Bactria, Sogdiana, and the Persian trade routes. Your court will become the Hellenistic beacon of Asia."

LR_diadochi_antipatrid_kingdom_decision: "Restore the Kingdom of Antipater"
LR_diadochi_antipatrid_kingdom_desc: "Before the world knew the brilliance of Alexander's Empire, this mountainous land forged kings and conquerors. From Philip, who unified a people of warriors, to his son who led our phalanxes to the ends of the Earth, Antipater was the hammer that shaped the Hellenistic age. It is time for the silver helmet of the Macedonian kings to shine again, reclaiming its place as the master of Greece."
LR_diadochi_antipatrid_kingdom_tooltip: "Revive the legacy of the Macedonian kings and unify the Greek peoples under your scepter."
LR_diadochi_antipatrid_kingdom_confirm: "Let the Greek cities bow to our power!"
LR_diadochi_antipatrid_kingdom_effect_tooltip: "Form the Kingdom of Antipater and claim hegemony over the Greek lands. Your army will adopt the strength of the legendary phalanx."

LR_diadochi_antipatrid_empire_decision: "Strengthen the Antipatrid Empire"
LR_diadochi_antipatrid_empire_desc: "Constantinople is but a pale reflection of a greater dream. The true empire was not built on the Bosporus, but on the battlefields where Alexander's phalanxes swept away the Persians. This throne of Byzantine emperors belongs to us by right of blood and conquest. It is time to seize it from these bureaucrats and proclaim the rebirth of the only empire worthy of inheriting the Hellenistic world."
LR_diadochi_antipatrid_empire_tooltip: "Dethrone the Byzantine Basileus and claim his throne as the rightful heir of Alexander the Great."
LR_diadochi_antipatrid_empire_confirm: "Let the Macedonian eagle replace the Byzantine one!"
LR_diadochi_antipatrid_empire_effect_tooltip: "Destroy the Byzantine Empire and create the Macedonian Empire in its place, claiming Alexander's legacy as your right."

LR_diadochi_makedon_empire_decision: "Claim the Empire of Alexander"
LR_diadochi_makedon_empire_desc: "Constantinople is but a pale reflection of a greater dream. The true empire was not built on the Bosporus, but on the battlefields where Alexander's phalanxes swept away the Persians. This throne of Byzantine emperors belongs to us by right of blood and conquest. It is time to seize it from these bureaucrats and proclaim the rebirth of the only empire worthy of inheriting the Hellenistic world."
LR_diadochi_makedon_empire_tooltip: "Dethrone the Byzantine Basileus and claim his throne as the rightful heir of Alexander the Great."
LR_diadochi_makedon_empire_confirm: "Let the Macedonian eagle replace the Byzantine one!"
LR_diadochi_makedon_empire_effect_tooltip: "Destroy the Byzantine Empire and create the Macedonian Empire in its place, claiming Alexander's legacy as your right."

LR_restore_roman_empire_decision_effect_tooltip: "The Roman Empire will be restored and becomes [de_jure|E] liege of every [kingdom|E] and [duchy|E] title in the [GetGeographicalRegion('custom_roman_empire').GetName]."

LR_unify_italian_empire_decision:0 "Restore the Western Roman Empire"
LR_unify_italian_empire_decision_desc:0 "The shattering of [GetTitleByKey('e_spqr').GetName] was an unprecedented tragedy for our people, but we struggled on. After all, as long as a single roman still stands, Rome still stands.\n\nOne day, the barbarian hordes will be pushed out from our ancient homelands, and the Empire will rise again."
LR_unify_italian_empire_decision_tooltip:0 "Restore the Empire of the West"
LR_unify_italian_empire_decision_confirm: "Rome rises!"
LR_unify_italian_empire_decision_effect_tooltip: "[GetTitleByKey('e_spqr').GetName|U] will be restored, and become [de_jure|E] liege of every [kingdom|E] and [duchy|E] title in the [GetGeographicalRegion('custom_western_homelands').GetName]."

LR_retake_western_provinces_decision: "Re-Establish the Theodosian Borders"
LR_retake_western_provinces_decision_desc: "When Emperor [GetScriptedCharacterByHistoryID( '70534' ).GetFirstName] split the Roman Empire into two administrative halves, the Western part went to his youngest son, [GetScriptedCharacterByHistoryID( '145227' ).GetFirstName]. We are his direct successors. However, the borders of our [Glossary( 'Pars', 'PARS_OCCIDENTIS_GLOSS' )] have greatly contracted since those days; it will be cause of great glory for a Imperator to re-establish the frontiers that [GetScriptedCharacterByHistoryID( '70534' ).GetFirstNameNoTooltip] originally left us."
LR_retake_western_provinces_decision_tooltip: "Re-establish the original frontiers of Western Rome"
LR_retake_western_provinces_decision_confirm: "Officialize the new borders"
LR_western_kingdoms_held_or_vassals_tt: "You must hold the following [kingdom|E] titles, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_italia_annonaria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_italia_suburbicaria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_illyricum').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_galliarum').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_viennensis').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_africa').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_mauretania').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_hispania').GetName]"
  
