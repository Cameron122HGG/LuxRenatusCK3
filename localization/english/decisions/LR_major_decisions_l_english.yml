restore_diocese_britannia_decision: "Restore the Diocese of Britannia"
restore_diocese_britannia_decision_desc: "The long lost province of Britannia is still abandoned since the the imperial forces withdrew from the island following the chaos of the 5th century.\n\nMaybe against better advice, it is time to our Legions once again land on the shores of Britannia and restore the rule of civilization over the Empire's northern frontier."  
restore_diocese_britannia_decision_tooltip: "Re-establish the old Diocese of Britannia"
restore_diocese_britannia_decision_confirm: "Rome rises!"
