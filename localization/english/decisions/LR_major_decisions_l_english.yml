restore_eastern_diocese_decision: "Re-Establish the Eastern Exarchates"
restore_eastern_diocese_decision_desc: "The [Glossary( 'Exarchates', 'ROMAN_diocese_GLOSS' )] used to be our form of civilian and military governance. Once we recover our Empire from the ashes, we should also reestablish the old imperial administrative divisions."
restore_eastern_diocese_decision_tooltip: "Restore the former administrative divisions of the Eastern Empire"
restore_eastern_diocese_decision_confirm: "Rome rises!"
restore_eastern_diocese_system_effect_tooltip:0 "The Exarchates of [GetTitleByKey('k_diocese_thracia').GetName], [GetTitleByKey('k_diocese_dacia').GetName], [GetTitleByKey('k_diocese_macedonia').GetName], [GetTitleByKey('k_diocese_asia').GetName] and [GetTitleByKey('k_diocese_pontus').GetName] will be reestablished, and brought back under [de_jure|E] Imperial rule."
eastern_diocese_kingdoms_held_or_vassals_tt: "If the following [kingdom|E] titles are created, you must hold them, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_byzantium').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_krete').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_hellas').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_epirus').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_bulgaria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_pergamon').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_anatolia').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_pontus').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_cyprus').GetName]"
restore_eastern_diocese_system_unlock_tooltip:0 "Unlocks further decisions to restore former Imperial Exarchates."
 

restore_diocese_system_decision: "Re-Establish the Diocese System"
restore_diocese_system_decision_desc: "The [Glossary( 'Dioecesis', 'ROMAN_diocese_GLOSS' )] used to be our form of civilian and military governance. Now that we have recovered our Empire from the ashes, we should also reestablish the old imperial administrative divisions."
restore_diocese_system_decision_tooltip: "Restore the former imperial administrative divisions of the Western Empire"
restore_diocese_system_decision_confirm: "Rome rises!"
restore_diocese_system_effect_tooltip:0 "The Dioceses of [GetTitleByKey('k_diocese_italia_annonaria').GetName], [GetTitleByKey('k_diocese_italia_suburbicaria').GetName] and [GetTitleByKey('k_diocese_illyricum').GetName] will be reestablished, and brought back under [de_jure|E] Imperial rule."
