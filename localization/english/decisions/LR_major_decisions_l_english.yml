restore_wre_roman_empire_decision: "Restore the Roman Empire"
restore_wre_roman_empire_decision_desc: "If Rome and other key territories of the old empire could be reclaimed, the Western Empire would win recognition in the eyes of the world as the true and rightful continuation of the Roman State."
restore_wre_roman_empire_decision_tooltip: "The Roman Empire will be restored"
restore_wre_roman_empire_decision_confirm: "I will restore the Empire"
wre_borders_restored_tt: "The Theodosian Borders have been restored in the West"
restore_wre_roman_empire_decision_effect_tooltip: "The Roman Empire will be restored and becomes [de_jure|E] liege of every [kingdom|E] and [duchy|E] title in the [GetGeographicalRegion('custom_theodosian_wre').GetName]."

