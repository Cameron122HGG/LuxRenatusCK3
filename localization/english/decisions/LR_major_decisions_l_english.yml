LR_reunify_roman_empire_decision: "Re-unite the Roman Empire"
LR_reunify_roman_empire_decision_desc: "desc"
LR_reunify_roman_empire_decision_tooltip: "Merge the two halves of the Roman Empire"
LR_reunify_roman_empire_decision_confirm: "Let the Empire be whole again!"

