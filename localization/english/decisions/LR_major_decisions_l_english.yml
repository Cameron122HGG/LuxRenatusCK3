restore_diocese_gallia_viennensis_decision: "Restore the Dioceses of Gallia"
restore_diocese_gallia_viennensis_decision_desc: "Following the collapse of our [Glossary( 'limes', 'LIMES_GLOSS' )], the germanic barbarians flooded Gaul, a region that remained safe within the Empire for almost four hundred years.\n\nOnce we push the invasors back to the other side of the rhine, we must reassure Imperial control over the region and restore the old Dioceses."
restore_diocese_gallia_viennensis_decision_tooltip: "Re-establish the old Dioceses of Gallia and Viennensis"
restore_diocese_gallia_viennensis_decision_confirm: "Rome rises!"
restore_diocese_gallia_effect_tooltip: "[GetTitleByKey('k_diocese_galliarum').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_diocese_gallia').GetName]."
restore_diocese_viennensis_effect_tooltip: "[GetTitleByKey('k_diocese_viennensis').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_diocese_viennensis').GetName]."
viennensis_kingdoms_held_or_vassals_tt: "If the following [kingdom|E] titles are created, you must hold them, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_aquitaine').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_burgundy').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_france').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_lotharingia').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_brittany').GetName]"
wre_borders_restored_tt: "The Theodosian Borders have been restored in the West"

restore_diocese_aegyptus_decision: "Restore the Exarchate of Aegyptus"
restore_diocese_aegyptus_decision_desc: "After the betrayal of treacherous governors and the onslaught of the arab armies, Aegyptus, the breadbasket of the Eastern Empire, fell under muslim rule.\n\nOnce we drive the barbarian invaders back to the sands of Arabia, we must reaffirm imperial rule over the former province and restore the old [Glossary( 'Exarchate', 'ROMAN_diocese_GLOSS' )] of Aegyptus."
restore_diocese_aegyptus_decision_tooltip: "Restore the old Imperial Diocese of Aegyptus"
restore_diocese_aegyptus_decision_confirm: "Rome rises!"
restore_diocese_aegyptus_effect_tooltip: "[GetTitleByKey('k_diocese_aegyptus').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_diocese_aegyptus').GetName]."
aegyptus_kingdoms_held_or_vassals_tt: "If the following [kingdom|E] titles are created, you must hold them, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_egypt').GetName]"
  
ere_borders_restored_tt: "The Theodosian Borders have been restored in the East"

restore_diocese_syria_decision: "Restore the Exarchate of Syria Palestina"
restore_diocese_syria_decision_desc: "After centuries of devastation brought by the Persian incursions and the advance of the muslim invaders, the once heartlands of Roman power in the Levant, the cities of Antioch, Damascus, and Jerusalem must be once again under Imperial Rule.\n\n From there, we will ensure that Orientis remains forever roman."
restore_diocese_syria_decision_tooltip: "Restore the old Imperial Diocese of Syria Palestina"
restore_diocese_syria_decision_confirm: "Rome rises!"
restore_diocese_syria_effect_tooltip: "[GetTitleByKey('k_diocese_syria').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_diocese_syria').GetName]."
syria_kingdoms_held_or_vassals_tt: "If the following [kingdom|E] titles are created, you must hold them, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_syria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_israel').GetName]"
 
restore_diocese_africa_mauretania_decision: "Restore the Dioceses of North Africa"
restore_diocese_africa_mauretania_decision_desc: "Once the breadbasket of Rome, the fertile provinces of North Africa and must be reclaimed after centuries under the yoke of the Vandal kings and the dominion of the Berber warlords.\n\nRestoring the old [Glossary( 'Dioecesis', 'ROMAN_diocese_GLOSS' )] is the first step reassure the Grain Dole to Rome from the southern shores of the Mediterranean." 
restore_diocese_africa_mauretania_decision_tooltip: "Re-establish the old Dioceses of Africa and Mauretania"
restore_diocese_africa_mauretania_decision_confirm: "Rome rises!"
africa_kingdoms_held_or_vassals_tt: "If the following [kingdom|E] titles are created, you must hold them, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_africa').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_tahert').GetName]"
restore_diocese_africa_effect_tooltip: "[GetTitleByKey('k_diocese_africa').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_diocese_africa').GetName]."
restore_diocese_mauretania_effect_tooltip: "[GetTitleByKey('k_diocese_mauretania').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_diocese_mauretania').GetName]."
 
restore_diocese_hispania_decision: "Restore the Diocese of Hispania"
restore_diocese_hispania_decision_desc: "After centuries under the grasp of the Visigothic and Muslim usurpers, the Eagle of the Empire shall once again fly over Tarraco, Corduba, and Toletum.\n\nWith the old [Glossary( 'Dioecesis', 'ROMAN_diocese_GLOSS' )] reclaimed, the western shores of the Mediterranean will once again be secure under the righteous Roman rule." 
restore_diocese_hispania_decision_tooltip: "Re-establish the old Diocese of Hispania"
restore_diocese_hispania_decision_confirm: "Rome rises!"
hispania_kingdoms_held_or_vassals_tt: "If the following [kingdom|E] titles are created, you must hold them, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_castille').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_leon').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_navarra').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_aragon').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_spanish_galicia').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_asturias').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_valencia').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_andalusia').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_badajoz').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_portugal').GetName]"
