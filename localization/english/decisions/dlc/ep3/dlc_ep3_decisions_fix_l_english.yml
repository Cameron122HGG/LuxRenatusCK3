 ep3_decisions_event.4030.t: "An Empire Reborn"
 ep3_decisions_event.4030.desc: "By the dying of the faithful, by the fire of rhetoric, by the very will of [ROOT.Char.GetFaith.HighGodName] — #EMP [GetTitleByKey('e_byzantium').GetName|U] lives once more!#!\n\nI gaze over the Queen of Cities, a warm breeze from the Marmara playing with my regnal robes. Beauteous songs echo out from the great house of the Holy Wisdom. Citizens dance in the streets, giving voice to gratitude and joy.\n\nOur days of shame, with all the world scorning the fallen [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )], must surely be at an end. A legitimate [ROOT.Char.GetTitleAsNameNoTooltip] sits once again on the throne of [GetScriptedCharacterByHistoryID( '12501' ).GetFirstName].\n\n#EMP Me.#!"
 ep3_decisions_event.4030.a: "The glory of Rome shall continue to grow!"

