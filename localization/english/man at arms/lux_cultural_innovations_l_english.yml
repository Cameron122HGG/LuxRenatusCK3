  #MaA
 # Lux Cultural MaA
 hoplite: "Hoplite"
 hoplite_flavor: "#F Veteran rural conscripts, defenders of the rocky passes, who use careful timing and local knowledge to harass even the mightiest of hosts.#!"

 peltast: "Peltast"
 peltast_flavor: "#F The tall #EMP skouton#! shields these infantry array against the foe is their namesake. Yet their chief virtue in battle is discipline, which affords them good order in both advance and retreat.#!"

 companion_guards: "Companion Guards"
 companion_guards_flavor: "#F These famed axe-wielding Germanic mercenaries are the unwavering core of the imperial host.\n\n@warning_icon! #X They will claim some [gold|E] after the Basileus's death.#!"

 legionary_cohort: "Legionary Cohort"
 legionary_cohort_flavor: "A foremost force of professional soldiers, the Cohort is the heart and soul of the roman imperial legions."
 
 legionary_cavalry: "Legionary Cavalry"
 legionary_cavalry_flavor: "Cavalry support is vital to all infantry work, even in the Legions."
 
 roman_ballista: "Ballista"
 roman_ballista_flavor: "Spear-sized bolts soar from these torsion-based machines into besieged settlements and enemy formations alike, causing fear and disorder."
 
 praetorian_cohort: "Praetorian Cohort"
 praetorian_cohort_flavor: "Hand-picked heavy infantry, the Praetorian Cohorts were the Imperial bodyguards, serving in military campaigns only when the Emperor himself was present."

  #Court Positions
 pretorian_prefect_court_position: "Praetorian prefect"
 pretorian_prefect_employer_custom_effect_description: "$BULLET$Increases [GetTrait('varangian').GetName( GetNullCharacter )] [GetCourtPositionType('bodyguard_court_position').GetName()] [aptitude|E] (based on [aptitude|E])\n$BULLET$More eligible [courtiers|E] gain the [GetTrait('varangian').GetName( GetNullCharacter )] and [GetTrait('loyal').GetName( GetNullCharacter )] [traits|E]\n$BULLET$More Varangians will appear\n@warning_icon! #X The Varangians will claim some [gold_i] Gold after the Basileus's death.#!"
 pretorian_prefect_court_position_desc: "The $pretorian_prefect_court_position$ is the supreme commander of the Pretorian Guard."

  #Roman Traditions
 tradition_roman_legions_name: "Professional Soldiery"
 tradition_roman_legions_desc: "The romans emphasized that a farmer in battle worries about his crops; a soldier thinks of victory. This principle, alongside tatical flexiblity and several reforms troughout the centuries, forged one of the foremost military forces the world has ever seen: the Roman Legions."
 tradition_imperial_politics_name: "Imperial Politics"
 tradition_imperial_politics_desc: "In the Roman Empire, while power hungry generals often threatend to march their men towards the capital, within the palace walls treacherous courtiers schemed for influence. In this delicate balance of power, only strong and capable Emperors managed to preserve stability, while inept rulers brought the Empire to the brink of destruction."
 tradition_molded_architecture_name: "Moulded Architecture"
 tradition_molded_architecture_desc: "The romans believed that architecture should always be far more than one stone placed atop another. By perfecting concrete, a plentiful and cheap building material, they were able to build structures quickly, efficient and without the need for vast teams of skilled craftsmen."
 tradition_roman_ethics_name: "Mos Maiorum"
 tradition_roman_ethics_desc: "Mos Maiorum was the ancient unwritten code of values, principles and behavioural models that guided the roman way of living. It was one of the reasons why the romans considered themselves as Paragons of Civilization, guided by a mandate to subjulgate the barbarian and uncivilized cultures neighboring them."

 only_one_roman_military_tradition_allowed: "Only one roman militaristic [tradition|E] is allowed"
 only_one_roman_politics_tradition_allowed: "Only one roman politics [tradition|E] is allowed"
