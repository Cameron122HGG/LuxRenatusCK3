l_english:
 #################
 ##MEDIEVAL ARTS##
 #################

 ###########
 #GAME RULE#
 game_rule_category_MedievalArts: "Medieval Arts"
 rule_MA_monuments: "$game_rule_category_MedievalArts$: Monuments"
 setting_MA_monuments_all: "$game_rule_category_MedievalArts$ Favored"
 setting_MA_monuments_all_desc: "#help Suggested:#! When conflicting, [special_buildings|E] from #V $game_rule_category_MedievalArts$#! are preferred over the base game."
 setting_MA_monuments_selection: "Base Game Favored"
 setting_MA_monuments_selection_desc: "When conflicting, [special_buildings|E] from the #V base game#! are preferred over $game_rule_category_MedievalArts$."

 rule_MA_ahistorical_monuments: "$game_rule_category_MedievalArts$: Implausibility"
 setting_MA_ahistorical_monuments_yes: "Implausible Monuments in"
 setting_MA_ahistorical_monuments_yes_desc: "#help Suggested:#! [special_buildings|E] that might be considered #italic implausible#! are allowed."
 setting_MA_ahistorical_monuments_no: "Implausible Monuments out"
 setting_MA_ahistorical_monuments_no_desc: "[special_buildings|E] that might be considered #italic implausible#! are #bold not#! allowed."

 rule_MA_creator_pack: "$game_rule_category_MedievalArts$: Creator Packs"
 setting_MA_creator_pack_yes: "Creator Packs Favored"
 setting_MA_creator_pack_yes_desc: "#help Suggested:#! [special_buildings|E] from #V Creator Packs#! such as #V Holy Buildings#! are preferred over those from $game_rule_category_MedievalArts$."
 setting_MA_creator_pack_no: "$setting_MA_monuments_all$"
 setting_MA_creator_pack_no_desc: "When conflicting, [special_buildings|E] from #V $game_rule_category_MedievalArts$#! are preferred over those from #V Creator Packs#!."

 ##########
 #GLOSSARY#
 #NOTE: as of now only for "non-english terms" and cheeky fourth wall breaks, in the future decide if you want to expand it to "technical" terms too
 stecak: "From the Old Slavic #italic stajati#! - to stand - a #bold stećak#! is a tall, monumental tombstone richly carved with figures and stories, typical of Medieval Bosnia. \nHundreds still today dot the landscape."
 tumulus: "An earthen mound of ground and stone forming a colossal dome over a tomb. Used by many cultures - especially of Ancient societies - #bold tumuli#! are sombre and monumental testimonies to the passing of Time."
 MA_rostrum: "The beak of a galley, used by the Romans as a bronze or iron spike to ram enemy ships. \nAs the centuries have passed it has become a symbol of triumph and glory in battle, and of Roman heritage."

 ###################
 #SPECIAL BUILDINGS#

 #Rock of Cashel
 building_type_MA_rock_cashel: "$building_MA_rock_cashel$"
 building_type_MA_rock_cashel_desc: "$building_MA_rock_cashel_desc$"
 building_MA_rock_cashel: "Rock of Cashel"
 building_MA_rock_cashel_desc: "Constructed over a rocky hill and surrounded by green pastures, the Rock is an impregnable stone fortress surrounded by many walls and capable of serving both as a castle and a palace. It also contains one of the most influential monasteries in Ireland, and has a Palatine Chapel whose vault is decorated by beautiful frescoes depicting the life of St Patrick."

 #St Donatus of Zadar
 building_type_MA_st_donatus: "$building_MA_st_donatus$"
 building_type_MA_st_donatus_desc: "$building_MA_st_donatus_desc$"
 building_MA_st_donatus: "Saint Donatus of Zadar"
 building_MA_st_donatus_desc: "A magnificent round church constructed of white stone, glimmering with the sunlight over the Adriatic waves. It was inspired by the Palatine Chapel of Charlemagne's palace and is decorated by a beautiful golden mosaic."

 #Aula Palatina
 building_type_MA_aula_palatina: "$building_MA_aula_palatina$"
 building_type_MA_aula_palatina_desc: "$building_MA_aula_palatina_desc$"
 building_MA_aula_palatina: "Aula Palatina"
 building_MA_aula_palatina_desc: "A colossal brick hall constructed by Constantine the Great for his own #italic palatium#!. \nIt is massive in size, with few equals in the continent, and shows a level of engineering prowess that can always be a source of inspiration."

 #Jokhang Temple
 building_type_MA_jokhang: "$building_MA_jokhang$"
 building_type_MA_jokhang_desc: "$building_MA_jokhang_desc$"
 building_MA_jokhang: "Jokhang Temple"
 building_MA_jokhang_desc: "The most ancient and mystical temple in the whole of Tibet, a majestic assemble of courtyards and shrines in the very heart of the Land of the Gods."

 #Dongola Throne Hall
 building_type_MA_dongola_hall: "$building_MA_dongola_hall$"
 building_type_MA_dongola_hall_desc: "$building_MA_dongola_hall_desc$"
 building_MA_dongola_hall: "Dongola Throne Hall"
 building_MA_dongola_hall_desc: "A great palace constructed atop a rocky hill with a complete view of the surrounding plain and the Nile. \nIts use is ceremonial, to impress the envoys and travelers that, through a monumental staircase decorated by splendid frescoes painted by Nubian and Greek artists, are lead to the majestic throne hall of the upper floor."

 #Cathedral of Hildesheim
 building_type_MA_hildesheim_cathedral: "$building_MA_hildesheim_cathedral$"
 building_type_MA_hildesheim_cathedral_desc: "$building_MA_hildesheim_cathedral_desc$"
 building_MA_hildesheim_cathedral: "Saint Michael of Hildesheim"
 building_MA_hildesheim_cathedral_desc: "This basilica was constructed to show the might and prestige of its Roman king, with a painted wooden ceiling and round arches giving it a grandiose, imperial appearance. Labourers and masters from the Rhine and Italy participated in its construction, and it holds a set of doors and a massive column both worked in bronze and carefully decorated with reliefs."

 #Toulouse Cathedral
 building_type_MA_toulouse_basilica: "$building_MA_toulouse_basilica$"
 building_type_MA_toulouse_basilica_desc: "$building_MA_toulouse_basilica_desc$"
 building_MA_toulouse_basilica: "Toulouse Basilica"
 building_MA_toulouse_basilica_desc: "A grandiose basilica, one of the largest cathedrals north of the Alps. It is made of bricks, a material abundant in the local area, and is a truly Romanesque building, inspired by the ancient Roman ruins of Southern France and decorated with lombard bands, round arches and spolia columns."

 #The Durham Cathedral
 building_type_MA_durham_cathedral: "$building_MA_durham_cathedral$"
 building_type_MA_durham_cathedral_desc: "$building_MA_durham_cathedral_desc$"
 building_MA_durham_cathedral: "Durham Cathedral"
 building_MA_durham_cathedral_desc: "The grand cathedral of Durham towers high over the river Wear's marshy peninsula, where legends say two milk maids discovered the immovable tomb of saint Cuthbert. Its ribbed vault, planned by artisans from both sides of the Channel, is a masterful feat of engineering, without precedence in England, and was built above the woodlands and riverbanks of the town using stone cut from the cliffs below."
 
 #The Castel del Monte
 building_type_MA_castel_monte: "$building_MA_castel_monte$"
 building_type_MA_castel_monte_desc: "$building_MA_castel_monte_desc$"
 building_MA_castel_monte: "Castel del Monte"
 building_MA_castel_monte_desc: "An elegant hunting lodge atop a gentle Apulian hill. \nIt has a unique design with an octagonal plan and octagonal towers at each corner, a mixture of Classical and Gothic architecture. \nIts sombre, geometrical exterior is in stark contrast to the lavishly furnished interior of tapestries, rugs, paintings and capitals."

 #The Belfry of Bruges
 building_type_MA_belfort: "$building_MA_belfort$"
 building_type_MA_belfort_desc: "$building_MA_belfort_desc$"
 building_MA_belfort: "Belfry of Bruges"
 building_MA_belfort_desc: "The stunning Gothic belfry soaring over the marketplace of Bruges, dictating life for the entire city. It is an enormous tower covered in spires and statues and has been constructed out of brick and stone with a rectangular plan rising into an octagonal upper stage, where the bells are held."

 #The Strasbourg Cathedral
 building_type_MA_strasbourg_cathedral: "$building_MA_strasbourg_cathedral$"
 building_type_MA_strasbourg_cathedral_desc: "A gigantic and delicate marvel, this gargantuan cathedral triumphs over all its peers, reaching into the sky even more daringly than Babel. Built out of pinkish sandstone, the temple shines with the dawning sun in magnificent detail, looming over the narrow square and its timber houses."
 building_MA_strasbourg_cathedral: "Strasbourg Cathedral"
 building_MA_strasbourg_cathedral_desc: "Inspired in equal parts by the great churches of West and East Francia, the townsfolk of the city have - thanks to their great wealth and the patronage of their lord - constructed a grandiose basilica. Its pinkish walls shine in the late day sun, and the heavy stone westwork rises tall above the timber homes, its bronze bells chanting their melody to the winds."
 building_MA_strasbourg_cathedral_02: "$building_MA_strasbourg_cathedral$"
 building_MA_strasbourg_cathedral_02_desc: "A gigantic and delicate marvel, this gargantuan cathedral triumphs over all its peers, reaching into the sky even more daringly than Babel. Built out of pinkish sandstone, the temple shines with the dawning sun in magnificent detail, while its many gargoyles, statues and steeples loom over the narrow square and its timber houses. Though with a Romanesque core, the cathedral is a perfect cobination of the elegant French Gothic, and its soaring German counterpart, particularly embodied in its immense octagonal spire."

 #Koutoubia Mosque
 building_type_MA_koutoubia: "$building_MA_koutoubia$"
 building_type_MA_koutoubia_desc: "$building_MA_koutoubia_desc$"
 building_MA_koutoubia: "Koutoubia Mosque"
 building_MA_koutoubia_desc: "An exemplary masterpiece of Moorish architecture, the minaret of this mosque is a source of inspiration for builders all over the Islamic world."

 #Parigoritissa
 building_type_MA_parigoritissa: "$building_MA_parigoritissa$"
 building_type_MA_parigoritissa_desc: "$building_MA_parigoritissa_desc$"
 building_MA_parigoritissa: "Panagia of Parigoritissa"
 building_MA_parigoritissa_desc: "The plan of this church, dedicated to the Most Holy Mary, is inspired by Classical ideas of symmetry and geometric completeness. An almost perfect square, centred around an octagonal dome supported by piers and surrounded by a minor chapel on each of the four angles."

 #Rotunda
 building_type_MA_rotunda: "$building_MA_rotunda$"
 building_type_MA_rotunda_desc: "$building_MA_rotunda_desc$"
 building_MA_rotunda: "Rotunda of Thessaloniki"
 building_MA_rotunda_desc: "A colossal domed building inspired by the Pantheon in Rome. \nIts interiors are decorated with mosaics of unique artistry and beauty, their golden #italic tesserae#! shimmering in the sunlight coming from the oculus. \nThe structure is connected by a colonnade to a massive marble Arch built by the Late Caesar Galerius."

 #The Nikaea Walls
 building_type_MA_nikaea_walls: "$building_MA_nikaea_walls$"
 building_type_MA_nikaea_walls_desc: "$building_MA_nikaea_walls_desc$"
 building_MA_nikaea_walls: "Nikaea Walls"
 building_MA_nikaea_walls_desc: "Constructed by the Caesars centuries ago, these impregnable double walls protect the route to Constantinople."

 #The Ephesus Basilica
 building_type_MA_ephesus_basilica: "$building_MA_ephesus_basilica$"
 building_type_MA_ephesus_basilica_desc: "$building_MA_ephesus_basilica_desc$"
 building_MA_ephesus_basilica: "Ephesus Basilica"
 building_MA_ephesus_basilica_desc: "A massive basilica constructed over the burial site of #italic John the Apostle#! in the time of Justinian. \nIts bricks-and-ashlar walls are supported by elegant marble columns from the Proconnesus and lavishly decorated with golden mosaics."

 #Palace of Palermo
 building_type_MA_palace_palermo: "$building_MA_palace_palermo$"
 building_type_MA_palace_palermo_desc: "$building_MA_palace_palermo_desc$"
 building_MA_palace_palermo: "Palace of Palermo"
 building_MA_palace_palermo_desc: "A bulky palace-fortress overlooking the whole city. \nThe complex has hundreds of chambers and halls, lavishly decorated by artists from all over the Mediterranean with golden mosaics and exotic marbles."

 #Arles Amphiteatre
 building_type_MA_arles_amphiteatre: "$building_MA_arles_amphiteatre$"
 building_type_MA_arles_amphiteatre_desc: "$building_MA_arles_amphiteatre_desc$"
 building_MA_arles_amphiteatre: "Arles Amphiteatre"
 building_MA_arles_amphiteatre_desc: "Constructed centuries ago, this massive arena remains the centre of life in Arles. \nOut of its stone walls the townsmen have carved towers, chapels and their homes, living on the sandy field where the gladiators once slaughtered each other for sport."

 #Axum Stelae Field
 building_type_MA_axum_stelae: "$building_MA_axum_stelae$"
 building_type_MA_axum_stelae_desc: "$building_MA_axum_stelae_desc$"
 building_MA_axum_stelae: "Stelae Field"
 building_MA_axum_stelae_desc: "Three colossal stelae are all that remains of the once mighty Aksum, and yet they still cast a long shadow over the regnal culture of these lands. \nCarved out of dressed stone, one can still see the reliefs on their surface, to some showing the #italic Gates of Heaven#!."

 #Karnak Temple
 building_type_MA_karnak: "$building_MA_karnak$"
 building_type_MA_karnak_desc: "$building_MA_karnak_desc$"
 building_MA_karnak: "Karnak"
 building_MA_karnak_desc: "The most magnificent of the ancient Pharaos' temples, Karnak stands after millenia as a testament to the power and wealth of the kings of the Nile."

 #Pharos of Alexandria
 building_type_MA_pharos_alexandria: "$building_MA_pharos_alexandria$"
 building_type_MA_pharos_alexandria_desc: "$building_MA_pharos_alexandria_desc$"
 building_MA_pharos_alexandria: "Pharos"
 building_MA_pharos_alexandria_desc: "Rising high above the isthmus, the lighthouse is renowned all over the world as one of Antipater's #italic Great Seven Wonders#!. \nCenturies have passed since its first stone was laid down, and a new dome - commissioned by the caliphs - crowns the structure, but its unparalleled height, sturdy masonry and shining beacon continue to cement the Pharos' legend in every heart that sees it."

 #Trajan Arch
 building_type_MA_trajan_arch1: "$building_MA_trajan_arch1$"
 building_type_MA_trajan_arch1_desc: "The great Emperor Trajan, who begun his campaigns in #italic Dacia#! from this city, to commemorate his triumph ordered the construction of a most magnificent Arch, still greeting any ship that enters Ancona's harbour with memories of pride and might."
 building_MA_trajan_arch1: "Trajan Arch"
 building_MA_trajan_arch1_desc: "The great Emperor Trajan, who begun his campaigns in #italic Dacia#! from this city, to commemorate his triumph ordered the construction of a most magnificent Arch, still greeting any ship that enters Ancona's harbour with memories of pride and might. \nUnfortunately, the bronze and gold that once adorned it have long since been stripped away by raiding Saracens, a shameful moment that will surely have to be avenged."
 building_MA_trajan_arch2: "Anconetan Arch"
 building_MA_trajan_arch2_desc: "The great Emperor Trajan, who begun his campaigns in #italic Dacia#! from this city, to commemorate his triumph ordered the construction of a most magnificent Arch, still greeting any ship that enters Ancona's harbour with memories of pride and might. \nThe bronze and gold that once adorned it, and were stripped away by raiding Saracens, have been replaced by the local craftsmen with a new, even more impressive array of [Glossary('rostra','rostrum')] and statues of deities and conquerors."

 #Palatium of Diocletian
 building_type_MA_diocletian_palace: "$building_MA_diocletian_palace$"
 building_type_MA_diocletian_palace_desc: "$building_MA_diocletian_palace_desc$"
 building_MA_diocletian_palace: "Palatium of Diocletian"
 building_MA_diocletian_palace_desc: "This palace, built during the Tetrarch's reign, was constructed as a monumental, miniature utopian city, with colonnaded streets, arches, walls and halls. \nWith the fall of the Empire, it has been taken over by the townsmen and transformed into the urban heart of the city."

 #Romuliana
 building_type_MA_romuliana: "$building_MA_romuliana$"
 building_type_MA_romuliana_desc: "$building_MA_romuliana_desc$"
 building_MA_romuliana: "Romuliana"
 building_MA_romuliana_desc: "#italic Felix Romuliana#! was founded as a model-city by the great Caesars and protected through the years by colossal walls. \nThey were not enough to withstand the centuries' invasions, however, and now all that remains of its past glories are the hollow skeletons of the watchtowers, and the humbling mound of vegetation that has engulfed them."

 #Hexamilion
 building_type_MA_hexamilion: "$building_MA_hexamilion$"
 building_type_MA_hexamilion_desc: "$building_MA_hexamilion_desc$"
 building_MA_hexamilion: "Hexamilion"
 building_MA_hexamilion_desc: "Constructed by the emperor Theodosius to protect the Peloponnese, these walls have guarded the narrow entry point of the Isthmus for centuries, stretching from the gulf of Corinth to the Saronic, channeling trade, travelers and hostile raids into chokepoints north and south."

 #Temple of Jupiter
 building_type_MA_baalbek: "$building_MA_baalbek$"
 building_type_MA_baalbek_desc: "$building_MA_baalbek_desc$"
 building_MA_baalbek: "Temple of Jupiter"
 building_MA_baalbek_desc: "The main temple of Baalbek was once one of the largest in the world, towering over the fertile valley. \nSince then many raids and sieges have damaged the gargantuan temple, its columns shattered or carried to distant cities, but the ruin still enchants travellers from every corner of the world."

 #Leptis Magna
 building_type_MA_leptis_magna: "$building_MA_leptis_magna$"
 building_type_MA_leptis_magna_desc: "$building_MA_leptis_magna_desc$"
 building_MA_leptis_magna: "Leptis Magna"
 building_MA_leptis_magna_desc: "The gem of Tripolitania, Leptis Magna was founded by the ancient Emperors. \nAs the cruel Sun reaches its zenith at midday, the shadows it casts over the ruins of temples, markets and theaters disappear, and one cannot help but feel lost in this land without time."

 #Tomb of Numidia
 building_type_MA_mauretanian_mausoleum: "$building_MA_mauretanian_mausoleum$"
 building_type_MA_mauretanian_mausoleum_desc: "$building_MA_mauretanian_mausoleum_desc$"
 building_MA_mauretanian_mausoleum: "Tomb of Numidia"
 building_MA_mauretanian_mausoleum_desc: "An ancient, colossal mausoleum built by the Berber kings of Numidia, before their conquest by the Romans. \nEntirely made of stone and perched atop a hill facing the sea, it can be seen from great distances, gleaming with the sunlight over the horizon."

 #Meroë Pyramids
 building_type_MA_meroe_pyramids: "$building_MA_meroe_pyramids$"
 building_type_MA_meroe_pyramids_desc: "$building_MA_meroe_pyramids_desc$"
 building_MA_meroe_pyramids: "Meroë Pyramids"
 building_MA_meroe_pyramids_desc: "Nestled amidst the golden sands of Nubia, the enigmatic Pyramids rise like forgotten guardians, their secrets whispered by desert winds, beckoning curious minds to unravel the mysteries of a lost civilization through their hauntingly beautiful and intricately adorned structures."

 #Basilica of Saint Martin
 building_type_MA_saint_martin: "$building_MA_saint_martin$"
 building_type_MA_saint_martin_desc: "$building_MA_saint_martin_desc$"
 building_MA_saint_martin: "Basilica of Saint Martin"
 building_MA_saint_martin_desc: "Final resting place to the body of Saint Martin, this great basilica was first constructed when the Merovingians still ruled these lands. \nIt is one hundred and sixty feet long and sixty feet wide, decorated with ancient columns and colourful marbles, and attracts pilgrims from far and wide on the road to Santiago."

 #Pillars of Titus
 building_type_MA_piliers: "$building_MA_piliers$"
 building_type_MA_piliers_desc: "$building_MA_piliers_desc$"
 building_MA_piliers: "Pillars of Gascony"
 building_MA_piliers_desc: "Laid upon the highest point of the city, overlooking the river and blessed by the sun, these pillars are as elegant as they are mysterious. Some say they might have once been part of a great palace belonging to the Caesar Titus, but others say they rose from the rock long before the Romans ever came."

 #Txindoki
 building_type_MA_txindoki: "$building_MA_txindoki$"
 building_type_MA_txindoki_desc: "$building_MA_txindoki_desc$"
 building_MA_txindoki: "Txindoki"
 building_MA_txindoki_desc: "It is difficult for the pilgrims traveling the land not to notice its striking, snow-covered peak. Rising prominently and suddenly, Txindoki has embodied the majesty and mysterious beauty of these lands long before Man ever set its eyes on it."

 #Hospice of Santa Juliana
 building_type_MA_santillana: "$building_MA_santillana$"
 building_type_MA_santillana_desc: "$building_MA_santillana_desc$"
 building_MA_santillana: "Hospice of Santa Juliana"
 building_MA_santillana_desc: "The great vaults, stone pillars, relics and accomodations of this colegiate make for an obligatory stop to the many pilgrims on the road to Santiago. \nFunded by the local magnate and the constant flow of offers, the hospice has grown rich and beautiful, decorate with magnificent statues and sculpted reliefs."

 #Palace of Naranco
 building_type_MA_palace_naranco: "$building_MA_palace_naranco$"
 building_type_MA_palace_naranco_desc: "$building_MA_palace_naranco_desc$"
 building_MA_palace_naranco: "Palace of Naranco"
 building_MA_palace_naranco_desc: "This beautiful palace served as the residence of the holy kings of Asturia for generations, dominating the view of Oviedo from atop the mount Naranco. Its elegant arches and vault, as were not seen in the peninsula since the rule of the Romans, are a testament to the ambition and power of its rulers."

 #Burgos Cathedral
 building_type_MA_burgos_cathedral: "$building_MA_burgos_cathedral$"
 building_type_MA_burgos_cathedral_desc: "$building_MA_burgos_cathedral_desc$"
 building_MA_burgos_cathedral: "Burgos Cathedral"
 building_MA_burgos_cathedral_desc: "Constructed by artisans from both sides of the Pyrenees, this magnificent cathedral is one of the foremost examples of this new, modern style of church-building. \nIts towers rise far into the sky, and its cavernous chapels and corridors guide pilgrims from one relic to another, covered in offerings and gold and overseen by the alterous sight of the many sculpted saints."

 #Qasr al-Farid
 building_type_MA_hegra: "$building_MA_hegra$"
 building_type_MA_hegra_desc: "$building_MA_hegra_desc$"
 building_MA_hegra: "Qasr al-Farid"
 building_MA_hegra_desc: "A monumental tomb carved deep into a monolithic rock, remnant of a once wealthy and powerful pagan city. \nIt rises from the desert all alone, solitary and dashing the winds, prompting the locals to name it the #italic Lonely Castle#!."

 #Wadi Rum
 building_type_MA_wadirum: "$building_MA_wadirum$"
 building_type_MA_wadirum_desc: "$building_MA_wadirum_desc$"
 building_MA_wadirum: "Wadi Rum"
 building_MA_wadirum_desc: "This great and ancient valley has long been the source of myths and legends, and still today is shrouded in mysticism. \nFrom it, a massive wall of red rock rises against the winds of the desert, tall and heavy, strong and beyond the reach of any army, providing safe reapair in the worst of times."

 #Walls of Sana'a
 building_type_MA_walls_sanaa: "$building_MA_walls_sanaa$"
 building_type_MA_walls_sanaa_desc: "$building_MA_walls_sanaa_desc$"
 building_MA_walls_sanaa: "Walls of Sana'a"
 building_MA_walls_sanaa_desc: "A circle of strong rampants encircle the heart of Sana'a, rising impervious from the intricate labyrinth of the Sarawat mountains, their weathered grandeur whispering tales of terrible fights and great deeds of men and gods."

 #Dam of Sheba
 building_type_MA_dam_sheba: "$building_MA_dam_sheba$"
 building_type_MA_dam_sheba_desc: "$building_MA_dam_sheba_desc$"
 building_MA_dam_sheba: "Dam of Sheba"
 building_MA_dam_sheba_desc: "Alone in the barren land of Ma'rib, where the scorching sun punishes all those that dare face it, this magnificent ruins murmur tales of the great kingdom of the Queen of Sheba, that turned sands into fertile fields, that brought wealth and life where there was scarcity and death."

 #Bahla Fort
 building_type_MA_bahla_fort: "$building_MA_bahla_fort$"
 building_type_MA_bahla_fort_desc: "$building_MA_bahla_fort_desc$"
 building_MA_bahla_fort: "Bahla Fort"
 building_MA_bahla_fort_desc: "This immense mudbrick castle has been constructed to protect the precious Bahla oasis, from atop the heights of the approaching highlands. \nIts intricate walls shield from enemies and the scorching heat a series of irrigation systems and a magnificent plantation of dates palm trees, sure to grant great prestige to its protector."

 #Jebe Hafeet
 building_type_MA_jebel_hafeet: "$building_MA_jebel_hafeet$"
 building_type_MA_jebel_hafeet_desc: "$building_MA_jebel_hafeet_desc$"
 building_MA_jebel_hafeet: "Jebe Hafeet"
 building_MA_jebel_hafeet_desc: "A long and slender, lonely mountain, the last before the sand dunes and the first before the Hajar chain. \nIts steep rocky slopes have long been inhabited by the people of the region, and beehive tombs can be found set at its feet."

 #Al-Turaif Palace
 building_type_MA_alturaif: "$building_MA_alturaif$"
 building_type_MA_alturaif_desc: "$building_MA_alturaif_desc$"
 building_MA_alturaif: "Al-Turaif Palace"
 building_MA_alturaif_desc: "Built through generations in one of the most unhospitable places in Creation, this palace is a symbol of determination and piety. \nSurrounded by a long set of walls, tall mudbrick palaces and an irrigated garden offer refuge from even the most scorching heat, and work as an important supply depot for its holder."

 #School of Preslav
 building_type_MA_school_preslav: "$building_MA_school_preslav$"
 building_type_MA_school_preslav_desc: "$building_MA_school_preslav_desc$"
 building_MA_school_preslav: "School of Preslav"
 building_MA_school_preslav_desc: "Supported by a stable stream of donations, the monastic scriptoria and palatial halls of Preslav labor tirelessly to translate manuscripts and produce new knowledge. The scent of ink and parchment permeates the air, and frescoes of saints and patrons adorn the walls. The school's influence is felt far beyond its stone halls, and it has become a beacon of Roman liturgy and thought for the region."

 #Madara Rider
 building_type_MA_madara_rider: "$building_MA_madara_rider$"
 building_type_MA_madara_rider_desc: "$building_MA_madara_rider_desc$"
 building_MA_madara_rider: "Madara Rider"
 building_MA_madara_rider_desc: "Carved deep into the cold, eternal embrace of a vertical cliff, this ancient relief depicts a horseman triumphing over a lion. The rider, spear in hand, seems to leap out from the stone itself, forever victorious. Below, inscriptions tell of glorious deeds, achieved in the grazing, infinite steppe, before the people of this land had ever settled west."

 #Tsarevgrad
 building_type_MA_tsarevgrad: "$building_MA_tsarevgrad$"
 building_type_MA_tsarevgrad_desc: "$building_MA_tsarevgrad_desc$"
 building_MA_tsarevgrad: "Tsarevgrad"
 building_MA_tsarevgrad_desc: "Rising from the craggy heights, this fortress is a sight to behold, its stone walls wrapping around the hill like a coiled serpent. Its many towers and gates strangle any army that dare enter their suffocating, narrow alley, while the palace and cathedral within its bowels impress envoys, travelers and pilgrims alike."

 #Tomb of the Thracian King
 building_type_MA_thracian_tomb: "$building_MA_thracian_tomb$"
 building_type_MA_thracian_tomb_desc: "$building_MA_thracian_tomb_desc$"
 building_MA_thracian_tomb: "Tomb of the Thracian King"
 building_MA_thracian_tomb_desc: "Hidden in time and space, surrounded by a calm, golden prairie, an ancient tomb rests beneath a massive earthen [Glossary('tumulus','tumulus')], its entrance marked by a monolithic gate and circled by a forest of stones. Legends whisper that a great king of old was laid to rest here, his name long forgotten, but his spirit still riding in the skies. \nA lone cypress stands sentinel before the entrance, casting a silent, long shadow over the tomb."

 #Boyana Church
 building_type_MA_boyana_church: "$building_MA_boyana_church$"
 building_type_MA_boyana_church_desc: "$building_MA_boyana_church_desc$"
 building_MA_boyana_church: "Boyana Church"
 building_MA_boyana_church_desc: "This humble church might seem unassuming at first glance, secluded in a rural town lost between golden fields, its simple brickwork blending with the surrounding landscape. \nYet within its modest exterior lies a treasure beyond compare, hidden from the eyes of the world, the heart of the temple is adorned with frescoes of breathtaking beauty, each brushstroke a testament to divine inspiration. The blue, red, golden hues blend together and the saints dance with the flaking of the candles' flames, in the most mystical of spectacles."

 #Belogradchik Fortress
 building_type_MA_belogradchik_fort: "$building_MA_belogradchik_fort$"
 building_type_MA_belogradchik_fort_desc: "$building_MA_belogradchik_fort_desc$"
 building_MA_belogradchik_fort: "Belogradchik Fortress"
 building_MA_belogradchik_fort_desc: "Nestled among towering rock formations, this fortress seems to emerge from the earth itself, its walls seamlessly growing out of the mountain's cold, red stone. The elegant chimneys rise tall and engulf the fortress from three sides, rendering it virtually impregnable. \nLocals tell of a tale as old as time, of a giant from the nearby forest who piled the stones high up with his bare hands, and of a monastery that was devoured by the rocks as divine punishment."

 #Studenica Monastery
 building_type_MA_studenica: "$building_MA_studenica$"
 building_type_MA_studenica_desc: "$building_MA_studenica_desc$"
 building_MA_studenica: "Studenica Monastery"
 building_MA_studenica_desc: "The most magnificent of the monuments of Serbia, and a beacon of faith and tranquility to the locals, this monastery lies tucked away in a secluded valley. \nIts walls show traces of the traditions of both the Latin west and the Greek east, the white slabs of marble carved with expert hand and the imposing dome sitting atop a bright red drum are testaments to the skill and piety of the monastery's patrons."

 #Church of the Nativity
 building_type_MA_church_nativity: "$building_MA_church_nativity$"
 building_type_MA_church_nativity_desc: "$building_MA_church_nativity_desc$"
 building_MA_church_nativity: "Church of the Nativity"
 building_MA_church_nativity_desc: "First commissioned by the saintly mother of Constantine and then rebuilt under orders of Justinian, this temple celebrates one of the holiest sites of Christianity, the place of the nativity of Christ. \nThe church is a long basilica of five naves, with a triumphal entrance and decorated by golden mosaics and ancient Roman columns of colorful marbles. It houses several holy relics and works of art, which have - legends claim - saved her from multiple invasions before."

 #Great Lejre Hall
 building_type_MA_lejre_hall: "$building_MA_lejre_hall$"
 building_type_MA_lejre_hall_desc: "$building_MA_lejre_hall_desc$"
 building_MA_lejre_hall: "Great Hleiðr Hall"
 building_MA_lejre_hall_desc: "A grandiose mead hall constructed by kings of old with tall trees and magnificent sculptures. \nSagas are sure to be inspired by the tales of the great heroes and kings who dined and fought in this hall."

 #Aetna
 building_type_MA_aetna: "$building_MA_aetna$"
 building_type_MA_aetna_desc: "$building_MA_aetna_desc$"
 building_MA_aetna: "Aetna"
 building_MA_aetna_desc: "The greatest of the fiery volcanoes of the ancient world, mount Aetna towers triumphant over the fertile island of Sicily, its ashes enriching the nearby soil significantly. \nLegends and myths have been seeped in its breath for millenia, of how the god Hephaestus forged his divine creations in the heart of the infernal mountain."

 #Brescia Duomo
 building_type_MA_duomo_brescia: "$building_MA_duomo_brescia$"
 building_type_MA_duomo_brescia_desc: "$building_MA_duomo_brescia_desc$"
 building_MA_duomo_brescia: "Brescia Duomo"
 building_MA_duomo_brescia_desc: "A rotunda of stone in the heart of the #italic Cittanuova#!, the new centre of power of Brescia west of the ancient Roman core. Its thick walls and simple Romanesque design were inspired by tales of Jerusalem, while within its dimly lit interior, frescoes and relics tell of centuries of devotion and power."

 #Maschio
 building_type_MA_maschio: "$building_MA_maschio$"
 building_type_MA_maschio_desc: "$building_MA_maschio_desc$"
 building_MA_maschio: "Maschio"
 building_MA_maschio_desc: "A massive castle of stone and volcanic tuff rising over the glimmering bay of Naples, its battlements and imposing round towers ruling both land and sea with an iron fist. \nA great system of cells and dungeons burrow deep into the rock, some as old as the ancient Greeks."

 #Basilica of Saint Nicholas
 building_type_MA_st_nicholas: "$building_MA_st_nicholas$"
 building_type_MA_st_nicholas_desc: "$building_MA_st_nicholas_desc$"
 building_MA_st_nicholas: "Basilica of Saint Nicholas"
 building_MA_st_nicholas_desc: "A bulky Romanesque basilica built of solid local stone, a glimmering white color striking over the wine-blue sea. Within its walls, the relics of Saint Nicholas attract pilgrims and great riches from all over Christendom, daring them to cross into the Holy Land."

 #Palace of Arechis
 building_type_MA_palace_arechis: "$building_MA_palace_arechis$"
 building_type_MA_palace_arechis_desc: "$building_MA_palace_arechis_desc$"
 building_MA_palace_arechis: "Palace of Arechis"
 building_MA_palace_arechis_desc: "A vast palatial complex of buildings carved into the ancient Roman city of Beneventum, protected by a circle of walls and a quadrangular tower. Built by the first Prince of the Lombards, it has become a symbol of this people's defiance and stubborn independence."

 #Basilica of Saccargia
 building_type_MA_saccargia_basilica: "$building_MA_saccargia_basilica$"
 building_type_MA_saccargia_basilica_desc: "$building_MA_saccargia_basilica_desc$"
 building_MA_saccargia_basilica: "Basilica of Saccargia"
 building_MA_saccargia_basilica_desc: "A striking black-and-white stone basilica rising from a dry, weather-beaten coast of Sardinia, its striped tower visible for miles from the sea. Craftsmen from Italy were brought to aid in the construction, and their stylistic influence is profound."

 #Ruins of Paestum
 building_type_MA_paestum: "$building_MA_paestum$"
 building_type_MA_paestum_desc: "$building_MA_paestum_desc$"
 building_MA_paestum: "Ruins of Paestum"
 building_MA_paestum_desc: "The remains of the once great ancient city lie surrounded by wild grass and silence, the colossal columns of its temples broken and shattered. The city was slowly abandoned after the nearby river turned the land to swamp, and today few dare venture into the malaised land."

 #Tower of Pisa
 building_type_MA_tower_pisa: "$building_MA_tower_pisa$"
 building_type_MA_tower_pisa_desc: "$building_MA_tower_pisa_desc$"
 building_MA_tower_pisa: "Tower of Pisa"
 building_MA_tower_pisa_desc: "The elegant #italic campanile#! of the proud city of Pisa, whose elegant arches and shimmering white stone have become known all over Christendom and beyond. Since its construction the ground beneath it has shown to often shift, causing it to increasingly lean."

 #Saint Peter's Basilica
 building_type_MA_vatican: "$building_MA_vatican$"
 building_type_MA_vatican_desc: "$building_MA_vatican_desc$"
 building_MA_vatican: "Saint Peter's Basilica"
 building_MA_vatican_desc: "The holiest of the ancient basilicas ordered by Constantine in Rome, it rises over the tomb of the Apostle upon whom the Church was founded. \nThe church is as monumental as it is elegant, its tall naves adorned in golden mosaics and exotic marbles welcoming thousands of pilgrims from all over Christendom, and all the wealth and power they entail."

 #Rock of Canossa
 building_type_MA_rock_canossa: "$building_MA_rock_canossa$"
 building_type_MA_rock_canossa_desc: "$building_MA_rock_canossa_desc$"
 building_MA_rock_canossa: "Rock of Canossa"
 building_MA_rock_canossa_desc: "This formidable castle was constructed atop a steep, rocky crag as the center of an impressive system of fortifications to guard the Appenine passes. From this isolated stronghold, its lords watch over the valleys below, secure in their refuge of stone and sky."

 #Hill of Tara
 building_type_MA_hill_tara: "$building_MA_hill_tara$"
 building_type_MA_hill_tara_desc: "$building_MA_hill_tara_desc$"
 building_MA_hill_tara: "Hill of Tara"
 building_MA_hill_tara_desc: "A grassy hill protected by dykes and earthworks and ringed by ancient carved stones, holy seat of the High Kings of Ireland. Though no walls stand upon it, the land itself holds power, and attracts visitors from all over the island."

 #Clonmacnoise
 building_type_MA_clonmacnoise: "$building_MA_clonmacnoise$"
 building_type_MA_clonmacnoise_desc: "$building_MA_clonmacnoise_desc$"
 building_MA_clonmacnoise: "Clonmacnoise"
 building_MA_clonmacnoise_desc: "A great monastery founded on the banks of the broad River Shannon, its stone church and tall round tower rising solemn amid the windswept plains. With time it has become one of the most important centers of learning of the island, drawing scholars and pilgrims from far and wide."

 #White Stupa of Gaochang
 building_type_MA_white_stupa: "$building_MA_white_stupa$"
 building_type_MA_white_stupa_desc: "$building_MA_white_stupa_desc$"
 building_MA_white_stupa: "White Stupa of Gaochang"
 building_MA_white_stupa_desc: "Commissioned by the imperial authorities to mark the reach of the Middle Kingdom, this gleaming stupa rises alone above the scorched sands of the desert. Its design draws heavily from Tibetan and Indian temples with its great, rounded white dome and gilded spire, but also incorporates traditional Chinese elements such as its wooden foundation."

 #Khan Tengri
 building_type_MA_khan_tengri: "$building_MA_khan_tengri$"
 building_type_MA_khan_tengri_desc: "$building_MA_khan_tengri_desc$"
 building_MA_khan_tengri: "Khan Tengri"
 building_MA_khan_tengri_desc: "Called the #italic Lord Sky#! by the people of the steppe, this towering pyramid of marble rises in perfect symmetry above the surrounding mountains. Its slopes are draped in eternal snow, glowing red at dusk and gold at dawn, and it forms a sacred axis between earth and heaven beneath the clear blue vault of the sky."

 #Singing Dunes
 building_type_MA_singing_dunes: "$building_MA_singing_dunes$"
 building_type_MA_singing_dunes_desc: "$building_MA_singing_dunes_desc$"
 building_MA_singing_dunes: "Singing Dunes"
 building_MA_singing_dunes_desc: "Not too long a march from the oasis, a great crescent of sand rises from the barren steppe, where the wind draws long, haunting notes from the earth itself. Nomads crossing the ancient routes of Asia pause to listen believing the song of the dunes to be a voice of the spirits, and poets from afar are inspired by its music."

 #Dakhma of Gurganj
 building_type_MA_dakhma: "$building_MA_dakhma$"
 building_type_MA_dakhma_desc: "$building_MA_dakhma_desc$"
 building_MA_dakhma: "Dakhma of Gurganj"
 building_MA_dakhma_desc: "This great circular #italic Dakhma#!, or tower of silence, tops a lonely rise above the plain. It was once used by the Zoroastrians to expose their dead to the cleansing sky and sun, but as the faithful grow fewer with each passing summer, the tower sees fewer funerary rites—and more sentries, for its height and shape now lend themselves better to watchfulness than worship. \n\n#help The tower grants additional effects if held or populated by a [faith|E] practicing #game_link Sky Burials#!#!"

 #Black Ruins
 building_type_MA_karabalgasun: "$building_MA_karabalgasun$"
 building_type_MA_karabalgasun_desc: "$building_MA_karabalgasun_desc$"
 building_MA_karabalgasun: "Black Ruins"
 building_MA_karabalgasun_desc: "Shattered earthen walls and broken columns are all that remain of the once-mighty palace that sat at the heart of one of the greatest empires of the steppe. Wind howls through the empty courtyards and carved stones lie half-buried in grass and dust, but travelers still pass through, and call them the #italic Karabalgasun#!, the Black Ruins."

 #City of the Army
 building_type_MA_ordu: "$building_MA_ordu$"
 building_type_MA_ordu_desc: "$building_MA_ordu_desc$"
 building_MA_ordu: "City of the Army"
 building_MA_ordu_desc: "A great city of merchants, courtiers and horses is found at the crossroad of the routes of Europe and Asia. \nProtected by earthen walls and surrounded by a wide moat, one can found many tents and temples strewn along a colonnaded avenue, leading to the gilded tent of the great lord of the Steppe that rules from such a seat."

 #Kurgan of the Rider
 building_type_MA_kurgan: "$building_MA_kurgan$"
 building_type_MA_kurgan_desc: "$building_MA_kurgan_desc$"
 building_MA_kurgan: "Kurgan of the Rider"
 building_MA_kurgan_desc: "Locals tell of a great rider who once roamed these lands, and whose spirit still rides the steppe. \nHis Kurgan, a great mound of earth, is said to be the place where he was buried, and it is surrounded by a circle of stones that mark the boundaries of his domain. Ever fewer remember his name, but the kurgan nonetheless stands against the wind and time."

 #Cliffs of Ustyurt
 building_type_MA_ustyurt_cliffs: "$building_MA_ustyurt_cliffs$"
 building_type_MA_ustyurt_cliffs_desc: "$building_MA_ustyurt_cliffs_desc$"
 building_MA_ustyurt_cliffs: "Cliffs of Ustyurt"
 building_MA_ustyurt_cliffs_desc: "These weather-shaped cliffs mark the transition from a desolate plateau to the coasts of the inland sea, and are traversed by canyons and burrowed by caves. The land is harsh and waterless, and has forced the hunters to adapt and create #italic arans#!, stone traps used to funnel wild herds into narrow points, turning the cliffs into a silent theatre of death."

 #White Fortress
 building_type_MA_sarkel: "$building_MA_sarkel$"
 building_type_MA_sarkel_desc: "$building_MA_sarkel_desc$"
 building_MA_sarkel: "White Fortress"
 building_MA_sarkel_desc: "A grand stronghold made of white limestone-and-brick, #italic Sark-el#! – the White Fortress – was built on the left bank of the Don River when the Khagan solicited from the Roman emperor engineers to reinforce his realm's northern border. Now it commands the strategic portage between the Don and Volga, exerting military might far into the northern lands and protecting the important trade routes that flow through the region."

 #Nilometer
 building_type_MA_nilometer: "$building_MA_nilometer$"
 building_type_MA_nilometer_desc: "$building_MA_nilometer_desc$"
 building_MA_nilometer: "Nilometer"
 building_MA_nilometer_desc: "A narrow stone chamber built along the muddy riverbank to better measure the rise and fall of the Nile and help plan crops. It was commissioned by the new islamic rulers to continue an ancient custom of the land, binding flood and fortune to the order of the state."

 #Abu Simbel
 building_type_MA_abu_simbel: "$building_MA_abu_simbel$"
 building_type_MA_abu_simbel_desc: "$building_MA_abu_simbel_desc$"
 building_MA_abu_simbel: "Abu Simbel"
 building_MA_abu_simbel_desc: "Colossal statues, carved by the ancient Pharaohs many generations ago, protrude from these rocky dunes, their size still unrivalled anywhere in the world. \nAny witness to their majesty, be they simple travellers or great kings, cannot help but be inspired by the story they tell."

 #Red and White Monasteries
 building_type_MA_red_white_monasteries: "$building_MA_red_white_monasteries$"
 building_type_MA_red_white_monasteries_desc: "$building_MA_red_white_monasteries_desc$"
 building_MA_red_white_monasteries: "Red and White Monasteries"
 building_MA_red_white_monasteries_desc: "Two ancient Coptic monasteries near the banks of the Nile, their walls built from stones of striking hue granting them their names, one deep and earthen red, the other pale and luminous. Isolated but not forgotten, within their chapels echoing with old chants and their walls adorned with fading frescoes, they preserve a learned and devout Christian tradition dating from before the Muslim rulers crossed the deserts and rocks of the Sinai to conquer these lands."

 #Knossos
 building_type_MA_knossos_ruins: "$building_MA_knossos$"
 building_type_MA_knossos_ruins_desc: "$building_MA_knossos_desc$"
 building_MA_knossos_ruins: "Ruins of Knossos"
 building_MA_knossos_ruins_desc: "Casting a shadow over the splendid sea, these ancient ruins come from the broken palace of myths of old. \nShattered columns and peeling frescoes still enchant travelers, but the memory fades with each passing year, and the great halls of the Minoans are now but a distant echo of a time long gone."
 building_MA_knossos: "Palace of Knossos"
 building_MA_knossos_desc: "After countless centuries of oblivion, the great palace of Knossos has been brought back to its ancient glory. \nIn its cavernous halls, dimly lit by candles, the frescoes seem to dance and cheer, flickering with the light, while courtiers and envoys go about their business, exchanging news and gossip."

 #Skara Brae
 building_type_MA_skara_brae: "$building_MA_skara_brae$"
 building_type_MA_skara_brae_desc: "$building_MA_skara_brae_desc$"
 building_MA_skara_brae: "Skara Brae"
 building_MA_skara_brae_desc: "Timidly peeking out of a grassy hill on the wind-lashed coast, this cluster of ancient stone dwellings lies half-buried beneath the earth. \nWashed by the stinging breeze of the ocean, it endures in silence, its walls low and weathered, its hearths cold for countless centuries, yet still echoing with the memory of lives long vanished."

 #Whitehorse Hill
 building_type_MA_whitehorse_hill: "$building_MA_whitehorse_hill$"
 building_type_MA_whitehorse_hill_desc: "$building_MA_whitehorse_hill_desc$"
 building_MA_whitehorse_hill: "Whitehorse Hill"
 building_MA_whitehorse_hill_desc: "#flavor Near to the town of Abinton there is a mountain with a figure of a stallion upon it, and it is white. Nothing grows upon it.#!"

 #Gagikashen
 building_type_MA_gagikashen: "$building_MA_gagikashen$"
 building_type_MA_gagikashen_desc: "$building_MA_gagikashen_desc$"
 building_MA_gagikashen: "Gagikashen"
 building_MA_gagikashen_desc: "A large circular church dedicated to Saint Gregory, towering over the high ground of Ani. Its builders were inspired by the ruined forms of Zvart'nots Cathedral. Its tall drum rises in three steps over rings of columns and side chapels, surrounding a central space of great harmony and clarity."

 #Saint Gall
 building_type_MA_saint_gall: "$building_MA_saint_gall$"
 building_type_MA_saint_gall_desc: "$building_MA_saint_gall_desc$"
 building_MA_saint_gall: "Saint Gall"
 building_MA_saint_gall_desc: "A major monastic complex founded on the site of Saint Gallus' hermitage, at the edge of the Alemannic lands. Known for its discipline and organization, it houses a #italic scriptorium#! and library of exceptional quality, where monks copy, translate, and preserve classical and sacred texts for the use of scholars across Christendom."

 #Sé of Lisbon
 building_type_MA_se_lisbon: "$building_MA_se_lisbon$"
 building_type_MA_se_lisbon_desc: "$building_MA_se_lisbon_desc$"
 building_MA_se_lisbon: "Sé of Lisbon"
 building_MA_se_lisbon_desc: "A heavy Romanesque cathedral built on the slopes above the harbor, its thick walls and narrow windows a reflection of the troubled times of this Iberian struggle. Raised after the Christian reconquest of the city, it stands atop the ruins of an old mosque, with relics of Saint Vincent housed within its stone vaults, welcoming processions along its echoing nave."

 #Alto Douro Vineyards
 building_type_MA_alto_douro: "$building_MA_alto_douro$"
 building_type_MA_alto_douro_desc: "$building_MA_alto_douro_desc$"
 building_MA_alto_douro: "Alto Douro Vineyards"
 building_MA_alto_douro_desc: "Terraced vineyards carved into the steep hills of the Douro Valley, where stone walls hold the earth and channel the sun. First planted in Roman times, the vineyards have long produced strong, dark wines, carried downriver to coastal markets and foreign courts."

 #Fortifications on the Guadalquivir
 building_type_MA_guadalquivir_fortifications: "$building_MA_guadalquivir_fortifications$"
 building_type_MA_guadalquivir_fortifications_desc: "$building_MA_guadalquivir_fortifications_desc$"
 building_MA_guadalquivir_fortifications: "Fortifications on the Guadalquivir"
 building_MA_guadalquivir_fortifications_desc: "Stretching along the banks of the Guadalquivir, fortifications guard the bustling port of Seville with towers and gates at every turn. Most striking is the Torre del Oro, a twelve-sided watchtower clad in a golden-hued limewash that gleams over the waters of the river, both a beacon for approaching ships and a warning of the city's strength."

 #Madinat al-Zahra
 building_type_MA_madinat_alzahra: "$building_MA_madinat_alzahra$"
 building_type_MA_madinat_alzahra_desc: "$building_MA_madinat_alzahra_desc$"
 building_MA_madinat_alzahra: "Madinat al-Zahra"
 building_MA_madinat_alzahra_desc: "A vast palace-city built near the gentle foothills of the Córdoba countryside, raised to display the splendor of the Caliph's court. Its gardens, pavilions, and reception halls are laid out across broad terraces, with walls of marble and jasper carved in fine detail, its beauty and splendor inspiring poets to write of the finest pleasures of life."

 #Circus of Merida
 building_type_MA_circus_merida: "$building_MA_circus_merida$"
 building_type_MA_circus_merida_desc: "$building_MA_circus_merida_desc$"
 building_MA_circus_merida: "Circus of Mérida"
 building_MA_circus_merida_desc: "The remains of an ancient Roman circus stretch long and thin across the plain outside Mérida, its outline still marked by crumbling walls and grassy tracks, the shade gently offered by spare few cipresses. Nearby, a small church with a quiet graveyard has risen outside the ruins, finding new purpose where there was no more."

 #Alhambra
 building_type_MA_alhambra: "Alhambra"
 building_type_MA_alhambra_desc: "A fortified palace-city watching superbly over Granada from the gentle Sabika hill, red as the setting sun of the summer spring."
 building_MA_alhambra: "Red Fort"
 building_MA_alhambra_desc: "A small castle of Roman origin built of rammed-earth walls, their reddish tones giving it the name by which it has become known. Modest towers and battlements crown the Sabika hill, looking over the fertile plain."
 building_MA_alhambra_02: "New Citadel"
 building_MA_alhambra_02_desc: "Stronger walls now embrace the old Alcazaba, and larger towers flank its keep. The new rulers of the modest, ancient fort have breathed new life into the structure, and furbished it with new residential quarters, including a small palace and garden, offering shelter and comfort alongside the military redoubt."
 building_MA_alhambra_03: "Courtyards and Gardens"
 building_MA_alhambra_03_desc: "The Alhambra has now spread across most of the Sabika hill, transformed into a sprawling palace-city. Halls with slender columns open onto courtyards paved with marble, their walls lavishly decorated by arabesques and floral reliefs. Canals carry running water through the mediterranean gardens, cooling the pavilions from the hot air outside. Behind the elegance, large towers ensure the citadel and its surroundings remain safe and within reach."
 building_MA_alhambra_04: "Court of the Lionstra"
 building_MA_alhambra_04_desc: "At the heart of the palace now lies its most refined jewel: a quadrangular courtyard encircled by arcaded galleries with delicate stucco and slender marble columns. From its center flows a great fountain borne on twelve sculpted lions, with channels of water running through the adjoining halls."

 #The Cologne Cathedral
 building_type_MA_cologne_cathedral: "Cologne Cathedral"
 building_type_MA_cologne_cathedral_desc: "The great church of Cologne, seat of its archbishop and a symbol of the city's pride. Expanded and built upon over centuries, it holds relics of untold value and serves as a source of pride for the whole , triumphing over the roofs of the city."
 building_MA_cologne_cathedral: "$building_type_MA_cologne_cathedral$"
 building_MA_cologne_cathedral_desc: "The old basilica has given way to a soaring Gothic design taller than ever before, with pointed arches, clustered columns, and vast stained-glass windows flooding the interior with colored light. Its twin spires rise above the city, a bold statement of faith and ambition on the Rhine."
 building_MA_cologne_cathedral_02: "$building_MA_cologne_cathedral$"
 building_MA_cologne_cathedral_02_desc: "The old basilica has given way to a soaring Gothic design taller than ever before, with pointed arches, clustered columns, and vast stained-glass windows flooding the interior with colored light. Its twin spires rise above the city, a bold statement of faith and ambition on the Rhine."

 #Qutb Complex
 building_type_MA_qutb_complex: "Qutb Complex"
 building_type_MA_qutb_complex_desc: "The vast, sacred the heart of Delhi, a stratification of monuments and temples to many gods and men."
 building_MA_qutb_complex: "Iron Pillar"
 building_MA_qutb_complex_desc: "An ancient cluster of Hindu and Jain temples at the center of #italicss Lal Kot#!, beautifully carved and adorned with figures of gods and guardians. Among them rises a tall iron pillar from the time of the Guptas, gleaming dark against the sun."
 building_MA_qutb_complex_02: "Great Masjid of Delhi"
 building_MA_qutb_complex_02_desc: "The temples have given way to a great mosque, of a masterful style mixing influences from within and without the subcontinent. The columns that border the central courtyard have come from spolia of the older temples torn down, and a great gateway allows access into it from the south."
 building_MA_qutb_complex_03: "Qutb Minar"
 building_MA_qutb_complex_03_desc: "Erected to celebrate recent conquests, the #italic Qutb Minar#! rises proud and scans the hour of prayers long and far. Its red sandstone shaft rises high above the city, covered in bands of calligraphy and balconies that circle each level."
 building_MA_qutb_complex_04: "Alai Minar"
 building_MA_qutb_complex_04_desc: "A colossal, second minaret now trumps over the whole city, inspired in style by its earlier sibling, the #italic Alai Minar#! is now without equals anywhere in the Islamic world."

 #Sigiriya
 building_type_MA_sigiriya: "Sigiriya"
 building_type_MA_sigiriya_desc: "A giant rock rising from the jungle, crowned by the ruins of a great palace and gardens."
 building_MA_sigiriya: "Ruins of Sigiriya"
 building_MA_sigiriya_desc: "A mighty, lonely rock in the middle of the deep jungle, the summit of Sigiriya was once crowned by a great palace and lush gardens. Stairways climb past frescoed walls and the colossal Lion Gate, where giant carved paws once guarded the ascent to the royal citadel in the sky. \nToday, the ruins have been reclaimed by nature and a small monastic community."
 building_MA_sigiriya_02: "Restored Sigiriya"
 building_MA_sigiriya_02_desc: "The towering rock has been reclaimed. \nSprings flow from its sides, feeding pools and fountains in the terraced gardens below. The Lion Gate has been restored, and a stairway climbs past frescoed walls to the summit, where a royal citadel now once again stands triumphant."

 #Great Sanchi Stupa
 building_type_MA_sanchi_stupa: "$building_MA_sanchi_stupa$"
 building_type_MA_sanchi_stupa_desc: "$building_MA_sanchi_stupa_desc$"
 building_MA_sanchi_stupa: "Great Sanchi Stupa"
 building_MA_sanchi_stupa_desc: "This massive dome of stone and brick was first constructed on the orders of the mighty emperor Ashoka. Since then, the complex has been enlarged by his successors, and ravaged by the times. It is set on a raised terrace, encircled by carved railings and decorated #italics toranas#!, gateways around which pilgrims circle in endless devotion."

 #Vindhyagiri Hill
 building_type_MA_gommateshwara: "Vindhyagiri Hill"
 building_type_MA_gommateshwara_desc: "Rising steeply above the town of Shravanabelagola, the granite heights of Vindhyagiri are crowned with shrines and courtyards of Jain devotion. Pilgrims ascend its carved steps barefoot, the air filled with the chime of bells and the scent of stone warmed by the sun."
 building_MA_gommateshwara: "Vindhyagiri Temples"
 building_MA_gommateshwara_desc: "Clustered along the terraces of the granite hill, the Jain temples of Vindhyagiri rise in calm harmony, their pillared halls and sanctuaries hosting sacred figures and #italic tirthankaras#!. Pilgrims ascend its carved steps barefoot, the air filled with the chime of bells and the scent of stone warmed by the sun."
 building_MA_gommateshwara2: "Gommateshwara Colossus"
 building_MA_gommateshwara2_desc: "Carved from living granite, the towering statue of Bahubali stands over fifty feet in height, unclothed and unarmed, embodying perfect detachment. \nPilgrims from afar come to witness his timeless calm, a vision of enlightenment hewn from stone."
 
 #Palace of Ghazni
 building_type_MA_ghazni_palace: "$building_MA_ghazni_palace$"
 building_type_MA_ghazni_palace_desc: "$building_MA_ghazni_palace_desc$"
 building_MA_ghazni_palace: "Ghaznavid Palace"
 building_MA_ghazni_palace_desc: "Set outside the walls of Ghazni, this royal residence serves as the center of power of the sultan of the city. Its halls, radiating from the quadrangular #italic iwan#! courtyard, are expertly carved and richly adorned with stucco and polychrome tiles, inspired by the artistry of Persia."
 
 #Stupas of Anuradhapura
 building_type_MA_stupas_anuradhapura: "$building_MA_stupas_anuradhapura$"
 building_type_MA_stupas_anuradhapura_desc: "$building_MA_stupas_anuradhapura_desc$"
 building_MA_stupas_anuradhapura: "Stupas of Anuradhapura"
 building_MA_stupas_anuradhapura_desc: "Scattered around the ancient temple-city of Anuradhapura rise the vast brick stupas of the Sinhalese kings, built to enshrine relics of the Buddha, many of the stupas stand upon a square terrace encircled by processional paths and stone railings. The whitewashed forms of the monasteries and centers of learning of the city gleam beneath the sun, while debates are carried in their halls and courtyards."

 #Eye of the Sahara
 building_type_MA_eye_sahara: "$building_MA_eye_sahara$"
 building_type_MA_eye_sahara_desc: "$building_MA_eye_sahara_desc$"
 building_MA_eye_sahara: "The Eye of the Sahara"
 building_MA_eye_sahara_desc: "A vast circular formation in the heart of the desert, its rocky rings stretching for miles across the sand. From afar it seems an enormous, weathered eye gazing skyward, a landmark known to nomads and caravans who cross the barren wastes around it. \nAncient legends link it to what was once a thriving city, lush and flowing with water, but now swallowed by the sands."
 
 #Great Mosque of Mahdia
 building_type_MA_mahdia_mosque: "$building_MA_mahdia_mosque$"
 building_type_MA_mahdia_mosque_desc: "$building_MA_mahdia_mosque_desc$"
 building_MA_mahdia_mosque: "Great Mosque of Mahdia"
 building_MA_mahdia_mosque_desc: "Raised upon the peninsula of Mahdia's rocky shores, this austere mosque appears fortress-like with its pale stone towers. \nWithin it, two elegant, arcaded courtyards lead to the prayer halls where the faithful gather beneath pale stone arches."
 
 #Saint Mark's of Zagreb
 building_type_MA_zagreb_church: "$building_MA_zagreb_church$"
 building_type_MA_zagreb_church_desc: "$building_MA_zagreb_church_desc$"
 building_MA_zagreb_church: "Saint Mark's of Zagreb"
 building_MA_zagreb_church_desc: "Constructed with the help of Italian and German artisans, the church of Saint Mark towers over the rest of the city. Its Romanesque plan is embellished with Gothic additions, and its portals and walls richly painted with biblical stories." 
 
 #Walls of Balkh
 building_type_MA_walls_balkh: "$building_MA_walls_balkh$"
 building_type_MA_walls_balkh_desc: "$building_MA_walls_balkh_desc$"
 building_MA_walls_balkh: "Walls of Balkh"
 building_MA_walls_balkh_desc: "For centuries the citadel of Balkh has been protected by two great circular walls around the entire perimeter, one within the other. Their earthen ramparts and towers form a bulwark against the armies that sweep across the steppe, and protect the markets and workshops within the city."
 
 #Martand Sun Temple
 building_type_MA_martand_sun_temple: "$building_MA_martand_sun_temple$"
 building_type_MA_martand_sun_temple_desc: "$building_MA_martand_sun_temple_desc$"
 building_MA_martand_sun_temple: "Martand Sun Temple"
 building_MA_martand_sun_temple_desc: "Raised upon a high plateau in the Vale of Kashmir, the temple is one of the most ancient to be devoted to the Sun divine. Its great sanctum lies at its center, and is surrounded by a multitude of smaller shrines and rows of carvings of deities and celestial figures. The peristyle courtyard contains a peaceful pool, beaming in the sunlight."
 
 #Ruins of Aquae Sulis
 building_type_MA_aquae_sulis_ruins: "$building_MA_aquae_sulis_ruins$"
 building_type_MA_aquae_sulis_ruins_desc: "$building_MA_aquae_sulis_ruins_desc$"
 building_MA_aquae_sulis_ruins: "Ruins of Aquae Sulis"
 building_MA_aquae_sulis_ruins_desc: "#low The work of giants is decaying#! \nAround the steaming sacred spring lie the shattered remains of Aquae Sulis, where the Romans once raised great baths and temples of dressed stone. Broken walls, fallen arches, and flooded chambers still mark the ordered plan of the ancient complex, its warm waters continuing to flow as pilgrims and townsfolk gather among the ruins." 
 
 #Winchester Minster
 building_type_MA_winchester_minster: "$building_MA_winchester_minster$"
 building_type_MA_winchester_minster_desc: "$building_MA_winchester_minster_desc$"
 building_MA_winchester_minster: "Winchester Minster"
 building_MA_winchester_minster_desc: "The great Minster is a vast basilica of stone and timber, with a broad painted nave and multiple bell towers. It dominates the royal city, much larger than any of its other constructions, and acts as guardian of the Wessex royal tombs." 
 
 #Westminster Abbey
 building_type_MA_westminster_abbey: "$building_MA_westminster_abbey$"
 building_type_MA_westminster_abbey_desc: "$building_MA_westminster_abbey_desc$"
 building_MA_westminster_abbey: "Westminster Abbey"
 building_MA_westminster_abbey_desc: "Built beside the Thames and richly endowed by the kings of England, Westminster Abbey is a great monastic church of stone, its long nave and soaring choir adorned with sculpted capitals and painted walls. Here kings are crowned and laid to rest, and the abbey serves as a sacred stage where royal authority and divine favor are bound together." 
 
 #Lorsch Gate
 building_type_MA_lorsch_gate: "$building_MA_lorsch_gate$"
 building_type_MA_lorsch_gate_desc: "$building_MA_lorsch_gate_desc$"
 building_MA_lorsch_gate: "Lorsch Gate"
 building_MA_lorsch_gate_desc: "The monumental gatehouse of Lorsch Abbey is a rare and carefully constructed example of Carolingian architecture. Built of finely cut stone and brick, its symmetrical facade is articulated by engaged columns, blind arches, and classical ornament echoing ancient Roman models." 
 
 #Dover Castle
 building_type_MA_dover_castle: "$building_MA_dover_castle$"
 building_type_MA_dover_castle_desc: "$building_MA_dover_castle_desc$"
 building_MA_dover_castle: "Dover Castle"
 building_MA_dover_castle_desc: "Set upon the white cliffs that overlook the narrow channel, the fortress commands the principal gateway between England and the continent. Its massive stone keep, curtain walls, and layered gatehouses form a formidable defensive complex, controlling the harbor and the roads inland while serving as a royal stronghold and residence."  
 
 #Château Gaillard
 building_type_MA_chateau_gaillard: "$building_MA_chateau_gaillard$"
 building_type_MA_chateau_gaillard_desc: "$building_MA_chateau_gaillard_desc$"
 building_MA_chateau_gaillard: "Château Gaillard"
 building_MA_chateau_gaillard_desc: "Constructed atop a limestone spur above the Seine, Château Gaillard is a compact and sophisticated stone fortress designed for active defense. Its concentric walls, angled towers, and forward-facing gateworks minimize blind spots and concentrate fire along the approaches. Built with speed and precision, it embodies the latest principles available of military architecture, securing control of the river and the frontier of Normandy." 
 
 #Carnac Stones
 building_type_MA_carnac_stones: "$building_MA_carnac_stones$"
 building_type_MA_carnac_stones_desc: "$building_MA_carnac_stones_desc$"
 building_MA_carnac_stones: "Carnac Stones"
 building_MA_carnac_stones_desc: "Hundres of massive stones are scattered across the plain, set in ordered rows stretching toward the horizon. Raised in a distant age beyond memory, their true purpose has been lost to legends and tales."
 
 #Guérande Salt Marshes
 building_type_MA_guerande_salt_marshes: "$building_MA_guerande_salt_marshes$"
 building_type_MA_guerande_salt_marshes_desc: "$building_MA_guerande_salt_marshes_desc$"
 building_MA_guerande_salt_marshes: "Guérande Salt Marshes"
 building_MA_guerande_salt_marshes_desc: "Along the low coastal flats near Guérande spreads a network of salt pans, dikes, and channels used to extract from the sea the famed delicacy of the #italic fleur de sel#!. Seawater is guided through shallow basins where the sun draws out white salt, sustaining the towns and trade of the region through a craft passed down across generations." 
 
 #Reims Cathedral
 building_type_MA_reims_cathedral: "$building_MA_reims_cathedral$"
 building_type_MA_reims_cathedral_desc: "$building_MA_reims_cathedral_desc$"
 building_MA_reims_cathedral: "Reims Cathedral"
 building_MA_reims_cathedral_desc: "A vast Gothic cathedral defined by its tall nave, slender clustered piers, and extensive use of ribbed vaulting and flying buttresses. Its west front is richly articulated with sculpted portals and deep archivolts, while the interior is enclosed by walls of stained glass that emphasize height, light, and ceremonial grandeur, befitting its central role in the royal coronations of France."
 
 #Chartres Cathedral
 building_type_MA_chartres_cathedral: "$building_MA_chartres_cathedral$"
 building_type_MA_chartres_cathedral_desc: "$building_MA_chartres_cathedral_desc$"
 building_MA_chartres_cathedral: "Chartres Cathedral"
 building_MA_chartres_cathedral_desc: "One of the most elegant and ordered examples of High Gothic ambition, Chartres is distinguished by its broad nave, strong piers, and deep choir. Its walls are largely dissolved into stained glass set within a robust skeletal framework, while the twin towers and carefully proportioned elevations express stability, clarity, and theological intent."
 
 #Palace of Avignon
 building_type_MA_avignon_palace: "Palace of Avignon"
 building_type_MA_avignon_palace_desc: "An enormous Romanesque and Gothic palace-fortress, seat of a most refined and powerful court"
 building_MA_avignon_palace1: "Palais Vieux"
 building_MA_avignon_palace1_desc: "Since the establishment of this great palace-fortress, the city has grown rapidly, its streets bounded by strong walls crowded with envoys, artisans, and merchants. Rising on a rocky outcrop above the Rhône, the complex of halls, towers, and vaulted chapels is strong and elegant in its lines."
 building_MA_avignon_palace2: "Palais Neuf"
 building_MA_avignon_palace2_desc: "The palace has been greatly expanded, with a new section of wings and towers to the west of the old keep. It is a monumental symbol of authority, its vast chambers adorned with frescoes, tapestries, and gilded ceilings that proclaim the splendour of its rulers." 
 
 #Walls of Carcassonne
 building_type_MA_walls_carcassonne1: "Walls of Carcassonne"
 building_type_MA_walls_carcassonne1_desc: "Wrapped around the city, these formidable walls form an important stronghold between the Iberian and Frankish lands."
 building_MA_walls_carcassonne1: "Walls of Carcassonne"
 building_MA_walls_carcassonne1_desc: "The ancient Gallo-Roman and Visigothic walls of Carcassonne have protected the valley from hostile raids for centuries, forming one of the greatest fortified outposts on the shifting frontier between the Muslim and Christian worlds. Forty towers crown the circuit, guarding the roads and fields that stretch below it."
 building_MA_walls_carcassonne2: "Walls of Carcassonne"
 building_MA_walls_carcassonne2_desc: "A second outer wall now encircles the original fortifications, doubling the strength of the citadel. New towers and gateworks reinforce the ancient circuit, creating a layered bastion whose battlements stand ready against all foes." 
 
 #Saint-Denis Basilica
 building_type_MA_saint_denis_basilica1: "Basilica of Saint-Denis"
 building_type_MA_saint_denis_basilica1_desc: "An architectural masterpiece, this basilica represents the union between royal and religious power in France."
 building_MA_saint_denis_basilica1: "Basilica of Saint-Denis"
 building_MA_saint_denis_basilica1_desc: "Raised on the burial site of Saint Denis, the impressive Carolingian basilica is a sanctuary of royal devotion. One of the largest of its kind, it has a long and broad nave supported by heavy pillars and columns, guiding pilgrims toward the saint’s shrine. Its capitals and walls are solemnly painted with biblical scenes, judging the works of the kings that lay below in their rest."
 building_MA_saint_denis_basilica2: "Basilica of Saint-Denis"
 building_MA_saint_denis_basilica2_desc: "A grand expansion has transformed the ancient basilica with a great new Gothic choir and a soaring pointed vaults. The sunlight enters the building through slender windows of coloured glass, illuminating the royal necropolis with a radiance worthy of its solemn importance." 

 #Île de la Cité
 building_type_MA_ile_de_la_cite1: "$building_MA_ile_de_la_cite1$"
 building_type_MA_ile_de_la_cite1_desc: "$building_MA_ile_de_la_cite1_desc$"
 building_MA_ile_de_la_cite1: "Île de la Cité"
 building_MA_ile_de_la_cite1_desc: "After a bend of the Seine, the Île serves as the foundation of a compact city shaped by Roman inheritance and Carolingian rule. Enclosed by the old walls, it is organized around a Roman-style palatial complex and an early basilica, their masonry halls and courts forming the administrative and sacred core of the Frankish realm."
 building_MA_ile_de_la_cite2: "Île de la Cité"
 building_MA_ile_de_la_cite2_desc: "The island has grown dense and vibrant, its streets crowded with clerics, officials, foreign envoys and merchants at the center of the western world. Gothic masterpieces now dominate its skyline: the fortified Palais de la Cité, the jeweled Sainte-Chapelle, and the vast cathedral of Notre-Dame, whose bells regulate the daily activities of this bustling metropolis." 
 
 #Iron Gate
 building_type_MA_iron_gate: "$building_MA_iron_gate$"
 building_type_MA_iron_gate_desc: "$building_MA_iron_gate_desc$"
 building_MA_iron_gate: "Iron Gate"
 building_MA_iron_gate_desc: "Guarding the mountain pass that links the Orontes plain to the mountain range high above, the Iron Gate forms one of the most critical entrances into Antioch. Here the walls narrow into a fortified defile of stone towers, gates, and retaining walls anchored directly into the rock. The citadel also works as a sort of dam, controlling the torrent of the Parmenios to protect the city." 
 
 #Pula Amphitheater
 building_type_MA_pula_amphiteater: "$building_MA_pula_amphiteater$"
 building_type_MA_pula_amphiteater_desc: "$building_MA_pula_amphiteater_desc$"
 building_MA_pula_amphiteater: "Pula Amphitheater"
 building_MA_pula_amphiteater_desc: "Built of finely cut limestone, this amphitheater preserves the full form of a Roman arena, with elliptical walls, tiered seating, and a system of vaulted corridors beneath. Its four corner towers and robust arcades reflect the proud engineering traditions that raised it, while the structure continues to serve as a focal point of authority, gathering, and spectacle within the medieval city."

 #Olympus
 building_type_MA_olympus: "$building_MA_olympus$"
 building_type_MA_olympus_desc: "$building_MA_olympus_desc$"
 building_MA_olympus: "Olympus"
 building_MA_olympus_desc: "A towering mountain in the heart of Thessaly, its jagged peak - the tallest in all of Greece - casting long shadows over the sea and the gentle, fertile slopes. \nBelieved to be the home of the Gods, it has inspired reverence and awe for millenia, its summit said to be crowned by their invisible palace." 
 
 #Ypres Cloth Hall
 building_type_MA_ypres_cloth_hall: "$building_MA_ypres_cloth_hall$"
 building_type_MA_ypres_cloth_hall_desc: "$building_MA_ypres_cloth_hall$"
 building_MA_ypres_cloth_hall: "Ypres Cloth Hall"
 building_MA_ypres_cloth_hall_desc: "This vast civic hall of stone and timber is constructed to house the regulation, storage, and trade of woolen cloth that sustains the wealth of the city. Its long, orderly façade is articulated by arcades, gables, and a commanding belfry, combining mercantile function with urban authority. Within its vaulted halls, merchants, guild officials, and magistrates oversee contracts, measures, and taxes at the heart of the city’s economy." 
 
 #Gravensteen
 building_type_MA_gravensteen: "$building_MA_gravensteen$"
 building_type_MA_gravensteen_desc: "$building_MA_gravensteen_desc$"
 building_MA_gravensteen: "Gravensteen"
 building_MA_gravensteen_desc: "This imposing stone castle serves as the seat of the counts of Flanders and a symbol of comital authority over the city. Centered on a massive donjon and enclosed by thick curtain walls, it combines residential halls with judicial chambers and military defenses, asserting lordly power amid the dense urban fabric of Ghent." 
 
 #Mount Ararat
 building_type_MA_ararat: "$building_MA_ararat$"
 building_type_MA_ararat_desc: "$building_MA_ararat_desc$"
 building_MA_ararat: "Mount Ararat"
 building_MA_ararat_desc: "A vast volcanic massif rising in twin peaks above the surrounding plains, Mount Ararat dominates the horizon with perpetual snow upon its summit. Revered across kingdoms and faiths, it is bound to ancient tradition as the resting place of Noah’s Ark, lending sacred authority and solemn presence to the lands beneath its slopes." 
 
 #Székesfehérvár Basilica
 building_type_MA_szekesfehervar_basilica1: "$building_MA_szekesfehervar_basilica1$"
 building_type_MA_szekesfehervar_basilica1_desc: "$building_MA_szekesfehervar_basilica1_desc$"
 building_MA_szekesfehervar_basilica1: "Basilica of Székesfehérvár"
 building_MA_szekesfehervar_basilica1_desc: "Built as a great Romanesque basilica of stone, this church serves as the ceremonial and dynastic heart of the Hungarian realm. Its broad nave, heavy piers, and orderly arcades frame royal coronations and burials, binding kingship, law, and faith within a single monumental space."
 building_MA_szekesfehervar_basilica2: "Basilica of Székesfehérvár"
 building_MA_szekesfehervar_basilica2_desc: "The basilica has been expanded in the Gothic manner, its structure heightened with new towers and a deeper, more elaborate choir. Pointed vaults, enlarged windows, and richer articulation transform the interior, enhancing both the visual grandeur of the church and its role as the foremost royal sanctuary of the kingdom."
 
 #Prague Castle
 building_type_MA_prague_castle1: "$building_MA_prague_castle1$"
 building_type_MA_prague_castle1_desc: "$building_MA_prague_castle1_desc$"
 building_MA_prague_castle1: "Prague Castle"
 building_MA_prague_castle1_desc: "Upon the long ridge above the Vltava lies an early fortified settlement of timber halls, earthen ramparts, and stone churches. Serving as the seat of dukes and princes, it gathers craftsmen, retainers, and clergy around its courts, forming the political and sacred nucleus from which Prague begins to grow."
 building_MA_prague_castle2: "Prague Castle"
 building_MA_prague_castle2_desc: "The hilltop has been transformed into a vast Gothic complex of palaces, towers, and enclosed courtyards, its walls reshaped in stone and its skyline crowned by a monumental cathedral. From here kings rule the lands of Bohemia, while vaults, spires, and stained glass proclaim royal authority, dynastic continuity, and the city’s place among the great centers of Christendom." 
 
 #Saint Adrian's Basilica
 building_type_MA_zalavar_basilica: "$building_MA_zalavar_basilica$"
 building_type_MA_zalavar_basilica_desc: "$building_MA_zalavar_basilica_desc$"
 building_MA_zalavar_basilica: "Saint Adrian's Basilica"
 building_MA_zalavar_basilica_desc: "Center of a Carolingian fortified settlement within the marshlands of the Zala, Saint Adrian’s Basilica is a major ecclesiastical foundation of the early Christianization of the region. Built as a three-aisled stone church with a pronounced sanctuary and western structures, it serves as both a missionary center and princely church, used to enhance the diplomatic reach of its protector over the borderland regions." 
 
 #Trosky Castle
 building_type_MA_trosky_castle: "$building_MA_trosky_castle$"
 building_type_MA_trosky_castle_desc: "$building_MA_trosky_castle_desc$"
 building_MA_trosky_castle: "Trosky Castle"
 building_MA_trosky_castle_desc: "Erected upon two sheer basalt towers rising from the Bohemian plain, Trosky Castle exploits the natural rock as its primary defense. Each crag bears a separate tower connected by walls and narrow passages, forming a vertically organized stronghold with limited approaches. Its elevated position grants wide surveillance over the surrounding lands, while the irregular terrain renders direct assault difficult and costly." 
 
 #Baths of Hisham
 building_type_MA_baths_hisham: "$building_MA_baths_hisham$"
 building_type_MA_baths_hisham_desc: "$building_MA_baths_hisham_desc$"
 building_MA_baths_hisham: "Baths of Hisham"
 building_MA_baths_hisham_desc: "Part of a larger palace complex, these baths are laid out in a sequence of cold, warm, and hot chambers, supplied by a hypocaust system and vaulted in stone. Their floors are richly covered in geometric and figural mosaics, most notably the great pavement of trees and animals, executed with fine tesserae and careful composition." 
 
 #Peel Castle
 building_type_MA_peel_castle1: "Saint Patrick's Island"
 building_type_MA_peel_castle1_desc: "$building_MA_peel_castle1_desc$"
 building_MA_peel_castle1: "Saint Patrick’s Isle Monastery"
 building_MA_peel_castle1_desc: "A small monastic enclosure occupies the rocky isle, organized in the Irish manner around a round tower and simple stone or timber buildings. Serving as an important center of worship, on its burial grounds older local traditions and the faith of new settlers meet side by side."
 building_MA_peel_castle2: "Patricksholm"
 building_MA_peel_castle2_desc: "The site has grown into a fortified ecclesiastical and princely center, with a Romanesque temple established alongside the monastery and a great hall raised for the rulers of the island. Timber defenses now enclose the island, while clergy and laity reside and are buried here."
 building_MA_peel_castle3: "Peel Castle"
 building_MA_peel_castle3_desc: "The island has been transformed into a fully developed stone fortress, its earlier timber works replaced by curtain walls, towers, and a strong keep. The temple itself is fortified with battlements, and the old monastic structures are integrated into the defensive system, forming a compact stronghold that controls the surrounding sea and secures the island against seaborne threats." 
 
 #Knin Fortress
 building_type_MA_knin_fortress: "$building_MA_knin_fortress$"
 building_type_MA_knin_fortress_desc: "$building_MA_knin_fortress_desc$"
 building_MA_knin_fortress: "Knin Fortress"
 building_MA_knin_fortress_desc: "Extended along a narrow limestone ridge above the Krka valley, the fortress of Knin forms a long, segmented defensive complex of walls, towers, and enclosed courts. Its position controls the routes between the coast and the inland plains, establishing it as a principal royal stronghold in the region."