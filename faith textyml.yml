High God: Zalmoxis-Christos
God Names: Zalmoxis and Zalmoxis-Christos
Evil God Names: Satan and the Dark Spirits
Scripture: The Codex Zalmoxis
* The Grail Keeper can call for a Crusade
* Priests (Temple holders) can inherit titles
* Priests can marry
* Vassals do not mind if their levies are raised
Christo-Zalmoxian counties and characters are hard to convert
Rulers lose Prestige if at peace for too long
* Holy Brythonian Church is held by a secular ruler, and can be destroyed or created normally
* There is always a Grail Keeper, landed or not

High God: Zalmoxis
Evil God Names: The Dark Spirits
Scripture: The Codex Zalmoxis
The High Priest can Excommunicate Zalmoxian characters
The High Priest can grant divorces
The High Priest can grant the Invasion Casus Belli
The High Priest can grant Claims on titles
The High Priest can call for a Struggle for the Skies
Priests (Temple holders) can inherit titles
Priests can marry
Vassals do not mind if their levies are raised
Zalmoxian counties and characters are hard to convert
Rulers lose Prestige if at peace for too long

The Apogenesianists ( "Twice Born" ) is a Local Greco-Roman sect of Martial soul, with strong
Gnostic influences. An Heretical sect of Zalmoxism in which adherents believe that through valor in
battle, they shall ascend into heaven with Zalmoxis, regardless of their quality of life.
High God: Zalmoxis
God Names: Zalmoxis and Ohrmazd
Evil God Names: The King of Darkness
Scripture: The Codex Zalmoxis
* The High Priest can call for a Crusade
* Priests (Temple holders) can inherit titles
Priests can marry
* Vassals do not mind if their levies are raised
* Apogenesianist counties and characters are hard to convert
* Rulers lose Prestige if at peace for too long
* There is always a High Priest, landed or not

